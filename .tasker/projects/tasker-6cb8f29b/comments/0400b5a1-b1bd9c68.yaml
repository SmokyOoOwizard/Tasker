body: 'Отменена 2026-11-06 по решению пользователя: «Homebrew пока не нужно». Подпись и нотаризация macOS перенесены в TSK-204, туда же добавлено, что консоль и демон внутри пакета тоже подписываются. Подпись Windows-бинарников никуда не перенесена.'
