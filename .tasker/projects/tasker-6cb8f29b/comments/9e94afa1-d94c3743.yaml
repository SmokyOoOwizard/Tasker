body: Отменена 2026-11-06 по решению пользователя («я так понимаю 64 задача уже не актуальна», затем «Да, отменить»). В приложении macOS связи в карточке, их добавление и удаление сделаны в TSK-191, настройки типов связей — в TSK-198. Задача была написана под веб-интерфейс, который дальше не развивается.
