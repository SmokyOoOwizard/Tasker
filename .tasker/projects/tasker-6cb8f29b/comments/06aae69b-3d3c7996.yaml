body: |-
  Отменена: на текущем main баг не воспроизводится.

  - Проверено на macOS и Linux (Docker, dotnet/sdk:10.0) на коммите `d062135`: второй `tasker mcp run` с другим `TASKER_HOME` на занятом порту выходит с кодом 1 и сообщением «Port N is busy», первый демон продолжает работать.
  - Второй Kestrel на том же адресе в обход проверки порта тоже не встаёт: «address already in use».
  - Причина старого бага: супервизор ставил `ReuseAddress`, на macOS это давало SO_REUSEPORT, и два сокета вставали на один порт. Супервизор удалён в TSK-235.
  - Быстрый перезапуск после `kill -9` работает на обеих системах.

  Тест на сценарий по решению пользователя не добавлялся.
