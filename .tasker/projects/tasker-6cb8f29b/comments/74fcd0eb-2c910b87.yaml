body: 'Отменена: объединена с TSK-246 «Права агента: демон, сервер и приложение». Уровни прав, сценарий воспроизведения на сервере и условия готовности отсюда перенесены туда. Новая задача охватывает и демон, и сервер, и приложение macOS, а эта была только про сервер и старый веб-интерфейс.'
