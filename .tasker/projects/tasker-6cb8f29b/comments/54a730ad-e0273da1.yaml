body: 'Отменена 2026-11-06 по решению пользователя: «давай мы отменим эти задачи и вообще напишем задачу на то, чтобы вырезать у нас SQLite из демона». Вместо починки слежения за файлом SQLite области в SQLite убраны из демона и консоли (TSK-236). Десктоп с SQLite-вкладками к тому времени уже был удалён.'
