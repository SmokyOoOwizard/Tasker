description: |-
  Эпик TSK-178. Вынесено из TSK-200, где осталась локальная часть.

  Что сделать
  - Профиль: имя, почта, смена пароля.
  - Агенты: создание, переименование, удаление; токены агента (срок, префикс, последний вход, отзыв), полный токен показывается один раз с кнопкой копирования.

  Готово, когда
  В режиме Server можно изменить профиль и пароль, завести агента, выпустить и отозвать его токен, а затем подключить агента к Claude по этому токену.
