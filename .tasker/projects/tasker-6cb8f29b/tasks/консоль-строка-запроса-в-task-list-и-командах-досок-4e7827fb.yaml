description: |-
  Продолжение TSK-190. Разбор строки запроса уже есть на сервере и в ядре (`TaskService.ParseQuery`, аргумент `query` у `List`, `ListTree` и `BoardService.GetColumnTasks`), консоль им пока не пользуется.

  Пример:

  tasker task list --query '.Status == ["Todo", "Done"] && .Field.Estimate > 3 | sort -.Updated'

  Что сделать
  - Параметр `--query` у `task list` и у команды задач колонки доски (`board ... tasks`).
  - Совместное использование с существующими `--status`, `--type`, `--series`, `--field`: условия соединяются через И. Сортировка из запроса главнее `--sort`.
  - Ошибка разбора: понятное сообщение с указанием места в запросе.
  - Автодополнение оболочки не обязательно, если оно не получается простым способом.
  - Обновить `docs/wiki/Консоль.md` и `docs/wiki/Строка-запроса.md`, эталонные файлы в `tests/golden`, если они изменятся.

  Готово, когда
  Строкой запроса можно отбирать и сортировать задачи в консоли в обоих видах хранилища, есть тесты.
