description: |-
  Проблема
  Десктоп не запоминает окна и вкладки: после перезапуска открывается одно окно с пустой вкладкой, открытые папки, их порядок и положение окон теряются.

  Где
  - src/Tasker.Desktop/WindowManager.cs — создание окон и вкладок, `Open(StartupRequest)` при запуске
  - src/Tasker.Desktop/WorkspaceWindow.axaml.cs, src/Tasker.Desktop/Tabs/TabModel.cs — окно и его вкладки
  - src/Tasker.Desktop/App.axaml.cs — запуск и выход приложения
  - src/Tasker.Global/AppDirectories.cs — каталог данных (`AppDirectories.Data`)

  Как повторить
  - `dotnet run --project src/Tasker.Desktop`, открыть два окна с несколькими вкладками папок, передвинуть окна, выйти из приложения и запустить снова — одно окно с пустой вкладкой.

  Что нужно сделать
  - Сохранять в `session.json` в `AppDirectories.Data`: окна (положение, размер, развёрнуто ли), их вкладки (папка или файл SQLite, адрес страницы во вкладке) и активную вкладку; запись — при изменениях и при выходе, атомарно.
  - При запуске без аргументов восстанавливать окна и вкладки; недоступную папку открывать вкладкой с ошибкой или пропускать; окно за пределами экранов — сдвигать на видимый экран. При запуске с папкой в аргументах — восстановить сессию и открыть папку.
  - Проверка: открыть несколько окон и вкладок, перезапустить — всё на месте; удалить одну из папок — остальные открываются, приложение не падает.
