description: |-
  Эпик TSK-178. Найдено при проверке TSK-245.

  Что происходит
  Строка запроса над доской (и, вероятно, над списком задач) проверяется только при вводе. Если в ней был верный запрос, а потом поле переименовали или удалили (в настройках, консолью или через MCP), строка не перепроверяется. Загрузка доски с таким запросом молча не проходит, доска показывает старые данные: старые колонки, старые запросы колонок, старое число задач. Ошибки на экране нет. Стоит изменить строку — появляется ошибка «No field ... in the catalog or in the tasks», а с пустой строкой доска сразу показывает верное состояние.

  Как повторить
  1. На доске ввести в строку над доской `| sort .Field.Estimate`, Enter.
  2. Переименовать поле Estimate (например, `tasker field update Estimate --name Points`).
  3. Открыть доску заново или изменить её в редакторе и сохранить: на доске прежние данные, ошибки нет.

  Что должно быть
  - Когда строка запроса становится неверной из-за изменения каталога, под строкой показывается ошибка, как при вводе.
  - Доска и список не показывают молча устаревшие данные: ошибка строки видна, а состояние колонок (в том числе ошибки запросов колонок) обновляется.

  Где
  - macos/Sources/Tasker/Query/ — `TaskQueryModel`, строка запроса
  - macos/Sources/Tasker/Boards/BoardViewModel.swift — загрузка колонок со строкой над доской
  - список задач — проверить то же поведение

  Готово, когда
  - После переименования или удаления поля, которое есть в строке над доской или списком, под строкой видна ошибка без правки строки.
  - Доска не остаётся со старыми данными: колонки показывают актуальное состояние или явную ошибку.
  - Есть тест модели на этот случай.
