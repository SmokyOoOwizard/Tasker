description: |-
  Эпик TSK-178.

  Что происходит
  При русской раскладке нажатие ⌘ и клавиши K (буква «л») палитру не открывает. Замечено при работе над TSK-220 (PR #70): ввод буквы через систему палитру не открыл, а нажатие по коду клавиши открыло. По предположению пользователя, это касается всех сочетаний приложения, а не только ⌘K. Подтвердить вручную на настоящей клавиатуре.

  Как должно быть
  Все сочетания приложения работают при любой раскладке.

  Что сделать
  - Проверить все сочетания из реестра команд `AppCommand` (TSK-202) и сочетания вне реестра, например в списке, карточке и окне создания.
  - Исправить общим решением, а не отдельно для каждого сочетания.
  - Системные сочетания ⌘C, ⌘V и другие при русской раскладке продолжают работать.

  Готово, когда
  Все сочетания приложения работают при русской и английской раскладке.
