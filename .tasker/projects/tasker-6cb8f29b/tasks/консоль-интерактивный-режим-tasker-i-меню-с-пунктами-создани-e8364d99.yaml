description: |-
  Проблема
  У консоли нет интерактивного режима: каждое действие — отдельная команда с параметрами, нужно помнить имена, id и обязательные опции. `tasker -i` сейчас не распознаётся: печатается справка и «Required command was not provided.», код 1.

  Где
  - rust/crates/tasker-cli/src/spec.rs — дерево команд и общие параметры
  - rust/crates/tasker-cli/src/app.rs, commands/ — выполнение команд
  - rust/crates/tasker-cli/src/terminal.rs — работа с терминалом
  - docs/wiki/Консоль.md

  Как повторить
  - В папке с областью: `tasker -i` — справка, «Required command was not provided.», код выхода 1; в `tasker --help` параметра `-i` нет.

  Что нужно сделать
  - `tasker -i` (без команды) открывает в терминале интерактивную сессию: меню действий; выбрал пункт — прошёл шаги — вернулся в меню (аналог `git add -i`).
  - Сессия:
    - область — текущая папка или `-w`; проект выбирается один раз на сессию (если проект один — сразу он), сменить можно из меню;
    - только в терминале: если stdin или stdout не терминал — ошибка с подсказкой, код 1;
    - выход из меню — `q` или Ctrl+C; Esc — шаг назад или отмена текущего действия без изменений.
  - Пункты меню:
    - создать: проект, задачу, статус, набор статусов, тип задачи, серию, поле, перечисление, доску, тип связи, пользователя, агента;
    - изменить: те же сущности; у задачи — заголовок, описание, тип, статус, серии, родители, значения полей, связи;
    - удалить: те же сущности, с подтверждением; где команда требует выбора для каскада (что делать с задачами, значениями полей) — тот же выбор шагом.
  - Шаги:
    - выбор из списков — стрелками (сущности, типы, статусы, серии, значения перечислений, bool); где можно несколько значений — множественный выбор; в длинных списках — фильтр по набранному тексту;
    - текст — ввод строкой с проверкой (те же правила и тексты ошибок, что у команд); многострочное описание — в `$EDITOR`;
    - после действия — результат (как вывод соответствующей команды) и возврат в меню;
    - конфликт версии или блокировка правки — сообщение тем же текстом, что у команды, и предложение повторить с текущими данными.
  - Действия выполняются теми же сервисами, что и команды консоли — поведение не расходится с `tasker <команда>`.
  - Справка `tasker --help` показывает `-i`; вики «Консоль» — раздел про интерактивный режим.
  - Проверка: тесты сессии через псевдотерминал (создание, изменение и удаление каждой сущности, Esc и отмена, конфликт версии, отказ вне терминала) на Linux, macOS и Windows.
