title: 'Консоль: интерактивный режим tasker -i — меню с пунктами создания, изменения и удаления сущностей'
typeId: 52c69d59-658f-467b-8e64-0eb42c3dd961
statusId: 943a8e7d-9573-4e9f-a4e4-7f67d8473c7a
