description: |-
  Проблема
  В .NET-движке при параллельном добавлении связей в проекте без сохранённых типов связей изредка падает «TypeId: link type not found in the project: <id>» для типа по умолчанию. `LinkTypeService.EnsureDefaults` читает набор типов и пишет недостающие по одному вне секции записи: если запрос A уже записал часть типов по умолчанию (например, Blocks и Cloners), запрос B видит непустой набор, решает «типы сохранены» и дописывает только «позже добавленные» (Parent/Child) — его тип (Duplicate, Relates…) ещё не записан, `GetById` возвращает null. `catch` в EnsureDefaults защищает только от одновременной записи одного и того же типа. Затрагивает десктоп и сервер (Tasker.Core).

  Где
  - src/Tasker.Core/Links/LinkTypeService.cs — EnsureDefaults (и вызовы из записи типов)
  - src/Tasker.Core/Links/TaskLinkService.cs — Add: `types.EnsureDefaults`, затем `types.GetById(typeId) ?? throw`
  - src/Tasker.Core/TaskSeries/IWriteScope.cs — секция записи проекта
  - rust/crates/tasker-services/src/link_type.rs — `ensure_defaults` (там повторное чтение под `exclusive`)

  Как повторить
  - Свежий проект без связей, несколько задач; 6–12 параллельных `POST /w/<папка>/api/projects/<id>/tasks/<A>/links` к десктопу (или к серверу) с типом Duplicate, либо в одном процессе `Task.WhenAll` над `TaskLinkService.Add` с типом, который в Defaults не первый. Часть запросов изредка падает с 400 «link type not found».

  Что нужно сделать
  - Дать LinkTypeService `IWriteScope` (как у FieldService/BoardService/TaskLinkService; регистрация в DI не меняется).
  - EnsureDefaults: если по первому чтению записывать нечего — выйти; иначе в `writes.Exclusive(projectId, …)` перечитать набор, заново вычислить, что добавлять (Defaults при пустом наборе, иначе Missing), и записать.
  - Убедиться, что EnsureDefaults не вызывается внутри Exclusive того же проекта (вложенная секция не должна ждать саму себя — проверить реализацию IWriteScope для files и sqlite) и что TaskLinkService.Add вызывает его вне своей секции.
  - Проверка: .NET-тест — параллельные Add с типом Duplicate в свежем проекте для files и sqlite, в цикле под нагрузкой, без падений.
