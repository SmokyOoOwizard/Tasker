description: |-
  Гонка в .NET при параллельном добавлении связей в свежей области: изредка «TypeId: link type not found in the project: <id>» для типа связи по умолчанию. Та же гонка исправлена в Rust в TSK-157 (коммит 00f071f, rust/crates/tasker-services/src/link_type.rs, ensure_defaults); в .NET (src/Tasker.Core) не исправлялась.

  ГДЕ ГОНКА В C#. src/Tasker.Core/Links/LinkTypeService.cs, EnsureDefaults: читает types.GetAll(projectId); пусто — пишет шесть типов по умолчанию (Defaults) по одному через types.Add, иначе — только «позже добавленные» (Missing: Parent/Child, если нет иерархического типа). Всё это без секции записи проекта (IWriteScope.Exclusive). Вызывается из TaskLinkService.Add (src/Tasker.Core/Links/TaskLinkService.cs: await types.EnsureDefaults(...); затем types.GetById(typeId) ?? throw "TypeId: link type not found in the project") и из записи типов (LinkTypeService, строки с await EnsureDefaults). Если запрос A уже записал часть типов по умолчанию (например, Blocks и Cloners), запрос B видит непустой набор, решает «типы сохранены, удалённые пользователем не возвращаем» и добавляет только Missing (Parent/Child) — его тип (Duplicate, Relates…) ещё не записан, GetById возвращает null, связь падает с [invalid]. Ловушка catch в EnsureDefaults защищает только от одновременной записи ОДНОГО и того же типа, а не от чтения частично записанного набора.

  КАК ВОСПРОИЗВЕСТИ. Проект без сохранённых типов связей (свежий, ни одной связи), несколько задач; 6–12 параллельных `tasker task link <A> duplicates <Ti>` (или MCP link_tasks через демон, или в одном процессе Task.WhenAll над TaskLinkService.Add) с типом, который идёт в Defaults не первым. В Rust тест concurrent_links_from_one_task_without_a_version_are_all_kept (rust/crates/tasker-services/tests/links.rs, 6 потоков, тип Duplicate) падал в 2–5 из 120 запусков по 12 параллельно. В .NET похожий тест — tests/Tasker.Tests/ParallelWorkTests.cs Links_added_to_one_task_by_many_clients_are_all_kept (тип blocks — первый по алфавиту, поэтому гонку почти не ловит): поменять тип на duplicates/relates и гонять в цикле.

  КАК ИСПРАВЛЕНО В RUST. ensure_defaults: быстрый путь не изменился — прочитать набор, записывать нечего → выход. Если записать есть что — Workspace::exclusive(project_id, …) (write.lock между процессами + сверка папки задач проекта) и ВНУТРИ секции повторно прочитать набор и вычислить, что добавлять (Defaults при пустом, иначе Missing), и только потом писать. Второй запрос ждёт первого и видит уже полный набор. После правки: 240 запусков по 12 параллельно — 0 падений.

  ЧТО СДЕЛАТЬ В .NET. Дать LinkTypeService IWriteScope (как у FieldService/BoardService/TaskLinkService; регистрация в DI не меняется) и в EnsureDefaults: если по первому чтению записывать нечего — выйти; иначе `await writes.Exclusive(projectId, async () => { var stored = await types.GetAll(...); foreach (Defaults/Missing) Add… })`. Проверить, что вызовы EnsureDefaults не происходят уже внутри Exclusive того же проекта (вложенная секция не должна ждать саму себя — в Rust вложенный вызов не ждёт; в .NET проверить реализацию IWriteScope) и что TaskLinkService.Add вызывает EnsureDefaults вне своей секции. Тест: параллельные link с типом не первым в Defaults (Duplicate) в свежем проекте для storage files и sqlite, в цикле под нагрузкой. Актуально, пока .NET-консоль/демон не снесены (TSK-143); десктоп и сервер на .NET используют тот же Tasker.Core и после сноса — тогда исправление нужно в любом случае.
