description: |-
  Эпик TSK-178. Найдено при проверке TSK-245.

  Что происходит
  Если поле переименовали или удалили, сохранённые запросы колонок, где оно было, перестают разбираться. Редактор доски в приложении не даёт сохранить доску, пока в любой колонке такой запрос, даже если эту колонку не трогали. Например, нельзя исправить одну колонку, переименовать доску или поменять статусы, не исправив сразу все сломанные запросы. Сервер так не делает: он проверяет только изменённый текст запроса (`Columns[i].Query`), а неизменённый сломанный запрос пропускает. Поэтому MCP и консоль сохраняют такую доску, а приложение — нет.

  Что должно быть
  - Сохранение блокирует только запрос, который изменили в этой правке и который не разбирается.
  - Сломанный неизменённый запрос по-прежнему подсвечивается у своей колонки с текстом ошибки, но кнопка сохранения работает.
  - После сохранения такая колонка на доске продолжает показывать ошибку, пока её не исправят.

  Где
  - macos/Sources/Tasker/Boards/BoardEditorModel.swift — `queryIssues()` и проверка в `save()`
  - macos/Sources/Tasker/Boards/BoardDraft.swift — исходный текст запроса колонки (сравнение с изменённым)
  - macos/Tests/TaskerTests/BoardEditorTests.swift

  Готово, когда
  - Доску с одной сломанной неизменённой колонкой можно сохранить, исправив другую колонку или название доски.
  - Изменённый и неверный запрос по-прежнему не даёт сохранить.
  - Есть тесты редактора на оба случая.
