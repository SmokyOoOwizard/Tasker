description: |-
  Продолжение TSK-190. Сейчас `.Created` и `.Updated` работают только в сортировке (`| sort -.Updated`), в условии строка отвечает ошибкой `query.sortOnly`. Нужно разрешить их в условиях.

  Пример:

  .Created >= "2026-11-01" && .Updated < "2026-11-07"

  Что сделать
  - Сравнения `==`, `!=`, `>`, `>=`, `<`, `<=` для `.Created` и `.Updated`.
  - Подсказки: операторы после этих свойств, формат значения.
  - Условие в обоих хранилищах (БД и индекс папки) и в `TaskPredicate.Matches`.
  - Понятные ошибки на неверную дату.
  - Обновить `docs/wiki/Строка-запроса.md` и макет.

  Что решить перед началом
  - Как записываются даты: только `"yyyy-MM-dd"` или ещё и время.
  - Что значит `.Created == "2026-11-05"`: `.Created` хранит момент времени, а значение задаёт целый день. Варианты: день целиком или точное совпадение момента.
  - В каком часовом поясе считается день: локальном у клиента или UTC. Разбор идёт на сервере, поэтому поясу клиента нужен способ дойти до сервера.
  - Нужны ли относительные даты, например `Today()` или `-7d`.
  - Распространяются ли те же правила на поля типа date (`.Field.Срок`), которые сейчас сравниваются как текст `yyyy-MM-dd`.

  Готово, когда
  Строкой можно отобрать задачи по дате создания и обновления в обоих хранилищах, есть тесты разбора, подсказок и хранилищ, документация обновлена.
