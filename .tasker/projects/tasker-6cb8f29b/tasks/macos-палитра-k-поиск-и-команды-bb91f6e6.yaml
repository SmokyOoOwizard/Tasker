description: |-
  Эпик TSK-178.

  Что сделать
  - Плавающая панель (NSPanel) по ⌘K и по клику на поиск в сайдбаре: мгновенный поиск задач по ключу и заголовку, переход по TSK-N (при конфликте номеров — обе задачи).
  - Команды: создать задачу, создать доску, перейти в раздел/настройку, открыть серию («серия TSK»), сменить проект и рабочую область, переключить тему и язык.
  - Строка запроса из списка работает и в палитре; полностью с клавиатуры, Esc закрывает.

  Готово, когда
  Любой экран и основное действие доступны из палитры, ответ на ввод без заметной задержки.
