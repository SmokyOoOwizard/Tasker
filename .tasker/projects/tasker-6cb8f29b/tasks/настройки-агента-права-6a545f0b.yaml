description: |-
  Эпик TSK-178.

  Зачем
  Агент через MCP может делать всё: создавать, менять и удалять задачи, статусы, доски, поля и настройки проекта. Ограничить агента нельзя. Нужны настройки агента, в которых задаются его права.

  Что должно быть
  - У агента есть раздел настроек с правами.
  - Права проверяются в ядре, поэтому действуют для MCP, REST и любых клиентов. Отказ возвращается понятной ошибкой с кодом.
  - Права задаются и меняются из приложения macOS там, где сейчас создаются, переименовываются и удаляются агенты (TSK-200 для локального режима, TSK-239 для режима Server).

  Решить перед началом
  - Какие права нужны. Пример уровней из TSK-19: только чтение, только задачи (задачи, связи, серии, поля задач, комментарии, без настройки проекта), полный доступ. Возможно, отдельные флаги, например «можно удалять».
  - На что выдаются права: на агента целиком, на проект или на рабочую область.
  - Работают ли права в локальном режиме (агент области через демон) так же, как на сервере.
  - Какие права у существующих агентов после обновления. Предложение: полный доступ, как сейчас.
  - Видит ли агент свои права, например в `whoami`, чтобы заранее знать, что ему нельзя.

  Связано с TSK-19 (права агентов внутри проекта на сервере): при проектировании решить, объединить задачи или TSK-19 остаётся частью для участников проекта.

  Где
  - dotnet/src/Tasker.Core/Agents/AgentService.cs — агенты и их токены
  - dotnet/src/Tasker.Core/Projects/MemberProjectAccess.cs, ProjectMemberService.cs — доступ к проекту на сервере
  - dotnet/src/Tasker.Mcp/LocalMcpAgent.cs, dotnet/src/Tasker.Mcp/Tools/ — агент в локальном режиме и инструменты MCP
  - dotnet/src/Tasker.Web/TaskerApi.cs, dotnet/src/Tasker.Web/Graph/ — REST и GraphQL для агентов
  - macos/Sources/Tasker/ — экран агентов
  - docs/wiki/MCP-и-агенты.md

  Готово, когда
  Агенту можно задать права в приложении. Агент с ограниченными правами получает отказ на запрещённые действия через MCP и REST, а разрешённые работают. Существующие агенты работают как раньше. Есть тесты на каждый уровень прав для папки и для БД сервера.
