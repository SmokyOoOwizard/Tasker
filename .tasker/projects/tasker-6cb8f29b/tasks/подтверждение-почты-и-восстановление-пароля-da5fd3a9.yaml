description: |-
  Проблема
  На сервере почта пользователя никак не подтверждается, а забытый пароль может сбросить только админ (`POST /api/users/{id}/password` без текущего пароля). Самостоятельного восстановления пароля по почте нет, отправки писем в сервере нет вообще.

  Где
  - src/Tasker.Core/Users/UserService.cs — `Register`, `Create`, `ChangePassword`
  - src/Tasker.Web/Auth/, src/Tasker.Web/TaskerApi.cs — маршруты `/api/auth/*`, `/api/users/{id}/password`
  - src/Tasker.Core/Users/User.cs, src/Tasker.Storage.Db/Models/UserDbModel.cs — данные пользователя
  - frontend/src/pages/LoginPage.tsx, frontend/src/pages/ProfilePage.tsx
  - docs/wiki/Настройка-и-сервер.md — раздел «Пользователи, вход и права»

  Как повторить
  - Запустить сервер, зарегистрировать админа, создать пользователя с произвольной почтой — почта принимается без подтверждения.
  - На странице входа нет «Забыли пароль?»; в API нет маршрута запроса сброса пароля. Пользователь, забывший пароль, не войдёт, пока админ не задаст новый.

  Что нужно сделать
  - Настройка отправки писем на сервере (SMTP: адрес, порт, учётные данные, отправитель) в конфигурации и вики.
  - Подтверждение почты: письмо со ссылкой (одноразовый токен с ограниченным сроком), отметка «почта подтверждена»; повторное подтверждение при смене почты.
  - Восстановление пароля: запрос по почте или имени, письмо со ссылкой, установка нового пароля по токену; после смены прежние токены сессий отзываются; ответ на запрос не раскрывает, существует ли пользователь.
  - Интерфейс: «Забыли пароль?» на странице входа, страницы подтверждения и задания нового пароля.
  - Проверка: тесты на выдачу, срок и одноразовость токенов; вручную — письмо приходит (например, на локальный SMTP-перехватчик), по ссылке почта подтверждается и пароль меняется, старые сессии перестают действовать.
