description: |-
  Проблема
  В консоли нет переноса задачи в колонку доски: в ядре и MCP он есть (`move_task`), а у `tasker board` только create, list, get, tasks, show, update, delete.

  Где
  - dotnet/src/Tasker.Cli/Commands/BoardCommands.cs — команды `tasker board`
  - dotnet/src/Tasker.Core/Boards/BoardService.cs — `MoveTask` (статус из правила переноса колонки, проверка условий по полям)
  - dotnet/src/Tasker.Mcp/Tools/BoardTools.cs — MCP `move_task`

  Как повторить
  - `tasker board --help` — команды переноса нет

  Что нужно сделать
  - `tasker board move <доска> <колонка> <задача>` (задача по ссылке или id, `--expected-version`, `--json`) с теми же ошибками, что у `move_task`; автодополнение, `tasker manual`, вики «Консоль»
  - Проверка: тест консоли — задача переносится в колонку и получает статус из правила, неподходящая по полям отклоняется
