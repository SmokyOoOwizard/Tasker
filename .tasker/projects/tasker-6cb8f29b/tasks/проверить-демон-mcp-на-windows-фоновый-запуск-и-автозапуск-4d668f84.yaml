description: |-
  Проблема
  Запуск демона без окна (`tasker mcp start`) и автозапуск через Планировщик заданий (`tasker mcp autostart enable`, задача «Tasker MCP») для Windows написаны, но ветки, работающие только на Windows (`schtasks`, `powershell`, пользователь по умолчанию), на Windows не проверялись: автозапуск проверен лишь тестами XML-определения, а .NET-тесты автозапуска на Windows пропускаются.

  Где
  - rust/crates/tasker-daemon/src/autostart/windows_task.rs — задача Планировщика (`schtasks`, XML, `conhost.exe --headless`)
  - rust/crates/tasker-cli/src/daemon.rs — `spawn_daemon` (запуск без окна, `CREATE_NO_WINDOW`)
  - tests/Tasker.Tests/AutostartTests.cs — `Supported` только macOS и Linux
  - rust/crates/tasker-daemon/tests/golden_autostart.rs — эталоны определения задачи

  Как повторить
  - На Windows: `tasker mcp autostart enable`, `tasker mcp autostart status`, выйти и войти в систему, `tasker mcp status`; убить процесс `tasker-mcpd` и проверить перезапуск; `tasker mcp autostart disable`.
  - В CI windows-latest тесты `AutostartTests` ничего не проверяют (ранний `return`).

  Что нужно сделать
  - Проверить на Windows: `mcp start` не открывает окно и не держит вывод вызвавшей программы; автозапуск создаёт задачу, демон стартует при входе без окна, перезапускается при падении, `status`/`disable` работают; пути с пробелами и кириллицей.
  - Исправить найденные ошибки и убрать из windows_task.rs пометку «на Windows не проверены».
  - Включить `AutostartTests` на Windows (поддельный `schtasks` или настоящая задача с отдельным именем через `TASKER_SERVICE_LABEL`).
  - Проверка: `AutostartTests` проходят на windows-latest в CI; ручная проверка входа в систему на Windows 10/11 пройдена.
