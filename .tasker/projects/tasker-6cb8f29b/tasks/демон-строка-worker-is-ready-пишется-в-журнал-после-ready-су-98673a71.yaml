  number: 174
description: |-
  Проблема
  Тест `the_supervisor_holds_the_files_and_the_worker_serves` иногда падает под нагрузкой: в журнале демона ещё нет строки «MCP server worker is ready». Рабочий процесс сначала шлёт супервизору `ready`, а строку в журнал пишет после этого; тест, дождавшись готовности, читает журнал сразу и может опередить запись.

  Где
  - rust/crates/tasker-mcpd/src/worker.rs — отправка `ready` супервизору и запись «MCP server worker is ready» после неё
  - rust/crates/tasker-mcpd/tests/supervisor.rs — `the_supervisor_holds_the_files_and_the_worker_serves`, проверки журнала

  Как повторить
  - Под нагрузкой на процессор (например, параллельная сборка) прогонять `cargo test -p tasker-mcpd --test supervisor the_supervisor_holds_the_files_and_the_worker_serves` в цикле: изредка падает последний `assert!` по журналу.

  Что нужно сделать
  - Писать «MCP server worker is ready» в журнал до отправки `ready` супервизору (журнал отражает состояние к моменту, когда о готовности узнают другие), либо в тесте ждать появления строки в журнале с тайм-аутом.
  - Проверить другие тесты демона, читающие журнал сразу после события, на ту же гонку.
  - Проверка: тест в цикле (сотни прогонов) под нагрузкой без падений; cargo test -p tasker-mcpd.
