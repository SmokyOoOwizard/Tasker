description: |-
  Эпик TSK-178.

  Что происходит
  В сайдбаре у раздела задач нет числа задач. В макете `docs/mockups/web/main-design.html` оно есть.

  Как должно быть
  Число задач показано как в макете и соответствует выбранному проекту.

  Что проверить
  - Число обновляется при создании и удалении задачи, в том числе когда изменения приходят от других клиентов (живые события).
  - Число меняется при смене проекта и не смешивается между вкладками с разными проектами.
  - Сверить с макетом, какие ещё пункты сайдбара показывают счётчики.

  Готово, когда
  Сайдбар показывает число задач как в макете, и оно остаётся актуальным.
