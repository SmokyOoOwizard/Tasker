description: |-
  Эпик TSK-178.

  Зачем
  В локальном режиме агент через MCP демона может делать всё: создавать, менять и удалять задачи, статусы, доски, поля и настройки проекта. Ограничить агента нельзя. Нужны настройки агента, в которых задаются его права.

  Границы
  Задача касается только демона и приложения macOS в локальном режиме. Сервер и режим Server не входят: права агентов на сервере — TSK-19.

  Что должно быть
  - У агента в приложении есть раздел настроек с правами, рядом с созданием, переименованием и удалением агентов из TSK-200.
  - Демон проверяет права при вызовах MCP от этого агента. Отказ возвращается понятной ошибкой с кодом, чтобы агент мог понять, что ему нельзя.
  - Действия самого приложения, то есть локального человека, права агентов не ограничивают.

  Решить перед началом
  - Какие права нужны. Например: только чтение, только задачи (задачи, связи, серии, поля задач, комментарии, без настройки проекта), полный доступ. Возможно, отдельные флаги, например «можно удалять».
  - На что выдаются права: на агента целиком, на проект или на рабочую область.
  - Где хранятся права: в файлах агента в `.tasker` (общие для всех, кто работает с репозиторием) или в настройках демона на машине.
  - Какие права у существующих агентов после обновления. Предложение: полный доступ, как сейчас.
  - Видит ли агент свои права, например в `whoami`, чтобы заранее знать, что ему нельзя.

  Где
  - dotnet/src/Tasker.Core/Agents/AgentService.cs — агенты
  - dotnet/src/Tasker.Mcp/LocalMcpAgent.cs, dotnet/src/Tasker.Mcp/Tools/ — агент в локальном режиме и инструменты MCP
  - dotnet/src/Tasker.Daemon.Host/ — демон
  - macos/Sources/Tasker/ — экран агентов
  - docs/wiki/MCP-и-агенты.md

  Готово, когда
  Агенту можно задать права в приложении. Агент с ограниченными правами получает отказ на запрещённые действия через MCP демона, а разрешённые работают. Существующие агенты работают как раньше. Сервер не изменился. Есть тесты на каждый уровень прав.
