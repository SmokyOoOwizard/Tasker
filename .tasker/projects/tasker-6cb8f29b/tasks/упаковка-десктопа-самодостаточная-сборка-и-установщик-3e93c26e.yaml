description: |-
  Проблема
  Десктоп нельзя установить готовой сборкой: релиз (`scripts/release.sh`, workflow release-build) собирает только консоль `tasker` и демон `tasker-mcpd`, а десктоп запускается только из исходников (`dotnet run`). Нет самодостаточной публикации под платформы и установщика.

  Где
  - src/Tasker.Desktop/Tasker.Desktop.csproj — проект десктопа (без RID и настроек публикации)
  - tools/RustBinaries.targets — копирование `tasker-mcpd` в сборку и публикацию (по умолчанию берётся debug-сборка, готовый — `-p:TaskerRustBin=<каталог>`)
  - scripts/release.sh, .github/workflows/release-build.yml — релиз без десктопа

  Как повторить
  - `scripts/release.sh --help` и архивы релиза: в них только `tasker` и `tasker-mcpd`.
  - `grep -rn SelfContained src/Tasker.Desktop` — ничего.

  Что нужно сделать
  - Самодостаточная публикация десктопа (`dotnet publish --self-contained`) под osx-arm64, osx-x64, win-x64, linux-x64 вместе с фронтендом и release-сборкой `tasker-mcpd` под ту же платформу.
  - Установщик или пакет на каждую ОС: macOS — `.app` в `.dmg`, Windows — установщик (или архив с ярлыком), Linux — архив/AppImage.
  - Сборка пакетов скриптом и в CI рядом с архивами консоли.
  - Проверка: пакет с чистой машины без .NET SDK и Rust устанавливается, десктоп запускается, открывает папку и поднимает демон MCP.
