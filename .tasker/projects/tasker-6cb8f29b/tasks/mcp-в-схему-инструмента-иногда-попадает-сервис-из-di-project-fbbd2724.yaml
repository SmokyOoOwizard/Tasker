title: 'MCP: в схему инструмента иногда попадает сервис из DI (projects: object)'
typeId: 97e160a1-7791-45ea-aa77-9e590c3536eb
statusId: 19d3f76d-e068-4e23-83c9-cebd1c982ca3
createdAt: 2026-11-03T22:38:58.4245410+00:00
updatedAt: 2026-11-03T22:38:58.4245410+00:00
