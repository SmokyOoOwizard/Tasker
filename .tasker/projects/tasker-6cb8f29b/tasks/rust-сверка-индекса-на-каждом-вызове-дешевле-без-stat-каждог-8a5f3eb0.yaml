  number: 152
description: |-
  Проблема
  Перед каждой командой консоль сверяет индекс области с диском: обходит папки и делает `std::fs::metadata` каждого файла (~5 мкс на файл). На 2000 задачах это ~10 мс из ~25 у `task get`. `task create` в серии сверяет трижды (полная сверка при открытии, сверка папки задач в секции `write.lock`, обновление после записи), без серии — дважды.

  Где
  - rust/crates/tasker-files/src/index/mod.rs — `sync`, `refresh`, `exclusive`
  - rust/crates/tasker-files/src/index/sync.rs — обход файлов и `metadata`
  - rust/crates/tasker-files/src/write.rs — `WriteScope::exclusive` (сверка папки задач под `write.lock`)
  - src/Tasker.Storage.Files/Index/WorkspaceIndex.cs — тот же алгоритм в .NET (десктоп, сервер)

  Как повторить
  - Во временной области с проектом, серией и сотней-другой задач: `TASKER_PROFILE=1 tasker task create x --type <тип> --series <префикс>` — `[count] index-sync 3` и `sync-scan 3`; без `--series` — по 2; `TASKER_PROFILE=1 tasker task get <id>` — `index-sync 1`, время которого растёт с числом задач.

  Что нужно сделать
  - Удешевить сверку, не меняя смысла (свежести индекса):
    - обход с меньшим числом системных вызовов: `getattrlistbulk` на macOS, `fstatat` относительно дескриптора каталога вместо полного пути;
    - пропуск неизменившихся каталогов по mtime каталога как первый уровень проверки (новый или удалённый файл меняет mtime каталога, правка на месте — нет);
    - в `task create` не сверять папку задач второй раз сразу после полной сверки при открытии, если `write.lock` взят без ожидания.
  - Любое изменение гарантий свежести согласовать с .NET-движком (WorkspaceIndex.Sync), который читает тот же индекс.
  - Проверка: замеры `task get` и `task create` на 100 и 2000 задачах до и после (scripts/perf/bench.py); тесты индекса и сверки после внешних правок (git pull, правка файла на месте, удаление) проходят.
