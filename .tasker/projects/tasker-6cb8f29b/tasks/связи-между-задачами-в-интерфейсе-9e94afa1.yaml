description: |-
  Проблема
  Связи между задачами есть в ядре, хранилищах, REST, MCP и консоли, но интерфейс их не показывает и не меняет: в списке задач связей нет, карточки задачи нет, настроек типов связей в настройках проекта нет (видно только их число в сводке проекта).

  Где
  - frontend/src/pages/TasksPage.tsx — список задач
  - frontend/src/pages/SettingsPage.tsx, frontend/src/pages/settings/ — разделы настроек проекта (статусы, наборы, типы задач, участники)
  - frontend/src/api.ts, frontend/src/types.ts
  - src/Tasker.Web/TaskerApi.cs — REST `/tasks/{id}/links`, `/link-types`

  Как повторить
  - `tasker task link TSK-1 blocks TSK-2`, открыть проект в десктопе: в списке задач связи не видны, добавить или удалить связь негде
  - Настройки проекта — раздела типов связей нет

  Что нужно сделать
  - Показ связей в списке задач и в карточке задачи (делается вместе с карточкой)
  - Добавление и удаление связи из интерфейса
  - Раздел настроек проекта для типов связей: список, создание, изменение, удаление
  - Проверка: связь, добавленная в интерфейсе, видна в `tasker task links`, и наоборот; типы связей, созданные в настройках, видны в `tasker link-type list`
