description: |-
  Эпик TSK-178.

  Что происходит
  Таблица markdown в описании задачи или в комментарии показывается в приложении как текст: строки `| Вариант | В месяц | В год |` и `|---|---|---|` видны как есть, без колонок и рамок. Разбор markdown в приложении знает заголовки, абзацы, пункты списков, цитаты, блоки кода и горизонтальную линию, таблиц в нём нет.

  Как повторить
  1. В описание задачи (или в комментарий) вставить:
     | Вариант | В месяц |
     |---|---|
     | Одна ВМ | 4 605 |
  2. Открыть задачу в приложении: таблица видна сырым текстом.

  Что должно быть
  - Таблицы GFM (строка заголовков, строка-разделитель, строки данных) показываются таблицей: колонки выровнены, заголовок выделен, есть разделители строк.
  - Выравнивание из разделителя (`:---`, `:---:`, `---:`) учитывается; числа по правому краю, если так задано.
  - Внутри ячеек работает строчное оформление (жирный, курсив, код, ссылки, ссылки на задачи вида TSK-123), как в абзацах.
  - Широкая таблица не ломает карточку: прокручивается по горизонтали или переносит текст в ячейках.
  - Текст таблицы можно выделить и скопировать.
  - Одинаково в описании задачи и в комментариях.
  - Строки с `|`, которые не являются таблицей (нет строки-разделителя), остаются обычным текстом.

  Где
  - macos/Sources/Tasker/TaskDetail/MarkdownBlocks.swift — `MarkdownBlock`, `MarkdownParser`
  - macos/Sources/Tasker/TaskDetail/TaskDetailComponents.swift — `MarkdownView`
  - macos/Sources/Tasker/TaskDetail/TaskCommentsView.swift, TaskPageView.swift — где показывается
  - macos/Tests/TaskerTests/ — тесты разбора

  Готово, когда
  Таблица из примера показывается таблицей в описании и в комментарии, есть тесты разбора: таблица, выравнивание, строки с `|` без разделителя, таблица рядом с другими блоками.
