description: 'Шесть полурабочих макетов веб-интерфейса в отдельных HTML-файлах (docs/mockups/web), каждый в своём стиле: классика в духе Jira, поисковый язык в духе YouTrack, тёмный минимализм, таблица-база данных, IDE/терминал, обзор и эпики. Макеты покрывают текущий функционал: задачи, фильтры по полям, сортировку, дерево эпиков, карточку с полями, связями и сериями, доски с колонками и условиями, настройки схемы, участников, агентов и токены, блокировки, конфликты версий и проблемы рабочей области. Цель — сравнить удобство вариантов перед разработкой интерфейса.'
