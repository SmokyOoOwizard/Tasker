description: |-
  Цель
  Решить, как делать нативное приложение Tasker, и составить план. Решение на сейчас: полный натив. Сначала macOS (SwiftUI + AppKit), Windows (WinUI 3) — позже, на втором плане. Вернуться к задаче и обсудить конкретные шаги.

  Исходные данные
  - Макеты веб-интерфейса: docs/mockups/web/main-design.html (основной дизайн) и docs/mockups/web/alternative-design.html (альтернатива в стиле IDE). Коммит 401fe4b в локальной ветке task/tsk-176 — пока не запушен.
  - Основной дизайн общий для веба и приложения: компактная тёмная тема, светлая тема в тёплой палитре, строка запроса (список, доски, глобальный поиск ⌘K), палитра команд и горячие клавиши, peek-панель задачи, окно создания задачи в раскладке полной карточки, RU/EN по языку системы, страница серии, админ-панель.
  - Сейчас десктоп — Avalonia (.NET) с WebView, внутри тот же React-фронтенд. Консоль и демон уже на Rust; REST и живые события для интерфейса переносятся в Rust-демон.

  Какие варианты рассматривали
  - Tauri 2 (Rust + системный WebView): дизайн 1:1 с вебом, лёгкий и быстрый, ядро на Rust подключается напрямую. Был рекомендован как самый дешёвый.
  - Electron: дизайн 1:1, но тяжёлый.
  - Оставить Avalonia + WebView: тянет .NET рядом с Rust-ядром.
  - Avalonia на XAML, Rust-интерфейс на GPU (GPUI, Slint, iced), Flutter: дизайн перерисовывать вручную.
  - Полный натив SwiftUI/AppKit + WinUI 3 — выбран: максимальная нативность и скорость ценой отдельных реализаций интерфейса.

  Главное следствие
  Интерфейсов станет три (веб, macOS, позже Windows). Всё, что не отрисовка, держать в одном месте, приложения — тонкие.

  Архитектура (предложение)
  1. Ядро на Rust, не в приложениях. Основной путь — через демон tasker-mcpd: локальный REST + живые события (SSE), тот же API, что у веб-сервера. Клиенты Swift (и потом C#) генерировать из OpenAPI. Демон уже следит за папками .tasker и рабочими областями. Запасной путь — FFI внутри процесса (UniFFI), точечно, если упрёмся в скорость.
  2. Логику интерфейса тоже держать в ядре: разбор строки запроса, подсказки автодополнения, перевод запроса в фильтр, проверки (обязательные поля, циклы связей, условия колонок доски).
  3. Дизайн из одного источника: файл токенов (JSON: цвета обеих тем, отступы, радиусы, значки статусов) → Swift Color / asset catalog, позже XAML ResourceDictionary, CSS-переменные для веба. Строки RU/EN — один словарь → .xcstrings (macOS), позже .resw (Windows).

  macOS
  - SwiftUI для экранов и форм.
  - AppKit там, где SwiftUI слаб: большие списки и дерево эпиков (NSTableView / NSOutlineView), перетаскивание между колонками доски, палитра ⌘K (NSPanel), вкладки рабочих областей.
  - Системное меню, полупрозрачный сайдбар, ⌘-сочетания, уведомления, deep links tasker://TSK-…, один экземпляр.
  - Минимальная версия macOS — зафиксировать (13 или 14).

  Windows (на потом)
  WinUI 3 (Windows App SDK) на C#, ListView/ItemsRepeater с виртуализацией, Mica, трей. Минимум Windows 10 1809+.

  Риски
  - Стоимость: каждая фича — отдельная реализация и тесты на каждой платформе.
  - Расхождение с макетом и между платформами без общих токенов, строк и логики.
  - SwiftUI List тормозит на тысячах строк — списки на AppKit.
  - Avalonia-десктоп и .NET-обвязка становятся лишними — решить, когда выводить.

  Черновик этапов
  1. Договор API: REST + SSE демона с OpenAPI; общие токены дизайна и строки.
  2. MVP на macOS: список задач со строкой запроса, карточка задачи, доска, палитра ⌘K. Заодно проверить перенос дизайна и скорость списков.
  3. Настройки проекта, админ-панель, остальное.
  4. Windows — отдельным решением позже.

  Открытые вопросы для обсуждения
  - Демон vs FFI: окончательный выбор и что с режимом Server (приложение как клиент удалённого сервера?).
  - Минимальная версия macOS, способ распространения (подпись, нотаризация, обновления).
  - Что делать с текущим Avalonia-десктопом до готовности нового приложения.
  - Порядок экранов MVP и критерии «готово».

  Сведения о сторонних библиотеках (Tauri, GPUI, UniFFI для C#) — на момент обсуждения, перед решением перепроверить актуальность.
