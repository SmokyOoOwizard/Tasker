  number: 41
description: |-
  Проблема
  `tasker sync` для области в файле SQLite сразу отвечает «A SQLite workspace has no cache: nothing to sync» и не показывает состояние серий и связей проектов, как для папки. Сверять кэш у SQLite действительно нечего, но проблемы серий и связей (ссылки на отсутствующие серии, связи с отсутствующими задачами и типами) так не видны; `cleanup --check` и MCP `series_health` на SQLite работают.

  Где
  - rust/crates/tasker-cli/src/sync.rs — ранний выход для `WorkspaceKind::Sqlite`
  - rust/crates/tasker-services/src/health.rs — `health::compute`, `describe`, `describe_links`
  - rust/crates/tasker-mcpd/src/sync.rs — сверка через демон (для SQLite уже считает `health::compute`)

  Как повторить
  - `tasker --sqlite /tmp/a.db project create Demo`
  - `tasker --sqlite /tmp/a.db sync` — «A SQLite workspace has no cache: nothing to sync», отчёта о сериях и связях нет; с `--json` — только `path`, `via: null`, `problemCount: 0`.

  Что нужно сделать
  - Для SQLite в `tasker sync` пропускать сверку кэша, но печатать (и отдавать в `--json` в поле `series`) проблемы серий и связей проектов так же, как для папки; с `-q` — молчать, если проблем нет.
  - Обновить docs/wiki/Консоль.md (там сказано, что для SQLite `sync` сообщает, что делать нечего).
  - Проверка: в БД с задачей, ссылающейся на удалённую серию, `tasker --sqlite <файл> sync` показывает проблему, а без проблем — короткое сообщение.
