description: |-
  Эпик TSK-178.

  Как воспроизвести
  1. Открыть доску и кликнуть по задаче А: она открывается в боковой панели справа.
  2. В панели добавить задаче А связь с задачей Б.
  3. Найти задачу Б на этой же доске и кликнуть по ней.
  4. В панели у задачи Б связи с задачей А нет.
  5. Перейти во «Все задачи» и вернуться на доску: связь появилась.

  Как должно быть
  Связь видна у задачи Б сразу, без смены раздела.

  Что известно (по коду, в приложении причина не проверена)
  - `TaskDetailHost` создаёт новую `TaskDetailModel` при смене задачи и загружает её запросом `TaskQuery`, поэтому панель должна получать свежие данные.
  - Связь хранится в файле исходной задачи, у задачи Б она только входящая. Изменение связи может не считаться изменением задачи Б.

  Что сделать
  - Воспроизвести и установить, где теряется связь: кэш клиента GraphQL, ответ сервера или индекс демона для входящих связей, данные доски. Проверить тем же запросом сразу после добавления связи, что отвечает демон.
  - Проверить связь в обе стороны, удаление связи и иерархическую связь Parent/Child.
  - Проверить тот же сценарий в списке «Все задачи» и в полной карточке.

  Готово, когда
  Добавленная или удалённая связь сразу видна у обеих задач в панели на доске, в списке и в полной карточке, без смены раздела. Есть тест на сценарий.
