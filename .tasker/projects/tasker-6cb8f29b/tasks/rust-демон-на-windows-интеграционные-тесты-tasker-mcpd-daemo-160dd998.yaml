description: |-
  Проблема
  На Windows интеграционные тесты демона tasker-mcpd не доходят до готовности: daemon.rs — `/health` не отвечает 200 за 30 с, mcp.rs — «the daemon did not get ready in 60 s», supervisor.rs — условие Fixture не выполняется за 30 с. На Linux и macOS проходят. Поэтому Windows-ветки демона (передача сокета `wsa:<base64>` через WSADuplicateSocketW, Job Object, CREATE_NO_WINDOW, именованное событие остановки `Local\tasker-mcp-stop-…`) тестами не проверены. Тесты помечены `#[cfg_attr(windows, ignore = "TSK-156: …")]`.

  Где
  - rust/crates/tasker-mcpd/tests/daemon.rs (4 теста), mcp.rs (4 теста), supervisor.rs (8 тестов) — пропуск на Windows
  - rust/crates/tasker-mcpd/src/ — supervisor.rs, worker.rs, shutdown.rs, http.rs (привязка и передача сокета, ожидание hello/ready)
  - .github/workflows/release-build.yml — прогон cargo nextest на windows-latest

  Как повторить
  - На Windows (или в CI windows-latest) убрать `ignore` у тестов и выполнить `cargo nextest run -p tasker-mcpd --run-ignored all` — тесты падают по таймауту готовности.

  Что нужно сделать
  - Найти причину, начиная с дешёвых:
    - сами тесты: settings.json пишется форматированием без экранирования пути (обратные косые в JSON); stdout/stderr демона в канале, который никто не читает (буфер канала Windows 4 КБ — демон блокируется на записи журнала); sh-обёртки и `kill` в supervisor.rs;
    - демон: привязка и передача сокета, ожидание hello/ready.
  - Исправить тесты и/или демон, снять `ignore` со всех 16 тестов.
  - Проверка: `cargo nextest run -p tasker-mcpd` проходит на windows-latest в CI вместе с Linux и macOS.
