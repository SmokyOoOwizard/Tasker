description: |-
  Проблема
  Не записывается, что именно меняли агенты через MCP: на сервере у токена агента видно только время последнего использования (`lastUsedAt`, обновляется не чаще раза в минуту), в демоне на десктопе и в консоли нет и этого. Кто из агентов создал, изменил или удалил сущность, узнать нельзя.

  Где
  - src/Tasker.Mcp/McpCall.cs, src/Tasker.Mcp/Tools/ — вызовы инструментов MCP сервера
  - src/Tasker.Core/Agents/AgentService.cs, src/Tasker.Core/Agents/AgentToken.cs, src/Tasker.Storage.Db/Storages/AgentTokenStorage.cs — `LastUsedAt`
  - rust/crates/tasker-mcp/src/call.rs, rust/crates/tasker-mcpd/src/logging.rs — вызовы и журнал демона
  - frontend/src/pages/profile/AgentsSection.tsx — «использован …» у токена

  Как повторить
  - Сервер: создать агента и токен, выполнить через MCP `create_task`, `update_task`, `delete_task`; в «Профиль → Агенты» видно только «использован <время>», списка действий нет ни в интерфейсе, ни в API.
  - Десктоп/демон: те же вызовы через `http://127.0.0.1:<порт>/mcp` не оставляют записи о том, какой агент что изменил.

  Что нужно сделать
  - Записывать изменяющие вызовы MCP агентов: агент, инструмент, сущность (вид, id, проект), время, результат (успех/ошибка) — на сервере и в демоне.
  - Место хранения для БД и для папки (не в git-файлах сущностей), срок или объём хранения.
  - Просмотр журнала владельцем агента и админом: в интерфейсе («Профиль → Агенты») и через API.
  - Проверка: после вызовов `create_task`/`update_task`/`delete_task` агентом в журнале есть записи с агентом, инструментом, сущностью и временем; чтение через MCP в журнал не попадает; чужой журнал недоступен обычному пользователю.
