description: |-
  Проблема
  Под нагрузкой (load ~5, параллельные прогоны) два .NET-теста падают, а в изоляции проходят:
  - SettingsTests.Parallel_updates_are_not_lost — таймаут `settings.lock` 30 с;
  - DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up — `tasker mcp run` после SIGINT не завершается за 30 с.
  Неизвестно, это короткие таймауты или настоящие гонки.

  Где
  - dotnet/tests/Tasker.Tests/SettingsTests.cs — Parallel_updates_are_not_lost (20 параллельных `SettingsStore.AddWorkspace`)
  - dotnet/tests/Tasker.Tests/DaemonTests.cs — Foreground_run_stops_on_interrupt_and_cleans_up
  - dotnet/src/Tasker.Global/SettingsStore.cs — `settings.lock`, AddWorkspace
  - dotnet/src/Tasker.Daemon.Host/McpDaemon.cs, dotnet/src/Tasker.Daemon/ShutdownSignal.cs — остановка демона

  Как повторить
  - Нагрузить машину (второй полный `dotnet test` параллельно или стресс-стенд dotnet/tools/Tasker.Stress) и прогнать `dotnet test dotnet/tests/Tasker.Tests --filter "FullyQualifiedName~SettingsTests|FullyQualifiedName~DaemonTests"` несколько раз подряд — тесты падают с описанными ошибками; без нагрузки проходят.

  Что нужно сделать
  - Для каждого теста выяснить причину: долгая работа под блокировкой или ожидание (тогда поднять таймаут или сделать его адаптивным) либо гонка в продукте (тогда исправить продукт).
  - Остановка `tasker mcp run` по SIGINT: где уходит больше 30 с.
  - Проверка: два теста проходят в цикле под нагрузкой (параллельный полный прогон) на macOS и Linux.
