description: |-
  Эпик TSK-178. Интерфейс на двух языках, как в main-design.

  Что сделать
  - String Catalog (.xcstrings) с ключами RU/EN; источник строк — общий словарь (тот же, что EN-словарь макета), чтобы веб и приложение говорили одинаково.
  - Язык по умолчанию — системный: русский, если в системе русский, иначе английский. Переключатель языка в настройках приложения.
  - Формы множественного числа («5 задач»), даты и числа по выбранному языку.
  - Перевести каркас окна.

  Готово, когда
  Каркас окна полностью на RU и EN, язык выбирается по системе и меняется в настройках.
