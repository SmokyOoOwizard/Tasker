description: |-
  Проблема
  У десктопа нет своей иконки приложения: на macOS в Dock и переключателе программ показывается стандартная иконка, потому что приложение запускается не из `.app`-бандла и `.icns` нет. В проекте есть только иконка трея (`Assets/tray.png`), иконка окна не задана.

  Где
  - src/Tasker.Desktop/Tasker.Desktop.csproj — сборка десктопа (нет бандла, иконки приложения)
  - src/Tasker.Desktop/Assets/ — только tray.png
  - src/Tasker.Desktop/WorkspaceWindow.axaml — окно без `Icon`

  Как повторить
  - `dotnet run --project src/Tasker.Desktop` на macOS: в Dock — стандартная иконка, а не иконка Tasker.
  - `find src/Tasker.Desktop -name '*.icns' -o -name Info.plist` — ничего не находит.

  Что нужно сделать
  - Нарисовать иконку приложения и подготовить форматы: `.icns` (macOS), `.ico` (Windows), PNG (Linux, окно).
  - Собирать на macOS `.app`-бандл: `Info.plist` (имя, идентификатор, `CFBundleIconFile`, версия) и иконка в `Contents/Resources`.
  - Задать иконку окна (`Window.Icon`) и `ApplicationIcon` для Windows.
  - Проверка: собранный `Tasker.app` показывает иконку в Dock, Finder и Cmd+Tab; на Windows — у exe и в панели задач.
