  number: 228
description: |-
  Эпик TSK-178.

  Что происходит
  При перетаскивании задачи из колонки в колонку подтверждение переноса иногда подвисает: индикатор крутится довольно долго, примерно 10 секунд. Происходит не всегда.

  Если в это время переключиться на вкладку задач и вернуться на доску, всё в порядке: задача уже успешно перенесена в другую колонку.

  Что это значит
  По наблюдению выше перенос успевает выполниться, а экран доски об этом не узнаёт вовремя. Где именно застревает, не проверено: ответ на запрос переноса, живое событие или снятие индикатора. Также не проверено, сколько времени реально занимает сам запрос.

  Что сделать
  - Воспроизвести и замерить время запроса и момент прихода живого события.
  - Индикатор снимается сразу после ответа сервера, а карточка стоит в новой колонке, не дожидаясь перезагрузки экрана.
  - Если запрос переноса действительно бывает долгим, выяснить причину отдельно.

  Готово, когда
  После успешного переноса индикатор исчезает сразу после ответа сервера, а карточка показана в новой колонке без переключения экрана. Поведение при отказе сервера не меняется.
