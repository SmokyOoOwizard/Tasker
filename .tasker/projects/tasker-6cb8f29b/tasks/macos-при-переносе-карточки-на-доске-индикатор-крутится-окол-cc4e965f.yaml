title: 'macOS: при переносе карточки на доске индикатор крутится около 10 секунд, хотя перенос уже выполнен'
typeId: 97e160a1-7791-45ea-aa77-9e590c3536eb
statusId: 30300951-beb2-495f-a290-2b36ae0f4920
