description: |-
  Проблема
  При перетаскивании вкладки за курсором едет фантом только с заголовком вкладки и путём папки, а не с картинкой страницы: нативный WebView (`NativeWebView` из Avalonia.Controls.WebView) не рисуется в `RenderTargetBitmap`. Нужно выяснить, можно ли получить снимок содержимого другим способом.

  Где
  - src/Tasker.Desktop/Tabs/GhostWindow.cs — окно фантома (заголовок + карточка с путём)
  - src/Tasker.Desktop/Tabs/TabDragController.cs — создание фантома при отрыве вкладки
  - src/Tasker.Desktop/Tabs/TabModel.cs — `NativeWebView` вкладки

  Как повторить
  - Запустить десктоп (`dotnet run --project src/Tasker.Desktop -- --files=<папка>`), открыть рабочую область.
  - Потащить вкладку за пределы полосы вкладок: в фантоме — название и путь папки, содержимого страницы нет.

  Что нужно сделать
  - Исследовать способы получить снимок страницы: API снимка самого WebView (WKWebView `takeSnapshot` на macOS, WebView2 `CapturePreviewAsync` на Windows, WebKitGTK на Linux), доступ к ним через Avalonia.Controls.WebView или нативный дескриптор, либо снимок средствами страницы.
  - Если способ есть — показывать в фантоме уменьшенный снимок вкладки, снятый в момент отрыва; где снимок недоступен — оставить текущий вид (заголовок и путь).
  - Проверка: при отрыве вкладки на macOS (и на других системах, где сделано) в фантоме видна картинка страницы; перетаскивание не тормозит.
