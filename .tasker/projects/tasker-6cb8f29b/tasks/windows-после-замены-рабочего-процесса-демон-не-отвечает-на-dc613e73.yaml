description: |-
  Что происходит
  На Windows (CI, windows-latest) после замены рабочего процесса демона `tasker mcp status --json` всё время отдаёт `"daemon": null`. Так бывает и после `tasker mcp upgrade`, и после того, как супервизор перезапустил упавший рабочий процесс. На macOS и Linux всё работает.

  Падающие тесты (ветка dotnet-cli-parity, PR SmokyOoOwizard/Tasker#35, коммиты 0a90899 и 483a3aa):
  - DaemonUpgradeTests.A_server_started_as_one_process_is_restarted_by_upgrade_and_is_seamless_afterwards
  - DaemonUpgradeTests.A_call_in_progress_is_finished_by_the_old_process_and_both_are_shown_in_the_status
  - DaemonUpgradeTests.A_worker_that_crashes_is_started_again_by_the_supervisor
  - ParallelWorkTests.The_daemon_replaced_on_the_fly_under_load_loses_no_call_and_no_write (сценарий upgrade стенда Tasker.Stress: сразу после `mcp upgrade` вызов `mcp status --json` вернул daemon null)

  Что показала диагностика (коммит 199d621, прогон CI по 483a3aa)
  Во всех трёх DaemonUpgradeTests одно и то же: «lock held True, pid …, port …: TaskCanceledException: The request was canceled due to the configured HttpClient.Timeout of 10 seconds elapsing».
  - Блокировку daemon.lock супервизор держит, а daemon.json читается. Клиент тут ни при чём.
  - На прямой запрос GET /daemon/status из процесса тестов демон не отвечает 10 с. Значит, после замены рабочего процесса на Windows не отвечает сам демон, а не консоль.

  Где искать
  - В main эти тесты на Windows проходили. Тогда тесты запускали Rust-консоль, но демон с тех пор менялся: коммит 54bb60d «демон как в Rust». Начать с разницы `git diff main -- dotnet/src/Tasker.Daemon.Host dotnet/src/Tasker.Daemon`.
  - /daemon/status принимает рабочий процесс и передаёт его супервизору: request/reply по stdin/stdout. Проверить:
    - передачу сокета новому рабочему процессу на Windows (WSADuplicateSocket);
    - затвор приёма (accept gate) у нового процесса после activate;
    - чтение супервизором stdout нового рабочего процесса и пересылку request/reply.
  - Журнал демона пишется в logs/mcp-*.log в TASKER_HOME. В CI его стоит сохранять артефактом, когда тесты падают.

  Готово, когда
  - Найдена причина.
  - Исправлен демон, а не тест.
  - Четыре теста выше проходят на windows-latest, а на macOS и Linux ничего не сломано.
