description: |-
  Проблема
  Строки таблицы `refresh_tokens` никогда не удаляются: при каждом обмене refresh-токена добавляется новая строка, использованные, отозванные и истёкшие остаются навсегда, и таблица растёт без предела.

  Где
  - src/Tasker.Storage.Db/Storages/RefreshTokenStorage.cs — хранилище refresh-токенов (только добавление и отзыв)
  - src/Tasker.Core/Auth/RefreshToken.cs (`IRefreshTokenStorage`), src/Tasker.Core/Auth/AuthService.cs — выдача и обмен
  - src/Tasker.Storage.Db/AppDbContext.cs — таблица `refresh_tokens`

  Как повторить
  - `dotnet run --project src/Tasker.Server -- --sqlite=tasker.db`, войти в интерфейс, несколько раз выйти и войти (или дождаться обменов токена).
  - `sqlite3 tasker.db "select count(*), sum(revoked_at is not null) from refresh_tokens"` — погашенные строки накапливаются, удаления нет ни в коде, ни по расписанию.

  Что нужно сделать
  - Метод хранилища для удаления строк с истёкшим сроком (`ExpiresAt` в прошлом): погашенные, но ещё не истёкшие, нужны для обнаружения повторного использования токена и остаются.
  - Фоновая задача сервера, вызывающая чистку периодически (например, раз в сутки и при старте).
  - Проверка: тест хранилища — истёкшие строки удаляются, действующие и погашенные неистёкшие остаются; обмен и выход после чистки работают.
