description: |-
  Эпик TSK-178.

  Что сделать
  - Каталог полей: создание, тип, множественность, перечисление; смена типа с окном затронутых задач и вариантами (очистить / сопоставить / оставить первое); «Используется» с местами использования.
  - Перечисления: редактор значений списком с перестановкой (значений может быть много), удаление используемого значения — стереть из задач или заменить.
  - Типы связей: стороны, направленность, циклы, иерархия; нельзя удалить тип со связями.
  - Серии: создать, переименовать, удалить, здоровье.
  - Проект: переименование, удаление только после ввода названия; участники (в режиме Server).

  Готово, когда
  Все настройки проекта из main-design доступны в приложении.
