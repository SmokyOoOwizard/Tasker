description: |-
  Эпик TSK-178. Общие механизмы для всех редакторов.

  Что сделать
  - Открытие редактора берёт блокировку и продлевает её, пока окно открыто; закрытие снимает (уже сделано для досок и окон настроек).
  - Чужая блокировка: отметка «правит Мария», сохранение недоступно (уже сделано для досок и окон настроек).
  - Ответ «Изменено другим пользователем» → окно «перечитать и повторить» без потери введённого (уже сделано для карточки задачи).
  - Один компонент для карточки задачи, досок и окон настроек.

  Готово, когда
  Два клиента (приложение и консоль/MCP) не затирают правки друг друга, пользователь видит, кто правит.
