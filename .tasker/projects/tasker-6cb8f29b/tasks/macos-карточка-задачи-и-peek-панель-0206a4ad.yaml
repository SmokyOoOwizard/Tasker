description: |-
  Эпик TSK-178.

  Что сделать
  - Полная карточка задачи и боковая peek-панель, раскладка как в main-design: заголовок, описание (markdown), справа колонка свойств — статус (только из набора типа), тип (смена с выбором нового статуса, если текущего нет в наборе), серии, поля.
  - Поля по видам (поля типа, добавленные из каталога, свои), ввод по типу поля, отметка обязательных, добавление поля из каталога и своего поля.
  - Серии: добавить, убрать, перенумеровать.
  - Связи, сгруппированные по названию стороны, добавление (тип + поиск задачи по ключу/заголовку) и удаление; родители и дети с прогрессом эпика.
  - Удаление с подтверждением, created/updated, ссылки TSK-N внутри текста кликабельны.

  Готово, когда
  Задачу можно полностью просмотреть и отредактировать из карточки и из peek-панели.
