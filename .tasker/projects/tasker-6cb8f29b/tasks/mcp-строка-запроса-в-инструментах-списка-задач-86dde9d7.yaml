description: |-
  Продолжение TSK-190. Разбор строки запроса уже есть на сервере и в ядре (`TaskService.ParseQuery`, `AnalyzeQuery`), инструменты MCP им пока не пользуются.

  Пример вызова list_tasks:

  { "query": ".Status == \"Todo\" && .Field.Метки.Contains(\"bug\") | sort -.Updated" }

  Что сделать
  - Параметр `query` у `list_tasks` и у инструмента задач колонки доски, если он есть.
  - Совместное использование с существующими параметрами фильтра: условия соединяются через И. Сортировка из запроса главнее `sort`.
  - Ошибка разбора возвращается с кодом `query.*` и позицией, чтобы агент мог исправить запрос.
  - Описание синтаксиса в описании параметра: кратко, с примером.
  - Решить, нужен ли отдельный инструмент проверки запроса и подсказок поверх `AnalyzeQuery`.
  - Обновить `docs/wiki/MCP-и-агенты.md` и эталонный список инструментов `tests/golden/expected/mcp/tools-list.json`.

  Готово, когда
  Агент может отбирать и сортировать задачи строкой запроса через MCP в обоих видах хранилища, есть тесты.
