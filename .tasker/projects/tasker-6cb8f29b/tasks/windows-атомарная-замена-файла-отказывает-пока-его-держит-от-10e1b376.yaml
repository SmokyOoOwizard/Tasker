description: |-
  Проблема
  На Windows атомарная запись файла (временный файл + замена через `File.Move` с overwrite = MoveFileEx с MOVEFILE_REPLACE_EXISTING) отказывает с `UnauthorizedAccessException: Access to the path is denied`, пока исходный файл открыт читателем — даже если он открыт так, как читает сам AtomicFile (`FileShare.ReadWrite | FileShare.Delete`). Долгий читатель (дольше пауз повторов, ~1,5 с) блокирует запись; короткий только задерживает. Комментарий AtomicFile «читатель не мешает чужой замене файла» на Windows неверен.

  Где
  - src/Tasker.Core/IO/AtomicFile.cs — Move, WriteAllBytes, Retry
  - rust/crates/tasker-core/src/io/atomic_file.rs — `move_file` (`std::fs::rename` с повторами на Windows)
  - tests/Tasker.Tests/WindowsFileSystemTests.cs — Windows_a_file_can_be_replaced_while_a_reader_has_it_open (`Skip = "TSK-163: …"`)

  Как повторить
  - На Windows убрать Skip у Windows_a_file_can_be_replaced_while_a_reader_has_it_open и выполнить `dotnet test tests/Tasker.Tests --filter "FullyQualifiedName~WindowsFileSystemTests"` — тест падает с UnauthorizedAccessException из AtomicFile.Move.

  Что нужно сделать
  - Замена с POSIX-семантикой: `SetFileInformationByHandle` с `FileRenameInfoEx` и `FILE_RENAME_FLAG_REPLACE_IF_EXISTS | FILE_RENAME_FLAG_POSIX_SEMANTICS` (Windows 10 1709+, NTFS), с откатом на MoveFileEx, где это не поддерживается.
  - Проверить Rust-сторону (`move_file` в tasker-core): тот же сценарий с открытым читателем; при отказе — то же исправление.
  - Исправить комментарий AtomicFile.
  - Проверка: снять Skip, тест проходит на windows-latest в CI; аналогичный Rust-тест (замена при открытом читателе) проходит на Windows.
