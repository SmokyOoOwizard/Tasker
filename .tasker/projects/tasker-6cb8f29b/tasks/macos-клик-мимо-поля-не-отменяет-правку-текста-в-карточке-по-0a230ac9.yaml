description: |-
  Эпик TSK-178.

  Как воспроизвести
  1. Открыть задачу.
  2. Нажать на текст, чтобы начать его редактировать.
  3. Нажать на пустое место вне поля: редактирование не снимается.
  4. Нажать в поле ещё раз, чтобы появился курсор.
  5. Снова нажать на пустое место: теперь редактирование отменяется.

  Как должно быть
  Клик вне поля отменяет редактирование сразу, в том числе если в поле ещё не ставили курсор. Лишний клик в поле не нужен.

  Предположение (не проверено)
  После входа в режим правки поле не получает клавиатурный фокус. Тогда снятие правки по потере фокуса срабатывает только после того, как пользователь сам поставил в поле курсор.

  Что проверить
  Все поля карточки, которые правятся по клику, в полной карточке и в peek-панели. Несохранённый текст не должен теряться незаметно: сверить с поведением черновиков из TSK-211.

  Готово, когда
  Первый же клик вне поля снимает редактирование, а после входа в правку можно сразу печатать.
