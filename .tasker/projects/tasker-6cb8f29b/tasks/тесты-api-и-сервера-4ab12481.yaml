description: |-
  Проблема
  REST проверен в тестовом проекте лишь частично: в tests/Tasker.Tests приложение поднимается в процессе (`TaskerWebApp.CreateBuilder`, SQLite в памяти, временная папка) для задач, серий, полей, перечислений, связей и блокировок, а в серверном режиме — для серий, полей, входа и токенов агентов. Не покрыты тестами REST доски и перенос задачи по доске, участники проекта, статусы и наборы статусов, пользователи, обновление сессии, выход и смена пароля, статистика и проблемы области.

  Где
  - src/Tasker.Web/TaskerApi.cs — маршруты REST
  - tests/Tasker.Tests/SeriesApiTests.cs, FieldsApiTests.cs, SeriesServerApiTests.cs, FieldsServerTests.cs — существующие тесты API
  - .github/workflows/dotnet-tests.yml — прогон tests/Tasker.Tests в CI

  Как повторить
  - `grep -l '/boards\|/members\|auth/refresh\|auth/logout\|/password' tests/Tasker.Tests/*.cs` — тестов этих маршрутов через HTTP нет

  Что нужно сделать
  - Тесты REST в tests/Tasker.Tests для непокрытых маршрутов: доски и `/boards/{id}/columns/{columnId}/move`, участники проекта, статусы и наборы статусов, пользователи, `/auth/refresh`, `/auth/logout`, `/users/{id}/password`, `/projects/{id}/stats`, `/workspace/problems`
  - В серверном режиме — права: без входа 401, чужой проект недоступен, участник видит только свои проекты
  - Проверка: `dotnet test tests/Tasker.Tests` проходит локально и в CI
