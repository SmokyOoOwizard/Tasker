description: |-
  Проблема
  Директива автодополнения `[suggest:N]` получает строку вторым аргументом программы, но заново разбирает все аргументы как обычную командную строку. Строка, начатая с короткого параметра, склеивается с ним: `'-p Второй status get '` превращается в токены `-p` и `' Второй status get '`, и директива подсказывает без `-p`. Так же `'--json=x task'` превращается в `'x task'`, а строка, начатая с `@`, читается как файл ответов.

  Где
  - rust/crates/tasker-cli/src/suggest/mod.rs — `run`: строка берётся как последний токен после `scl::tokenize` всех аргументов
  - rust/crates/tasker-cli/src/suggest/scl.rs — разбор токенов

  Как повторить
  - Во временной папке с временным `TASKER_HOME`: два проекта (`tasker project create Первый`, `tasker project create Второй`), статус в проекте Второй.
  - `tasker '[suggest:22]' '-p Второй status get '` — выводит список параметров (`--help`, `--json`, …) вместо статусов проекта Второй.
  - `tasker '[suggest:30]' 'status get -p Второй '` — выводит статусы проекта Второй (то же, но `-p` не в начале).

  Что нужно сделать
  - Брать строку директивы прямо из второго аргумента (`args[1]`), без повторного разбора всей командной строки.
  - Строки, начатые с `-p X`, `--opt=value`, `@`, дополняются так же, как без этого начала.
  - Проверка: тесты директивы на эти три случая (подсказки для проекта из `-p`, `--json=x task`, строка с `@`); существующие тесты автодополнения и golden проходят.
