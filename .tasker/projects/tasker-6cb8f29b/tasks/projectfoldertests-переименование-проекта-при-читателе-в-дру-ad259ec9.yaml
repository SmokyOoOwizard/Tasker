description: 'В CI на Windows (PR #74, прогон 42118606201) тест A_reader_in_another_process_sees_the_project_while_it_is_renamed_again_and_again упал один раз: при переименовании папки проекта «Access to the path ...\.tasker\projects\name-4-... is denied», index.db занят другим процессом. В остальных прогонах проходил. Нужно понять, хватает ли повторов у Directory.Move под нагрузкой. Готово, когда тест стабильно проходит на Windows.'
