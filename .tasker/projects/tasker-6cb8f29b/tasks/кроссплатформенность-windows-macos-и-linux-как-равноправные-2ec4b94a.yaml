description: |-
  Проблема
  Tasker должен одинаково работать на macOS, Linux и Windows: консоль, демон с автозапуском, установка, файловое хранилище, десктоп. Консоль и демон собираются и ставятся на всех трёх (scripts/install.sh, scripts/install.ps1, автозапуск через launchd, systemd, Планировщик заданий), но на Windows .NET-тесты в CI падают, интеграционные тесты демона пропускаются, бесшовное обновление демона по умолчанию выключено, а десктоп на Windows и Linux не запускался; демон под systemd не проверен на настоящей машине x86_64.

  Где
  - .github/workflows/dotnet-tests.yml, .github/workflows/release-build.yml — CI на ubuntu, macos, windows
  - rust/crates/tasker-mcpd/ — демон (на Windows однопроцессный без `TASKER_MCP_SUPERVISOR=1`; тесты `tests/daemon.rs`, `tests/mcp.rs` помечены ignore на Windows)
  - rust/crates/tasker-daemon/src/autostart/ — launchd, systemd, Планировщик заданий
  - src/Tasker.Desktop/ — десктоп
  - docs/wiki/Платформы.md, docs/wiki/Установка.md — матрица платформ и установка

  Как повторить
  - `gh run list --workflow ".NET tests" --branch main` — прогоны с ошибкой задания windows-latest (SeriesIndexTests, DaemonTests, ConcurrencyTests и др.)
  - `grep -rn 'cfg_attr(windows, ignore' rust/crates/tasker-mcpd/tests` — тесты демона на Windows не выполняются
  - `dotnet run --project src/Tasker.Desktop` на Windows или Linux не проверялся

  Что нужно сделать
  - Довести дочерние задачи (связь includes): CI и базовый прогон на трёх платформах, десктоп на Windows и Linux, проверка демона под systemd на настоящем Linux
  - Бесшовное обновление демона на Windows включено по умолчанию после проверки на Windows
  - Проверка: все тесты (Rust и .NET) зелёные в CI на трёх платформах без пропусков по платформе, кроме тестов, платформенных по природе; установка одной командой на каждой ОС; демон стартует при входе и обновляется без простоя; docs/wiki/Платформы.md описывает, что и где проверено
