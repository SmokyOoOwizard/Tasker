description: |-
  Проблема
  `tasker mcp upgrade` заменяет только рабочий процесс демона; супервизор tasker-mcpd (держит порт, блокировку и сокет) остаётся старой сборки до перезапуска демона или службы. Не решено, нужна ли замена супервизора на лету (передача сокета и блокировки новому супервизору) или достаточно совместимости протокола супервизор — рабочий процесс. Сборка супервизора нигде не показывается.

  Где
  - rust/crates/tasker-mcpd/src/supervisor.rs — супервизор и замена рабочего процесса
  - rust/crates/tasker-mcpd/src/handoff.rs — передача слушающего сокета
  - rust/crates/tasker-mcpd/src/wire.rs, rust/crates/tasker-mcpd/src/version.rs — протокол с рабочими процессами
  - rust/crates/tasker-cli/src/commands/mcp.rs — `tasker mcp upgrade`, `tasker mcp status`
  - docs/wiki/Демон-MCP.md — описание устройства

  Как повторить
  - `tasker mcp status` — строка «worker pid …, build …», сборки супервизора нет
  - Поставить новую сборку и выполнить `tasker mcp upgrade`: pid супервизора в `tasker mcp status` прежний, работает старый код супервизора

  Что нужно сделать
  - Решить: замена супервизора на лету или только совместимость протокола; при совместимости — правила версионирования протокола и что делать при несовместимом супервизоре (`upgrade` сообщает и предлагает `--restart`)
  - Показывать сборку супервизора в `tasker mcp status` (и `--json`)
  - При замене на лету — передача сокета и `daemon.lock` новому супервизору без простоя, под launchd, systemd и Планировщиком
  - Проверка: тест — после `upgrade` на сборку с другой версией супервизора `status` показывает ожидаемую сборку супервизора, вызовы MCP во время обновления не обрываются
