description: |-
  Эпик TSK-178.

  Что сделать
  - Создание доски из интерфейса и из палитры команд, редактирование: название, наборы статусов, колонки (добавить, переименовать, переставить, удалить), статусы колонки, статус при переносе для каждого набора, условия по полям.
  - Сообщения сервера о непринятой доске («статус «Бэклог» в колонках A и B без взаимоисключающих условий») показываются рядом с колонками.
  - Блокировка редактирования: «правит …», «вы правите, блокировка продлевается».

  Готово, когда
  Доску можно создать и полностью настроить без консоли.
