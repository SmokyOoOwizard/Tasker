description: |-
  Эпик TSK-178. Дизайн приложения и веба берётся из одного источника, а не перерисовывается на глаз.

  Что сделать
  - Выписать из docs/mockups/web/main-design.html токены: цвета тёмной (компактной) и светлой (тёплой) темы, акценты, цвета статусов, отступы, радиусы, размеры и начертания шрифтов, высоты строк, тени.
  - Один файл токенов в репозитории (JSON, например design/tokens.json) и генерация из него Swift-кода / Color assets для приложения; заодно CSS-переменные для фронтенда (подключать во фронтенд — отдельно).
  - Набор значков статусов из макета (ST_ICONS) как SF Symbols или векторные ассеты.
  - Применить токены к каркасу окна; переключение тем по системе.

  Готово, когда
  Токены живут в одном файле, Swift-код из них генерируется скриптом, каркас окна в обеих темах совпадает с макетом.
