description: |-
  Проблема
  В веб-интерфейсе нет серий задач: у задач не показываются номера (`TSK-5`), нельзя создать, переименовать или удалить серию, добавить задачу в серию или сменить номер, не видно пометки конфликта номера. Серии есть только в API, консоли и MCP; в интерфейсе — лишь их количество в настройках проекта.

  Где
  - frontend/src/pages/TasksPage.tsx, frontend/src/pages/BoardsPage.tsx — списки задач без номеров
  - frontend/src/pages/settings/ProjectSection.tsx — только счётчик серий
  - frontend/src/types.ts — тип задачи без `seriesNumbers`
  - src/Tasker.Web/TaskerApi.cs — `/series`, `/series/health`, `/tasks/{id}/series`, `/renumber`, фильтр `?seriesId=`; `seriesNumbers` в задаче

  Как повторить
  - Создать серию и задачи в ней: `tasker series create ...`, `tasker task create ...`.
  - Открыть проект в интерфейсе: в списке задач и на доске номеров нет, раздела серий нет.

  Что нужно сделать
  - Показывать номера задач (`PREFIX-N`) в списке задач, на доске и в карточке задачи.
  - Страница серий: список, создание, переименование (имя, префикс), удаление.
  - В карточке задачи: добавить в серию, убрать из серии, сменить номер (`renumber`).
  - Пометка «конфликт номера» у задач с повторяющимся номером (по `/series/health`), фильтр задач по серии.
  - Проверка: в интерфейсе видны номера, серии создаются и правятся, дубликат номера после слияния веток помечен.
