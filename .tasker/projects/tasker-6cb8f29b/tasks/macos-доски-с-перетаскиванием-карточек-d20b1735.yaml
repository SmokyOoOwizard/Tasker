description: |-
  Эпик TSK-178.

  Что сделать
  - Выбор доски, колонки со статусами и условиями по полям (чипы условий), подсказка «N задач вне колонок», 50 карточек на колонку с «показать все».
  - Перетаскивание карточек (AppKit drag & drop) между колонками: статус по dropStatuses для набора задачи; отказ с сообщением сервера («Сначала поправьте поля: …»).
  - Клик по карточке открывает задачу во всплывающем окне; строка запроса фильтрует доску.
  - Карточка сама переезжает при смене поля (живые события).

  Готово, когда
  Доски проекта Tasker работают как в main-design, перетаскивание плавное и правила отказа соблюдаются.
