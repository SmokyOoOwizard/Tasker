description: |-
  Что случилось
  В списке задач, вид «По статусам»: в заголовке группы «Готово» число задач показано не полностью. Вместо «120» видно «12», последний ноль обрезан. Похоже, край названия «Готово» тоже обрезан. Снимок экрана пользователь присылал 2026-11-05.

  Где смотреть (причина ещё не подтверждена)
  GroupCellView.layout в macos/Sources/Tasker/TaskList/TaskListCells.swift. Ширина рамок названия и числа берётся из intrinsicContentSize, а название ещё ограничено значением bounds.width - x - 60. Заголовок рисуют две разные строки: сама строка группы и закреплённый заголовок StickyGroupHeader. Надо воспроизвести и понять, в какой из них это видно и зависит ли это от ширины окна и трёхзначного числа.

  Готово, когда
  Название группы и число видны полностью при любом числе задач (проверить 1, 120 и 10000), в обычной строке группы и в закреплённом заголовке, на обеих темах. На узкой колонке сокращается название, а не число.
