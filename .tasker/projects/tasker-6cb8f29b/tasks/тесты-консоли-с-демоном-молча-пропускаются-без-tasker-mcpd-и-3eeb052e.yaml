  number: 175
description: |-
  Проблема
  Тесты консоли с демоном (`rust/crates/tasker-cli/tests/mcp_daemon.rs`) берут `tasker-mcpd`, лежащий рядом с бинарником `tasker` в каталоге сборки. Если демона там нет, тесты молча пропускаются и считаются пройденными. Если он есть, но собран из старого кода, тесты гоняют устаревший демон: `cargo test -p tasker-cli` его не пересобирает, и тест падает (или проходит) не на текущем коде.

  Где
  - rust/crates/tasker-cli/tests/mcp_daemon.rs — `daemon_is_built`, три теста, которые без демона возвращаются сразу
  - rust/crates/tasker-cli/Cargo.toml — зависимости тестов (демон в них не объявлен)

  Как повторить
  - `cargo clean -p tasker-mcpd` (или чистый `CARGO_TARGET_DIR`), затем `cargo test -p tasker-cli --test mcp_daemon` — «3 passed» за 0,00 с, тесты фактически не выполнялись.
  - Собрать `tasker-mcpd` из старого коммита, вернуться на текущий и запустить `cargo test -p tasker-cli --test mcp_daemon` — тест работает со старым демоном.

  Что нужно сделать
  - Тесты с демоном всегда идут на демоне из текущего кода: демон собирается вместе с тестами (например, artifact dependency/зависимость тестов, сборка `tasker-mcpd` из теста или общий бинарник), либо тест проверяет, что демон не старше консоли, и падает с понятной ошибкой.
  - Отсутствующий демон — падение теста с подсказкой, а не пропуск.
  - Проверить другие тесты, которые зовут внешние бинарники из каталога сборки, на ту же проблему.
  - Проверка: `cargo test -p tasker-cli` в чистом каталоге сборки запускает тесты с демоном по-настоящему; после сборки старого демона тест использует текущий; CI (nextest) выполняет эти тесты.
