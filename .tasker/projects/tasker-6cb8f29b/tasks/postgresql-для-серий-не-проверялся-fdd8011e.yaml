description: |-
  Проблема
  Серии в хранилище БД проверены только на SQLite. На Postgres не запускались: транзакция `Serializable` в `IWriteScope.Exclusive`, повтор при сбое сериализации (`40001`) и взаимной блокировке (`40P01`), перевод запроса `GetWithSeriesNotIn` (`Contains` по массиву id) в SQL.

  Где
  - src/Tasker.Storage.Db/Storages/WriteScope.cs — транзакция и повторы
  - src/Tasker.Storage.Db/Storages/TaskStorage.cs — `GetWithSeriesNotIn`
  - src/Tasker.Storage.Db/DbStorageModule.cs — выбор провайдера Postgres
  - tests/Tasker.Tests — тестов на Postgres нет

  Как повторить
  - `grep -rln -i "postgres\|npgsql" tests` — тестов с Postgres нет.
  - Запустить сервер с Postgres: `dotnet run --project src/Tasker.Server -- --postgres="Host=...;Database=...;Username=...;Password=..."` и параллельно создавать задачи в одной серии.

  Что нужно сделать
  - Прогнать на Postgres сценарии серий: параллельное создание задач в одной серии (уникальные номера без дыр и падений), повторы при `40001`/`40P01`, `cleanup` с `GetWithSeriesNotIn`.
  - Исправить найденные ошибки.
  - Добавить тесты на Postgres (например, Testcontainers или сервис Postgres в CI), запускаемые в workflow .NET-тестов.
  - Проверка: тесты серий проходят на Postgres в CI.
