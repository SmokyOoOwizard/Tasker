description: |-
  Эпик TSK-178. Вероятно, след TSK-218 (PR #65).

  Что происходит
  В процессе Release build на main падает задание «Tasker.app osx-x64», шаг `scripts/macos-build.sh package`: «Command CodeSign failed with a nonzero exit code» при подписи всего приложения.
  - Первый падающий запуск на main: коммит bc0a914 (слияние PR #65), запуск 42006562478.
  - Предыдущий Release build на main (bfb4202, запуск 42002129582) прошёл успешно.
  - По отчёту сессии TSK-222 сборка osx-arm64 проходит, и то же падение x64 видно в PR #67.

  Причина не установлена. В выводе, который я смотрел, не было текста ошибки самого codesign: его надо найти в полном журнале.

  Что проверить
  - Что именно отвергает codesign. PR #65 добавил в приложение консоль и демон: возможно, вложенный бинарник или архитектура x64 устроены иначе, чем на arm64.
  - Запускается ли получившееся приложение x64, а не только собирается.

  Связано
  TSK-204 (подпись, нотаризация, DMG): новая раскладка пакета должна ей подходить.

  Готово, когда
  Release build на main проходит для osx-x64 и osx-arm64.
