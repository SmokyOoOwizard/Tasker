description: |-
  Что происходит
  На Windows (CI, windows-latest) падает тест ProjectFolderTests.A_reader_in_another_process_sees_the_project_while_it_is_renamed_again_and_again (dotnet/tests/Tasker.Tests/ProjectFolderTests.cs). Он упал в двух прогонах подряд: ветка dotnet-cli-parity, PR SmokyOoOwizard/Tasker#35, коммиты 483a3aa и c24510a. В main и на 0a90899 тест проходил.

  Ошибка: System.IO.IOException «Access to the path '…\.tasker\projects\start-65a8a02f' is denied». Её бросает Directory.Move в AtomicFile.MoveDirectory (dotnet/src/Tasker.Core/IO/AtomicFile.cs). Цепочка вызовов: YamlFile.WriteIfMatchMoving, затем WorkspaceIndex.Written, затем IProjectStorage.Update. Это переименование проекта, а с ним и его папки.

  Как устроен тест
  Один экземпляр хранилища 30 раз переименовывает проект. Второй экземпляр в это время без пауз, в цикле, читает проект и статус из той же папки.

  Причина, скорее всего, такая
  Windows не даёт переименовать папку, пока в ней открыт хотя бы один файл. AtomicFile.Retry повторяет кратковременные отказы (доступ запрещён, нарушение совместного доступа) 16 раз с паузами 5…100 мс, всего около 1,4 с. Если читатель почти всё время держит в папке какой-нибудь файл открытым, все попытки неудачны, и переименование падает. То же может случиться у пользователя: например, демон и консоль работают с одной областью, и консоль переименовывает проект, пока демон читает его файлы.

  Что проверить
  - Позволяет ли открытие файлов при чтении с FileShare.Delete переименовать родительскую папку на Windows. Сейчас YamlFile и индекс открывают файлы без него.
  - Если не позволяет, есть два пути. Первый: дольше повторять и не давать читателю бесконечно опережать переименование (например, читатель ждёт, пока идёт переименование). Второй: переименовывать не сразу, а отложенно.
  - Как Rust-версия (до коммита 747c526) переименовывала папку проекта на Windows и проходил ли у неё этот сценарий.

  Готово, когда
  - Переименование папки проекта на Windows выдерживает непрерывное чтение из другого экземпляра хранилища или процесса.
  - Тест стабильно проходит на windows-latest: 10 прогонов подряд.
  - На macOS и Linux ничего не сломано.
