description: |-
  Проблема
  В редакторе набора статусов порядок статусов меняется только кнопками «Выше»/«Ниже» по одному шагу — для длинного набора это неудобно.

  Где
  - frontend/src/pages/settings/StatusSetsSection.tsx — редактор набора (`move`, кнопки `IconArrowUp`/`IconArrowDown`)

  Как повторить
  - Настройки проекта → «Наборы статусов» → изменить набор: статус переставляется только кнопками, перетащить его нельзя.

  Что нужно сделать
  - Перетаскивание статусов мышью внутри набора (кнопки можно оставить для клавиатуры).
  - Проверка: перетащить статус в другое место, сохранить — порядок сохранён (`tasker status-set get`).
