description: |-
  Проблема
  Регистрация первого пользователя (он становится админом) защищена от гонки только `SemaphoreSlim` внутри процесса сервера. Если несколько экземпляров сервера работают с одной БД (за балансировщиком), два одновременных `POST /api/auth/register` на разные экземпляры могут создать двух админов.

  Где
  - src/Tasker.Core/Users/UserService.cs — `Register`, `RegisterLock`
  - src/Tasker.Web/TaskerApi.cs — `POST /api/auth/register`
  - src/Tasker.Storage.Db/ — хранилище пользователей (SQLite, Postgres)

  Как повторить
  - Запустить два экземпляра сервера на одной пустой БД (Postgres или общий файл SQLite).
  - Одновременно отправить `POST /api/auth/register` с разными пользователями на оба экземпляра.
  - Возможен исход, когда оба запроса успешны и в БД два админа.

  Что нужно сделать
  - Сделать проверку «пользователей ещё нет» и создание первого админа атомарными на уровне БД (транзакция с блокировкой или уникальное ограничение), для SQLite и Postgres.
  - Проверка: тест с параллельными регистрациями через независимые подключения к одной БД — ровно одна успешна, остальные получают «Registration is closed».
