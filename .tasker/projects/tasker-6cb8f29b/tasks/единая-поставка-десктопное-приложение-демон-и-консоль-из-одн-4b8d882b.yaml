description: |-
  Эпик TSK-178.

  Зачем
  Десктопное приложение, демон и консоль должны поставляться из одного места как одно приложение. Например, на macOS пользователь устанавливает собранный Tasker.app, и вместе с ним в системе появляются и консольный tasker, и демон, и само приложение.

  Как сейчас
  - Демон уже лежит внутри приложения: Tasker.app/Contents/Helpers/tasker-mcpd (macos/project.yml, DaemonConnection.swift).
  - Консоли в приложении нет. Консоль и демон ставятся отдельно через scripts/install.sh: ~/.local/share/tasker/app и ссылка ~/.local/bin/tasker, служба com.tasker.mcp.
  - В итоге на одной машине может быть две копии демона разных версий.

  Что сделать
  - Положить консольный tasker в пакет приложения рядом с демоном, версия у всех частей одна.
  - При установке или первом запуске приложения подключать консоль к системе, чтобы команда tasker работала в терминале, и подключать демон как службу из пакета.
  - Определить, что происходит при обновлении и удалении приложения: ссылка на консоль, служба демона, работающий демон.
  - Определить переход с установки через scripts/install.sh: что делать с уже установленными консолью, демоном и службой com.tasker.mcp. Данные пользователя не трогать.
  - Обновить документацию по установке (docs/wiki/Установка.md, macos/README.md).

  Что решить перед началом
  - Как консоль попадает в PATH: ссылка в ~/.local/bin, /usr/local/bin (нужны права администратора), пункт меню или вопрос при первом запуске.
  - Остаётся ли scripts/install.sh отдельным способом установки для тех, кому не нужно приложение.
  - Как это будет на других платформах (Windows, Linux): та же идея позже или только macOS.

  Связано
  TSK-204 (подпись, нотаризация, DMG, автообновление): консоль внутри пакета тоже должна быть подписана и обновляться вместе с приложением. TSK-186: там решено класть демон внутрь приложения.

  Готово, когда
  После установки одного Tasker.app работают приложение, команда tasker в новом терминале и демон, все части одной версии и обновляются вместе.
