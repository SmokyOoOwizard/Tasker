description: |-
  Фаза 5 плана docs/rust-migration-plan.md, п. 3–5. Сценарий: install.sh кладёт Rust-бинарники → tasker mcp upgrade (новая Rust-консоль, старый .NET-супервизор) → супервизор запускает tasker-mcpd --worker --listen-fd N (Rust), проверяет ready и require, активирует, дренирует старый воркер; супервизор остаётся .NET до первого mcp restart. Проверить тестом в Docker (на базе test-linux-systemd.sh).

  Документация: wiki Разработка (Rust toolchain вместо .NET SDK для консоли и демона), Установка, Платформы (musl/Alpine, нет требования ICU), README (размер и скорость). Решить, нужен ли один-два релиза с .NET-консолью в архиве как tasker-dotnet (только если фаза 0 выявила зоны риска).

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (2026-10-10): 1) параллельный релиз НЕ нужен — в архиве нет .NET-консоли как tasker-dotnet; п. 5 фазы 5 плана закрыт этим решением. 2) Windows: никаких пометок «экспериментально»/«не проверено» в документации и выводе пока не делаем (даже при том, что интеграционные тесты демона на Windows пропускаются — TSK-155/156).
