description: |-
  Что случилось (2026-11-05, macOS)
  Два демона одновременно слушали 127.0.0.1:5719, по lsof это разные сокеты:
  - основной com.tasker.mcp (pid 867);
  - тестовый стенд com.technotronika.tasker.daemon.tsk202 (pid 70087) со своим TASKER_HOME.

  Второй запустился без ошибки. Новые MCP-соединения стали попадать в него: list_workspaces показывал только тестовую область «ws» вместо настоящих областей, вызовы с workspace Tasker падали с [not_found]. Никаких предупреждений не было. Если бы такой демон принял запись, она ушла бы в данные стенда, и это было бы незаметно. После остановки стенда всё вернулось.

  Возможная причина (не проверена)
  Supervisor.Bind (Supervisor.cs:126, удалён в TSK-235; теперь порт слушает Kestrel через UseUrls в dotnet/src/Tasker.Daemon.Host/McpDaemon.cs, а перед этим McpDaemon.WaitForPort и IsPortFree проверяют, свободен ли порт) на Unix ставил ReuseAddress. Предположение: в .NET на macOS эта опция включает и SO_REUSEPORT, поэтому второй bind на тот же адрес проходит. Нужно подтвердить воспроизведением и проверить Linux. На Windows код ставил ExclusiveAddressUse. Сохранилась ли проблема после TSK-235, не проверено.

  Что сделать
  - Воспроизвести: запустить второй демон с другим TASKER_HOME на том же порту, на macOS и Linux.
  - Сделать так, чтобы занятый порт был ошибкой запуска с понятным сообщением, при этом сохранив быстрый перезапуск после падения (TIME_WAIT).
  - Проверить, что клиенты (консоль, приложение macOS) не принимают чужой демон за свой, если он всё же отвечает на этом порту.
  - Добавить тест.

  Готово, когда
  Второй демон на занятом порту не запускается и сообщает об этом, основной продолжает получать все соединения, перезапуск и `tasker mcp upgrade` работают как раньше.
