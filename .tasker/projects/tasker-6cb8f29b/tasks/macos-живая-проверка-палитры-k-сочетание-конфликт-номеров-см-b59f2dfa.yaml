description: |-
  Эпик TSK-178. Остаток проверки после TSK-195 (PR #55): эти сценарии не проверялись в запущенном приложении.

  Что проверить вживую
  - Нажатие ⌘K с приложением на переднем плане открывает палитру. Раньше панель открывали только через меню «Вид → Палитра команд» и клик по поиску в сайдбаре: в фоне сочетание не доходило до приложения.
  - Конфликт номеров: при переходе по TSK-N с дублирующимся номером показаны обе задачи. Покрыто только модульными тестами.
  - Смена проекта из палитры действует только на текущую вкладку. Покрыто только модульными тестами.
  - Смена рабочей области из палитры. Покрыто только модульными тестами.
  - Смена языка из палитры. Покрыто только модульными тестами.

  Если что-то не работает, исправить в рамках этой задачи.

  Готово, когда
  Все пять сценариев проверены в запущенном приложении, результат записан, найденные ошибки исправлены.
