description: |-
  Эпик TSK-178.

  Зачем
  На карточке задачи на доске не видно, в какой эпик или другую родительскую задачу она входит. Приходится открывать задачу.

  Что должно быть
  - Если у задачи есть родитель по иерархической связи (Parent/Child), выше шапки карточки, то есть выше строки с номером вроде TSK-120, показывается родительская задача.
  - Если родителя нет, карточка выглядит как сейчас, без пустого места.

  Сначала макет
  Работа начинается с макета, код пишется после его согласования с пользователем. Макет показывает карточку на доске в обеих темах и с цветами из `design/tokens.json`:
  - карточку без родителя, с одним родителем и с несколькими родителями;
  - длинный заголовок родителя и родителя без номера в серии;
  - как родитель соотносится с шапкой, заголовком и метками карточки при ширине колонки 290.

  Решить при проектировании
  - Что показывать: номер родителя, заголовок или и то и другое.
  - Показывать только прямых родителей или всю цепочку до верхнего уровня.
  - Как показывать несколько родителей: у задачи их может быть больше одного (`parentIds`).
  - Можно ли нажать на родителя, чтобы открыть его. Нажатие не должно мешать перетаскиванию карточки.

  Где
  - macos/Sources/Tasker/Boards/BoardView.swift — `BoardCardBody`, шапка карточки
  - macos/Sources/Tasker/Boards/BoardViewModel.swift, BoardViewSource.swift — данные доски
  - macos/Sources/Tasker/TaskList/TaskListVocabulary.swift — `TaskRow`
  - macos/TaskerAPI/GraphQL/Boards.graphql — `BoardColumnTasks`, macos/TaskerAPI/GraphQL/Tasks.graphql — `parentIds`
  - dotnet/src/Tasker.Web/Graph/Types/TaskTypes.cs — поле `ParentIds`

  Учесть
  Родитель может стоять в другой колонке, другой доске или вообще не быть на доске, поэтому его номер и заголовок нельзя брать только из загруженных карточек. Не делать отдельный запрос на каждую карточку: на доске могут быть сотни задач.

  Готово, когда
  Макет согласован, реализация ему соответствует. Карточка на доске показывает родителя выше шапки, родитель обновляется без перезагрузки экрана при изменении связи и при переименовании, перетаскивание работает как раньше, карточка без родителя не изменилась, есть тесты.
