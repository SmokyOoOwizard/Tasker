description: |-
  Проблема
  Одновременная запись в одну папку `.tasker` защищена короткими блокировками файлов `.cache/write.lock` и `.cache/index.lock` (на Unix `flock`, на Windows `FileShare.None`) и кэшем SQLite в режиме WAL. Это работает между процессами одной машины, но на сетевых дисках (SMB, NFS) блокировки файлов и WAL ненадёжны: при работе с одной папкой с разных машин «сравнить версию и записать» может потерять правку, а кэш — повредиться. Поведение на реальной общей папке не проверено, и в вики не сказано, что так работать нельзя.

  Где
  - rust/crates/tasker-core/src/io/file_lock.rs — `FileLock` (консоль, демон)
  - rust/crates/tasker-files/src/write.rs, rust/crates/tasker-files/src/layout.rs — запись под `write.lock`
  - rust/crates/tasker-files/src/index/mod.rs — кэш SQLite (WAL) под `index.lock`
  - src/Tasker.Storage.Files/Storages/WriteScope.cs, src/Tasker.Storage.Files/Index/WorkspaceIndex.cs, src/Tasker.Storage.Files/TaskerDirectory.cs — то же в десктопе
  - docs/wiki/Хранение-и-git.md — раздел «Версии и блокировки»

  Как повторить
  - Положить папку с `.tasker` на SMB- или NFS-ресурс, смонтированный на двух машинах.
  - На обеих одновременно и многократно править одну задачу (`tasker task update <id> --title …`) и создавать задачи в одной серии.
  - Проверить, не теряются ли правки, не дублируются ли номера серии и не повреждается ли `.cache` (`tasker sync`).

  Что нужно сделать
  - Проверить работу консоли, демона и десктопа с одной папкой на общем сетевом диске с двух машин (SMB и NFS; macOS, Windows, Linux — что доступно).
  - По результату: либо обеспечить корректность (например, кэш и блокировки вне сетевой папки, обнаружение сетевой ФС и предупреждение), либо явно запретить и предупреждать при открытии такой папки.
  - Описать в вики: совместная работа нескольких людей с одной папкой — через git, сетевой диск — с указанными ограничениями.
  - Проверка: сценарий одновременной правки с двух машин на общей папке не теряет правки и не дублирует номера, либо Tasker предупреждает о неподдерживаемой сетевой папке; вики описывает итог.
