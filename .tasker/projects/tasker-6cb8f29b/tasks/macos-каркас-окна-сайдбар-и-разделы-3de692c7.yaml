description: |-
  Шаг эпика TSK-178: окно приобретает раскладку main-design, данных ещё нет.

  Что сделать
  - Раскладка как в docs/mockups/web/main-design.html: сайдбар слева (полупрозрачный, сворачивается), основная область справа, верхняя панель.
  - Сайдбар: поле поиска (откроет палитру ⌘K позже), проект, разделы Задачи / Доски / Настройки / Админ-панель, внизу кнопка профиля.
  - Навигация между разделами, экраны-заглушки для каждого раздела, выбранный раздел запоминается.
  - Сочетания ⌘1…⌘4 для разделов, ⌘0 — показать/скрыть сайдбар.

  Готово, когда
  Можно переключаться по разделам мышью и клавиатурой, окно визуально совпадает с каркасом макета.
