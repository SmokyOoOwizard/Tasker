description: |-
  Проблема
  Демон `tasker-mcpd` держит индекс открытых папок актуальным по событиям слежения за файлами, а полностью сверяет область только при открытии, при потере событий, которую заметил сам наблюдатель, и по `tasker sync`. События теряются и незаметно: сетевые диски (SMB, NFS), лимит inotify на Linux, сон и пробуждение, время, когда демон был остановлен. Тогда индекс молча отстаёт, пока его не сверит кто-то другой.

  Где
  - rust/crates/tasker-mcpd/src/sync.rs — `WorkspaceSync` (открытие областей, `sync` по запросу)
  - rust/crates/tasker-files/src/watch.rs — наблюдатель, `FullSync`
  - rust/crates/tasker-files/src/index/mod.rs — сверка индекса под `index.lock`
  - rust/crates/tasker-mcpd/src/state.rs — `WorkspaceStatus` для `tasker mcp status`
  - rust/crates/tasker-core/src/settings/ — раздел `mcp` в `settings.json`

  Как повторить
  - Запустить демон с областью (`tasker mcp workspace add`, `tasker mcp start`), остановить его, изменить файлы задач в `.tasker`, запустить снова — изменения подхватит только стартовая сверка; на сетевом диске правки с другой машины не видны, пока не вызвать `tasker sync`.
  - `tasker mcp status --json` — нет времени последней сверки и числа необработанных событий.

  Что нужно сделать
  - Периодическая полная сверка открытых папок в демоне (по умолчанию раз в 5 минут) — та же, что стартовая.
  - Сверка порциями с отпусканием `index.lock` между ними, чтобы на больших папках не задерживать чтение других процессов.
  - В `tasker mcp status` — время последней сверки каждой области и число необработанных событий слежения.
  - Интервал в `settings.json` (раздел `mcp`): реже или выключить (для сетевых дисков); описать в docs/wiki/Демон-MCP.md.
  - Проверка: тест — изменение файла в обход наблюдателя попадает в индекс после интервала; при сверке большой папки чтение из другого процесса не ждёт её целиком; статус показывает время сверки.
