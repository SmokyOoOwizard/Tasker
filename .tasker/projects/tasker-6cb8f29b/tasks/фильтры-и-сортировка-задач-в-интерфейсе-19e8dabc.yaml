description: |-
  Проблема
  Список задач в интерфейсе нельзя отфильтровать и отсортировать: страница запрашивает `GET /tasks` только с `offset` и `limit`. API уже принимает фильтры (`statusId`, `typeId`, `seriesId`, `field`) и `sort`.

  Где
  - frontend/src/pages/TasksPage.tsx — загрузка и показ списка
  - src/Tasker.Web/TaskerApi.cs — `GET /projects/{id}/tasks` (параметры фильтра и сортировки)

  Как повторить
  - Открыть «Задачи» проекта — нет выбора статуса, типа, серии и порядка; список всегда в порядке создания.

  Что нужно сделать
  - Фильтры по статусу, типу и серии (несколько значений) в интерфейсе списка.
  - Выбор сортировки (статус, тип, название, создание, изменение, по убыванию).
  - Фильтры и сортировка в адресе страницы, чтобы переживали перезагрузку.
  - Проверка: выбрать статус и сортировку — список и счётчик совпадают с `tasker task list --status … --sort …`; после перезагрузки выбор сохраняется.
