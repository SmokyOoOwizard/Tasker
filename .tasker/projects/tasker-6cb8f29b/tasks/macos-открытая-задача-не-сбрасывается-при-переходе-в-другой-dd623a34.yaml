description: |-
  Эпик TSK-178.

  Как воспроизвести
  1. Открыть доску и кликнуть по задаче: задача открывается.
  2. Переключиться на «Все задачи».
  3. Задача всё ещё открыта.

  Как должно быть
  Переход на другой базовый экран, например с доски на «Все задачи», меняет контекст, поэтому открытая задача сбрасывается.

  Что проверить
  - Переходы в обе стороны и между другими разделами сайдбара: доски, все задачи, серии, настройки.
  - Переход на другую доску и смену проекта.
  - Вкладки: у другой вкладки открытая задача не сбрасывается.
  - Несохранённые правки в открытой задаче не должны теряться незаметно: сверить с поведением черновиков из TSK-211.

  Готово, когда
  При переходе в другой раздел открытая задача закрывается и показан экран этого раздела.
