description: |-
  Эпик TSK-178.

  Что происходит
  В сайдбаре раздел досок есть, но конкретные доски в нём не показаны. В макете `docs/mockups/web/main-design.html` они есть. Речь именно о сайдбаре, а не об экране досок.

  Как должно быть
  Доски выбранного проекта перечислены в сайдбаре как в макете, клик по доске открывает её.

  Что проверить
  - Список обновляется при создании, переименовании и удалении доски, в том числе когда изменения приходят от других клиентов (живые события).
  - Список меняется при смене проекта, а вкладки с разными проектами не смешиваются.
  - Выбранная доска отмечена в сайдбаре так же, как выбор доски на экране досок, и они не расходятся.

  Готово, когда
  Сайдбар показывает доски как в макете, и по ним можно переходить.
