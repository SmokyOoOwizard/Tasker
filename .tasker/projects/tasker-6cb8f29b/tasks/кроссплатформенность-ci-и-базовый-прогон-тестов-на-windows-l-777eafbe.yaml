description: |-
  Проблема
  CI есть: Rust-тесты (cargo nextest) и .NET-тесты (tests/Tasker.Tests) идут на ubuntu-latest, macos-latest и windows-latest. Но .NET-тесты на Windows на main падают, фронтенд в CI не собирается и не проверяется (`-p:EmbedFrontend=false`, Node.js не ставится), стенд tools/Tasker.Stress в CI не запускается, а в вики нет матрицы «платформа × что проверено».

  Где
  - .github/workflows/dotnet-tests.yml, .github/workflows/release-build.yml
  - rust/.config/nextest.toml — профиль ci
  - tests/Tasker.Tests/PlatformFactAttribute.cs, tests/Tasker.Tests/PlatformFacts.cs — пометки платформенных тестов
  - frontend/package.json — `build` (tsc -b && vite build), `lint`
  - tools/Tasker.Stress — стенд параллельной работы
  - docs/wiki/Платформы.md, docs/wiki/Разработка.md

  Как повторить
  - `gh run list --workflow ".NET tests" --branch main` — задание windows-latest с ошибкой; `gh run view <id> --log-failed` — SeriesIndexTests.Exclusive_gives_unique_consecutive_numbers_under_parallelism_from_two_containers, DaemonTests.Only_one_server_runs_at_a_time, ConcurrencyTests.Of_two_processes_changing_the_same_version_only_one_wins, ParallelWorkTests, LinkInterfaceTests
  - `grep -n 'npm\|Stress' .github/workflows/*.yml` — пусто

  Что нужно сделать
  - Разобрать падения .NET-тестов на Windows по группам причин (пути, блокировки файлов, процессы, переводы строк, кодировка) и завести на каждую группу задачу-баг в эпике
  - Платформенные по природе тесты (launchd, systemd, Планировщик заданий) — с явным пропуском на других ОС
  - CI: сборка фронтенда (`npm ci`, `npm run build`, `npm run lint`) с кэшем npm
  - CI: стенд tools/Tasker.Stress в малом объёме на трёх платформах
  - docs/wiki/Платформы.md: матрица «платформа × что проверено в CI»
  - Проверка: оба workflow зелёные на main на трёх платформах; задание фронтенда и стенда проходят
