description: |-
  Проблема
  На десктопе вкладка «Профиль» в настройках пользователя показывает только пояснение про локальный режим и папку: ни имени, ни других настроек человека там нет, потому что у десктопа нет текущего пользователя (TSK-14).

  Где
  - frontend/src/pages/ProfilePage.tsx (`LocalProfile`) — профиль на десктопе
  - frontend/src/workspace.ts (`isDesktop`) — признак десктопа

  Как повторить
  - `dotnet run --project src/Tasker.Desktop -- --files=<папка>`, открыть «Настройки пользователя» → «Профиль» — только текст «Локальный режим» и путь к папке.

  Что нужно сделать
  - На вкладке «Профиль» десктопа — данные текущего локального пользователя (имя, почта) с правкой, когда он появится в TSK-14.
  - Проверка: на десктопе изменить имя в профиле — оно сохраняется и отображается после перезапуска.
