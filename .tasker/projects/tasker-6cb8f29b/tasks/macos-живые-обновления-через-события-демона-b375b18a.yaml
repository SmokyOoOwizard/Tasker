description: |-
  Эпик TSK-178. Экраны обновляются сами, как в веб-интерфейсе.

  Что сделать
  - Подписка на изменения через GraphQL-подписки (POST /graphql отвечает потоком text/event-stream; прежний GET /events заменён в TSK-208), транспорт — из Swift-клиента TSK-185. Переподключение и догрузка пропущенного после обрыва.
  - Хранилище состояния в приложении (наблюдаемые модели) обновляет только затронутые сущности, без перечитывания всего; перечитывание — точечными GraphQL-запросами.
  - Тосты об изменениях от других («Claude перевёл TSK-131 в «В работе»»), отметка «обновлено N с назад».

  Готово, когда
  Изменение задачи из консоли или MCP появляется в открытом приложении без действий пользователя.
