description: |-
  Эпик TSK-178.

  Зачем
  В настройках доски условия колонки задаются отдельными условиями по полям (`ColumnFieldFilter`). Теперь есть строка запроса (TSK-190), и в настройках доски нужно использовать её, а не свой синтаксис и отдельный редактор.

  Что должно быть
  - В настройках доски условие колонки задаётся строкой запроса: тот же синтаксис, разбор, подсказки и компонент, что в поиске (`TaskQueryBar`).
  - Прежние условия по полям убираются.
  - Если в запросе есть сортировка (`| sort`), задачи в колонке идут в этом порядке.

  Решения пользователя
  - Существующие условия по полям в запросы не переводятся: автоматической миграции условий нет.
  - Статусы колонки не меняются: это отдельная настройка, правило статуса при переносе остаётся прежним.
  - Колонка без сортировки в запросе идёт в том же порядке, что сейчас.
  - Если сохранённый запрос перестал разбираться, например поле удалили или переименовали, колонка показывает ошибку.

  Решить перед началом
  - Над доской уже есть строка запроса (TSK-190), и в ней тоже можно написать `| sort`. Какая сортировка важнее, если она задана и там, и в запросе колонки. Предложение: строка над доской важнее, пока заполнена, как сортировка из строки важнее сортировки списка.
  - Условия запроса колонки и строки над доской объединяются через И.
  - Что делать со старыми данными условий в файлах и БД: старые записи не должны мешать чтению доски.
  - Какие условия допустимы при переносе карточки: сейчас карточка, не подходящая под условия, отклоняется. Проверить, что запрос со скобками, ИЛИ и функциями проверяется тем же образом.

  Где
  - dotnet/src/Tasker.Core/Boards/Board.cs — `FieldConditions`, `ColumnFieldFilter`
  - dotnet/src/Tasker.Core/Boards/BoardService.cs — проверка при переносе и выборка колонки (`GetColumnTasks`)
  - dotnet/src/Tasker.Core/Boards/ColumnFilters.cs — перевод условий и текст для показа
  - dotnet/src/Tasker.Core/Tasks/Query/ — `TaskQueryParser`, `TaskQueryBinder`, `TaskPredicate`, `TaskQuerySuggestions`
  - dotnet/src/Tasker.Storage.Files/Storages/BoardFile.cs, dotnet/src/Tasker.Storage.Db/Storages/BoardStorage.cs — хранение
  - dotnet/src/Tasker.Web/Graph/Types/BoardTypes.cs, dotnet/src/Tasker.Web/TaskerApi.cs, dotnet/src/Tasker.Mcp/Tools/BoardTools.cs, dotnet/src/Tasker.Cli/Commands/BoardCommands.cs — API, MCP, консоль
  - macos/Sources/Tasker/Boards/BoardEditorView.swift, BoardDraft.swift, BoardView.swift — редактор и значки условий колонки
  - macos/Sources/Tasker/Query/ — компонент строки запроса
  - docs/wiki/Строка-запроса.md

  Готово, когда
  - В редакторе доски запрос колонки вводится с теми же подсказками и ошибками, что в поиске, редактора условий по полям больше нет.
  - Колонка показывает только подходящие задачи, а сортировка из запроса определяет порядок.
  - Колонка со сломанным запросом показывает ошибку.
  - Перенос карточки, не подходящей под запрос, отклоняется, как и раньше.
  - Доска со старыми условиями открывается без сбоя, старые условия больше не применяются.
  - MCP, консоль и API работают с запросом колонки, есть тесты для папки и для БД сервера.
