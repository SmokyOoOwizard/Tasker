description: |-
  Эпик TSK-178. Делать после списка задач (TSK-189).

  Что сделать
  - Оторвать вкладку рабочей области в отдельное окно и вернуть обратно. Сцена Window заменяется на WindowGroup; у каждого окна своё состояние: выбранная вкладка, выбранный проект, своя живая подписка на область. Общими остаются список открытых папок и подключение к демону.
  - Разрешить несколько вкладок одной рабочей области. Вкладка остаётся вкладкой области, но получает собственный идентификатор (сейчас она определяется путём папки), а выбранный проект хранится по этому идентификатору. Проекты переключаются в сайдбаре, как сейчас, в каждой вкладке независимо. Живую подписку держать одну на область и раздавать вкладкам.
  - Состояние окон и вкладок восстанавливается при запуске.

  Готово, когда
  Вкладку можно перенести в новое окно, одну и ту же область можно открыть в двух вкладках с разными проектами, после перезапуска всё на месте.
