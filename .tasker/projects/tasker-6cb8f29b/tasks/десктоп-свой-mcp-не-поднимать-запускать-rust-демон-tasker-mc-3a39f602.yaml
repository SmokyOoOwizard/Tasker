description: |-
  Проблема
  Десктоп демон не запускает: если демон не работает, десктоп сам обслуживает MCP по открытым вкладкам через Tasker.Mcp и отдаёт порт, когда демон стартует. Из-за этого все 62 инструмента MCP существуют дважды — в Rust (rust/crates/tasker-mcp) и в C# (src/Tasker.Mcp) — и каждое изменение инструмента или схемы делается в обеих реализациях.

  Где
  - src/Tasker.Desktop — старт десктопа, интерфейс (адрес MCP, кто обслуживает MCP).
  - src/Tasker.Daemon — DesktopMcpPlan, DaemonClient.
  - src/Tasker.Web — AddTaskerMcp в режиме desktop, WorkspaceRegistry/LocalMcpAgent, McpWorkspaceCatalog.
  - Тесты DesktopMcpTests, DesktopSharedMcpTests, DesktopMcpDaemonTests.
  - Сборка и упаковка десктопа.

  Что нужно сделать
  - Десктоп при старте, если демон не работает, запускает Rust tasker-mcpd так же, как tasker mcp start (отсоединённый процесс, тот же daemon.json, порт из settings.json), и ждёт готовности; свой MCP не поднимает ни в каком случае; закрытие десктопа демон не останавливает.
  - Открытые во вкладках области, которых нет в mcp.workspaces в settings.json: выбрать, как они попадают к демону (добавлять в settings.json при открытии, передавать иначе или не отдавать по MCP), описать в вики.
  - tasker-mcpd для десктопа: рядом с установленной консолью (~/.local/share/tasker/app) или из своей сборки; у пользователя только с десктопом демон есть в сборке и упаковке десктопа.
  - Убрать режим собственного MCP десктопа (DesktopMcpPlan, регистрацию MCP в режиме desktop, связанный код); тесты переделать на проверку запуска демона. Tasker.Mcp остаётся только для сервера (AddTaskerMcp(requireAgentToken: true)).
  - Интерфейс десктопа показывает состояние демона.
  - Вики «MCP-и-агенты», «Демон-MCP», «Интерфейс».
  - Проверка: десктоп без демона запускает его и MCP отвечает; при работающем демоне ничего не запускает; .NET-тесты и CI зелёные на трёх ОС.
