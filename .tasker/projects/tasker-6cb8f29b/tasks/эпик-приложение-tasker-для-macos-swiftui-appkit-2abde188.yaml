description: |-
  Цель
  Нативное приложение Tasker для macOS на SwiftUI + AppKit: максимально быстрое и отзывчивое, по дизайну — docs/mockups/web/main-design.html. Решение и архитектура обсуждались в TSK-176; Windows (WinUI 3) — позже, отдельным эпиком.

  Исходные данные
  - Десктоп на Avalonia удалён, консоль и демон теперь на .NET (ветка dotnet-cli-parity, NativeAOT; замеры — TSK-177).
  - Демон в режиме Local поднимает тот же REST API, что и Tasker.Server (Tasker.Web: проекты, задачи, статусы, наборы, типы, серии, связи, поля, перечисления, доски, блокировки, проблемы рабочей области), и живые события GET /events (SSE). Схемы OpenAPI пока нет.
  - Приложение — тонкий клиент демона (локально) или сервера (режим Server). Вся логика данных — в .NET; в приложении только отрисовка и логика интерфейса.

  Принципы
  - SwiftUI для экранов и форм; AppKit там, где SwiftUI медленный или слабый: большие списки и дерево (NSTableView / NSOutlineView), перетаскивание на доске, палитра ⌘K (NSPanel), вкладки рабочих областей.
  - Дизайн из общих токенов (цвета обеих тем, отступы, радиусы, значки статусов) и общих строк RU/EN — чтобы веб и приложение не разъезжались.
  - Маленькие шаги: каждая задача эпика даёт рабочее приложение, которое собирается и запускается.

  Порядок
  1. Каркас: Xcode-проект → пустое окно → окно с сайдбаром → токены дизайна и локализация.
  2. Данные: OpenAPI демона → Swift-клиент → запуск/подключение к демону → живые события → рабочие области и проекты.
  3. MVP: список задач, строка запроса, карточка и peek-панель, создание задачи, доски, палитра ⌘K, страница серии.
  4. Остальное: настройки проекта, блокировки и версии, профиль/агенты/проблемы, режим Server и админ-панель, меню и горячие клавиши, deep links и уведомления, распространение.

  Готово, когда
  Всё из main-design доступно в приложении для обоих режимов (Local и Server), приложение подписано, нотаризовано и собирается в CI.
