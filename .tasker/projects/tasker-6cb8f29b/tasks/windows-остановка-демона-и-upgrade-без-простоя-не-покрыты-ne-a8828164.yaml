description: |-
  Проблема
  На Windows ни один тест не проверяет остановку демона и `tasker mcp upgrade`. DaemonUpgradeTests (A_new_process_that_dies_at_the_start_leaves_the_old_one_serving, A_new_process_that_never_gets_ready_is_removed_after_the_timeout, A_new_process_that_cannot_open_a_workspace_open_in_the_old_one_is_rolled_back) и DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up помечены `[UnixFact]` (sh-скрипты, SIGINT), Upgrade_under_load_loses_no_call_and_no_write_and_duplicates_none пропущен на Windows: в CI во время upgrade под нагрузкой запросы к `/mcp` и `/health` получали HttpRequestException — соединения обрываются при передаче сокета новому рабочему процессу. Rust-тесты демона на Windows тоже не идут (TSK-156).

  Где
  - tests/Tasker.Tests/DaemonUpgradeTests.cs — `[UnixFact]` и `[SkipOnWindowsFact("TSK-165: …")]`
  - tests/Tasker.Tests/DaemonTests.cs — Foreground_run_stops_on_interrupt_and_cleans_up (`kill -INT`)
  - rust/crates/tasker-mcpd/src/shutdown.rs — именованное событие `Local\tasker-mcp-stop-<hash>`
  - rust/crates/tasker-mcpd/src/supervisor.rs, worker.rs — передача сокета (WSADuplicateSocketW), Job Object
  - .github/workflows/dotnet-tests.yml — прогон на windows-latest

  Как повторить
  - На Windows: `dotnet test tests/Tasker.Tests --filter "FullyQualifiedName~DaemonUpgradeTests|FullyQualifiedName~DaemonTests"` — перечисленные тесты в отчёте пропущены.
  - Убрать пропуск у Upgrade_under_load_loses_no_call_and_no_write_and_duplicates_none и прогнать в цикле — изредка HttpRequestException на вызовах во время upgrade.

  Что нужно сделать
  - Сделать сценарии проверяемыми на Windows: вместо sh-скриптов и сигналов Unix — Windows-механизмы (именованное событие остановки, CTRL_BREAK через GenerateConsoleCtrlEvent для `tasker mcp run`, скрипты-заглушки нового процесса для Windows).
  - Начать с Upgrade_under_load_loses_no_call_and_no_write_and_duplicates_none: найти, где обрываются соединения при передаче сокета, и исправить.
  - Включить тесты на windows-latest в CI; найденные ошибки демона исправить.
  - Проверка: DaemonUpgradeTests и Foreground_run_stops_on_interrupt_and_cleans_up проходят на windows-latest (в цикле — без обрывов соединений).
