description: |-
  Проблема
  Демон MCP `tasker-mcpd` (его запускает и десктоп, и консоль) не требует токена: агента выбирает заголовок `X-Tasker-Agent: <id>`, а без заголовка вызов идёт от локального агента `agent` области. Любая программа на этом компьютере может передать id чужого агента папки и писать от его имени: заголовок выбирает, от чьего имени писать, но не защищает. Защита сейчас только в том, что демон слушает 127.0.0.1.

  Где
  - rust/crates/tasker-mcp/src/call.rs — `AGENT_HEADER`, выбор агента
  - rust/crates/tasker-mcp/src/workspaces.rs — локальный агент области, проверка id в области
  - rust/crates/tasker-mcpd/src/daemon.rs, rust/crates/tasker-mcpd/src/http.rs — HTTP на `127.0.0.1:<port>`
  - src/Tasker.Daemon/DaemonClient.cs — десктоп передаёт `X-Tasker-Agent`
  - frontend/src/pages/profile/AgentsSection.tsx — команда `claude mcp add … --header "X-Tasker-Agent: …"`
  - docs/wiki/MCP-и-агенты.md, docs/wiki/Демон-MCP.md, docs/wiki/Настройка-и-сервер.md

  Как повторить
  - В папке создать двух агентов: `tasker agent create a1`, `tasker agent create a2`; запустить демон (`tasker mcp start`), папка доступна ему (`tasker mcp workspace`).
  - Отправить `tools/call` на `http://127.0.0.1:<порт>/mcp` с `X-Tasker-Agent: <id a2>` от любой программы (например, `curl`) — вызов проходит от имени a2, хотя подключение настраивалось для a1; без заголовка — от имени `agent`.

  Что нужно сделать
  - Привязать выбор агента к секрету, а не к id: например, локальный токен агента (выдаётся при создании, хранится вне `.tasker`), который демон проверяет; id без секрета не даёт писать от имени агента.
  - Решить, что разрешено вызову без заголовка (локальный агент `agent`).
  - Обновить команду подключения в интерфейсе и консоли (`claude mcp add …`) и вики.
  - Проверка: вызов с id агента без верного секрета получает `[forbidden]`; с верным — проходит от имени этого агента; тесты демона (`rust/crates/tasker-mcpd/tests/mcp.rs`) покрывают оба случая.
