description: |-
  Эпик TSK-178, после OpenAPI-схемы (TSK-184).

  Как устроен API сейчас (после TSK-208)
  - Чтение данных — GraphQL: POST /graphql (HotChocolate), схема в graphql/schema.graphql. Почти все прежние GET-запросы переехали сюда.
  - Живые обновления — GraphQL-подписки: тот же POST /graphql отвечает потоком text/event-stream (SSE, с пингами), вместо прежнего GET /events.
  - Изменения (создание, правка, удаление, перенос, блокировки, auth, управление демоном) — REST, описан в docs/api/openapi.json (TSK-184).

  Что сделать
  - Отдельный Swift-пакет клиента в macos/.
  - Чтение: типизированные запросы из .graphql-операций с генерацией Swift-типов по graphql/schema.graphql (Apollo iOS codegen или аналог — выбрать). Нормализованный кэш — решить, нужен ли (по сравнению с хранилищем состояния приложения из TSK-187).
  - Подписки: транспорт поверх SSE-ответа POST /graphql (готовые клиенты обычно ждут WebSocket graphql-ws или multipart — вероятно, свой транспорт), переподключение.
  - Изменения: клиент из docs/api/openapi.json (swift-openapi-generator), только REST-операции.
  - Общий слой: async/await, единые ошибки (версия изменена другим, заблокировано «правит …», отказ с сообщением сервера, ошибки GraphQL в errors), таймауты, отмена запросов.
  - Адрес и авторизация подставляются извне: локальный демон (без входа) или сервер (JWT, обновление токена) — одинаково для GraphQL и REST.
  - Проверка рассинхрона: сгенерированный код совпадает со схемами (как у токенов дизайна).
  - Тесты на разбор ответов и ошибок на фикстурах.

  Готово, когда
  Пакет собирается, тесты проходят, из приложения можно получить список проектов через GraphQL, создать что-то через REST и получить событие подписки у запущенного вручную демона.
