description: |-
  Проблема
  Консоль работает только с папкой (`--workspace`) или файлом SQLite (`--sqlite`) напрямую. Подключиться к серверу (Postgres за REST, вход по паролю) она не может.

  Где
  - rust/crates/tasker-cli/src/context.rs, rust/crates/tasker-cli/src/session.rs — выбор рабочей области
  - rust/crates/tasker-cli/src/commands/ — команды консоли
  - src/Tasker.Web/TaskerApi.cs — REST сервера, `/auth/login`, `/auth/refresh`, `/auth/logout`
  - src/Tasker.Server/ — сервер

  Как повторить
  - `tasker --help` — среди глобальных опций только `--workspace` и `--sqlite`, адреса сервера нет

  Что нужно сделать
  - Режим работы с сервером: адрес сервера, вход по паролю, хранение и обновление токена, выход
  - Команды консоли выполняются через REST сервера с тем же выводом, `--json` и ошибками (нет доступа, конфликт версии, не найдено)
  - Проверка: тест — сервер в процессе теста, консоль входит, создаёт и меняет задачи, видит только проекты, где пользователь участник
