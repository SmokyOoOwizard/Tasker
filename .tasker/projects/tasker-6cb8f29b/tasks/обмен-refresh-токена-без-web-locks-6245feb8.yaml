description: |-
  Проблема
  Обмен refresh-токена во фронтенде сериализуется между вкладками через `navigator.locks`. Если сервер открыт по http не на localhost, Web Locks недоступны, очередь работает только внутри вкладки: две вкладки могут обменять один токен одновременно, сервер сочтёт это повторным использованием и отзовёт сессию.

  Где
  - frontend/src/auth.ts — `refresh` и `exchange` (запасной путь без `navigator.locks`)
  - src/Tasker.Core/Auth/AuthService.cs (`Refresh`) — отзыв сессии при повторном обмене

  Как повторить
  - Запустить сервер на адресе, доступном не через localhost (например, `--urls http://0.0.0.0:5156`), открыть интерфейс по IP машины в двух вкладках.
  - В консоли браузера `navigator.locks` — `undefined`.
  - Дождаться, пока access-токен почти истечёт, и одновременно сделать запросы из обеих вкладок — одна из них выбрасывает на экран входа, сессия отозвана.

  Что нужно сделать
  - Запасная межвкладочная блокировка обмена, когда `navigator.locks` нет (например, через `localStorage` с меткой владельца и сроком), либо явное требование https для такого режима с предупреждением.
  - Проверка: в контексте без Web Locks две вкладки, обменивающие токен одновременно, остаются в сессии; с Web Locks поведение не меняется.
