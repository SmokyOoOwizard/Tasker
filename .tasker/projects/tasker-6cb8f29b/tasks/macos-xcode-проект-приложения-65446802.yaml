description: |-
  Первый шаг эпика TSK-178: в репозитории появляется проект приложения для macOS, который собирается.

  Что сделать
  - Папка macos/ в корне репозитория: Xcode-проект Tasker (таргет macOS App, SwiftUI life cycle, язык Swift 6, строгая проверка конкурентности).
  - Решить, как хранить проект: обычный .xcodeproj в git или генерация из описания (XcodeGen / Tuist), чтобы не было конфликтов в project.pbxproj. Зафиксировать выбор в README.
  - Минимальная версия macOS — предложение 14 (Sonoma: Observation, новые API SwiftUI); подтвердить.
  - Bundle id, название, версия из файла VERSION репозитория.
  - Сборка из командной строки: xcodebuild (или скрипт scripts/macos-build.sh) без открытия Xcode.
  - .gitignore для DerivedData, xcuserdata, build.
  - Таргет юнит-тестов (XCTest / Swift Testing) с одним тестом-заглушкой.

  Готово, когда
  Проект открывается в Xcode, собирается и проходит тесты командой из README; приложение запускается (содержимое окна не важно).
