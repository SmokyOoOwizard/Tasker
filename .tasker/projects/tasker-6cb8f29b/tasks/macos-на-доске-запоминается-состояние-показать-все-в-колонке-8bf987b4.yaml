description: |-
  Эпик TSK-178.

  Что происходит
  Когда в колонке доски слишком много задач, показана только часть, а в конце есть кнопка «Показать все». После нажатия это состояние запоминается: если уйти с экрана доски и вернуться, колонка остаётся раскрытой.

  Как должно быть
  Состояние «Показать все» не запоминается. После ухода с экрана доски и возврата колонка снова показывает обычное ограниченное число карточек и кнопку «Показать все».

  Готово, когда
  После возврата на экран доски все колонки свёрнуты до обычного числа карточек.
