description: |-
  Эпик TSK-178.

  Что сделать
  - Полное меню приложения: Файл (новая задача, открыть папку, новая доска), Правка, Вид (тема, сайдбар, дерево/плоский), Задача (статус, связи, копировать ключ), Окно, Справка.
  - Все горячие клавиши из main-design, без конфликтов с системными; список сочетаний в справке.
  - Настройки приложения (⌘,): язык, тема, поведение при запуске.

  Готово, когда
  Всё основное делается с клавиатуры, меню соответствует правилам macOS.
