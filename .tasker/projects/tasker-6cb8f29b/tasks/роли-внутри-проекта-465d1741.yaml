description: |-
  Проблема
  На сервере у участников проекта нет ролей: любой участник-человек может добавить в проект любого пользователя и убрать любого другого участника (запрещено только убрать последнего человека). Так же без ограничений любой участник переименовывает и удаляет проект.

  Где
  - src/Tasker.Core/Projects/ProjectMemberService.cs — `Add`, `Remove`
  - src/Tasker.Core/Projects/MemberProjectAccess.cs — доступ к проекту: админ или участник
  - src/Tasker.Core/Projects/ProjectService.cs — `Update`, `Delete`
  - src/Tasker.Core/Projects/IProjectMemberStorage.cs, src/Tasker.Storage.Db/ (таблица `project_members`: только `ProjectId`, `UserId`)
  - src/Tasker.Web/TaskerApi.cs — `/api/projects/{id}/members`
  - frontend/src/pages/settings/MembersSection.tsx
  - docs/wiki/Настройка-и-сервер.md — раздел «Пользователи, вход и права»

  Как повторить
  - На сервере админ создаёт пользователей A и B и проект, добавляет обоих участниками.
  - Войти как B: `DELETE /api/projects/{id}/members/{A}` (или «Участники» в настройках проекта) — A убран; `POST /api/projects/{id}/members` добавляет любого пользователя.

  Что нужно сделать
  - Ввести роли участника проекта (например, владелец/управляющий и участник) с хранением в БД.
  - Добавлять и убирать участников, менять роли — только управляющим и админам; обычный участник может только выйти сам.
  - Определить и ограничить по роли переименование и удаление проекта.
  - Сохранить правило: в проекте остаётся хотя бы один управляющий-человек; создатель проекта становится управляющим.
  - Показать и менять роли в разделе «Участники»; описать в вики.
  - Проверка: тесты прав — участник без роли получает 403 на добавление и удаление других, управляющий и админ — успешно; последнего управляющего убрать или понизить нельзя.
