description: |-
  Проблема
  На windows-latest .NET-тесты SeriesIndexTests изредка падают: Exclusive_gives_unique_consecutive_numbers_under_parallelism_from_two_containers — `.tasker/.cache/write.lock` не освободился за 30 с (таймаут FileLock); Exclusive_and_plain_writes_together_do_not_deadlock — «only 14 operations» за отведённое время (взаимной блокировки нет, но запись под `write.lock` на Windows-раннере идёт намного медленнее, чем на Linux и macOS). При повторном прогоне проходят; на Linux и macOS сбоев нет.

  Где
  - tests/Tasker.Tests/SeriesIndexTests.cs — оба теста (два контейнера в одном процессе, IWriteScope)
  - src/Tasker.Storage.Files/Storages/WriteScope.cs — секция записи (`write.lock`)
  - src/Tasker.Core/IO/FileLock.cs, AtomicFile.cs — блокировка и запись с повторами на Windows

  Как повторить
  - На Windows (или в CI windows-latest) гонять в цикле `dotnet test tests/Tasker.Tests --filter "FullyQualifiedName~SeriesIndexTests"` — изредка один из двух тестов падает с описанными ошибками.

  Что нужно сделать
  - Выяснить, кто держит `write.lock` дольше 30 с: взаимная блокировка двух контейнеров в одном процессе (порядок `write.lock` → файл → `index.lock`), сценарий TSK-147 (очередь по задаче внутри секции записи), медленное освобождение FileShare.None на Windows, антивирус или индексатор раннера, паузы повторов AtomicFile.
  - Выяснить, где уходит время записи под `write.lock` на Windows (FileLock с повторами, AtomicFile с повторами, антивирус).
  - Исправить причину в продукте; если это особенность раннера — сделать тесты устойчивыми (порог, ожидание) и описать в тесте почему.
  - Проверка: SeriesIndexTests в цикле (≥ 30 прогонов) на windows-latest без падений.
