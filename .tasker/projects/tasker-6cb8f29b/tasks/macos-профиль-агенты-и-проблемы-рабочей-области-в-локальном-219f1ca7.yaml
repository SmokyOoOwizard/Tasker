description: |-
  Эпик TSK-178.

  Что сделать
  - Профиль: имя локального человека, то же, что показывает `tasker whoami`, и его правка.
  - Агенты: создание, переименование, удаление; состояние MCP-демона для папки и команда claude mcp add для копирования.
  - Проблемы рабочей области: значок со счётчиком, список (нечитаемые файлы, конфликты номеров, вторая папка проекта, циклы), действия «Разрешить конфликты номеров» и «Очистить недействительные ссылки».

  Режим Server в эту задачу не входит: профиль и агенты сервера вынесены в TSK-239.

  Готово, когда
  В локальном режиме агента можно завести и подключить к Claude из приложения, имя меняется и совпадает с `tasker whoami`, проблемы рабочей области видны и исправляются.
