description: |-
  Проблема
  Вход на сервер (`POST /api/auth/login`) не ограничивает число попыток: пароль можно перебирать без задержек и блокировок. То же для смены своего пароля с проверкой текущего (`POST /api/users/{id}/password`).

  Где
  - src/Tasker.Core/Auth/AuthService.cs — `SignIn`
  - src/Tasker.Core/Users/UserService.cs — `ChangePassword`, `CheckPassword`
  - src/Tasker.Web/TaskerApi.cs — маршруты `/api/auth/login`, `/api/auth/register`, `/api/users/{id}/password`
  - src/Tasker.Web/TaskerWebApp.cs, src/Tasker.Server — подключение промежуточных обработчиков
  - docs/wiki/Настройка-и-сервер.md

  Как повторить
  - Запустить сервер, зарегистрировать пользователя.
  - Отправить подряд, например, 100 запросов `POST /api/auth/login` с неверным паролем — все получают обычный ответ об ошибке входа, без задержки, `429` или временной блокировки.

  Что нужно сделать
  - Ограничить частоту попыток входа по имени/почте пользователя и по IP-адресу (например, ASP.NET Core rate limiting или счётчик неудачных попыток с нарастающей задержкой/временной блокировкой).
  - Ответ при превышении — `429` с `Retry-After`; текст ошибки не раскрывает, существует ли пользователь.
  - То же ограничение для проверки текущего пароля при его смене.
  - Пороги настраиваются в конфигурации сервера; описать в вики, учесть работу за обратным прокси (адрес клиента).
  - Проверка: тест — после N неверных попыток следующая получает `429`, после ожидания вход с верным паролем снова работает; успешный вход другого пользователя не затронут.
