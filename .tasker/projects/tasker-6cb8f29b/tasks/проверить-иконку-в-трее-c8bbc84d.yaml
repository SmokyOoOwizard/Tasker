description: |-
  Проблема
  Иконка десктопа в строке меню macOS при проверке не была видна. Возможная причина — строка меню переполнена и иконка ушла под вырез экрана; не проверено, что иконка создаётся и отображается.

  Где
  - src/Tasker.Desktop/App.axaml.cs — `CreateTrayIcon` (`TrayIcon`, template-иконка, меню «Открыть», «Новое окно», MCP, «Выход»)
  - src/Tasker.Desktop/Assets/tray.png — иконка трея (44×44)

  Как повторить
  - Запустить десктоп на macOS (`dotnet run --project src/Tasker.Desktop`) и найти иконку Tasker в строке меню.
  - Закрыть окно: приложение должно остаться в трее и открываться кликом по иконке.

  Что нужно сделать
  - Проверить на macOS при свободной строке меню (мало иконок или внешний монитор без выреза), видна ли иконка; проверить на Windows и Linux.
  - Если иконки нет и при свободной строке — найти и исправить причину (создание `TrayIcon`, ресурс иконки, template-режим).
  - Проверка: иконка видна в строке меню macOS в светлой и тёмной теме, её меню работает; на Windows и Linux — в области уведомлений.
