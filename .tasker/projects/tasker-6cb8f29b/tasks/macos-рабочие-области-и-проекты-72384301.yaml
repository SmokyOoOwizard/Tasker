description: |-
  Эпик TSK-178.

  Что сделать
  - Вкладки рабочих областей вверху окна (папки с .tasker), «Открыть папку…» (NSOpenPanel), закрытие вкладки, список недавних.
  - Переключатель проектов в сайдбаре, «Новый проект».
  - Пустой проект: подсказки-онбординг (создать статусы → набор статусов → тип → доску), как в макете.
  - Открытые рабочие области и выбранный проект запоминаются.

  Готово, когда
  Можно открыть несколько папок, переключать вкладки и проекты, новый проект ведёт пользователя по онбордингу.
