description: |-
  Проблема
  Настройки демона MCP (области, порт, запуск, остановка, автозапуск) меняются только командами `tasker mcp …`. Десктоп лишь показывает состояние демона и адрес MCP папки в разделе «Агенты» профиля и в трее (пункт трея умеет только запустить неработающий демон). Отдельной страницы управления демоном в интерфейсе нет.

  Где
  - frontend/src/pages/profile/AgentsSection.tsx — состояние демона и адрес MCP папки
  - frontend/src/pages/ProfilePage.tsx, frontend/src/api.ts
  - src/Tasker.Web/TaskerApi.cs — `GET /workspace/mcp` (только чтение)
  - src/Tasker.Daemon/DesktopDaemon.cs, src/Tasker.Daemon/DaemonClient.cs, src/Tasker.Daemon/DaemonLauncher.cs — запуск и опрос демона десктопом
  - src/Tasker.Desktop/App.axaml.cs — пункт «MCP» в трее
  - src/Tasker.Global/SettingsStore.cs — settings.json (порт, области)
  - rust/crates/tasker-cli/src/commands/mcp.rs, rust/crates/tasker-daemon/src/autostart/ — команды `tasker mcp` и автозапуск

  Как повторить
  - Открыть папку в десктопе → профиль → «Агенты»: видна только строка состояния демона и адрес, кнопок управления нет
  - Порт, список областей, остановка и автозапуск доступны только через `tasker mcp port`, `tasker mcp workspace`, `tasker mcp stop`, `tasker mcp autostart`

  Что нужно сделать
  - Страница (раздел) во фронтенде десктопа: состояние демона (работает, порт, сборка рабочего процесса, время работы), список областей с их состоянием, порт
  - Действия: запуск, остановка, перезапуск, включение и выключение автозапуска, добавление и удаление области, смена порта
  - REST десктопа для этих действий (через демон и консоль `tasker`, без своей реализации автозапуска в .NET)
  - Проверка: в десктопе со страницы остановить и запустить демон, сменить порт, включить автозапуск — `tasker mcp status` и `tasker mcp config` показывают то же; на сервере страница не показывается
