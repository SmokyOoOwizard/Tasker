description: |-
  Что происходит
  В поиске палитры macOS есть задача TSK-133, но по запросу «133» она не показывается.

  Что нужно
  Универсальный механизм нечёткого поиска на сервере и в демоне, а не отдельное решение для приложения macOS. Им смогут пользоваться все клиенты.

  Где ищем, по убыванию приоритета
  1. Номер задачи в серии: просто номер («133») и серия плюс номер («TSK-133»).
  2. Заголовок.
  3. Описание задачи, в том числе длинное.

  Что сделать
  - Поиск на сервере и в демоне с единым поведением в обоих режимах (Local и Server, файлы, SQLite, Postgres) и выдачей через API.
  - Перевести на него палитру ⌘K в приложении macOS. Команды палитры остаются на клиенте: решить, как смешивать их с задачами.

  Что решить перед началом
  - Что считать совпадением: часть номера, регистр префикса, часть слова, слова не по порядку, опечатки, неверная раскладка клавиатуры, русский и английский текст.
  - Как устроить индекс, чтобы поиск по описаниям не тормозил и обновлялся при изменении задач.
  - Как показывать совпадение в описании: например, фрагмент текста вокруг него.
  - Что делать при нескольких сериях и конфликте номеров: показывать все подходящие задачи.
  - Нужен ли этот поиск также в консоли и MCP.

  Готово, когда
  Запрос «133» находит TSK-133, поиск находит задачи по заголовку и описанию, результаты упорядочены по приоритету выше, а ответ остаётся без заметной задержки на 10 000 задач.

  Обсудить план перед началом работу
