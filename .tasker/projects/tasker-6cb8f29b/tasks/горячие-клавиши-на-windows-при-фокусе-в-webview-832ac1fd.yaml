description: |-
  Проблема
  На Windows и Linux горячие клавиши окна (Ctrl+T, Ctrl+N, Ctrl+O, Ctrl+W, Ctrl+Tab, Ctrl+1…9) заданы через `KeyBindings` окна, а когда фокус в WebView, нажатия до окна не доходят — WebView2 обрабатывает их сам. На macOS команды идут через меню и работают.

  Где
  - src/Tasker.Desktop/WindowCommands.cs — меню и `KeyBindings` (ветка `!OperatingSystem.IsMacOS()`)
  - src/Tasker.Desktop/WorkspaceWindow.axaml.cs — вкладка с `NativeWebView`

  Как повторить
  - Собрать и запустить десктоп на Windows, открыть папку, кликнуть в страницу интерфейса и нажать Ctrl+T или Ctrl+W — новая вкладка не открывается, вкладка не закрывается; при фокусе на полосе вкладок те же клавиши работают.

  Что нужно сделать
  - Перехватывать сочетания команд окна, когда фокус в WebView на Windows (WebView2 `AcceleratorKeyPressed` или аналог в Avalonia WebView), и выполнять те же команды, что `WindowCommands`; остальные клавиши оставлять странице.
  - То же для Linux, если там WebView тоже забирает клавиши.
  - Проверка: на Windows с фокусом в странице все сочетания из `WindowCommands` срабатывают ровно один раз, ввод текста и Ctrl+C/Ctrl+V в странице работают.
