description: |-
  Проблема
  Релизные бинарники `tasker` и `tasker-mcpd` для macOS не подписаны и не нотаризованы: скачанный браузером архив Gatekeeper не даст запустить (`install.sh` снимает карантин, но это обход, а не подпись). Формулы Homebrew нет, Windows-бинарники тоже без подписи.

  Где
  - scripts/release.sh — сборка и упаковка архивов (без подписи)
  - .github/workflows/release-build.yml — сборка под платформы (без подписи и публикации)
  - scripts/install.sh — снятие `com.apple.quarantine`

  Как повторить
  - Собрать `scripts/release.sh --rid osx-arm64`, распаковать архив, проверить `codesign -dv app/tasker` и `spctl -a -vv app/tasker` — подписи разработчика нет.
  - `brew install tasker` — формулы нет.

  Что нужно сделать
  - Подписывать бинарники macOS сертификатом Developer ID (hardened runtime) и нотаризовать (`notarytool`) в релизной сборке; секреты — в CI.
  - Подписывать Windows-бинарники (Authenticode), если есть сертификат.
  - Формула Homebrew (свой tap), ставящая `tasker` и `tasker-mcpd` из архива релиза.
  - Проверка: `spctl -a -vv` принимает бинарники из скачанного браузером архива без снятия карантина; `brew install` из tap ставит рабочий `tasker`.
