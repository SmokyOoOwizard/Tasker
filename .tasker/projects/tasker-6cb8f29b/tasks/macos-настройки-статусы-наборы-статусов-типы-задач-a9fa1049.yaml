description: |-
  Эпик TSK-178. Окна настроек как в доработанном main-design.

  Что сделать
  - Статусы: создание, цвет, описание, выбор значка; удаление запрещено, пока статус используется (показать кем).
  - Наборы статусов: просторное окно, упорядоченный список с перетаскиванием, добавление статусов через всплывающий список с поиском по статусам проекта.
  - Типы задач: название, описание, набор статусов через всплывающий список с поиском, поля типа с переключателем «обязательное»; удаление поля из типа спрашивает: стереть значения или оставить как добавленные.
  - Блокировки редактирования и конфликт версий в каждом окне.

  Готово, когда
  Статусы, наборы и типы настраиваются без консоли, отказы сервера показаны понятно.
