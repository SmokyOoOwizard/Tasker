description: |-
  Проблема
  Задачи создаются только по одной: каждая — отдельный вызов `tasker task create` (отдельный процесс), инструмента MCP `create_task` или запроса `POST /tasks`. Сотни задач агентом через MCP — сотни вызовов; пакетного пути с одной проверкой и одной записью нет.

  Где
  - rust/crates/tasker-cli/src/commands/task.rs — `tasker task create`
  - rust/crates/tasker-services/src/task.rs, rust/crates/tasker-services/src/series.rs — создание задач и номера серий (консоль, демон)
  - rust/crates/tasker-mcp/src/tools/task.rs, rust/crates/tasker-mcp/src/tools.json — MCP демона
  - src/Tasker.Core/Tasks/TaskService.cs, src/Tasker.Web/TaskerApi.cs, src/Tasker.Mcp/Tools/TaskTools.cs — сервер и десктоп

  Как повторить
  - `tasker task --help` — команды импорта нет
  - В tools.json нет `create_tasks`; в TaskerApi.cs нет `POST /tasks/batch`

  Что нужно сделать
  - Формат и режимы согласовать перед реализацией
  - Консоль: `tasker task import <файл|->` — JSON-массив или JSON Lines со всеми полями задачи (title, type, status, description, series, поля, родитель, связи), CSV для простых случаев; `--dry-run`; режимы «всё или ничего» и «пропустить ошибки с отчётом»; итог (создано N, ошибки с номером строки), `--json`
  - MCP `create_tasks`: список задач в одном вызове, лимит размера, отчёт по каждой (демон и сервер)
  - REST `POST /projects/{id}/tasks/batch`
  - Ядро: одна проверка прав и версий, одна секция записи, номера серий подряд без гонок; в папке — пачка файлов и одно обновление индекса, в БД — одна транзакция; события одним пакетом; учёт блокировок правки
  - Связи внутри пакета через временные ключи (`ref`); идемпотентность повторного запуска (необязательный `externalId`); ограничение размера пачки
  - README/вики, `tasker manual`, автодополнение
  - Проверка: тесты на обоих хранилищах — 500 задач одним вызовом за секунды, номера серий подряд, связи по `ref` созданы, повтор с теми же `externalId` дублей не создаёт
