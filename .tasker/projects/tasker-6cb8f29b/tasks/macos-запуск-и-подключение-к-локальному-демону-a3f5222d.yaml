description: |-
  Эпик TSK-178. В режиме Local приложение работает через демон Tasker (.NET, режим Local).

  Что сделать
  - Найти демон: уже запущенный (файлы состояния демона, порт, daemon/status) или запустить его самому (бинарник в составе приложения или установленный tasker).
  - Проверка версии демона и приложения; при несовпадении — понятное сообщение / обновление демона (daemon/upgrade).
  - Состояние подключения в интерфейсе: работает / запускается / не работает, повтор подключения, перезапуск после падения демона.
  - Решить, как поставлять демон с приложением (внутри .app или отдельно) — зафиксировать.

  Готово, когда
  Приложение само поднимает демон или подключается к работающему, показывает его состояние и переживает перезапуск демона.
