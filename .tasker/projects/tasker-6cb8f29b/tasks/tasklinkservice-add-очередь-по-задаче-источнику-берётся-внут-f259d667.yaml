description: |-
  Проблема
  При добавлении связи без версии типа, не допускающего циклы, проверка цикла и запись идут в секции записи проекта (`write.lock`), а внутри неё берётся очередь (полоса Stripes) по задаче-источнику. Связь от той же задачи с типом, допускающим циклы (или симметричным), берёт ту же полосу вне секции и уже под ней пишет файл, беря `write.lock`. Порядок захвата противоположный — взаимная блокировка до таймаута FileLock, когда несколько агентов демона одновременно связывают одну задачу. Комментарий в Change («очередь берётся вне секции записи и не вложена в другие») для Add неверен.

  Где
  - rust/crates/tasker-services/src/links.rs — `add` (`self.ws.exclusive(...)` → `change`), `change` (stripes)
  - rust/crates/tasker-files/src/write.rs — `exclusive` и запись файла под `write.lock`
  - src/Tasker.Core/Links/TaskLinkService.cs — Add (`writes.Exclusive` → Change), Change (Stripes)

  Как повторить
  - Демон с открытой областью, задача A и несколько задач-целей. Параллельно (несколько клиентов MCP) звать `link_tasks` от A без версии: часть — с типом без циклов (Blocks), часть — с типом, допускающим циклы, или симметричным (Relates). Изредка вызовы зависают до таймаута FileLock (30 с) и падают.
  - В тесте: потоки над `TaskLinkService::add` для одной задачи-источника с двумя такими типами вперемешку, в цикле.

  Что нужно сделать
  - Единый порядок захвата: брать полосу по задаче-источнику до секции записи или проверять цикл внутри Modify, без вложенного захвата полосы под `write.lock`.
  - Исправить комментарий в Change.
  - Исправить в обоих движках (Rust tasker-services, .NET Tasker.Core).
  - Проверка: тест параллельных связей от одной задачи с типами с циклами и без, в цикле под нагрузкой, без зависаний и потерь связей — для Rust и .NET (files и sqlite).
