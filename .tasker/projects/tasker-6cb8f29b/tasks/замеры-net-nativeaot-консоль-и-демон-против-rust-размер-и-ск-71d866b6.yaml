description: |-
  Цель
  Понять, можно ли держать единственное ядро на C#, а не на Rust, если собрать консоль и демон через .NET NativeAOT. От C# отказываться не хотим; вопрос — проходит ли AOT-сборка по размеру и скорости. Контекст решения: TSK-176 (нативное приложение) и обсуждение «одно ядро на Rust или на C#» — ядер должно быть одно, смесь (консоль на Rust + демон/сервер на C#) не рассматриваем.

  Критерии приемлемости
  - Размер: каждый исполняемый файл (консоль, демон) — до 10 МБ.
  - Скорость: медианы вызовов консоли отстают от Rust не больше чем на 10–20 %.
  - Дополнительно записать: память демона (RSS), размер архива релиза.

  Что уже известно
  - Базовая линия .NET (JIT + R2R, TSK-126, 0.1.0, osx-arm64, M2 Max): релиз 152 МБ / 377 файлов; version 60 мс, status list 152, task list --limit 1 178, task get 202, task create 241 (50 задач, медианы). Из ~200 мс на task get: запуск рантайма ~45 мс, Autofac ~43 мс, JIT ~50 мс, SQLite-индекс ~21 мс.
  - Rust (TSK-136): 8–15 мс на вызов, 4,3 + 5,0 МиБ.
  - Числа и сырые замеры были в docs/rust-migration-baseline.md, docs/rust-migration-results.md, docs/perf-baseline/ — удалены в fe4484e, достать из истории (b17fc3c, 76cf2de).
  - .NET-консоль удалена в d9042d3 (TSK-143: src/Tasker.Cli, src/Tasker.Daemon.Host) — восстановить из d9042d3^ во временной ветке для замера.

  Что сделать
  1. Восстановить Tasker.Cli (и хост демона) из истории в отдельной ветке, собрать на текущем Tasker.Core / Storage.Files.
  2. Включить PublishAot, собрать под osx-arm64 (потом win-x64). Разобрать предупреждения AOT/trimming; ожидаемые места:
     - Autofac (DI на рефлексии) — заменить ручной регистрацией или AOT-совместимым контейнером;
     - System.Text.Json — генераторы исходного кода (JsonSerializerContext);
     - YamlDotNet — статический генератор контекста;
     - Microsoft.Data.Sqlite — проверить нативную библиотеку SQLite в AOT;
     - EF Core (если попадает в консоль/демон) — поддержка AOT неполная.
  3. Прогнать scripts/perf/bench.py теми же сценариями, что в базовой линии: с демоном и без, 50/100/2000 задач; version, status list, task list --limit 1, task get, task create; медианы и p10/p90. Тот же компьютер, рядом прогнать Rust-бинарники для честного сравнения.
  4. Записать: размер каждого бинарника и архива, медианы, отставание от Rust в %, RSS демона, список переделок, которые понадобились для AOT, и что не удалось.

  Итог задачи
  Таблица «.NET JIT/R2R — .NET NativeAOT — Rust» и вывод: укладывается ли AOT в критерии (≤10 МБ, ≤10–20 % медленнее Rust) и чего стоит перевести код на AOT. По результату решаем, на каком языке единственное ядро (и сервер).
