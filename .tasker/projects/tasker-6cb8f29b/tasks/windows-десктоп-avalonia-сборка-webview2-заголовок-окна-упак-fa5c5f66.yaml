description: |-
  Проблема
  Десктоп (src/Tasker.Desktop, Avalonia 12, WebView из Avalonia.Controls.WebView с фронтендом по адресу /w/{папка}/) проверялся только на macOS. В CI на Windows и Linux он лишь собирается в составе решения, но не запускается; в релиз и установщики не входит ни на одной платформе. В коде есть развилки для не-macOS (клавиша Control вместо Cmd, правый отступ 140 под кнопки окна, MacTitleBar только на macOS), но поведение на Windows и Linux не проверено.

  Где
  - src/Tasker.Desktop/Tasker.Desktop.csproj — пакеты Avalonia и WebView
  - src/Tasker.Desktop/WorkspaceWindow.axaml(.cs) — заголовок, отступы LeftInset/RightInset
  - src/Tasker.Desktop/Tabs/ — собственная панель вкладок
  - src/Tasker.Desktop/WindowCommands.cs, MacTitleBar.cs, App.axaml.cs (трей), Program.cs
  - src/Tasker.Daemon/DaemonLauncher.cs — поиск и запуск tasker-mcpd.exe
  - src/Tasker.Global/AppDirectories.cs — `%LOCALAPPDATA%\Tasker`
  - scripts/release.sh, scripts/install.ps1 — поставка (десктопа в ней нет)

  Как повторить
  - На Windows: `dotnet run --project src/Tasker.Desktop` — запуск не проверялся
  - `grep -i desktop scripts/release.sh scripts/install.ps1` — пусто

  Что нужно сделать
  - Запуск десктопа на Windows и Linux: WebView (WebView2 Runtime на Windows — проверять и предлагать установку; движок на Linux), трей
  - Окно: панель вкладок, заголовок и кнопки окна, отступы по платформам, меню, горячие клавиши с Ctrl
  - Демон: десктоп находит и запускает tasker-mcpd.exe, отдаёт ему открытые папки, понятная ошибка при занятом порте
  - Пути и настройки (`%LOCALAPPDATA%\Tasker`, журнал), диалог выбора папки, перетаскивание, ассоциация с `.tasker`
  - Упаковка: самодостаточная публикация, установщик (MSIX или Inno Setup/WiX) или zip с ярлыком, значок, версия
  - Проверка на Windows 10/11 x64 и arm64: высокий DPI, тёмная тема; вики (Платформы, Установка)
  - Проверка: десктоп запускается на Windows и Linux, открывает папку, MCP демона работает для неё; сборка пакета проходит в CI
