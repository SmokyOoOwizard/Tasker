title: 'Обновление демона не заменяет супервизор: он работает на старой сборке до перезапуска службы'
typeId: 97e160a1-7791-45ea-aa77-9e590c3536eb
statusId: 30300951-beb2-495f-a290-2b36ae0f4920
createdAt: 2026-11-06T02:21:27.5652950+00:00
updatedAt: 2026-11-06T04:22:14.9441590+00:00
