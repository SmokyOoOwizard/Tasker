- seriesId: d7ef1523-7d8d-46f8-b3c1-996e24fbd2c1
  number: 235
description: |-
  `tasker mcp upgrade` заменял только рабочий процесс. Супервизор (Supervisor.cs) работал со старой сборкой, пока служба не перезапустится: правки в его коде после обновления не действовали.

  Решение пользователя: замена без простоя не нужна, на время обновления демон может не работать, держать сокет вечно незачем. Поэтому супервизор и рабочие процессы убираются целиком: демон везде один процесс, а `tasker mcp upgrade` проверяет новую сборку пробным запуском и перезапускает демон. Отказ пробного запуска оставляет старый демон работать.

  Готово, когда после обновления демон работает на новой сборке, `tasker mcp status` показывает его сборку, отказ проверки не трогает работающий демон, тесты зелёные.

  Заодно: приложение сравнивает только номер версии, поэтому новый Tasker.app той же версии не обновлял демон (подтверждено по коду DaemonConnection.apply). Сравнивать сборку.

  Смежные: TSK-234 (обрыв вызовов при замене под нагрузкой) и TSK-165 теряют смысл; TSK-217 (второй демон на занятом порту) остаётся.
