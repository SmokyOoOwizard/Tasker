- seriesId: d7ef1523-7d8d-46f8-b3c1-996e24fbd2c1
  number: 235
description: |-
  `tasker mcp upgrade` заменяет только рабочий процесс. Супервизор (Supervisor.cs) продолжает работать со старой сборкой, пока служба не перезапустится, например после перезагрузки. Правки в коде самого супервизора после обновления не действуют.

  Готово, когда после обновления и супервизор, и рабочий процесс работают на новой сборке без простоя (сокет не закрывается, порт не освобождается, области остаются открытыми, вызовы не теряются), откат при неудаче работает, `tasker mcp status` показывает сборку супервизора, тесты зелёные.

  Заодно проверить: запуск нового Tasker.app той же версии не обновил демон — похоже, приложение сравнивает только номер версии, а не сборку.

  Смежные: TSK-234 (обрыв вызовов при замене под нагрузкой), TSK-217 (второй демон на занятом порту).
