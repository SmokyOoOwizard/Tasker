  number: 238
description: |-
  Эпик TSK-178.

  Как воспроизвести
  1. Открыть доску, где в одной колонке задач на несколько экранов, а в других заметно меньше.
  2. Прокрутить доску вниз на несколько экранов.
  3. Начать переносить карточку на другую колонку.
  4. Подсветки колонки не видно.

  Вероятная причина (по коду, в запущенном приложении не проверено)
  - Высота колонки определяется её содержимым, минимум — высота экрана доски: `BoardColumnView`, `frame(minHeight:)`, а `HStack` выравнивает колонки по верху (`BoardView.swift`). Подсветка рисуется фоном и обводкой самой колонки.
  - Колонка под курсором определяется только по горизонтали (`BoardDropView.column` в `BoardDragDrop.swift`), поэтому цель выбирается и перенос, вероятно, срабатывает. Но после прокрутки подсвеченный прямоугольник короткой колонки уже выше видимой области.
  - Заголовок колонки при такой прокрутке тоже не виден, поэтому непонятно, куда попадёт карточка.

  Что сделать
  - Воспроизвести и подтвердить причину. Проверить, срабатывает ли перенос без видимой подсветки.
  - Сделать подсветку целевой колонки видимой при любой вертикальной прокрутке, например растянуть все колонки на высоту самой длинной.
  - Проверить, что при этом не ломаются кнопка «Показать все», длинные списки и автопрокрутка у краёв.
  - Проверить состояние, когда колонка не принимает задачу.

  Готово, когда
  При переносе карточки на доске, прокрученной на любую глубину, целевая колонка подсвечена в видимой области, а перенос работает как раньше.
