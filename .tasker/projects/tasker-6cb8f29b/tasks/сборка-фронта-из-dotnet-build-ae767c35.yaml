description: |-
  Проблема
  Фронтенд встраивается в Tasker.Web из `frontend/dist`, но `dotnet build` его не собирает: перед сборкой .NET нужно вручную запустить `npm run build`. Без этого сервер и десктоп собираются без интерфейса (в лог пишется только предупреждение).

  Где
  - src/Tasker.Web/Tasker.Web.csproj — встраивание `frontend/dist`, свойство `EmbedFrontend`
  - src/Tasker.Web/TaskerWebExtensions.cs (`CreateFrontendProvider`) — предупреждение «Frontend is not embedded»
  - docs/wiki/Разработка.md — инструкция по сборке

  Как повторить
  - В свежем клоне или worktree: `dotnet build` и `dotnet run --project src/Tasker.Server` — страницы не открываются, в логе «Frontend is not embedded: run `npm run build`…».

  Что нужно сделать
  - MSBuild-цель в Tasker.Web: перед сборкой `npm ci`/`npm install` (если нет `node_modules`) и `npm run build` с инкрементальностью по исходникам `frontend/`, чтобы повторная сборка без изменений не пересобирала фронт.
  - При `-p:EmbedFrontend=false` цель не выполняется (CI-тесты без Node).
  - Обновить docs/wiki/Разработка.md.
  - Проверка: в чистом клоне `dotnet build` и запуск сервера открывают интерфейс; повторный `dotnet build` не запускает npm; `-p:EmbedFrontend=false` собирается без npm.
