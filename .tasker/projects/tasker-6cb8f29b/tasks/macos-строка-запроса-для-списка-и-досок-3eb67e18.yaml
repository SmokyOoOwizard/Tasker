description: |-
  Эпик TSK-178. Строка запроса: фильтр и сортировка одной строкой. Используется новый синтаксис, описанный ниже; синтаксис из макета 02 и main-design он заменяет.

  Синтаксис выражений (решения пользователя, 2026-11-05)
  Обращение к объекту задачи идёт через точку, дальше пишутся сравнения:

  .Status == "Todo" || .Status == "Done"

  - Сравнения по типу значения: числа — больше, меньше, равно, не равно; строки и перечисления — равно, не равно.
  - Логические И и ИЛИ. Скобки поддерживаются сразу.
  - Доступ к полям задачи: .Field.{FieldName}
  - Имя поля с пробелами пишется в кавычках: .Field."Тестовое поле" == 2
  - Проверки записываются функциями: .Field.Estimate.IsSet()
  - Множественные поля:
    - .Field.Метки.Contains("bug") — поле содержит это значение среди других;
    - == значит, что поле содержит только это значение;
    - справа может стоять массив: ["Todo", "Done"].

  Что решить перед началом
  - Как в новом синтаксисе записываются тип, серия и сортировка.
  - Как называются остальные проверки по образцу IsSet(): поле не задано, поле подключено к задаче, поле не подключено.
  - Какие ещё функции нужны кроме Contains и IsSet.
  - Важен ли порядок значений при сравнении с массивом.

  Что сделать
  - Разбор выражений нового синтаксиса с понятными сообщениями об ошибках.
  - Автодополнение по ключам, значениям статусов/типов/перечислений, полям проекта и функциям, подсветка ошибок.
  - Решить, где живёт разбор запроса: в .NET (эндпоинт разбора/подсказок, единый для веба и приложений) или в Swift. Предпочтительно в .NET, чтобы не писать три раза.
  - Запрос сохраняется в состоянии окна; общий компонент для списка задач и досок.
  - Привести макет и документацию в соответствие с новым синтаксисом, если они его описывают.

  Готово, когда
  Строкой можно выразить всё, что умеет фильтр списка задач, включая выражения со скобками, И и ИЛИ, подсказки работают с клавиатуры.
