description: |-
  Эпик TSK-178. Строка запроса из main-design (взята из макета 02): фильтр и сортировка одной строкой.

  Что сделать
  - Синтаксис как в макете: тип, статус, серия, условия по полям (=, !=, >, >=, <, <=, set, unset, attached, detached), сортировка.
  - Автодополнение по ключам, значениям статусов/типов/перечислений и полям проекта, подсветка ошибок.
  - Решить, где живёт разбор запроса: в .NET (эндпоинт разбора/подсказок, единый для веба и приложений) или в Swift. Предпочтительно в .NET, чтобы не писать три раза.
  - Запрос сохраняется в состоянии окна; общий компонент для списка задач и досок.

  Готово, когда
  Строкой можно выразить всё, что умеет фильтр списка задач, подсказки работают с клавиатуры.
