description: |-
  Проблема
  Экран «Доски» показывает только список досок с названиями колонок. Открыть доску с колонками и задачами, перенести задачу между колонками, создать или настроить доску из интерфейса нельзя — только через API, консоль или MCP.

  Где
  - frontend/src/pages/BoardsPage.tsx — список досок
  - frontend/src/App.tsx — маршруты проекта
  - src/Tasker.Web/TaskerApi.cs — `/boards` (CRUD), `GET /boards/{id}/columns/{columnId}/tasks`, `POST /boards/{id}/columns/{columnId}/move`

  Как повторить
  - Открыть «Доски» проекта: карточки досок не открываются; без досок — текст «Создать доску из интерфейса пока нельзя».

  Что нужно сделать
  - Просмотр доски: колонки с задачами (по `columns/{columnId}/tasks`).
  - Перенос задачи в другую колонку перетаскиванием (через `move`), с обработкой конфликта и блокировок.
  - Создание доски и настройка: название, наборы статусов, колонки (название, статусы, порядок), удаление.
  - Проверка: создать доску в интерфейсе, открыть её, перенести задачу в другую колонку — статус задачи меняется (`tasker task get`).
