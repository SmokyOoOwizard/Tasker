description: |-
  На доске в строке запроса при введённом запросе появляется крестик. Нажатие на него запрос не стирает: текст остаётся в поле.

  Ожидается: нажатие на крестик очищает поле и сбрасывает применённый запрос.

  Замечено на досках. Проверить остальные места, где используется та же строка запроса: список задач, запрос колонки в редакторе доски.
