description: |-
  Проблема
  У задачи нет автора и исполнителя: не хранится, кто её создал, и некому её назначить. Ни модель, ни файлы, ни БД, ни API, ни консоль, ни интерфейс таких полей не знают.

  Где
  - dotnet/src/Tasker.Core/Tasks/TaskItem.cs, dotnet/src/Tasker.Core/Tasks/TaskService.cs, dotnet/src/Tasker.Core/Tasks/TaskFilter.cs — модель и сервис задач
  - dotnet/src/Tasker.Storage.Files/Storages/TaskFile.cs — файл задачи
  - dotnet/src/Tasker.Storage.Db/Models/TaskDbModel.cs — таблица задач
  - dotnet/src/Tasker.Web/TaskerApi.cs, dotnet/src/Tasker.Mcp/Tools/TaskTools.cs, dotnet/src/Tasker.Cli/Commands/TaskCommands.cs
  - frontend/src/pages/TasksPage.tsx, frontend/src/types.ts

  Как повторить
  - `tasker task create "Первая" --type Task`, затем `tasker task get <id>` или файл задачи в `.tasker/projects/*/tasks/` — полей автора и исполнителя нет; у `tasker task create/update` нет параметров исполнителя.
  - `grep -rni "createdBy\|assignee" dotnet/src frontend/src macos/Sources` — ничего.

  Что нужно сделать
  - Поле автора `createdBy`: заполняется при создании текущим пользователем (на сервере — вошедший, в MCP — агент, в приложении macOS и в консоли — локальный пользователь), не меняется.
  - Поле исполнителя `assigneeId`: задаётся и снимается при создании и правке задачи.
  - Проверка, что пользователь существует и (на сервере) участвует в проекте; что делать с исполнителем при удалении пользователя или исключении из проекта.
  - Хранение в файлах и в БД (с учётом отсутствия миграций схемы).
  - REST, MCP (сервер и демон), консоль (`--assignee`, вывод в `task get/list`, фильтр по исполнителю), интерфейс (показ и выбор исполнителя); вики.
  - Проверка: задача, созданная через консоль, REST и MCP, получает правильного автора; назначение несуществующего пользователя или не участника проекта отклоняется; файлы и БД читаются одинаково.
