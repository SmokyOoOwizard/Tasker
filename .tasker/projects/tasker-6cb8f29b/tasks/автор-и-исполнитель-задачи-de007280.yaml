description: |-
  Проблема
  У задачи нет автора и исполнителя: не хранится, кто её создал, и некому её назначить. Ни модель, ни файлы, ни БД, ни API, ни консоль, ни интерфейс таких полей не знают.

  Где
  - src/Tasker.Core/Tasks/TaskItem.cs, src/Tasker.Core/Tasks/TaskService.cs, src/Tasker.Core/Tasks/TaskFilter.cs — модель и сервис задач (.NET)
  - rust/crates/tasker-core/src/model/task.rs, rust/crates/tasker-services/src/task.rs — то же в Rust
  - src/Tasker.Storage.Files/Storages/TaskFile.cs, rust/crates/tasker-files/src/files/task.rs — файл задачи
  - src/Tasker.Storage.Db/Models/TaskDbModel.cs, rust/crates/tasker-services/src/db/tasks.rs, rust/crates/tasker-services/src/db/schema.sql — таблица задач
  - src/Tasker.Web/TaskerApi.cs, src/Tasker.Mcp/Tools/, rust/crates/tasker-mcp/src/tools/task.rs, rust/crates/tasker-cli/src/commands/task.rs
  - frontend/src/pages/TasksPage.tsx, frontend/src/types.ts

  Как повторить
  - `tasker task create "Первая" --type Task`, затем `tasker task get <id>` или файл задачи в `.tasker/projects/*/tasks/` — полей автора и исполнителя нет; у `tasker task create/update` нет параметров исполнителя.
  - `grep -rni "createdBy\|assignee" src rust/crates frontend/src` — ничего.

  Что нужно сделать
  - Поле автора `createdBy`: заполняется при создании текущим пользователем (на сервере — вошедший, в MCP — агент, на десктопе и в консоли — локальный пользователь), не меняется.
  - Поле исполнителя `assigneeId`: задаётся и снимается при создании и правке задачи.
  - Проверка, что пользователь существует и (на сервере) участвует в проекте; что делать с исполнителем при удалении пользователя или исключении из проекта.
  - Хранение в файлах (.NET и Rust пишут одинаково) и в БД (с учётом отсутствия миграций схемы).
  - REST, MCP (сервер и демон), консоль (`--assignee`, вывод в `task get/list`, фильтр по исполнителю), интерфейс (показ и выбор исполнителя); вики.
  - Проверка: задача, созданная через консоль, REST и MCP, получает правильного автора; назначение несуществующего пользователя или не участника проекта отклоняется; файлы и БД читаются .NET и Rust одинаково.
