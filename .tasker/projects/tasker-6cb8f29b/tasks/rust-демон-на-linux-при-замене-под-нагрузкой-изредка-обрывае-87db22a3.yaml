  number: 154
description: |-
  Проблема
  На Linux при замене рабочего процесса демона под нагрузкой отдельные вызовы `/mcp` около замены получают HTTP 200 с пустым телом: заголовки ответа SSE отправлены, затем соединение закрыто без события `data`. Похоже, старый рабочий процесс завершается при дренаже, пока тело потокового ответа ещё не дописано (вызов перестаёт считаться «в работе» раньше конца тела), либо выход не дожидается сброса буферов. Неизвестно, записана ли при этом задача (клиент не получил подтверждения).

  Где
  - rust/crates/tasker-mcpd/src/worker.rs — дренаж старого рабочего процесса (`TASKER_MCP_DRAIN_QUIET_MS`), учёт вызовов в работе
  - rust/crates/tasker-mcpd/src/http.rs, mcp.rs — обслуживание `/mcp` (rmcp, ответ SSE)
  - rust/crates/tasker-mcpd/src/supervisor.rs — замена рабочего процесса
  - rust/crates/tasker-mcpd/tests/supervisor.rs — upgrade_under_continuous_load_refuses_no_connection_and_loses_no_write

  Как повторить
  - В Docker на Linux с ограничением CPU (`docker run --cpus 2` с Rust, исходники репозитория внутри) гонять в цикле `cargo test -p tasker-mcpd --test supervisor upgrade_under_continuous_load_refuses_no_connection_and_loses_no_write` — примерно 1 прогон из 8 падает с `load N-…: None` (ответ create_task без тела). На macOS и в CI ubuntu-latest не наблюдалось.

  Что нужно сделать
  - Воспроизвести и найти причину: учитывается ли вызов «в работе» до конца тела SSE-ответа rmcp; порядок завершения рабочего процесса (закрытие соединений, сброс буферов) при дренаже.
  - Исправить так, чтобы начатый вызов всегда получал полный ответ до выхода старого процесса.
  - Проверить, что задача из оборванного вызова записана ровно один раз.
  - Проверка: тест в цикле (≥ 50 прогонов) в Docker Linux `--cpus 2` без провалов; тест продолжает проходить на macOS, Linux и в CI.
