description: |-
  Проблема
  Тест ApiSchemaTests.Committed_schema_matches_the_current_api падает в CI в задании dotnet test (windows-latest) с сообщением «docs/api/openapi.json differs from the current API». На Linux и macOS тот же тест проходит. Из-за этого статус .NET-тестов на Windows красный и у main, и у PR.

  Что известно
  - Падает на чистом main: запуски f958a848, ab1a53d0, ee437aba. Также упал в PR #60 (TSK-214).
  - Причина не установлена. Сообщение теста не показывает, чем именно отличается схема.

  Что сделать
  1. Выяснить, чем сгенерированная на Windows схема отличается от закоммиченной: например, выложить её артефактом CI или показать первое расхождение в сообщении теста.
  2. Сделать генерацию одинаковой на всех платформах. Сравнение в тесте и файл docs/api/openapi.json менять только если расхождение действительно не в схеме.

  Готово, когда тест стабильно проходит в dotnet test (windows-latest), а openapi.json одинаков на всех платформах.
