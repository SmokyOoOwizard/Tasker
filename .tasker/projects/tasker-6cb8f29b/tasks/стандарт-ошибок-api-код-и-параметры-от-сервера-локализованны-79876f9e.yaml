  number: 214
description: |-
  Контекст: сейчас сервер присылает отказы только английским текстом (например «Status 'X' is used by 3 task(s) and cannot be deleted»). Клиент macOS показывает его как есть или разбирает текст регулярками, а в части мест считает занятость сам, чтобы показать по-русски (TSK-197, PR #59).

  Что сделать
  - Придумать механизм (нужно согласовать с владельцем): стабильный код ошибки (например status.in_use, status_set.status_in_use, task_type.fields_have_values, entity.locked, entity.modified, validation.*) и типизированные параметры (имена сущностей, числа, списки задач/досок/колонок), плюс английское сообщение как запасное.
  - Единый формат в REST (409/400) и GraphQL, описание в openapi.json и schema.graphql; MCP и CLI продолжают получать читаемый текст.
  - Заменить строки в сервисах (Usages, TaskerConflictException, TaskerValidationException) на код + параметры.
  - Клиент macOS: словарь кодов в design/strings.json (RU/EN), показ локализованного сообщения и структурированных списков «чем используется»; убрать клиентские обходы из TSK-197/198 (разбор текста, предварительный подсчёт занятости).
  - Веб-клиент: перейти на тот же формат.

  Готово, когда любой отказ сервера приходит с кодом и параметрами, а macOS показывает его на выбранном языке без разбора текста.
