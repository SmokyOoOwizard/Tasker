description: |-
  Проблема
  Добавление и удаление рабочей области в глобальных настройках сравнивает области по `Location.Id`, а `Location` каждой записи строится заново на каждом сравнении — с вычислением канонического пути, который перечисляет каталоги пути. Поэтому каждый вызов стоит O(число записей × длина пути × размер каталогов). В каталоге с ~50 тыс. записей (временный каталог macOS) 20 последовательных добавлений занимают ~12 с.

  Где
  - src/Tasker.Global/SettingsStore.cs — AddWorkspace, RemoveWorkspace (`x.Location.Id`)
  - src/Tasker.Global/GlobalSettings.cs — `WorkspaceEntry.Location` (строится при каждом обращении)
  - src/Tasker.Storage.Files/Workspaces/WorkspaceLocation.cs, CanonicalPath.cs
  - rust/crates/tasker-core/src/settings/store.rs — add_workspace, remove_workspace (`x.location().id()`)
  - rust/crates/tasker-core/src/settings/global_settings.rs — `WorkspaceEntry::location`

  Как повторить
  - С временным `TASKER_HOME` добавить несколько областей подряд с `TASKER_PROFILE=1 tasker mcp workspace add <папка>` — счётчик `[count] canonical-path` растёт с числом записей (1, 2, 3, …): на каждое добавление пересчитываются пути всех записей. В каталоге с десятками тысяч записей (`$TMPDIR` на macOS) каждое добавление заметно медленнее предыдущего.
  - .NET: SettingsTests.Parallel_updates_are_not_lost при переполненном временном каталоге упирается в таймаут `settings.lock`.

  Что нужно сделать
  - Не вычислять канонический путь существующих записей на каждом сравнении: кэшировать `Location` в записи или сравнивать с уже сохранённым каноническим путём без повторного раскрытия.
  - Id области (детерминизм) не меняется.
  - Исправить в обеих реализациях (.NET SettingsStore и Rust store.rs).
  - Проверка: тест — N добавлений областей вычисляют канонический путь O(N) раз, а не O(N²); SettingsTests проходят при переполненном временном каталоге.
