description: |-
  Эпик TSK-178, после OpenAPI-схемы.

  Что сделать
  - Генерация клиента и моделей из docs/api/openapi.json (swift-openapi-generator или аналог) отдельным Swift-пакетом в macos/.
  - Слой над клиентом: async/await, единые ошибки (версия изменена другим, заблокировано «правит …», отказ с сообщением сервера), таймауты, отмена запросов.
  - Адрес и способ авторизации подставляются извне: локальный демон (без входа, заголовок пользователя) или сервер (JWT, обновление токена).
  - Тесты на разбор ответов и ошибок на фикстурах.

  Готово, когда
  Пакет собирается, тесты проходят, из приложения можно получить список проектов у запущенного вручную демона.
