description: |-
  Проблема
  Тест DaemonUpgradeTests.Upgrade_under_load_loses_no_call_and_no_write_and_duplicates_none падает в CI не каждый раз: при замене демона под нагрузкой часть вызовов получает HttpRequestException (DaemonUpgradeTests.cs:232).

  Что известно
  - PR #75, коммит 58973c6, запуск 42136713775, ubuntu: 5 вызовов (load 1-48, 3-47, 5-48, 2-48, 4-48), тест шёл 16 с. Во втором запуске того же коммита (42136710996) ubuntu зелёный.
  - PR #75 этот код не меняет.
  - На macOS этот тест уже падал один раз в CI (PR #45, TSK-209) и прошёл при повторе.
  - Похожий тест Rust-демона падал из-за разрыва keep-alive соединения при закрытии затвора: возможно, причина та же. Это предположение, оно не проверено.

  Почему важно
  Тест проверяет, что при замене демона не теряется ни один вызов. Если падение настоящее, клиенты могут получать ошибки при обновлении демона, а не только тест быть нестабильным.

  Что сделать
  1. Воспроизвести, например повторением теста под нагрузкой.
  2. Выяснить, что обрывает соединения: приём в старом процессе, закрытие затвора, момент выхода старого процесса.
  3. Если ошибка в демоне, исправить её. Менять ожидание теста, только если он проверяет лишнее.

  Готово, когда
  Причина установлена, вызовы при замене не теряются, а тест стабильно проходит на трёх системах в CI.
