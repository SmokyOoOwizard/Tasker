  number: 148
description: |-
  Проблема
  inputSchema инструментов MCP у вложенных объектов перечисляет в required все свойства, хотя пропущенное свойство допустимо (становится null или значением по умолчанию): create_board/update_board — columns[].required = [id, name, statusIds, dropStatuses]; create_task_type/update_task_type — fields[].required = [fieldId, required] и др. Клиент, который проверяет аргументы по схеме, вынужден слать id: null и dropStatuses: null.

  Где
  - Rust: схемы инструментов в rust/crates/tasker-mcp (демон tasker-mcpd).
  - .NET: записи аргументов в src/Tasker.Mcp (MCP сервера с токенами агентов).

  Что нужно сделать
  - Убрать из required вложенных схем необязательные свойства (nullable и со значением по умолчанию) в обеих реализациях; верхний уровень не менять.
  - Проверить все 62 инструмента, а не только перечисленные.
  - Обновить снимки схем (tests/golden, tools/list) и .NET-тесты схем.
  - Тесты: вызов с вложенными объектами без необязательных свойств проходит; схема из tools/list проходит проверку валидатором JSON Schema на таком вызове.
