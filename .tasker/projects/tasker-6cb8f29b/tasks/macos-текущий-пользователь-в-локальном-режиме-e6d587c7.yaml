description: |-
  Эпик TSK-178.

  Проблема
  В локальном режиме у приложения macOS нет текущего пользователя-сущности. Вызовы MCP через демон идут от имени агента области, а действия приложения (REST к демону) ни от чьего имени: `ICurrentUser.Id` пуст, входа нет. Человек известен только по имени из настроек (`tasker whoami`) и используется лишь как держатель блокировок правки. Пользователем области (`users/<id>.yaml`) он не является, поэтому авторство и назначение на него не записать.

  Где
  - dotnet/src/Tasker.Web/Auth/HttpCurrentUser.cs — пользователь запроса только из claim `sub`, в локальном режиме его нет
  - dotnet/src/Tasker.Web/Auth/ModeRegistration.cs — регистрация `ICurrentUser` по режиму
  - dotnet/src/Tasker.Core/Users/ICurrentUser.cs, dotnet/src/Tasker.Core/Users/UserService.cs
  - dotnet/src/Tasker.Core/Locks/EditLockService.cs (`CurrentUserEditor`), dotnet/src/Tasker.Global/SettingsLocalEditor.cs — имя «локального человека» из настроек
  - macos/Sources/Tasker/Daemon/ — подключение приложения к демону

  Как повторить
  - `tasker whoami` показывает имя из настроек, но `tasker user list` в новой папке его не содержит.
  - Создать задачу в приложении: запрос идёт без пользователя.

  Что нужно сделать
  - Ввести текущего пользователя для действий приложения macOS: «локальный человек» — пользователь области (вид Human), сопоставленный с именем из настроек (`tasker whoami`). Создаётся при первом обращении к области, переименовывается вместе с именем.
  - Запросы приложения к демону выполняются от имени этого пользователя. MCP по-прежнему работает от имени агента.
  - Блокировки правки и показ «Правит …» в приложении используют того же пользователя.
  - Консоль в этой задаче не меняется.

  Готово, когда
  В новой папке после действия в приложении в `tasker user list` есть локальный человек с именем из `tasker whoami`, сервисы получают его id как текущего пользователя (есть тест), а вызовы MCP по-прежнему идут от агента.
