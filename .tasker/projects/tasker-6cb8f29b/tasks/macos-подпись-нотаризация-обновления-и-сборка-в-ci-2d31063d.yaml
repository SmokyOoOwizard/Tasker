description: |-
  Эпик TSK-178.

  Что сделать
  - Подпись Developer ID, hardened runtime, нотаризация, DMG; демон внутри пакета тоже подписан.
  - Автообновление (Sparkle или аналог) с лентой обновлений в релизах GitHub.
  - Сборка, тесты и выпуск в CI (macOS-раннер) вместе с релизом консоли и демона, версия из VERSION (уже сделано: job macos-app собирает zip с Tasker.app, консоль и демон внутри Tasker.app, версия из VERSION).

  Готово, когда
  Релиз выпускает подписанный нотаризованный DMG, установленное приложение обновляется само.
