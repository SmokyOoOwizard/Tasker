description: |-
  Проблема
  Стартовая страница пустой вкладки десктопа предлагает только «Выбрать папку…»: недавно открытых папок нет, каждую приходится выбирать в диалоге заново.

  Где
  - src/Tasker.Desktop/Tabs/StartPage.axaml, src/Tasker.Desktop/Tabs/StartPage.axaml.cs — стартовая страница
  - src/Tasker.Desktop/WindowManager.cs (`OpenFolder`, `OpenIn`) — открытие папки во вкладке
  - src/Tasker.Global/AppDirectories.cs, src/Tasker.Global/SettingsStore.cs — каталог данных и хранение настроек

  Как повторить
  - `dotnet run --project src/Tasker.Desktop`, открыть папку, затем новую вкладку (⌘T / Ctrl+T) — на стартовой странице только кнопка «Выбрать папку…».

  Что нужно сделать
  - Список недавних папок (и файлов SQLite) в каталоге данных: обновляется при каждом открытии, ограничен по длине, без повторов.
  - На стартовой странице — список недавних с открытием по клику и удалением пункта из списка; несуществующую папку показывать как недоступную.
  - Проверка: открыть две папки, новая вкладка показывает обе, клик открывает папку; после перезапуска список сохранился.
