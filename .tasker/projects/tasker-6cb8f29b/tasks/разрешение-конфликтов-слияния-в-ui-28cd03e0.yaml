description: |-
  Проблема
  Файл сущности с маркерами конфликта git выпадает из списков: в интерфейсе задача (или другая сущность) просто исчезает, а узнать о конфликте можно только из `tasker sync`, MCP `list_workspace_problems` или `GET /api/workspace/problems` — фронтенд этот список не запрашивает. Разрешать конфликт приходится вручную в текстовом редакторе. Как правильно показывать и разрешать конфликт в интерфейсе, ещё не решено — задача исследовательская.

  Где
  - rust/crates/tasker-files/src/error.rs — ошибка `MergeConflict` при чтении файла
  - rust/crates/tasker-files/src/index/ — список проблем индекса (`problems`)
  - src/Tasker.Storage.Files/Index/WorkspaceIndex.cs — `GetProblems` (десктоп)
  - src/Tasker.Web/TaskerApi.cs — `GET /api/workspace/problems`
  - frontend/src/ — экран проблем и показа конфликтов отсутствует
  - docs/wiki/Хранение-и-git.md, docs/wiki/Интерфейс.md

  Как повторить
  - В папке с проектом и задачей вставить в файл задачи `.tasker/projects/<проект>/tasks/<задача>.yaml` маркеры `<<<<<<<`, `=======`, `>>>>>>>` с двумя вариантами `title`.
  - `tasker task list` → `Found 0`; `tasker task get <id>` → `Unresolved git merge conflict (line 3)`; `tasker sync` показывает файл как нечитаемый.
  - Открыть эту папку в десктопе: задачи нет ни в списке, ни на доске, сообщения о конфликте нет.

  Что нужно сделать
  - Исследовать и выбрать способ показать конфликт в интерфейсе на месте сущности (в списке, на доске, в карточке), а не только в списке проблем.
  - Помочь разрешить конфликт: например, показать обе версии полей и дать выбрать значение для каждого, затем записать файл без маркеров.
  - Описать выбранный подход и его ограничения (какие сущности и поля поддержаны, что делать с битым YAML без маркеров).
  - Проверка: файл с маркерами конфликта виден в интерфейсе десктопа как конфликтная сущность; после выбора версий в интерфейсе файл читается, `tasker sync` не показывает проблем, сущность снова в списках.
