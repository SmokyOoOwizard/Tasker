  number: 42
description: |-
  Проблема
  Каждый вызов `Exclusive` в файловом хранилище (в том числе вложенный) перед действием сверяет индекс со всей папкой задач проекта — один обход каталога на вызов, что на больших проектах дорого. Кроме того, в .NET эта сверка помечает папку задач как свою запись, и если она нашла изменения, уже внесённые в общий индекс другим процессом, вкладкам десктопа событие об изменении не уходит.

  Где
  - rust/crates/tasker-files/src/write.rs — `WriteScope::exclusive`
  - rust/crates/tasker-files/src/index/mod.rs — `exclusive`, `sync_paths`
  - src/Tasker.Storage.Files/Storages/WriteScope.cs — `Exclusive` (.NET, десктоп и сервер с папкой)
  - src/Tasker.Storage.Files/Index/WorkspaceIndex.cs — `Refresh`, `ownWrites`, событие `Changed`
  - src/Tasker.Web/Workspaces/WorkspaceEvents.cs — события вкладкам

  Как повторить
  - В папке с тысячами задач в одном проекте создать задачу с серией (`tasker task create ...`) и посмотреть время: с `TASKER_PROFILE=1` видно сверку индекса (`index-sync`) на каждый `Exclusive`.
  - Открыть папку в десктопе, в другом процессе создать задачу так, чтобы индекс обновил он, затем сделать правку с `Exclusive` из интерфейса — вкладка не получает события о чужой задаче.

  Что нужно сделать
  - Сделать сверку в `Exclusive` точечнее: не повторять её во вложенных вызовах и не обходить весь каталог, если индекс и так актуален (например, по отметке изменения каталога или счётчику сверок).
  - В .NET: если сверка нашла изменения, сделанные другим процессом, отправлять вкладкам событие об изменении.
  - Проверка: тест — вложенный `Exclusive` не обходит папку повторно; создание задачи в большом проекте не делает лишних обходов; вкладка видит чужую задачу после правки через `Exclusive`.
