description: |-
  Проблема
  Блокировка на время правки работает в ядре (.NET и Rust), REST, MCP и консоли, а в интерфейсе — при правке статусов, наборов статусов, типов задач и названия проекта. Не закрыто: задача в интерфейсе правится без блокировки (меняется только статус, разовым PATCH), формы правки досок и серий в интерфейсе отсутствуют, имя «локального человека» на десктопе меняется только через `tasker whoami`, пользователя (`User`) заблокировать нельзя ни через одну точку входа, а открытый десктоп и сервер узнают о чужих блокировках с задержкой.

  Где
  - frontend/src/pages/TasksPage.tsx — смена статуса задачи без блокировки
  - frontend/src/hooks/useEditLock.ts, frontend/src/hooks/useLocks.ts — взятие блокировки формой; опрос раз в 15 с на сервере
  - frontend/src/pages/BoardsPage.tsx, frontend/src/pages/settings/ — формы, использующие блокировку
  - frontend/src/pages/ProfilePage.tsx — `LocalProfile` (десктоп) без правки имени
  - src/Tasker.Core/Users/UserService.cs — проверка `LockedEntity.User` есть, точки входа нет
  - src/Tasker.Web/TaskerApi.cs — `MapLocks` (нет маршрута для пользователей)
  - rust/crates/tasker-cli/src/ (`tasker lock acquire <entity>`), rust/crates/tasker-mcp/src/tools/ (`lock_entity`) — нет вида `user`
  - src/Tasker.Storage.Files/Storages/EditLockStorage.cs (`.cache/edit-locks/`), src/Tasker.Web/Workspaces/WorkspaceEvents.cs — событие `lock` только от своего процесса

  Как повторить
  - Десктоп, «Задачи»: у задачи меняется только статус, карточки с правкой названия и описания нет; на «Досках» и для серий форм правки нет.
  - Десктоп, Профиль: «Локальный режим» без поля имени; имя меняется только `tasker whoami <имя>`.
  - `tasker lock acquire user <имя>` → `Users cannot be locked: use one of project, task, …`.
  - Открыть доску в десктопе и выполнить в консоли `tasker lock acquire board <доска>`: плашка «Правит …» не появляется, пока экран не перечитают.
  - Сервер: блокировка, взятая в другой вкладке, видна только через ~15 секунд (опрос).

  Что нужно сделать
  - Карточка задачи с блокировкой при открытии: правка названия и описания (вместе с задачей «Карточка задачи»).
  - Блокировка при правке досок и серий в интерфейсе — в формах их правки, когда они появятся.
  - Правка имени «локального человека» в настройках пользователя десктопа (то же имя, что у `tasker whoami`).
  - Блокировка пользователей через REST, MCP и консоль — после решения, кто вправе блокировать чужого пользователя.
  - Блокировка или снятие её демоном или консолью доходит до открытого десктопа событием `lock` (например, слежением за `.cache/edit-locks/`).
  - События об изменении блокировок на сервере вместо опроса раз в 15 секунд.
  - Проверка: каждая из перечисленных форм берёт и снимает блокировку, другой клиент видит плашку и получает `409 locked`; блокировка из консоли видна в открытом десктопе без перезагрузки; на сервере плашка появляется без ожидания опроса.
