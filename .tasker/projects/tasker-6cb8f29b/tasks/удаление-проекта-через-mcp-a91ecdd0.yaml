description: |-
  Проблема
  Через MCP нельзя удалить проект: есть `create_project` и `update_project`, а `delete_project` нет ни у сервера, ни у демона. Удаление проекта убирает всё его содержимое, поэтому инструмент не добавлялся; удалить проект можно только из интерфейса, REST или `tasker project delete`.

  Где
  - src/Tasker.Mcp/Tools/ProjectTools.cs — инструменты проектов MCP сервера
  - rust/crates/tasker-mcp/src/tools.json, rust/crates/tasker-mcp/src/catalog.rs, rust/crates/tasker-mcp/src/tools/mod.rs, rust/crates/tasker-mcp/src/tools/project.rs — инструменты демона
  - src/Tasker.Core/Projects/ProjectService.cs (`Delete`), rust/crates/tasker-services/src/project.rs — удаление проекта
  - rust/crates/tasker-mcpd/tests/mcp.rs — тесты MCP демона
  - docs/wiki/MCP-и-агенты.md

  Как повторить
  - `tools/list` у демона (`http://127.0.0.1:<порт>/mcp`) или у сервера — инструмента `delete_project` нет; `tools/call` с `delete_project` отвечает, что инструмент неизвестен.

  Что нужно сделать
  - Добавить инструмент `delete_project` в MCP сервера и демона с одинаковой схемой и описанием: обязательные `projectId` и `version`, проверка блокировки правки проекта, аннотация `destructiveHint`, описание явно предупреждает, что удаляется всё содержимое проекта.
  - На сервере — те же права, что у удаления проекта через REST.
  - Обновить список инструментов в вики и счётчик инструментов в каталоге демона.
  - Проверка: `delete_project` с верной версией удаляет проект и его содержимое, с устаревшей — `[modified]`, при чужой блокировке — `[locked]`; тесты MCP сервера и демона.
