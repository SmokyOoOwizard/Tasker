description: |-
  В редакторе доски (macOS) список подсказок строки запроса колонки выходит за нижний край карточки колонки, и нижняя рамка карточки рисуется поверх него: строку подсказки перечёркивает полоса.

  Причина: рамка карточки нарисована через overlay, то есть поверх содержимого карточки, включая выпадающий список.

  Что сделать: рисовать рамку в фоне карточки, чтобы список подсказок был над ней.

  Проверка: русский интерфейс, редактор доски, в «Запрос колонки» ввести точку — рамка карточки не должна проходить поперёк списка, в том числе по выделенной строке.
