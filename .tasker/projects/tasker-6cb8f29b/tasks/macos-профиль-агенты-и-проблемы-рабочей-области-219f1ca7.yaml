description: |-
  Эпик TSK-178.

  Что сделать
  - Профиль: имя, почта, смена пароля (Server).
  - Агенты: создание, переименование, удаление. Local — состояние MCP-демона для папки и команда claude mcp add для копирования; Server — токены агента (срок, префикс, последний вход, отзыв), полный токен показывается один раз с кнопкой копирования.
  - Проблемы рабочей области: значок со счётчиком, список (нечитаемые файлы, конфликты номеров, вторая папка проекта, циклы), действия «Разрешить конфликты номеров» и «Очистить недействительные ссылки».

  Готово, когда
  Агента можно завести и подключить к Claude из приложения, проблемы рабочей области видны и исправляются.
