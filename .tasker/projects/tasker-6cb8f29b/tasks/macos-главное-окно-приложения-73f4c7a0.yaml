description: |-
  Шаг эпика TSK-178 после Xcode-проекта: приложение открывает главное окно.

  Что сделать
  - Главное окно с заглушкой содержимого (название Tasker и версия), размер и положение запоминаются между запусками, минимальный размер окна.
  - Стандартное системное меню (О программе, Закрыть, Выход, Окно), пункт «О программе» с версией.
  - Один экземпляр приложения: повторный запуск выводит уже открытое окно.
  - Иконка-заглушка приложения в asset catalog.
  - Тёмная и светлая тема следуют системе.

  Готово, когда
  Приложение запускается в окно, переживает закрытие/открытие окна и выход по ⌘Q, второй экземпляр не создаётся.
