description: |-
  Проблема
  Тест SettingsTests.Watch_ignores_rewrites_with_the_same_content_and_broken_files упал в CI в задании dotnet test (macos-latest): на строке SettingsTests.cs:167 ожидалось 0 вызовов наблюдателя, получено 2. То есть перезапись settings.json тем же содержимым вызвала обработчик.

  Что известно
  - Замечен один раз: запуск 41976912046, коммит 98a7cc1f в PR #60 (TSK-214). При повторном запуске того же коммита тест не упал.
  - В трёх последних запусках main (f958a848, ab1a53d0, ee437aba) этого падения нет. Код настроек и сам тест в TSK-214 не менялись.
  - Тест начинает следить сразу после store.SetPort(6000). Возможная причина: файловый наблюдатель macOS с задержкой доставляет событие той записи, и содержимое считается новым. Это предположение, оно не проверено.

  Что сделать
  1. Воспроизвести падение, например повторяя тест в цикле на macOS.
  2. Выяснить, откуда берутся вызовы: из теста (подписка раньше, чем дошло событие прошлой записи) или из SettingsStore.Watch. Если это ошибка Watch, исправить её: перезапись тем же содержимым не должна вызывать обработчик.

  Готово, когда причина установлена и тест стабильно проходит на macOS при многократном запуске.
