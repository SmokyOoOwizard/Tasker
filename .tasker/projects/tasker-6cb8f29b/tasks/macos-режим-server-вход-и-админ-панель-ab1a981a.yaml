description: |-
  Эпик TSK-178. Приложение как клиент удалённого Tasker.Server.

  Что сделать
  - Добавление сервера по адресу рядом с локальными рабочими областями; вход (имя или почта + пароль), регистрация первого админа, выход.
  - Токены в Keychain, обновление токена, повторный вход при истечении.
  - Админ-панель (кнопка под «Настройками» для админа): пользователи, создание, права админа (нельзя снять с последнего и с себя), агенты всех пользователей.
  - Участники проекта: добавить человека или агента, убрать (кроме последнего человека) (страница «Участники проекта» уже сделана).

  Готово, когда
  С приложения можно войти на сервер и работать там так же, как с локальной папкой; админ управляет пользователями.
