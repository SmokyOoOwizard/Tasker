description: |-
  Эпик TSK-178.

  Что происходит
  После открытия поиска, например по ⌘K, фокус не в поле поиска. Чтобы начать вводить запрос, сначала приходится ставить в него курсор.

  Как должно быть
  Сразу после открытия палитры фокус стоит в поле поиска, и можно сразу печатать.

  Что проверить
  Все способы открытия: ⌘K, пункт меню «Вид → Палитра команд», клик по поиску в сайдбаре. Повторное открытие после закрытия по Esc.

  Готово, когда
  При любом способе открытия ввод сразу попадает в поле поиска.
