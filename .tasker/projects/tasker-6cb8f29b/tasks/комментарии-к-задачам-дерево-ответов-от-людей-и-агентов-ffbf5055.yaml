description: |-
  Зачем
  К задаче нельзя оставить комментарий: обсуждение и заметки по ходу работы приходится дописывать в описание. Нужны полноценные комментарии с деревом ответов, которые могут оставлять и пользователи, и агенты.

  Что должно быть
  - На задаче можно оставить комментарий.
  - На любой комментарий можно ответить, на ответ тоже: вложенность не ограничена, комментарии показываются деревом.
  - Автор комментария — пользователь или агент, и это видно у комментария вместе со временем.
  - Правка и удаление своего комментария.

  Сначала макет
  Работа начинается с макета, код пишется после его согласования с пользователем. Макет показывает на карточке задачи (полной и в боковой панели), в обеих темах и с цветами из `design/tokens.json`:
  - дерево с несколькими уровнями и длинную ветку: как выглядит глубокая вложенность и что происходит, когда кончается ширина;
  - поле нового комментария и ответ на конкретный комментарий;
  - отличие агента от человека;
  - свёрнутую ветку, правку, удалённый комментарий с ответами, пустое состояние.

  Решить при проектировании
  - Хранение в папке `.tasker`: файлы должны хорошо сливаться в git, параллельные комментарии разных веток не должны давать конфликт. Вероятно, отдельный файл на комментарий, а не список внутри файла задачи.
  - Что происходит с ответами при удалении родительского комментария. Предложение: ветка остаётся, а на месте удалённого показывается пометка.
  - Что происходит с комментариями при удалении задачи.
  - Автор-человек в локальном режиме: сейчас он не является пользователем области (TSK-14). Решить, делается ли сначала TSK-14 или автор пока хранится иначе. Связано с TSK-11.
  - Формат текста: Markdown, как в описании задачи, или простой текст.

  Где
  - dotnet/src/Tasker.Core/ — сущность и сервис, проверки прав и версий
  - dotnet/src/Tasker.Storage.Files/Storages/ и dotnet/src/Tasker.Storage.Db/ — хранение в папке и в БД сервера, миграция формата при необходимости
  - dotnet/src/Tasker.Web/ — REST для изменений, чтение через GraphQL, живые события
  - dotnet/src/Tasker.Mcp/Tools/ — инструменты MCP, агент становится автором автоматически
  - dotnet/src/Tasker.Cli/Commands/ — команды консоли, автодополнение, `tasker manual`
  - macos/Sources/Tasker/TaskDetail/ — показ и ввод в карточке задачи
  - docs/wiki/ — описание

  Веб-интерфейс в задачу не входит.

  Готово, когда
  - Макет согласован, реализация ему соответствует.
  - В приложении macOS можно оставить комментарий, ответить на ответ на нескольких уровнях, изменить и удалить свой комментарий; дерево обновляется без перезагрузки экрана.
  - Агент через MCP читает дерево и отвечает на конкретный комментарий, в приложении он показан автором.
  - Консоль показывает дерево и добавляет комментарий.
  - Комментарии, созданные в двух ветках git, сливаются без конфликта.
  - Всё покрыто тестами для папки и для БД сервера.
