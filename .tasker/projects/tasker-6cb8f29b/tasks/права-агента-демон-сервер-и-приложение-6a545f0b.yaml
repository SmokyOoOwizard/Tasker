description: |-
  Эпик TSK-178. Заменяет TSK-19 (права агентов внутри проекта на сервере), она отменена.

  Зачем
  Агент через MCP может делать всё: создавать, менять и удалять задачи, статусы, доски, поля и настройки проекта. В локальном режиме это агент области через демон, на сервере — агент-участник проекта, которому запрещено только управлять участниками, пользователями и агентами. Ограничить агента нельзя. Нужны настройки агента, в которых задаются его права.

  Границы
  Демон (локальный режим), сервер и приложение macOS в обоих режимах. Веб-интерфейс не входит.

  Что должно быть
  - У агента в приложении есть раздел настроек с правами, рядом с созданием, переименованием и удалением агентов (TSK-200 для локального режима, TSK-239 для режима Server).
  - Права проверяются в сервисах ядра, поэтому действуют и в демоне, и на сервере, через MCP и REST. Отказ возвращается понятной ошибкой с кодом (на сервере 403), чтобы агент мог понять, что ему нельзя.
  - Действия людей права агентов не ограничивают.

  Решить перед началом
  - Какие права нужны. Минимум из TSK-19: только чтение, только задачи (задачи, связи, серии, поля задач, комментарии, без настройки проекта) и полный доступ, как сейчас. Возможно, отдельные флаги, например «можно удалять».
  - На что выдаются права: на агента целиком или на проект. На сервере в TSK-19 предлагалось задавать их при добавлении агента в проект и менять потом.
  - Где хранятся права в локальном режиме: в файлах агента в `.tasker` (общие для всех, кто работает с репозиторием) или в настройках демона на машине.
  - Какие права у существующих агентов после обновления. Предложение: полный доступ, как сейчас.
  - Видит ли агент свои права, например в `whoami`, чтобы заранее знать, что ему нельзя.

  Где
  - dotnet/src/Tasker.Core/Agents/AgentService.cs — агенты и токены
  - dotnet/src/Tasker.Core/Projects/MemberProjectAccess.cs, ProjectMemberService.cs — доступ к проекту и участники на сервере
  - dotnet/src/Tasker.Core/Users/UserService.cs (`GetCurrentHuman`) — сейчас единственная проверка «действие только для человека»
  - dotnet/src/Tasker.Mcp/LocalMcpAgent.cs, dotnet/src/Tasker.Mcp/Tools/ — агент в локальном режиме и инструменты MCP
  - dotnet/src/Tasker.Daemon.Host/, dotnet/src/Tasker.Server/ — демон и сервер
  - dotnet/src/Tasker.Web/TaskerApi.cs, dotnet/src/Tasker.Web/Graph/ — REST и GraphQL для агентов и участников
  - macos/Sources/Tasker/ — экраны агентов и участников проекта
  - docs/wiki/MCP-и-агенты.md

  Как повторить (сервер, из TSK-19)
  Создать агента и токен, добавить агента в проект, через MCP с токеном агента вызвать `delete_status`, `delete_board` или `delete_task_type`: удаление проходит, ограничить агента негде.

  Готово, когда
  Агенту можно задать права в приложении в обоих режимах. Агент с ограниченными правами получает отказ на запрещённые действия через MCP и REST и в демоне, и на сервере, а разрешённые действия работают. Агент «только чтение» получает отказ на любые изменения, агент «только задачи» меняет задачи, но не статусы и доски. Существующие агенты работают как раньше. Есть тесты на каждый уровень прав для папки и для БД сервера.
