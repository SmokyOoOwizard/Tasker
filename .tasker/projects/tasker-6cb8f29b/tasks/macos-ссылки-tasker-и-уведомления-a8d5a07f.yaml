description: |-
  Эпик TSK-178.

  Что сделать
  - Схема ссылок tasker://<рабочая область>/TSK-123 (и для досок, серий): открытие нужной задачи в приложении, копирование ссылки из карточки.
  - Системные уведомления о важных событиях (задачу назначили / изменили другие) с переходом к задаче; настройка в приложении.

  Готово, когда
  Ссылка из браузера или терминала открывает задачу в приложении, уведомления приходят и ведут к задаче.
