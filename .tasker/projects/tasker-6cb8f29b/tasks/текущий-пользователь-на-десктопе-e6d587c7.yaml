description: |-
  Проблема
  На десктопе и в консоли нет текущего пользователя-сущности. Вызовы MCP через демон идут от имени агента области (локальный `agent` или выбранный `X-Tasker-Agent`), а действия интерфейса десктопа (REST) и консоли — ни от чьего имени: `ICurrentUser.Id` пуст, входа нет. Человек известен только по имени из настроек (`tasker whoami`) и используется лишь как держатель блокировок правки; пользователем области (`users/<id>.yaml`) он не является, поэтому авторство и назначение на него не записать.

  Где
  - src/Tasker.Web/Auth/HttpCurrentUser.cs — пользователь запроса только из claim `sub` (на десктопе пусто)
  - src/Tasker.Core/Users/ICurrentUser.cs, src/Tasker.Core/Users/UserService.cs
  - src/Tasker.Core/Locks/EditLockService.cs (`CurrentUserEditor`), src/Tasker.Global/SettingsLocalEditor.cs — имя «локального человека» из настроек
  - rust/crates/tasker-services/src/users.rs, rust/crates/tasker-cli/src/commands/user.rs — пользователи области в консоли
  - rust/crates/tasker-mcp/src/workspaces.rs — локальный агент области
  - frontend/src/pages/ProfilePage.tsx — `LocalProfile`

  Как повторить
  - `tasker whoami` показывает имя из настроек, но `tasker user list` в новой папке его не содержит.
  - На десктопе создать задачу из интерфейса: запрос идёт без пользователя; в MCP `whoami` от демона отвечает агентом `agent`, а не человеком.

  Что нужно сделать
  - Ввести текущего пользователя для действий интерфейса десктопа и консоли: «локальный человек» — пользователь области (вид Human), сопоставленный с именем из настроек (`tasker whoami`); создаётся при первом обращении к области, переименовывается вместе с именем.
  - Десктоп (REST) и консоль передают его как текущего пользователя в сервисы (.NET и Rust одинаково); MCP по-прежнему работает от имени агента.
  - Блокировки правки и показ «Правит …» используют того же пользователя.
  - Проверка: в новой папке после действия в интерфейсе или консоли в `tasker user list` есть локальный человек с именем из `tasker whoami`; сервисы получают его id как текущего пользователя (тест .NET и Rust).
