description: |-
  Проблема
  Десктоп не узнаёт об изменениях рабочей области в SQLite, сделанных другим процессом (демоном tasker-mcpd или консолью `tasker --sqlite`): событие `unknown` публикуется только после изменяющих запросов самого десктопа, а за файлом БД никто не следит. Вкладка показывает старые данные, пока её не перечитать. Для папок это работает через индекс и наблюдатель за файлами.

  Где
  - src/Tasker.Web/Workspaces/WorkspaceEvents.cs — события SSE `/w/{key}/api/events`, `UseSqliteChangeEvents`
  - src/Tasker.Web/Workspaces/WorkspaceRegistry.cs — открытие области SQLite
  - src/Tasker.Storage.Db/ — хранилище SQLite
  - src/Tasker.Storage.Files/Index/WorkspaceWatcher.cs — как это сделано для папок

  Как повторить
  - Открыть в десктопе файл SQLite (`--sqlite=<файл>`) со списком задач проекта
  - В терминале: `tasker --sqlite <файл> task update <задача> --title новое`
  - Список задач в десктопе не меняется, пока вкладку не перезагрузить

  Что нужно сделать
  - Отслеживать изменения файла SQLite из других процессов (например, опрос `PRAGMA data_version` или счётчик изменений в БД) и публиковать событие в WorkspaceEvents
  - Не порождать лишних событий от собственных изменений десктопа и при отсутствии изменений
  - Проверка: тест — область SQLite открыта в веб-слое, изменение консолью `tasker --sqlite` приводит к событию в потоке `/api/events`; вручную — список в десктопе обновляется сам
