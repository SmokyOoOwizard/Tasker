description: |-
  Что происходит
  В CI (.NET tests, windows-latest) на main и на всех PR стабильно падают 4 теста: DaemonUpgradeTests.A_call_in_progress_is_finished_by_the_old_process_and_both_are_shown_in_the_status, A_server_started_as_one_process_is_restarted_by_upgrade_and_is_seamless_afterwards, A_worker_that_crashes_is_started_again_by_the_supervisor и ParallelWorkTests.The_daemon_replaced_on_the_fly_under_load_loses_no_call_and_no_write. На macOS и Linux они проходят.

  Симптом: после замены процесса демона (upgrade, перезапуск упавшего worker) новый процесс держит блокировку и порт, но не отвечает по HTTP — tasker mcp status ждёт 10 секунд и падает: «tasker mcp status has no daemon: lock held True, pid …, port …: TaskCanceledException … HttpClient.Timeout of 10 seconds». Сценарий upgrade стенда тоже падает («upgrade — crashed»).

  Пример прогона: 41755764911 (main, 0cac9fb).

  Что сделать
  Найти причину (передача слушающего сокета между процессами на Windows, ListenerHandoff / Supervisor в Tasker.Daemon.Host), исправить, добиться стабильно зелёного Windows-прогона.
