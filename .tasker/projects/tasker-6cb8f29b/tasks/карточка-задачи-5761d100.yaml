description: |-
  Проблема
  В интерфейсе нельзя открыть задачу: на странице задач есть только создание (название и тип) и смена статуса в строке списка. Описание, смена типа, удаление и прочее доступны только через API, консоль и MCP.

  Где
  - frontend/src/pages/TasksPage.tsx — список задач
  - frontend/src/App.tsx — маршруты проекта
  - src/Tasker.Web/TaskerApi.cs — `GET/PATCH/DELETE /projects/{id}/tasks/{taskId}` (`UpdateTask`: title, description, typeId, statusId, fields)
  - frontend/src/hooks/useEditLock.ts — блокировка правки

  Как повторить
  - Открыть проект в интерфейсе (сервер или десктоп), раздел «Задачи»: строка задачи не открывается, описания и удаления нет.

  Что нужно сделать
  - Карточка задачи (отдельный маршрут, чтобы открывать по адресу): название, описание, тип, статус.
  - Правка названия и описания, смена типа (с выбором статуса из набора нового типа), удаление с подтверждением.
  - Блокировка правки и конфликт версии — как на других страницах.
  - Проверка: открыть задачу из списка, изменить описание и тип, удалить — изменения видны в `tasker task get` и в списке.
