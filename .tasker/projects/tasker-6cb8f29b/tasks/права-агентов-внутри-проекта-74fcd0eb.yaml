description: |-
  Проблема
  На сервере агент-участник проекта может всё, что участник-человек, кроме управления участниками, пользователями и агентами: в том числе удалять статусы, наборы статусов, типы задач, поля, доски и задачи. Ограничить агента (только чтение, только задачи) нельзя.

  Где
  - src/Tasker.Core/Projects/MemberProjectAccess.cs, src/Tasker.Core/Projects/ProjectMemberService.cs — доступ к проекту и участники
  - src/Tasker.Core/Users/UserService.cs (`GetCurrentHuman`) — единственная сейчас проверка «действие только для человека»
  - src/Tasker.Core/Agents/AgentService.cs — агенты и их токены (`CreateAgent`, `CreateAgentToken` без прав)
  - src/Tasker.Mcp/Tools/*.cs — инструменты MCP сервера (create/update/delete для всех сущностей)
  - frontend/src/pages/profile/AgentsSection.tsx, frontend/src/pages/settings/MembersSection.tsx — агенты и участники в интерфейсе

  Как повторить
  - Сервер: создать агента и токен, добавить агента в проект.
  - Через MCP с токеном агента вызвать `delete_status`, `delete_board` или `delete_task_type` — удаление проходит; выдать агенту только чтение негде.

  Что нужно сделать
  - Уровни прав агента в проекте: как минимум «только чтение» и «только задачи» (задачи, связи, серии, поля задач — без настройки проекта), плюс текущий полный доступ.
  - Права задаются при добавлении агента в проект и меняются потом (REST участников и интерфейс настроек проекта).
  - Проверка прав в сервисах ядра, чтобы она действовала и в REST, и в MCP; отказ — 403 с понятным текстом.
  - Проверка: тесты — агент «только чтение» получает отказ на create/update/delete, агент «только задачи» меняет задачи, но не статусы и доски; полный агент работает как сейчас.
