- seriesId: d7ef1523-7d8d-46f8-b3c1-996e24fbd2c1
  number: 34
description: |-
  Проблема
  Для рабочей области в SQLite вкладки десктопа узнают об изменениях только из собственного HTTP-хоста: после каждого успешного изменяющего запроса (POST/PATCH/DELETE, кроме `/lock`) приходит общее событие `unknown`, и интерфейс перечитывает всё. Изменения, сделанные в том же файле БД снаружи — консолью `tasker --sqlite`, демоном `tasker-mcpd`, другим процессом десктопа или сервером, — вкладки не видят.

  Где
  - src/Tasker.Web/Workspaces/WorkspaceEvents.cs — `WorkspaceEvents`, `UseSqliteChangeEvents`
  - src/Tasker.Web/TaskerWebExtensions.cs — подключение `UseSqliteChangeEvents`
  - frontend/src — подписка на `GET /w/{key}/api/events`

  Как повторить
  - Открыть в десктопе файл SQLite (`--sqlite=<файл>`), открыть список задач.
  - В терминале: `tasker --sqlite <файл> task create "Новая"` — вкладка новую задачу не показывает, пока её не обновить.
  - Изменить задачу из интерфейса: в потоке `/api/events` приходит `unknown`, без сущности и id.

  Что нужно сделать
  - Замечать изменения файла SQLite, сделанные другими процессами (например, опрос `PRAGMA data_version` или слежение за файлом БД и её WAL), и отправлять вкладкам событие.
  - Для своих изменений отправлять событие с сущностью, проектом и id (как у папки), а не `unknown` на каждый запрос.
  - Проверка: задача, созданная консолью или через MCP в том же файле SQLite, появляется в открытой вкладке без ручного обновления; правка из интерфейса даёт событие с сущностью и id.
