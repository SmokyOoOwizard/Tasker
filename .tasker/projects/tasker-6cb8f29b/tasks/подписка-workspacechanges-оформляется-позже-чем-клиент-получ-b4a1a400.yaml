description: |-
  Проблема
  После TSK-208 тест EditLockInterfaceTests.Sqlite_lock_requests_do_not_trigger_the_catch_all_unknown_event регулярно падает в CI (Windows, на task/tsk-208 и task/tsk-184 ещё и Ubuntu) с OperationCanceledException: тест 15 секунд ждёт событие unknown и не дожидается.

  Причина
  1. Сервер пишет «: connected» до того, как начинается чтение потока событий, а подписчик WorkspaceEvents.Watch (итератор) регистрируется только при первом MoveNext. События, опубликованные между «connected» и регистрацией, теряются.
  2. Тест создаёт задачу до подписки, а её событие unknown выходит через 150 мс склейки: на медленном CI подписка успевает позже.

  Что сделать
  Регистрировать подписчика сразу при выполнении подписки (до ответа «connected»), в тесте подписываться до создания задачи.
