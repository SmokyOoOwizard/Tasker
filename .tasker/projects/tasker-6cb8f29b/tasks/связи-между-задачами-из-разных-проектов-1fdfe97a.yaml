description: |-
  Проблема
  Связать задачи из разных проектов нельзя: связь хранится в файле задачи-источника, типы связей у каждого проекта свои, а цель ищется только в проекте источника. Для межпроектных связей не решено, где хранить связь и её тип, как показывать её на обеих сторонах и как учитывать права на сервере (участник одного проекта не видит другой).

  Где
  - rust/crates/tasker-services/src/links.rs, rust/crates/tasker-services/src/link_type.rs, rust/crates/tasker-services/src/link_cycles.rs
  - rust/crates/tasker-core/src/model/task.rs, rust/crates/tasker-core/src/model/link.rs
  - src/Tasker.Core/Links/ — связи в .NET (десктоп, сервер)
  - src/Tasker.Web/TaskerApi.cs, rust/crates/tasker-mcp/src/tools/link.rs, src/Tasker.Mcp/Tools/LinkTools.cs

  Как повторить
  - В одной области создать проекты A и B с задачами AA-1 и BB-1
  - `tasker task link AA-1 blocks BB-1 -p A` → «Error: No task 'BB-1'»; то же по полному id задачи из B

  Что нужно сделать
  - Решить хранение связи и её типа между проектами и показ на обеих сторонах (исходящая и входящая)
  - Права на сервере: связь с задачей проекта, где пользователь не участник, не раскрывает её данных
  - Поддержка в ядре и хранилищах (папка, SQLite), REST, MCP, консоли; `tasker cleanup` и проверка циклов с учётом межпроектных связей
  - Проверка: тесты на обоих хранилищах — связь AA-1 → BB-1 создаётся, видна в `tasker task links` у обеих задач, удаляется; после удаления проекта B связь убирается `cleanup`
