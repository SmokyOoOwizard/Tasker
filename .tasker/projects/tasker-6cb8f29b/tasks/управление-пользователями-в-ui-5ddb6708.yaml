description: |-
  Проблема
  Администратор сервера не может управлять пользователями из интерфейса: в настройках пользователя есть только свой профиль, пароль и агенты. REST для этого есть (`/users`: список, создание, правка с `isAdmin`, удаление, смена пароля другого пользователя админом), но страницы нет.

  Где
  - frontend/src/pages/ProfilePage.tsx — настройки пользователя (вкладки «Профиль» и «Агенты»)
  - frontend/src/App.tsx — маршруты, frontend/src/components/Sidebar.tsx — навигация
  - src/Tasker.Web/TaskerApi.cs (`MapUsers`), src/Tasker.Core/Users/UserService.cs — API и правила (права админа, последний админ, пароль)

  Как повторить
  - `dotnet run --project src/Tasker.Server`, войти администратором.
  - Открыть «Настройки пользователя» — нет списка пользователей, создания, сброса пароля и переключения прав админа.

  Что нужно сделать
  - Раздел «Пользователи» для администратора (на сервере; на десктопе не показывать): список людей со страницами.
  - Создание пользователя (имя, почта, пароль, права админа).
  - Сброс пароля пользователю (новый пароль без текущего), выдача и снятие прав админа, удаление — с ошибками сервера (последний админ, конфликт версии) в интерфейсе.
  - Не-админ раздела не видит.
  - Проверка: администратором создать пользователя, войти им, сбросить ему пароль и выдать права админа из интерфейса; обычный пользователь раздела не видит.
