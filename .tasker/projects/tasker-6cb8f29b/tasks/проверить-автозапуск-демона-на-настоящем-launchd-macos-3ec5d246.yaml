description: |-
  Проблема
  Автозапуск демона через launchd на macOS проверяется только тестами с подменой: команды `launchctl` и содержимое plist сравниваются с эталоном, настоящий launchd не участвует. Что демон стартует при входе в систему (RunAtLoad), перезапускается после падения (KeepAlive) и не поднимается сам после `tasker mcp stop`, на настоящей службе не проверено ни тестом, ни скриптом.

  Где
  - rust/crates/tasker-daemon/src/autostart/launchd.rs — plist `com.tasker.mcp` и вызовы `launchctl bootstrap/bootout/kickstart/print`
  - rust/crates/tasker-daemon/src/autostart/mod.rs — запуск системных команд, переменные `TASKER_SERVICE_DIR`, `TASKER_SERVICE_LABEL`
  - rust/crates/tasker-daemon/tests/golden_autostart.rs, tests/Tasker.Tests/AutostartTests.cs — проверки с подменой
  - scripts/test-linux-systemd.sh — такая же проверка для настоящего systemd (образец)

  Как повторить
  - `grep -rn launchctl rust/crates/tasker-daemon` — все вызовы идут через подменный runner в тестах; `cd rust && cargo test -p tasker-daemon` не обращается к launchd
  - В scripts/ нет скрипта проверки на настоящем launchd

  Что нужно сделать
  - Скрипт проверки на настоящем launchd (по образцу scripts/test-linux-systemd.sh) с изолированной меткой и каталогом службы (`TASKER_SERVICE_LABEL`, `TASKER_SERVICE_DIR`, временный `TASKER_HOME`, свой порт), не задевающий рабочую службу пользователя
  - Чек-лист: `tasker mcp autostart enable` — демон запущен, `autostart status` — enabled; `kill -9` супервизора — launchd поднимает демон снова; `tasker mcp stop` — демон не поднимается сам; `start`/`restart` через launchd; `tasker mcp upgrade` под службой; `autostart disable` — plist удалён, служба выгружена; повторные enable/disable без ошибок
  - Ручная проверка запуска при входе: выйти из сеанса macOS и войти — демон работает без ручного запуска
  - Проверка: скрипт печатает ok по каждому пункту и завершается с кодом 0 на macOS, после него `launchctl print gui/$UID/<тестовая метка>` не находит службу
