description: |-
  Эпик TSK-178, первый экран MVP.

  Что сделать
  - Список задач на NSTableView / NSOutlineView (SwiftUI List не тянет тысячи строк): колонки ключ, заголовок, тип, статус, поля; ширина и порядок колонок запоминаются.
  - Вид деревом (дети под эпиками, сворачивание, повтор при нескольких родителях с пометкой (+)) и плоский вид.
  - Сортировка по нескольким ключам, смена статуса прямо в строке, счётчик «Найдено N», догрузка страниц при прокрутке.
  - Выделение и клавиатура: стрелки, Enter открывает задачу, пробел — peek-панель (когда появится).
  - Замер скорости на 10 000 задач: прокрутка и открытие без подвисаний.

  Готово, когда
  Список реального проекта Tasker открывается и листается плавно, дерево и сортировка работают как в main-design.
