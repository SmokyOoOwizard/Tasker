description: |-
  Проблема
  MCP сервера не ограничивает частоту вызовов: агент с действующим токеном может слать запросы к `/mcp` без предела. Зациклившийся агент нагружает сервер и засыпает проект изменениями.

  Где
  - src/Tasker.Mcp/McpRegistration.cs — регистрация `/mcp` и фильтры вызова инструментов
  - src/Tasker.Mcp/AgentTokenAuthentication.cs — вход агента по токену (id агента в claim `sub`)
  - src/Tasker.Server/Program.cs, src/Tasker.Web/TaskerWebApp.cs — конвейер запросов сервера

  Как повторить
  - Запустить сервер: `dotnet run --project src/Tasker.Server`, войти, создать агента и токен (Настройки пользователя → Агенты), добавить агента в проект.
  - В цикле слать на `http://localhost:5156/mcp` вызов `tools/call` (например `list_tasks`) с `Authorization: Bearer tsk_…` — все запросы проходят, ответа 429 нет.

  Что нужно сделать
  - Ограничение частоты вызовов `/mcp` на агента (по id агента из токена): лимит запросов за окно времени, сверх лимита — 429 с `Retry-After`.
  - Лимит задаётся в настройках сервера, значение по умолчанию не мешает обычной работе агента.
  - Проверка: тест — серия вызовов одного агента сверх лимита получает 429, другой агент в то же время работает; после окна вызовы снова проходят.
