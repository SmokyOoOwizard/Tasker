description: |-
  Проблема
  О файлах `.tasker` старого формата никто сам не сообщает: `tasker sync`, git-хуки и демон молчат, хотя `tasker migrate --dry-run` такие файлы находит. При открытии папки с файлами более нового формата понятного предупреждения тоже нет (они видны только в списке проблем области).

  Где
  - rust/crates/tasker-cli/src/sync.rs — `tasker sync` (отчёт о сериях и связях)
  - rust/crates/tasker-cli/src/commands/hooks.rs — хуки запускают `tasker sync --quiet`
  - rust/crates/tasker-mcpd/src/registry.rs, rust/crates/tasker-mcpd/src/sync.rs — открытие области и сверка в демоне
  - rust/crates/tasker-files/src/format.rs, rust/crates/tasker-files/src/migration.rs — версия формата (`CURRENT`) и миграция
  - src/Tasker.Desktop/WindowManager.cs — открытие папки в десктопе

  Как повторить
  - В рабочей папке заменить в файле задачи `formatVersion: 10` на `formatVersion: 8`
  - `tasker sync` → только «Synced … (via direct)», без предупреждения; `tasker migrate --dry-run` → «would migrate … (format 8 -> 10)»

  Что нужно сделать
  - `tasker sync` (в том числе с `--quiet` из хуков) и `--json`: строка «N файлов в старом формате: запустите tasker migrate»
  - Демон: та же строка в журнале при открытии и сверке области
  - Файлы более нового формата: понятное предупреждение при открытии папки (консоль, демон, десктоп) — обновить Tasker
  - Проверка: тесты — после понижения formatVersion в файле `tasker sync` и `sync --quiet` печатают предупреждение, после `tasker migrate` его нет; журнал демона содержит строку
