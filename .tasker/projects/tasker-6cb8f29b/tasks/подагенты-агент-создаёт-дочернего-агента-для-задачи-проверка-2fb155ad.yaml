description: |-
  Проблема
  Агент (пользователь kind=agent, работающий через MCP) не может создать дочернего агента для отдельной задачи. Нет ни подтверждения «жив» (heartbeat), ни автоматического удаления пропавших временных агентов, ни поля «исполнитель» у задачи.

  Где
  - rust/crates/tasker-core/src/model/user.rs, rust/crates/tasker-services/src/users.rs — пользователи и агенты (консоль, демон)
  - src/Tasker.Core/Agents/, src/Tasker.Core/Users/ — агенты на сервере и в десктопе
  - rust/crates/tasker-mcpd/src/registry.rs — агент вызова по заголовку `X-Tasker-Agent`
  - rust/crates/tasker-mcp/src/tools/, src/Tasker.Mcp/Tools/ — инструменты MCP
  - rust/crates/tasker-services/src/locks.rs, src/Tasker.Core/Locks/ — блокировки правки

  Как повторить
  - `tasker agent --help` — только create, list, get, update, delete; родителя и последнего сигнала нет
  - В списке инструментов MCP (rust/crates/tasker-mcp/src/tools.json) нет создания подагента и heartbeat

  Что нужно сделать
  - Перед реализацией согласовать открытые вопросы:
    - модель: тот же пользователь kind=agent с родителем и признаком временного или отдельная сущность; владелец, права (наследование от родителя, ограничение проектами и областью родителя), глубина вложенности, лимит числа
    - подключение: как подагент получает идентификацию (заголовок `X-Tasker-Agent`, токен на сервере), выдаёт ли её родитель
    - автоудаление: что с исполнителем задач, блокировками правки, авторством правок, уведомление родителя и людей, возможность восстановить
    - heartbeat: отдельный инструмент или любой вызов; период (~3 мин) и срок (~10 мин) настраиваемые; долгие операции; сон машины и пауза демона не должны удалять всех подагентов
    - исполнитель задачи: поле задачи (поле типа «пользователь» или отдельное), как подагент берёт задачу и сообщает результат
    - хранение: в файловой области временных агентов не писать в `.tasker` под git (память демона или нетрекаемый файл)
  - Реализация по согласованному: ядро, оба хранилища, MCP (создать подагента, heartbeat, список, удалить), REST, консоль (`agent list` с родителем и последним сигналом), интерфейс; фоновая проверка в демоне и на сервере
  - Проверка: тест — подагент без heartbeat дольше срока удаляется, с heartbeat живёт; родитель видит своих подагентов
