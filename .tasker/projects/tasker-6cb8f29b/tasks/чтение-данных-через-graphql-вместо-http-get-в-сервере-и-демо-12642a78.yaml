description: |-
  Проблема
  Сейчас все чтения идут через REST: отдельный HTTP GET на каждую сущность и каждый список (TaskerApi.cs, около 40 маршрутов MapGet). Нужно отказаться от HTTP GET для чтения данных в пользу GraphQL. Запросы на изменение (POST, PUT, PATCH, DELETE) остаются как есть.

  Где
  - Сервер (Tasker.Server, режим Server) и демон (режим Local) — оба выступают серверами и поднимают этот API через TaskerWebExtensions.MapTaskerWeb; переводить нужно в обоих.
  - dotnet/src/Tasker.Web/TaskerApi.cs: GET-маршруты /api/... — проекты и статистика, статусы, наборы статусов, типы задач, поля, перечисления, типы связей, задачи (список с фильтрами field/sort, /tasks/resolve, /tasks/{id}, /tasks/{id}/links), серии и /series/health, доски и задачи колонки, блокировки, пользователи, /auth/me и /auth/registration, агенты и их токены, участники проекта, /workspace/problems, /workspace/mcp.
  - dotnet/src/Tasker.Web/Workspaces/WorkspaceEvents.cs: GET /api/events (SSE).
  - Демон (Tasker.Daemon.Host/McpDaemon.cs): GET /daemon/status. Его вызывает консоль через Tasker.Daemon/DaemonClient.cs — этот вызов тоже перевести.
  - Клиенты API: frontend/src/api.ts, auth.ts, pages/LoginPage.tsx; приложение macOS, если читает REST.

  Что нужно сделать
  - Добавить GraphQL-эндпоинт (например /api/graphql) в сервер и в демон, схему чтения по всем сущностям выше: те же фильтры, сортировка, пагинация (offset/limit, totalCount), descriptionLength, права доступа и аутентификация (в режиме Server — та же авторизация, в Local — только loopback и рабочая область по префиксу /w/{key}).
  - Поток событий /events (SSE, WorkspaceEvents) заменить GraphQL-подпиской (subscription) с теми же событиями; SSE-маршрут удалить.
  - Ошибки — в формате GraphQL, коды соответствуют нынешним (not found, forbidden, invalid).
  - Генерировать файл схемы GraphQL (SDL, например schema.graphql) при сборке или отдельной командой и хранить его в репозитории. По этому файлу потом будут генерироваться клиенты (фронтенд, приложение macOS). В CI — проверка, что закоммиченная схема совпадает со сгенерированной из кода.
  - Перевести фронтенд, приложение macOS, вызов статуса демона из консоли и тесты на GraphQL-запросы.
  - Удалить GET-маршруты данных из TaskerApi и демона.
  - Выбрать библиотеку с учётом NativeAOT (демон собирается AOT) — проверить, что сборка и размер бинарника остаются приемлемыми.

  Не затрагивается
  - /health, /api/health и /ready остаются на GET (пробы живости для оркестраторов и лаунчера).
  - MCP (/mcp) и выдача статики/SPA.

  Готово, когда
  - В сервере и демоне не осталось HTTP GET, кроме /health, /api/health, /ready и статики; все чтения идут через GraphQL, события — через подписку.
  - Файл схемы генерируется из кода, лежит в репозитории, и CI ловит его рассинхрон с кодом.
  - POST/PUT/PATCH/DELETE работают как прежде.
  - Фронтенд, приложение macOS и консоль работают через GraphQL; тесты проходят на macOS, Linux и Windows.
