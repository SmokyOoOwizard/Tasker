description: |-
  Эпик TSK-178.

  Проблема
  Настройки демона MCP (области, порт, запуск, остановка, автозапуск) меняются только командами `tasker mcp …`. Приложение macOS показывает состояние демона значком в сайдбаре (порт только в подсказке) и экраны ошибок, когда демон не запущен или его версия не совпадает. Отдельного раздела управления демоном нет.

  Где
  - macos/Sources/Tasker/Daemon/DaemonStatusViews.swift — значок состояния и экраны ошибок
  - macos/Sources/Tasker/Daemon/DaemonConnection.swift — опрос, запуск и обновление демона
  - macos/Sources/Tasker/Daemon/DaemonLaunchAgent.swift — служба launchd
  - macos/Sources/Tasker/Install/AppIntegrationController.swift — установка консоли и службы приложением
  - dotnet/src/Tasker.Cli/Commands/McpCommands.cs — команды `tasker mcp`
  - dotnet/src/Tasker.Global/SettingsStore.cs — settings.json (порт, области)

  Как повторить
  - Открыть приложение: виден только значок состояния в сайдбаре, кнопок управления нет.
  - Порт, список областей, остановка и автозапуск доступны только через `tasker mcp port`, `tasker mcp workspace`, `tasker mcp stop`, `tasker mcp autostart`.

  Что нужно сделать
  - Раздел приложения: состояние демона (работает ли, порт, версия и сборка), список областей с их состоянием, порт.
  - Действия: запуск, остановка, перезапуск, включение и выключение автозапуска, добавление и удаление области, смена порта с применением через перезапуск.
  - Действия выполняются через консоль `tasker` внутри приложения и демон, без второй реализации автозапуска в приложении.
  - Решить, что приложение показывает после остановки демона пользователем: сейчас без демона основные экраны недоступны, и само приложение умеет его запускать. Остановка не должна тут же отменяться автоматическим запуском.
  - Команда `claude mcp add` остаётся в TSK-200, токены агентов — в TSK-239.
  - В режиме Server раздел не показывается.

  Готово, когда
  Из приложения можно остановить и запустить демон, сменить порт, включить автозапуск, добавить и удалить область, а `tasker mcp status` и `tasker mcp config` показывают то же самое.
