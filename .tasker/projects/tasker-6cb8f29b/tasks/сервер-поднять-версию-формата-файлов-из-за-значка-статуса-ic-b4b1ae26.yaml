description: |-
  Контекст: в TSK-197 (PR #59) у статуса появилось поле icon. Версия формата файлов не поднята (в FormatVersions для description поднимали), потому что после повышения падают общие golden-снапшоты: версия записана в корпусе. Побочный эффект: старый Tasker при правке статуса молча стирает ключ icon.

  Что сделать
  - Поднять FormatVersions.Current (сейчас 10 → 11), добавить шаг миграции.
  - Перегенерировать корпус golden-тестов и убедиться, что разница только в версии.
  - Проверить, что старый Tasker отказывается работать с новыми файлами понятной ошибкой, а не стирает icon.
  - Проверить миграцию столбца Icon на реальной старой БД (SQLite и Postgres): сейчас сделана по образцу прежних столбцов и не проверена.

  Готово, когда версия формата поднята, тесты .NET зелёные, старая БД и старые файлы читаются.
