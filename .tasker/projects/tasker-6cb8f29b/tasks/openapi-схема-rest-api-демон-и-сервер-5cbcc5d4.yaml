description: |-
  Эпик TSK-178. Чтобы клиенты на Swift (а позже на C# для Windows) не писались руками, у REST API Tasker.Web должна быть схема OpenAPI.

  Что сделать
  - Описать в схеме все эндпоинты TaskerApi (проекты, задачи, статусы, наборы, типы задач, серии, связи, типы связей, поля, перечисления, доски и колонки, блокировки, участники, пользователи, агенты и токены, auth, проблемы рабочей области, daemon/status) с моделями запросов, ответов и ошибок (версия изменена, заблокировано, invalid, not found).
  - События GET /events (SSE): формат и типы событий описать отдельно.
  - Схема генерируется при сборке и лежит в репозитории (например docs/api/openapi.json); тест проверяет, что закоммиченная схема совпадает с текущим API.
  - Совместимость с NativeAOT (генерация схемы без рефлексии в рантайме или только на этапе сборки).

  Готово, когда
  Схема полная, проходит валидацию, тест расхождения есть в CI.
