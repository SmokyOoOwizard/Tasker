description: |-
  Эпик TSK-178. Окно создания в раскладке полной карточки, как в main-design.

  Что сделать
  - Заголовок, описание, справа свойства (тип, статус, серия, поля, компоненты — множественный выбор во всплывающем списке с поиском, который не закрывается).
  - Блок связей под описанием через разделитель; высоты описания и связей меняются перетаскиванием.
  - Обязательные поля типа проверяются до сохранения, Сохранить / Отмена, ⌘Enter сохраняет, Esc закрывает.
  - Создание из списка, из карточки (ребёнок с родителем) и из палитры.

  Готово, когда
  Задача любого типа создаётся из окна со связями и полями, ошибки обязательных полей видны до отправки.
