description: |-
  Проблема
  Выход отзывает refresh-токены сессии, но выданный access-токен (JWT) продолжает приниматься до своего срока — по умолчанию до 15 минут. При проверке JWT сверяются только пользователь и его SecurityStamp, сессия не проверяется.

  Где
  - src/Tasker.Web/Auth/TokenService.cs — выдача JWT и проверка `EnsureNotRevoked`
  - src/Tasker.Core/Auth/AuthService.cs (`SignOut`, `Issue`) — выход и выдача пары токенов
  - src/Tasker.Storage.Db/Storages/RefreshTokenStorage.cs (`IsFamilyRevoked`) — признак закрытой сессии
  - src/Tasker.Web/Configs/Tasker/AuthConfigs.cs — `AccessTokenLifetime`

  Как повторить
  - Сервер: `POST /api/auth/login`, сохранить `accessToken` и `refreshToken`.
  - `POST /api/auth/logout` с этим `refreshToken`.
  - `GET /api/auth/me` с `Authorization: Bearer <accessToken>` — ответ 200, хотя сессия закрыта.

  Что нужно сделать
  - Класть id сессии (FamilyId refresh-токена) в JWT и при проверке токена отклонять его, если сессия закрыта (`IsFamilyRevoked`).
  - Проверка: тест — после `/auth/logout` старый access-токен получает 401, токены других сессий того же пользователя работают.
