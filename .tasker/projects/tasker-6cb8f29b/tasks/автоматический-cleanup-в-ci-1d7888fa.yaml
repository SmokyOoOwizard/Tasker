description: |-
  Проблема
  `tasker cleanup --check` (код 2, если есть что чистить) и `tasker cleanup` есть, но нет готового CI-сценария, который после заливки в main сам запускает чистку и коммитит результат. Workflows репозитория чистку не запускают.

  Где
  - rust/crates/tasker-cli/src/cleanup.rs — `cleanup`, `--check`, `--resolve-conflicts`
  - .github/workflows/ — только dotnet-tests.yml и release-build.yml
  - docs/wiki/Хранение-и-git.md — описание `cleanup` после слияний

  Как повторить
  - `grep -rn cleanup .github` — ничего.
  - Слить в main две ветки, создавшие задачи с одним номером серии: дубликат номера остаётся, пока кто-то не запустит `tasker cleanup --resolve-conflicts` вручную.

  Что нужно сделать
  - Скрипт и workflow (GitHub Actions) на push в main: установить `tasker`, выполнить `tasker cleanup --check`; если есть что чистить — `tasker cleanup --resolve-conflicts`, закоммитить изменения `.tasker` и запушить.
  - Не зацикливаться на своих коммитах (пропуск коммитов бота по автору или метке в сообщении), не запускаться во время чужого незавершённого слияния.
  - Описать сценарий в вики (как подключить в свой репозиторий).
  - Проверка: в тестовом репозитории слияние с дубликатом номера приводит к одному коммиту бота с перенумерацией, повторного запуска на этот коммит нет.
