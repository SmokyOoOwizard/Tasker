description: |-
  Проблема
  Схема БД создаётся только в пустой базе (`EnsureCreated`) и потом не обновляется: из изменений схемы поддержаны лишь столбцы `AllowCycles`, `Hierarchical` у `link_types` и `Icon` у `statuses`, дописанные вручную. После любого другого изменения моделей базу, созданную раньше, приходится пересоздавать. Для SQLite и Postgres нужны разные миграции, а файл SQLite открывает .NET (сервер).

  Где
  - dotnet/src/Tasker.Storage.Db/DbInitializer.cs — `EnsureCreatedAsync` и `AddMissingColumns`
  - dotnet/src/Tasker.Storage.Db/AppDbContext.cs, dotnet/src/Tasker.Storage.Db/Models/ — модели EF Core
  - docs/wiki/Хранение-и-git.md, docs/wiki/Настройка-и-сервер.md — «схема не мигрирует»

  Как повторить
  - `tasker --sqlite x.db project create Demo` — создаётся база со схемой.
  - `sqlite3 x.db 'DROP TABLE edit_locks'` (имитация базы, созданной до появления таблицы).
  - `tasker --sqlite x.db lock acquire project Demo` → `SQLite Error 1: 'no such table: edit_locks'`: недостающая таблица не создаётся, схема не доводится до текущей.

  Что нужно сделать
  - Ввести версионирование схемы БД и миграции для SQLite и Postgres вместо `EnsureCreated` и ручного `AddMissingColumns`.
  - Существующие базы (в т. ч. без столбцов `AllowCycles`/`Hierarchical`) обновляются без потери данных.
  - Обновить вики: убрать «схема не мигрирует».
  - Проверка: база, созданная по прежней схеме (без таблицы/столбца), открывается сервером и доводится до текущей схемы; .NET-тесты хранилища проходят для новой и обновлённой базы.
