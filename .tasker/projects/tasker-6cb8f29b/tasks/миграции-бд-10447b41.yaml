description: |-
  Проблема
  Схема БД создаётся только в пустой базе (`EnsureCreated` в .NET, `SCHEMA` в Rust) и потом не обновляется: из изменений схемы поддержаны лишь два столбца `link_types` (`AllowCycles`, `Hierarchical`), дописанные вручную. После любого другого изменения моделей базу, созданную раньше, приходится пересоздавать. Для SQLite и Postgres нужны разные миграции, а файл SQLite одновременно открывают .NET (десктоп, сервер) и Rust (консоль, демон).

  Где
  - src/Tasker.Storage.Db/DbInitializer.cs — `EnsureCreatedAsync` и `AddMissingColumns`
  - src/Tasker.Storage.Db/AppDbContext.cs, src/Tasker.Storage.Db/Models/ — модели EF Core
  - rust/crates/tasker-services/src/db/mod.rs — создание схемы и `add_missing_columns`
  - rust/crates/tasker-services/src/db/schema.sql, rust/tests/golden/sqlite/schema.sql, rust/crates/tasker-services/tests/db_schema.rs — схема SQLite и её эталон
  - docs/wiki/Хранение-и-git.md, docs/wiki/Настройка-и-сервер.md — «схема не мигрирует»

  Как повторить
  - `tasker --sqlite x.db project create Demo` — создаётся база со схемой.
  - `sqlite3 x.db 'DROP TABLE edit_locks'` (имитация базы, созданной до появления таблицы).
  - `tasker --sqlite x.db lock acquire project Demo` → `SQLite Error 1: 'no such table: edit_locks'`: недостающая таблица не создаётся, схема не доводится до текущей.

  Что нужно сделать
  - Ввести версионирование схемы БД и миграции для SQLite и Postgres вместо `EnsureCreated` и ручного `AddMissingColumns`.
  - Rust-хранилище SQLite (консоль, демон) должно доводить файл до той же версии схемы и тем же способом, что и .NET, либо проверять версию и отказывать с понятной ошибкой.
  - Существующие базы (в т. ч. без столбцов `AllowCycles`/`Hierarchical`) обновляются без потери данных.
  - Обновить вики: убрать «схема не мигрирует».
  - Проверка: база, созданная по прежней схеме (без таблицы/столбца), открывается десктопом, сервером и консолью и доводится до текущей схемы; тесты схемы (`db_schema.rs`, .NET-тесты хранилища) проходят для новой и обновлённой базы.
