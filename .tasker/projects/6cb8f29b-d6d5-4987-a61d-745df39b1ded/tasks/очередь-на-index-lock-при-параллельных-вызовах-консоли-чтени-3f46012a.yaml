title: 'Очередь на index.lock при параллельных вызовах консоли: чтение без блокировки, короткие удержания'
description: 'Найдено в TSK-92 (измерения: scripts/perf/bench.py degrade --clients 8). Восемь одновременных вызовов tasker task get дают ~0,5 с на вызов против ~0,19 при последовательных: суммарное время ожидания index.lock ~170-260 мс на процесс (у каждого вызова ~9 обращений к индексу: Cache() берёт index.lock, открывает соединение SQLite и закрывает; Initialize/Sync держат её на время схемы и обхода всех файлов). TSK-92 сделала только скоростные правки (потолок опроса FileLock 50 -> 5 мс, прогрев SQLite до блокировки). Предложение для TSK-96/отдельно, т.к. это логика блокировок: читать из индекса без index.lock (WAL допускает читателей, busy_timeout вместо внешней блокировки), index.lock оставить для записи/сверки/пересборки схемы; объединить обращения одного вызова в одно соединение; обход файлов при Sync делать до взятия блокировки.'
