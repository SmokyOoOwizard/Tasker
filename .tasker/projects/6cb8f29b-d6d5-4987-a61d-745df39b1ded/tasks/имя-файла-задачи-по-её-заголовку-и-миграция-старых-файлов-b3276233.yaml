title: Имя файла задачи по её заголовку (и миграция старых файлов)
description: 'Зависит от TSK-66 (версия формата в файле). Сейчас файл задачи называется по Guid (tasks/<guid>.yaml) — человеку неудобно ориентироваться в папке и в диффах git. Сделать имя файла по заголовку задачи (slug: безопасные для файловых систем символы, кириллица допустима), id остаётся полем внутри файла. Что учесть: (1) уникальность — одинаковые заголовки (и одинаковые в разных ветках) не должны затирать друг друга: добавлять короткий суффикс от id или номер серии; (2) смена заголовка — переименование файла (в git это удаление + добавление, возможны конфликты слияния), решить, переименовывать ли сразу или оставлять имя; (3) сейчас id берётся из имени файла: WorkspaceLayout.Classify, проверка «id в файле не совпадает с именем», чтение задачи по id по пути, события наблюдателя (WorkspaceEvents.Parse) — всё это должно брать id из содержимого/индекса; чтение по id идёт через индекс id→путь; (4) миграция: новый формат определяется по версии формата в файле (TSK-66); команда/автоматическая миграция переименовывает старые файлы с Guid-именами и читает оба варианта; старый Tasker не должен молча ломаться на новых именах; (5) решить, распространять ли схему имён на остальные сущности (статусы, наборы, типы) или только задачи. Влияет на git-хуки sync/cleanup и README (раскладка .tasker).'
