title: Перевод консоли tasker и демона tasker-mcpd на Rust (эпик)
description: |-
  Эпик по плану docs/rust-migration-plan.md. Цель: убрать время запуска .NET (60–230 мс на вызов) и размер релиза (папка app/ со средой выполнения). Ориентир: tasker task get за единицы-десятки мс, два статически слинкованных бинарника по 3–8 МБ.

  Границы: переносятся Tasker.Cli, Tasker.Daemon.Host, Tasker.Daemon (клиент), Tasker.Mcp, Tasker.Core, Tasker.Storage.Files, Tasker.Global/Configs и часть Tasker.Web (реестр областей) — около 25 тыс. строк C#. Десктоп и сервер остаются на .NET, поэтому в переходный период два движка работают над одной папкой .tasker и всё на диске и в локальных протоколах должно совпадать байт в байт (раздел 3 плана).

  Cargo workspace rust/ с крейтами tasker-core, tasker-files, tasker-mcp, tasker-daemon, tasker-cli, tasker-mcpd. Фазы 0–6 — дочерние задачи. Решения по объёму (раздел 1): режим --sqlite в Rust не поддерживается в первом релизе (явная ошибка «используйте .NET-сборку»), Windows переносится в тех же фазах с пометкой «не проверено», индекс — свой файл .cache/index-rs.db (вариант Б).

  Поведение по ходу переноса не меняем (раздел 6): только перенос; найденные golden-тестами баги и идеи улучшений — отдельными задачами.
