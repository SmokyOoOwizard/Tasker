title: Короткий id (8 символов) в списках консоли и поиск по нему
description: |-
  В текстовых списках консоли у задач без серии вместо ссылки показывается полный id (Guid, 36 символов): он расширяет колонку ссылок на всей странице (после TSK-91 — выравнивание по самой широкой ячейке) и плохо читается. Нужно показывать короткий id.

  Что сделать:
  - Короткий id = первые 8 символов Guid — как суффикс в имени файла (`<название>-<id8>.yaml`, TSK-67/TSK-77), чтобы по списку можно было найти файл. Показывать его в списках вместо полного id там, где у задачи нет ссылки серии: `task list`, `task links`, `board tasks`, `board show`, блок links в `task get`, и в других списках консоли, где выводится id сущности (project/status/status-set/task-type/series/board/link-type/field/enum/user/agent list) — привести к одному виду. Полный id остаётся в `--json` и в `task get` (поле id).
  - Чтобы короткий id был полезен, команды должны принимать его вместо полного: `task get/update/delete/link/unlink/links <id8>` и сущности по id (`status`, `board` и т. д.) — разбор ссылки: Guid, `ПРЕФИКС-номер`, имя, и теперь префикс Guid из 8+ шестнадцатеричных символов. Неоднозначный префикс (совпадает с несколькими сущностями) — ошибка со списком полных id и подсказкой; префикс короче 8 символов не принимать (слишком много совпадений). Учесть пересечение с именем сущности, состоящим из 8 hex-символов (приоритет: точное имя/ссылка серии, потом префикс — описать), и с ссылками серии вида ABC-12.
  - Автодополнение (TSK-83): подсказывать короткие id там, где раньше подсказывались полные; сторожевой тест значений должен проходить.
  - MCP и REST: инструменты и маршруты по-прежнему принимают полный id; принимать ли префикс — решить (рекомендация: принимать префикс и в MCP для задач, чтобы агент мог взять короткий id из вывода консоли; в REST — нет, там полный id).
  - Оба хранилища (поиск по префиксу через индекс id→путь файлового хранилища и запрос `LIKE 'xxxxxxxx%'` в БД), тесты (список, ширина колонки, поиск по префиксу, неоднозначность, регистр, префикс короче 8, задача без серии и с серией), README, мануал (`tasker manual`), обновить примеры. Связано с TSK-91 (выравнивание колонок): после слияния ширина колонки ссылок перестаёт раздуваться из-за Guid.
