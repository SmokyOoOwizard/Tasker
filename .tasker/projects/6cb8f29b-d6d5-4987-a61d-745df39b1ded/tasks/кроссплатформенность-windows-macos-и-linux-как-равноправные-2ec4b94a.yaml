title: 'Кроссплатформенность: Windows, macOS и Linux как равноправные платформы'
description: |-
  Эпик: Tasker должен полноценно работать на трёх платформах — macOS, Linux и Windows: консоль, демон и автозапуск, установка, файловое хранилище, десктоп. Сегодня macOS основная платформа; Linux поддержан частично (systemd-служба есть, установщика и прогона тестов нет — TSK-111, TSK-112); Windows не поддержан (автозапуск и фоновый запуск «пока не поддерживаются», `tasker mcp run` в терминале работает; в коде есть заготовки: Launcher.cs ищет .exe, DaemonFiles/DaemonHost/McpDaemon имеют ветки для Windows, GitHooks различает Windows, десктоп учитывает не-macOS заголовок окна).

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Состав (дочерние задачи, связь «includes»): CI на трёх платформах и базовый прогон; файловая система Windows (имена, пути, блокировки, переводы строк); демон на Windows (сокет между процессами, остановка, фоновый запуск); автозапуск через Планировщик задач; консоль на Windows (UTF-8, ширина, кавычки PowerShell, пути, автодополнение PowerShell); самодостаточные сборки и установка на всех платформах; десктоп на Windows; а также Linux-задачи из TSK-103 (TSK-111, TSK-112). Критерий готовности эпика: все тесты проходят на трёх платформах в CI, установка одной командой на каждой, демон стартует при входе и обновляется без простоя, README описывает матрицу платформ.
