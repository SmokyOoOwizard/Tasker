title: Одна папка с разных машин через сетевой диск
description: |-
  Раздел бэклога: Одновременная работа.

  Блокировки (`.cache/index.lock`, `.cache/write.lock`) работают между процессами одной машины (на Unix — `flock`), но на SMB/NFS блокировки файлов ненадёжны — проверить на реальной общей папке: там «сравнить версию и записать» может потерять правку. Работа с одной папкой нескольких человек — через git.
