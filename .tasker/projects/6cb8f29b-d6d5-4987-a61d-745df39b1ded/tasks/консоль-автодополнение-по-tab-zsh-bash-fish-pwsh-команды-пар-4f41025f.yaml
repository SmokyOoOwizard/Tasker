title: 'Консоль: автодополнение по Tab (zsh, bash, fish, pwsh): команды, параметры и значения'
description: |-
  Автодополнение по Tab в консоли: пользователь пишет `tasker pro` и нажимает Tab — дописывается `project`.

  Исходное состояние: консоль построена на System.CommandLine, директива `[suggest]` уже работает (проверено: `tasker "[suggest]" "pro"` → `project`, `--project`). Не хватает скрипта оболочки, который по Tab вызывает эту директиву, и источников значений.

  Этап 1 — команды и параметры:
  - Команда `tasker completion <zsh|bash|fish|pwsh>` печатает скрипт дополнения (zsh — основная оболочка владельца; bash, fish, PowerShell — по возможности). Скрипт вызывает `tasker "[suggest:позиция]" …` с текущей строкой и курсором.
  - Установка (решение пользователя: установщик подключает автоматически): scripts/install-macos.sh кладёт скрипт (например, ~/.local/share/tasker/completions/_tasker для zsh) и сам добавляет подключение в файл оболочки пользователя (zsh — ~/.zshrc: fpath и compinit при необходимости; bash — ~/.bashrc или ~/.bash_profile на macOS), по определению оболочки из $SHELL. Правка безопасная: один помеченный блок «# >>> tasker completion >>> … # <<< tasker completion <<<» (повторная установка и обновление заменяют блок, а не дублируют его), перед первой правкой резервная копия файла (например, .zshrc.tasker-backup), если блок уже есть и актуален — файл не трогается; в конце установщик пишет, что изменено и как отменить. Флаг --no-completion отключает подключение (скрипт всё равно кладётся). Удаление (uninstall) убирает помеченный блок и скрипт. Тесты установщика (изолированный HOME): блок добавлен один раз, повторная установка не дублирует, --no-completion и uninstall убирают/не добавляют, чужое содержимое файла не затрагивается.
  - Работает для подкоманд, вложенных команд (`task cr<Tab>` → `create`), параметров (`--st<Tab>` → `--status`) и общих параметров (-w, -p, --json).
  - Тесты: вывод директивы по нескольким префиксам, скрипты генерируются без ошибок (zsh -n / bash -n в тестах, если интерпретатор есть), установщик ставит файл.
  Этап 2 — значения (отдельным шагом, меняет много команд):
  - Источники дополнения для аргументов и параметров: названия проектов, статусов, наборов статусов, типов задач, серий, досок, колонок доски (`board tasks Основная <Tab>`), типов связей, полей и перечислений (после TSK-72..76), ссылки задач (`TSK-7<Tab>` → TSK-7, TSK-70…), значения перечислений для `--field Имя=<Tab>`, `-w`/`--workspace` — пути, `mcp workspace remove` — разрешённые области.
  - Данные берутся из хранилища текущей рабочей области (`-w`/текущая папка, `-p`/единственный проект); дополнение должно отвечать за доли секунды: не запускать демон и не блокировать, ограничить число вариантов (например, 50), при любой ошибке (нет рабочей области, нет доступа, формат новее) — молча пустой список без вывода в stderr.
  - Кириллица и пробелы в названиях: корректное экранирование в скриптах оболочек.
  - Тесты на оба хранилища.
  Перед выполнением коротко согласовать с пользователем: какие оболочки поддерживать, и объём этапа 2 (способ подключения уже решён: автоматически, с помеченным блоком и флагом --no-completion).

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение перед реализацией пройдено):
  - Оболочки: zsh и bash (fish и PowerShell — потом отдельной задачей, но скрипты и установщик пишутся так, чтобы добавить оболочку было просто).
  - Объём: этап 1 (команды и параметры, `tasker completion`, автоподключение установщиком) И этап 2 (значения: проекты, статусы, типы, серии, доски, колонки, ссылки задач, типы связей, поля и перечисления, значения перечислений, области MCP).
  - Установщик подключает автоматически (помеченный блок, резервная копия, флаг --no-completion, uninstall убирает).
