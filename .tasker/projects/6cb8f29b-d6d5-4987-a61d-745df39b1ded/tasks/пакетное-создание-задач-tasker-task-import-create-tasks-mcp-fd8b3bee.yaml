title: 'Пакетное создание задач: tasker task import / create_tasks (MCP) / POST /tasks/batch'
description: |-
  Создание сотен задач по одной (477 штук = 9 минут) слишком медленно и неудобно: каждый вызов CLI — отдельный процесс и обращение к хранилищу. Нужен пакетный путь, который создаёт много задач за один вызов и одну проверку/запись индекса.

  Идея (обсудить с пользователем перед реализацией): (а) CLI `tasker task import <файл|->` — JSON-массив или JSON Lines (по задаче в строке) со всеми полями задачи (title, type, status, description, series, поля, связи по ссылкам/временным ключам) или CSV для простых случаев; `--dry-run`, режим «всё или ничего» и режим «пропустить ошибки с отчётом»; вывод итога (создано N, ошибки с номером строки), `--json`; (б) MCP-инструмент `create_tasks` (список задач в одном вызове, лимит размера, отчёт по каждой); (в) REST `POST /tasks/batch`; (г) ядро: `TaskService.CreateMany` — одна проверка прав и версий, одна секция записи (IWriteScope), номера серий выдаются подряд без гонок, в файловом хранилище пачка файлов и одна пересборка индекса (транзакция индекса), в БД одна транзакция, события одним пакетом (SSE), блокировки правки учитываются. Связи между задачами внутри пакета: временные ключи (`ref`) для ссылок внутри пачки. Учесть: идемпотентность (повторный запуск после обрыва не должен создавать дубли — например, необязательный ключ `externalId`), размер пачки, обновление существующих (upsert) — возможно, отдельным шагом. Тесты на оба хранилища (скорость: 500 задач за секунды, а не минуты), README, мануал `tasker manual`, автодополнение. Связано с задачей про скорость CLI (профилирование одного вызова).
