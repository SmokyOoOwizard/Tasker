title: 'Windows: консоль — кодировка UTF-8, ширина окна, кавычки PowerShell, пути, автодополнение PowerShell'
description: |
  Консоль `tasker` (кириллица в заголовках, выровненные колонки, обрезка по ширине, итог Found, дерево задач, автодополнение) должна выглядеть и работать на Windows (Windows Terminal, PowerShell 5.1 и 7, cmd.exe, Git Bash) так же, как на macOS и Linux.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Что сделать и проверить на Windows: (1) КОДИРОВКА: консоль cmd.exe и старые PowerShell выводят в кодовой странице (866/1251), кириллица ломается — установить Console.OutputEncoding/InputEncoding = UTF-8 при запуске (и вернуть при выходе?), `chcp 65001`, потоки при перенаправлении (`> file`, `| more`, BOM не писать), чтение аргументов командной строки с кириллицей; (2) ширина окна и обрезка (TSK-106, TSK-110): Console.WindowWidth на Windows Terminal/conhost, `watch` нет — аналог (PowerShell `while ($true) { Clear-Host; tasker task list --truncate; Start-Sleep 10 }`) описать в мануале; ANSI-последовательности не используются (проверить) — выравнивание по ширине символов (эмодзи, CJK — широкие знаки) работает в Windows Terminal, в conhost может отличаться; (3) КАВЫЧКИ: PowerShell обрабатывает `>`, `<`, `!`, `$`, `` ` ``, `;` и `&` иначе, чем zsh/bash: в мануале и README примеры для фильтров (`--field "Estimate>=3"`, `--field 'Components!=Frontend'`) показать для обеих оболочек; проверить разбор `--field Name:set` и `--%` (stop-parsing); (4) ПУТИ: разделители, `~`, `-w C:\work\project`, пути с пробелами и кириллицей, регистр дисков, `TASKER_HOME`; (5) `tasker whoami` и имя пользователя ОС (`DOMAIN\user`), редакторы, `Process`-запуски (демон, `git`); (6) АВТОДОПОЛНЕНИЕ (TSK-83): скрипт для PowerShell (Register-ArgumentCompleter -Native, вызывает директиву `[suggest]`), `tasker completion pwsh`, установка в `$PROFILE` установщиком (помеченный блок, резервная копия, флаг --no-completion, удаление при uninstall), вопрос cmd.exe (completion не поддерживается — явно сказать); (7) цвета/ANSI в `status`-выводе, если они появятся; (8) тесты: консольные тесты запускаются и на Windows (пути, кодировка, перенаправление), мануал и README (раздел «Windows»).

  ## ПРОВЕРИТЬ НА WINDOWS (код и проверки macOS/Linux готовы; на Windows не запускалось)

  Собрать: `dotnet publish src/Tasker.Cli -c Release -r win-x64`, положить `tasker.exe` в PATH. Окно: Windows Terminal; отдельно — старая консоль (conhost, `cmd.exe`), Windows PowerShell 5.1 и PowerShell 7. Рабочая область с кириллицей: `tasker project create "Мой проект"`, `tasker task create "Починить вход"`.

  1. Кодировка в окне. В cmd.exe при `chcp` = 866 или 1251 (`chcp 866`): `tasker task list` — кириллица читается; после выхода `chcp` показывает прежнюю страницу. То же в PowerShell 5.1 и 7. Ожидание: заголовки и таблица без «кракозябр».
  2. Перенаправление. cmd.exe: `tasker task list > out.txt` — файл в UTF-8 без BOM (`powershell -c "[IO.File]::ReadAllBytes('out.txt')[0..2]"` не равно 239,187,191), в Блокноте кириллица верна. `tasker task list | more` — читается. PowerShell 7: `tasker task list > out.txt` — то же. PowerShell 5.1: `>` пишет UTF-16 (ожидаемо, описано в `tasker manual windows`); `cmd /c "tasker task list > out.txt"` — UTF-8.
  3. Расшифровка оболочкой. PowerShell: `tasker task list | Select-String Починить` — по умолчанию кракозябры/пусто (ожидаемо); после `[Console]::OutputEncoding = [Text.UTF8Encoding]::new()` строка находится.
  4. Ввод по конвейеру. `[Console]::OutputEncoding = $OutputEncoding = [Text.UTF8Encoding]::new(); "Заголовок" | tasker …` (команда, читающая stdin, например ответ на вопрос) — кириллица цела.
  5. Аргументы с кириллицей и пробелами: `tasker task create "Задача №2 ✓"`, `tasker task list --status 'В работе'`, `tasker task get TSK-1`; переменная `$env:TASKER_PROJECT = 'Мой проект'`.
  6. Ширина. Windows Terminal и conhost: `tasker task list --truncate` не даёт пустой строки между строками; уменьшите окно — ширина подхватывается. В conhost строка не должна переноситься. Задача с эмодзи и иероглифами в заголовке (`"Тест 🙂 日本語"`): в Windows Terminal колонки ровные; в conhost — как получится (запишите).
  7. Аналог watch: `while ($true) { Clear-Host; tasker task list --status 'В работе'; Start-Sleep 10 }` — обновляется, Ctrl+C останавливает.
  8. Кавычки PowerShell: `tasker task list --field 'Estimate>=3'` (работает), `tasker task list --field Estimate>=3` (создаёт файл `=3`; удалить), `--field 'Priority!=Low'`, `--field 'Title=It''s'`, `--field 'Component=Front end'`, `--field Estimate:set`, `'Cost<$100'`. Двойные в cmd.exe: `tasker task list --field "Estimate>=3"`. Проверить `tasker --% task list --field Estimate>=3` (что происходит с `>`; поправить мануал по факту).
  9. Пути: `tasker task list -w C:\work\project`, `-w D:/work/project`, `-w "C:\work\мой проект"`, `-w ~\work`, `-w ~/work` (PowerShell и cmd.exe); `$env:TASKER_HOME = 'D:\tasker-data'; tasker whoami` — каталог данных там; `tasker mcp workspace add ~\work\x`.
  10. `tasker whoami` — имя без домена (в доменной учётной записи: `CORP\ivan` не должно попасть в блокировки); `tasker whoami "Иван"` и обратно `--clear`.
  11. Автодополнение PowerShell 7 и 5.1: `tasker completion pwsh | Out-String | Invoke-Expression`, затем `tasker ta<Tab>`, `tasker task list --status <Tab>` (названия с пробелами и кириллицей — `'В работе'`), `tasker task get TSK-<Tab>`, `tasker task list -w "C:\my dir\" <Tab>` не падает, `tasker completion <Tab>` (`bash`, `pwsh`, `zsh`), в папке без `.tasker` — файловое дополнение. Скорость Tab приемлема.
  12. Установка в профиль: `tasker completion pwsh --install` — созданы `%LOCALAPPDATA%\Tasker\completions\tasker.ps1` (с BOM), блок в `Documents\PowerShell\Microsoft.PowerShell_profile.ps1` и `Documents\WindowsPowerShell\...` (если профиль уже был — копия `.tasker-backup`); повтор — «unchanged»; новое окно PowerShell 7 и 5.1 — Tab работает без `Invoke-Expression`; Documents в OneDrive и папка пользователя с кириллицей; `Get-ExecutionPolicy` = Restricted (профиль не грузится — подсказка из мануала); `tasker completion pwsh --uninstall` — блок и скрипт убраны, остальное содержимое профиля прежнее.
  13. cmd.exe: Tab не дополняет `tasker` команды (ожидаемо; в мануале и README это сказано).
  14. Git Bash: `tasker task list` — кириллица цела, `tasker completion bash` работает.
  15. Прогнать `dotnet test` на Windows: `WindowsConsoleTests` проходят (проверка с настоящим pwsh там пропускается).
