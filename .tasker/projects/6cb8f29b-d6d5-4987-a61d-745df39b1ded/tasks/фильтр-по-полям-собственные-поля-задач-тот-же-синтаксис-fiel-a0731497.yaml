title: 'Фильтр по полям: собственные поля задач (тот же синтаксис --field)'
description: |-
  Этап 2 расширения фильтра по полям (после TSK-84): `--field Имя…` (тот же синтаксис, вариант А) ищет и по полям каталога, и по собственным полям задач с таким именем. Собственное поле хранится в самой задаче (id внутри задачи, имя, тип, обязательность, множественность, перечисление); одноимённые собственные поля у разных задач — разные сущности, типы могут различаться.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение пройдено):
  1. Тот же синтаксис `--field Имя=…` (все операторы из TSK-84), в REST, MCP, консоли и просмотре колонок доски.
  2. Если в каталоге есть поле с таким именем: значение разбирается по его типу; собственные поля с тем же именем и ТЕМ ЖЕ типом тоже подходят; собственные поля с тем же именем, но ДРУГИМ типом пропускаются.
  3. Если в каталоге такого поля нет, а у задач есть собственные поля с этим именем: при одном типе значение разбирается по нему; при нескольких типах (например, int и string) — ошибка со списком типов (способа указать тип в фильтре пока нет).
  4. Имена собственных полей — только буквы и цифры (как в каталоге, TSK-84).
  Что учесть: собственные поля попадают в таблицы значений (индекс файлового хранилища и БД) отдельной колонкой с именем (в нижнем регистре) и типом, индекс по (имя, значение) и по числовому столбцу из TSK-84; значения собственных полей вместе с задачей пишутся в одной транзакции; сравнения, `!=` и (если решено) проверка наличия работают по тем же правилам, что у полей каталога; производительность запроса по имени; оба хранилища, README, мануал/автодополнение, тесты на оба хранилища. Блокируется TSK-84.
