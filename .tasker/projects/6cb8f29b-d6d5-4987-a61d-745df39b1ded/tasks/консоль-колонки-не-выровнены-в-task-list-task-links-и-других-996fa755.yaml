title: 'Консоль: колонки не выровнены в task list, task links и других списках'
description: |-
  Колонки в текстовом выводе не выровнены в `task list` и `task links`: ссылки разной длины (`T-7`, `T-10`, `TSK-7`, `TSK-70`) разделены фиксированными двумя пробелами, поэтому статус, тип и заголовок «ползут» (`T-7  Не начата…` / `T-10  Не начата…`). Читать список трудно.

  Что сделать: выравнивать колонки по ширине самой длинной ячейки на выведенной странице (дополнять пробелами справа), общий форматировщик для строк задач: `task list`, `task links`, `board tasks`, `board show` (с отступом колонки), результаты `task get` в блоке links, а также другие списки консоли, где выводятся таблицы-строки (project/status/type/series/board/field/enum list — проверить и привести к одному виду там, где колонок несколько). Учесть: ширину считать по отображаемой ширине символов (кириллица, эмодзи и CJK — широкие символы, комбинируемые знаки), а не по длине строки в UTF-16; последний столбец (заголовок) не дополняется и не обрезается; разделитель между колонками остаётся двумя пробелами (вывод по-прежнему делится по двойному пробелу в скриптах); пустые ячейки (нет типа у задачи — сейчас колонка пропускается) не должны сдвигать остальные — решить: оставлять пустое место нужной ширины; при выводе не в терминал (конвейер, перенаправление) формат тот же. `--json` не затрагивается. Тесты: список с ссылками разной длины, кириллица, эмодзи, задача без типа, пустой список, пагинация (ширина по странице), `task links`, `board show`. Обновить примеры в README и страницах `tasker manual` (тест команд в примерах не должен ломаться), существующие тесты, сверяющие точные строки, поправить.
