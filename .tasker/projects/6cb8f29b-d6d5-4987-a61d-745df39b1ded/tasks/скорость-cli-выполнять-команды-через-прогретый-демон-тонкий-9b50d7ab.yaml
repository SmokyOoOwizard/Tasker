title: 'Скорость CLI: выполнять команды через прогретый демон (тонкий клиент)'
description: 'Следствие TSK-92. Обычные команды tasker не ходят через демон: каждый вызов — отдельный процесс, который сам открывает область и сверяет индекс; после оптимизаций TSK-92 типичный вызов ~0,15-0,23 с, из них ~35 мс — старт рантайма, ~80 мс — JIT (около 1000 методов: дженерики/async над типами приложения, Autofac, System.Text.Json). Пол .NET-процесса ~35-60 мс. Идея: тонкий клиент (минимум кода, без Autofac) шлёт команду демону, который уже прогрет и держит индекс; клиент печатает ответ. Нужно: протокол (argv, cwd, TASKER_PROJECT, stdin, код выхода, stdout/stderr раздельно), версия клиента = версии демона, откат на прямой путь, автодополнение, интерактивные вопросы, идентификация держателя блокировок (console). Ожидание: ~60-80 мс на вызов и нет очереди на index.lock при параллельных клиентах (демон сериализует). Риск большой (двойной путь выполнения): делать отдельно, после TSK-96.'
