updatedAt: 2026-10-11T12:15:41.2476740+00:00
series:
- seriesId: d7ef1523-7d8d-46f8-b3c1-996e24fbd2c1
  number: 163
description: |-
  Первый прогон .NET-тестов на windows-latest (TSK-162): WindowsFileSystemTests.Windows_a_file_can_be_replaced_while_a_reader_has_it_open падает.

  AtomicFile.WriteAllBytes пишет во временный файл и заменяет им исходный (File.Move с overwrite = MoveFileEx с MOVEFILE_REPLACE_EXISTING). Если исходный файл открыт читателем так, как читает сам AtomicFile (FileShare.ReadWrite | FileShare.Delete), замена на Windows всё равно отказывает:

  System.UnauthorizedAccessException : Access to the path is denied.
     at System.IO.FileSystem.MoveFile(String sourceFullPath, String destFullPath, Boolean overwrite)
     at Tasker.Core.IO.AtomicFile.Move(...) (AtomicFile.cs:63) через Retry (все паузы, ~1,5 с)
     at Tasker.Core.IO.AtomicFile.WriteAllBytes(...) (AtomicFile.cs:87)

  То есть комментарий AtomicFile «читатель не мешает чужой замене файла» на Windows неверен: долгий читатель (дольше паузы повторов) блокирует запись. Короткие читатели только задерживают замену (тест Windows_a_short_lived_reader_without_share_delete_only_delays_the_replacement проходит).

  Варианты: замена с POSIX-семантикой (SetFileInformationByHandle, FileRenameInfoEx, FILE_RENAME_FLAG_REPLACE_IF_EXISTS | FILE_RENAME_FLAG_POSIX_SEMANTICS, Windows 10 1709+ на NTFS) с откатом на MoveFileEx; проверить и Rust-сторону (tasker-core io). Тест пропущен на Windows со ссылкой на эту задачу — снять пропуск после исправления.
