title: 'Windows: атомарная замена файла отказывает, пока его держит открытым читатель с FileShare.Delete'
typeId: 97e160a1-7791-45ea-aa77-9e590c3536eb
statusId: 943a8e7d-9573-4e9f-a4e4-7f67d8473c7a
