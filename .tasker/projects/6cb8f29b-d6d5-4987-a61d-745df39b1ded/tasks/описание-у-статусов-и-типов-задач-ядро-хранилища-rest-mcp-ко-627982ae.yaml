id: 627982ae-bbec-40be-8cfa-7cc10a283fdd
title: Описание у статусов и типов задач (ядро, хранилища, REST, MCP, консоль)
description: |-
  У статусов и типов задач нет описания: есть только название (и у типа — набор статусов). Нужно уметь оставлять описание, чтобы людям и агентам было понятно, что означает статус («В работе — задачу взял исполнитель, код пишется; закрывается в Готово после слияния») и когда использовать тип задачи («Баг — дефект в уже выпущенном поведении; R&D — исследование без обязательного кода»). Для агентов это особенно важно: агент, читающий `list_task_types`/`list_statuses`, получает правила работы в проекте без README.

  Что сделать:
  - Модель: необязательное текстовое поле `description` у статуса (Status) и типа задачи (TaskType); пустое по умолчанию; ограничение длины (как у описания задачи — уточнить по коду), Unicode, переводы строк. РЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ: описание делаем ТОЛЬКО у статусов и типов задач. Для других сущностей (наборы статусов, доски, колонки, серии, поля, перечисления и их значения, типы связей, проекты) пока не нужно — не добавлять, но модель и код писать так, чтобы потом добавить то же поле другой сущности было просто (общий приём без привязки к конкретным двум сущностям, без лишней обобщённости).
  - Хранилища: файловое (YAML: ключ `description` у статуса и типа, только когда не пуст; версия формата файлов и шаг миграции по правилам FormatVersions — старые файлы читаются без описания (данных мигрировать не нужно), шаг «только смена версии», если структура файла меняется; старый Tasker не должен молча терять ключ при правке — как в TSK-85) и БД (столбец, NULL по умолчанию; миграций БД нет — существующую базу нужно пересоздать, написать в README).
  - REST: `description` в телах POST/PATCH `/statuses`, `/task-types` и в ответах GET (списки и одиночные) — без поломки старых клиентов (поле необязательное); MCP: `description` в `create_status`/`update_status`/`create_task_type`/`update_task_type`, в результатах `list_*`/`get_*` (в списках — учесть краткий режим TSK-89: `descriptionLength` для списков, чтобы длинные описания типов не раздували ответ); консоль: `status create/update -d`, `task-type create/update -d` (`-d ""` очищает), вывод описания в `status get`, `task-type get`, в списках (`status list`, `task-type list`) — короткая колонка или не показывать (решить: рекомендация — только в `get`, в списках `--json` полный).
  - Подсказка при создании задачи: `task create` с неизвестным типом/статусом предлагает список с описаниями (необязательно); `tasker manual`: страница про статусы и типы — пример с описанием.
  - Интерфейс (React): поле описания в формах статуса и типа задачи, показ в подсказках; десктоп тот же фронтенд.
  - Блокировки правки и версии как у остальных правок; каскады не нужны (описание — просто текст).
  - Тесты на оба хранилища (создание, правка, очистка, длина, Unicode, чтение старого файла без описания, потеря ключа старым кодом не проверяется), REST/MCP/консоль, README (раздел про статусы и типы задач), мануал.
