title: 'Папка проекта по имени и короткому id: projects/<slug>-<id8>/ вместо projects/<guid>/'
description: |-
  Проблема
  Папка проекта — полный Guid (.tasker/projects/6cb8f29b-d6d5-4987-a61d-745df39b1ded/), а файлы сущностей внутри уже называются по имени и короткому id (<slug>-<id8>.yaml). По папке не видно, какой это проект.

  Где
  - Раскладка: Rust rust/crates/tasker-files/src/layout.rs (classify); .NET src/Tasker.Storage.Files/Index/WorkspaceLayout.cs (ProjectDirectory, TaskerDirectory).
  - migrate, cleanup, переименование и удаление проекта — в обеих реализациях.
  - Всё, что опирается на путь проекта: .cache/index.db, .cache/deleted-projects/<id>, блокировки правки, наблюдатель файлов.
  - Golden-корпус, .tasker этого репозитория, вики «Хранение-и-git».

  Что нужно сделать
  - Папка проекта — projects/<slug имени>-<id8>/ (правила slug те же, что у файлов сущностей). Раскладка принимает и новое имя, и прежнее <guid>; id проекта — из project.yaml, папка сверяется с ним по id8.
  - Поднять formatVersion: migrate записывает новую версию в project.yaml, старый Tasker показывает проект как «более нового формата».
  - tasker migrate переименовывает папки (под write.lock, имя не занято); migrate --check считает старое имя требующим миграции.
  - Переименование проекта переносит папку в projects/<новый slug>-<id8>/ одной операцией под write.lock (параллельные процессы видят старую или новую папку, не смесь; повторы на Windows для занятых файлов).
  - Две папки одного проекта (тот же id, например после git-слияния): чтение и индекс объединяют их; cleanup и migrate сливают файлы в папку с текущим именем (одинаковые имена файлов — в отчёт, без потери данных); sync и list_workspace_problems сообщают о второй папке.
  - Обе реализации — Rust (консоль, демон) и .NET (десктоп, сервер) — одновременно. SQLite не затрагивается.
  - Golden: раскладка, migrate, снимки с путями; .tasker репозитория переносится одним коммитом через tasker migrate.
  - Вики «Хранение-и-git».
  - Проверка: cargo test, golden --verify, .NET-тесты (раскладка, migrate, параллельная работа), CI на трёх ОС.
