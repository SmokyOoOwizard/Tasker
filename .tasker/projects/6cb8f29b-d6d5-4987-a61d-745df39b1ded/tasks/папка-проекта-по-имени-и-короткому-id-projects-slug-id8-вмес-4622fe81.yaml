title: 'Папка проекта по имени и короткому id: projects/<slug>-<id8>/ вместо projects/<guid>/'
description: |-
  Сейчас папка проекта — полный Guid: .tasker/projects/6cb8f29b-d6d5-4987-a61d-745df39b1ded/. Файлы сущностей внутри уже называются по имени и короткому id (<slug>-<id8>.yaml, EntityFileNames). Нужно так же назвать папку проекта: .tasker/projects/<slug имени проекта>-<id8>/ (те же правила slug: NFC, буквы и цифры, ToLowerInvariant, не более 60 UTF-16, пустой slug — запасное слово).

  Что нужно сделать и решить:
  - Раскладка: распознавание пути (Rust: rust/crates/tasker-files/src/layout.rs, classify; .NET: src/Tasker.Storage.Files/Index/WorkspaceLayout.cs, ProjectDirectory, TaskerDirectory) принимает папку <slug>-<id8> и прежнюю <guid>; id проекта — из project.yaml, папка сверяется с ним по id8, как у файлов сущностей.
  - formatVersion: старый Tasker не узнает папку с новым именем и молча не увидит проект — поэтому поднять формат (как при переименовании файлов сущностей в формате 5): migrate записывает новую версию в project.yaml, и старый Tasker покажет проект как «более нового формата».
  - tasker migrate переименовывает папки проектов в новую схему (под write.lock, с проверкой, что имя не занято); migrate --check считает папку со старым именем требующей миграции.
  - Переименование проекта переименовывает и папку: все файлы проекта переносятся в projects/<новый slug>-<id8>/ одной операцией под write.lock (параллельные процессы видят либо старую, либо новую папку, а не смесь; повторы на Windows для занятых файлов). Две папки одного проекта (тот же id в project.yaml, например после git-слияния, где в другой ветке в старую папку добавлены задачи) — штатная ситуация: чтение и индекс объединяют их как один проект; tasker cleanup и tasker migrate сливают файлы в папку с текущим именем (конфликт одинаковых имён файлов — в отчёт, без потери данных); sync и list_workspace_problems сообщают о второй папке. Описать в вики «Хранение-и-git».
  - Всё, что опирается на путь проекта: индекс .cache/index.db (колонки путей), маркеры .cache/deleted-projects/<id>, блокировки правки, наблюдатель файлов, удаление проекта, SQLite не затрагивается.
  - Обе реализации: Rust (консоль, демон) и .NET (десктоп, сервер — Tasker.Storage.Files) одновременно, иначе десктоп и консоль разойдутся.
  - Golden-корпус: эталоны раскладки, migrate, снимки с путями; .tasker этого репозитория переносится одним коммитом через tasker migrate.
  - Проверка: cargo test, golden --verify, .NET-тесты (раскладка, migrate, параллельная работа), CI на трёх ОС.
