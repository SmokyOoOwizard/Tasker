title: 'Автодополнение: после многозначного параметра (--status A --al) параметры не подсказываются'
description: |-
  Автодополнение по Tab перестаёт подсказывать параметры после параметра с несколькими значениями. Пользователь пишет `tasker task list --status Бэклог --al` + Tab и получает пустую подсказку (ожидается `--all`).

  Воспроизведение (директива `[suggest:<длина строки>]`, как вызывает скрипт оболочки):
  - `tasker task list --al` → `--all` (работает);
  - `tasker task list --status Бэклог --al` → ПУСТО (ожидается `--all`);
  - `tasker task list --status Бэклог -` → ПУСТО (ожидается список параметров);
  - `tasker task list --type Баг --al`, `--series TSK --al`, `--field Priority=High --al` → ПУСТО;
  - `tasker task list --status Бэклог ` (пробел после значения) → подсказывает ещё статусы (Бэклог, В работе, Готово, Туду) — а параметры не показывает;
  - `tasker task list --status Бэклог --status В` → `В работе` (работает).
  Причина (гипотеза, проверить): после TSK-105 параметры `--status`, `--type`, `--series` (и `--field`) принимают несколько значений (Kit.Many, арность 1..n), и дополнитель (src/Tasker.Cli/Completion/Completer.cs, CompleteDirective) считает любое слово после значения продолжением списка значений: фильтрует варианты значений по префиксу `--al` и не предлагает параметры.

  Что сделать: если текущее слово начинается с `-` (или это `--`), всегда предлагать параметры команды (и общие), даже когда предыдущий параметр принимает несколько значений; значения предлагать для слова, не начинающегося с `-` (или если оно после `=`); не предлагать уже использованные параметры без повтора (но `--status`/`--type`/`--series`/`--field` допускают повтор — их можно предлагать снова); пустое слово после значения многозначного параметра предлагает И значения этого параметра, И параметры (или только значения — решить, но параметры должны быть доступны по `-`/`--`). Проверить остальные места с несколькими значениями: `--field Имя=значение` (значения после `=`), `--sort`, `--column-filter`, `--value` у `enum create`, `--status` у `status-set create`, `--add-field` и т. п.
  Тесты: набор строк выше (zsh и bash скрипты вызывают одну директиву, поэтому достаточно теста директивы), все команды с многозначными параметрами (общая проверка по дереву команд: для каждого многозначного параметра `--<параметр> <значение> --` предлагает параметры команды — сторожевой тест), мануал/README при необходимости.
