title: 'Rust, фаза 0: golden-корпус области и снапшоты вывода консоли и MCP'
description: |-
  Фаза 0 плана docs/rust-migration-plan.md, п. 1–2.

  Скриптом на текущей .NET-сборке создать область со всеми сущностями, всеми типами полей (string/int/float/bool/date/enum, одиночные и множественные), многострочными и «опасными» строками (кавычки, #, ': ', кириллица, эмодзи, ведущие нули вроде 007, true/null, ведущие и хвостовые пробелы, пустые строки), файлами всех formatVersion 0–9, legacy-именами <guid>.yaml, файлом с маркером конфликта git. Сохранить в rust/tests/golden/: сами файлы .tasker, ожидаемые версии сущностей (16 hex SHA-256), ожидаемые имена файлов после migrate, вывод ключевых команд (task list --json, task get --json, sync, cleanup --check, migrate --check, справка команд).

  Снапшоты MCP с .NET-демона: tools/list (имена, описания, inputSchema всех 62 инструментов), ответы list_workspaces, get_task, по одной ошибке каждого кода ([invalid] [forbidden] [not_found] [modified] [locked] [unsupported_format] [in_use] [unavailable] [failed]).

  Отдельно снять стилевые эталоны YamlDotNet 18.1 до написания эмиттера: стиль кавычек (' или "), строки с #, ': ', ведущими пробелами, пустые строки, |- против |, DateTimeOffset формат O, Guid формат D.

  Скрипт генерации воспроизводим (идемпотентен по содержимому, кроме дат и id — их фиксировать). Результат: папка эталонов, которой пользуются фазы 1–4.
