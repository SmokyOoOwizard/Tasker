title: Входящие связи не видны в самой задаче (поле links пусто у принимающей стороны)
description: |-
  Входящие связи не видны в самой задаче. Пример: у задачи H-40 поле `links` пустое, хотя она «входит в» T-7: связь хранится только у исходящей стороны (в файле задачи-источника), а обратную показывают лишь `get_task_links` (MCP) и `tasker task links`. Агент, прочитав `get_task`/`list_tasks`, не видит, что задача чем-то заблокирована или входит в другую.

  Нужно: чтобы в представлении задачи (get_task, create/update, REST GET /tasks/{id}, консоль `task get --json`) связи были видны С ОБЕИХ сторон: исходящие (как сейчас) и входящие — например, `links` содержит все связи с указанием направления (`direction: out|in`, тип связи, название стороны «входит в»/«включает», ссылка и заголовок другой задачи, её статус), либо два поля `links` и `incomingLinks`. Хранение не меняется (связь по-прежнему пишется только у исходящей стороны), входящие вычисляются при чтении (индекс файлового хранилища / запрос в БД). Решить: в списках (list_tasks) связи не вычислять (дорого) — только число или флаг, полный вид в get_task; в `task get` консоли вывод уже показывает обе стороны (проверить, что --json и MCP согласованы с ним). Учесть виртуальные типы связей по умолчанию, удалённые задачи/типы (недействительные связи), проекты (только внутри проекта), оба хранилища, пагинацию длинных списков связей. Тесты на оба хранилища, README (раздел «Связи между задач»), схема инструмента get_task.
