title: Страховочная сверка кэша в демоне
description: |-
  Раздел бэклога: Консоль.

  Слежение за файлами (`FileSystemWatcher`) иногда теряет события: переполнение буфера при `git checkout` на тысячи файлов, сетевые диски (SMB, NFS), лимит inotify на Linux, сон и пробуждение, время, когда демон был остановлен. Тогда кэш молча отстаёт, пока его не перечитает следующий процесс. Идея: демон раз в несколько минут (по умолчанию 5) полностью сверяет открытые области с диском — то же, что делает стартовая сверка (~0,1 с на 10 000 файлов, если ничего не менялось) — и отправляет вкладкам событие об изменении. Нужно: (1) сверка порциями с отпусканием `index.lock` между ними — иначе на больших папках она на время задерживает чтение из других процессов; (2) в `tasker mcp status` — время последней сверки области и число необработанных событий слежения; (3) интервал в `settings.json` (реже или выключить на сетевых дисках, где сверка дорогая).
