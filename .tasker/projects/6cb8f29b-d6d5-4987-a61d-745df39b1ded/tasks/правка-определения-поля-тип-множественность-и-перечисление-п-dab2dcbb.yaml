title: 'Правка определения поля: тип, множественность и перечисление после создания'
description: |-
  После TSK-72 у поля из каталога правится только имя; тип значения, признак «несколько значений» и перечисление фиксированы при создании (нужно другое — создаётся новое поле). Нужно сделать их редактируемыми. Зависит от TSK-73 (появляются значения у задач и ссылки из типов).

  Что решить и реализовать:
  - Допустимые смены и что происходит со значениями, уже выбранными у задач и типов: int→float (без потерь), любой тип→string (значение приводится к тексту), string→int/float/bool/date (только если все значения разбираются; иначе отказ с числом и примерами проблемных значений либо явный выбор пользователя: преобразовать/очистить), enum↔другое перечисление (переназначение значений по имени или явному соответствию, непереданные — очистить, по образцу удаления значения перечисления из TSK-73), смена множественности: один→несколько (значение становится списком из одного), несколько→один (если у задачи несколько значений — выбор: оставить первое или очистить).
  - Явный выбор пользователя при затрагивании задач (как в TSK-73: без выбора и при наличии затронутых задач — ошибка с числом задач), операция атомарная (все значения и определение или ничего), с оптимистической блокировкой и проверкой Version.
  - Обязательность и значение по умолчанию не меняются этой задачей.
  - Оба хранилища, REST и MCP (параметры правки поля), консоль (`field update --type/--multiple/--enum` с флагами выбора), README, тесты. Блокируется TSK-73, затрагивает TSK-74 и TSK-75.
