title: Отчёт о сериях в демоне открывает временный контейнер
description: |-
  Раздел бэклога: Серии задач.

  Демон считает состояние серий (после открытия области и после `/daemon/sync`) через собственный короткоживущий контейнер папки: у `WorkspaceLease` нет публичного способа получить сервис из уже открытого контейнера. Лишняя загрузка индекса на каждую явную сверку; исправляется публичным `Resolve<T>()` у аренды.
