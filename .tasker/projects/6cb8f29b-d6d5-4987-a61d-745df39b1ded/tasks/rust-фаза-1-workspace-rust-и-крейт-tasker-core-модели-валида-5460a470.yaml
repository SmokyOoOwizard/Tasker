title: 'Rust, фаза 1: workspace rust/ и крейт tasker-core — модели, валидация, ShortId, Versioning, JSON, FieldValues, настройки'
description: |-
  Фаза 1 плана docs/rust-migration-plan.md, п. 1 и 5.

  Создать Cargo workspace rust/ (Cargo.toml с общим release-профилем: lto fat, codegen-units 1, opt-level s, panic abort, strip) и крейт tasker-core: модели сущностей (проект, задача, тип, статус, набор статусов, серия, поле, перечисление, доска, тип связи, пользователь, агент), Validate, ShortId, TaskReference (PREFIX-N и короткий id), Versioning (первые 16 hex SHA-256 от байтов файла с CRLF→LF без BOM), конвенции JSON TaskerJson (serde_json + свой Formatter: сырые не-ASCII, экранируются только ", \, < 0x20, 0x7F–0x9F, U+2028/2029, одиночные суррогаты), канонизация значений полей FieldValues (007→7, float как R, даты yyyy-MM-dd).

  Настройки: settings.json (userName, mcp.port, mcp.workspaces[{kind,path}]), settings.lock, каталог данных (TASKER_HOME, ~/Library/Application Support/Tasker, $XDG_DATA_HOME/Tasker, %LOCALAPPDATA%\Tasker), UserPath (~), разбор TASKER_* и аргументов с подсказками по опечаткам (Дамерау–Левенштейн).

  Критерий: версии сущностей по golden-корпусу совпадают с эталоном; unit-тесты JSON-экранирования и FieldValues.
