title: 'Файл задачи: описание последним ключом — после заголовка идут служебные поля'
description: |-
  Проблема
  В файле задачи (.tasker/projects/<id>/tasks/*.yaml) ключи идут в порядке полей модели: formatVersion, id, title, description, typeId, statusId, createdAt, updatedAt, series, links, fields. Описание часто длинное, и служебные поля оказываются после экрана текста.

  Где
  - Rust: модель файла задачи в rust/crates/tasker-files, migrate.
  - .NET: TaskFile в src/Tasker.Storage.Files (пишут десктоп и сервер), migrate, если он там есть.
  - Golden-корпус rust/tests/golden.
  - .tasker этого репозитория.
  - Вики «Хранение-и-git».

  Что нужно сделать
  - description — последний ключ файла задачи, после fields; остальной порядок без изменений. В обеих реализациях одновременно, иначе консоль и десктоп будут переставлять ключи при каждой записи.
  - formatVersion не поднимать: обе реализации читают ключи в любом порядке.
  - tasker migrate переписывает файлы задач в текущий порядок ключей; migrate --check считает файл с другим порядком требующим миграции.
  - Golden: эталоны файлов задач, versions.json и всё зависимое (migrate, снимки консоли и MCP с версиями, index); .NET-запись TaskFile даёт те же байты, что Rust.
  - Переформатировать .tasker репозитория одним коммитом (tasker migrate) вместе с изменением.
  - Вики «Хранение-и-git»: текущий порядок ключей; версия задачи при переформатировании меняется (агент со старой версией один раз получит «Modified»).
  - Проверка: cargo test, golden --verify, .NET-тесты (запись TaskFile, чтение обоих порядков), CI на трёх ОС.
