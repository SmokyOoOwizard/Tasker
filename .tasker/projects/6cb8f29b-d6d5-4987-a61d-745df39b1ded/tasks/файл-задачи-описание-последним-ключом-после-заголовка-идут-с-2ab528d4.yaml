title: 'Файл задачи: описание последним ключом — после заголовка идут служебные поля'
description: |-
  Сейчас в файле задачи (.tasker/projects/<id>/tasks/*.yaml) ключи идут в порядке полей модели: formatVersion, id, title, description, typeId, statusId, createdAt, updatedAt, series, links, fields. Описание часто длинное и многострочное, поэтому служебные поля (тип, статус, даты, серии, связи, значения полей) оказываются после экрана текста.

  Нужно: description — последний ключ файла задачи, после fields; остальной порядок без изменений.

  - Порядок записи меняется в обеих реализациях одновременно: Rust (модель файла задачи в rust/crates/tasker-files) и .NET (TaskFile в src/Tasker.Storage.Files — им пишут десктоп и сервер). Иначе консоль и десктоп будут переставлять ключи при каждой записи.
  - formatVersion не поднимать: обе реализации читают ключи в любом порядке, данные не теряются, старый Tasker читает новый файл без потерь.
  - tasker migrate переписывает файлы задач в текущий порядок ключей (не только formatVersion и имена файлов); migrate --check считает файл с другим порядком ключей требующим миграции. В .NET — так же, если там остаётся migrate для десктопа/сервера (проверить).
  - Golden-корпус (rust/tests/golden): обновить эталоны файлов задач, их версии (versions.json) и всё, что от них зависит (migrate, снимки консоли и MCP с версиями, раздел index); сверить, что .NET-запись (TaskFile) даёт те же байты, что Rust.
  - Переформатировать .tasker этого репозитория одним коммитом (tasker migrate) вместе с изменением.
  - Версия каждой задачи (хэш файла) при переформатировании меняется: агент со старой версией один раз получит «Modified» — описать в вики «Хранение-и-git» текущий порядок ключей, без истории.
  - Проверка: cargo test, golden --verify, .NET-тесты (запись TaskFile и чтение файлов обоих порядков), CI зелёный на трёх ОС.
