title: 'Rust, фаза 0: базовая линия скорости и размера текущей .NET-сборки'
description: |-
  Фаза 0 плана docs/rust-migration-plan.md, п. 4.

  Прогнать scripts/perf/bench.py на текущей сборке (с демоном и без, 100 и 2000 задач), зафиксировать размер папки app/ текущего релиза (scripts/release.sh). Записать числа в docs (рядом с планом или в wiki «Разработка»), чтобы после фазы 3 было с чем сравнивать. Итог — в описании задачи и в документе.

  ИТОГ (2026-10-09, 0.1.0, osx-arm64, Apple M2 Max; подробности в docs/rust-migration-baseline.md, сырые JSON в docs/perf-baseline/):
  - Размер релиза: app/ 152 МБ, 377 файлов (356 dll = 133 МБ, 14 dylib = 19 МБ, свой код Tasker.*.dll 5 МБ); архив tar.gz 56 МБ; tasker и tasker-mcpd — загрузчики по 122 КБ.
  - Вызовы (50 задач, медианы, с демоном = без демона): version 60 мс, status list 152, task list --limit 1 178, task get 202, task create 241; p10/p90 ±2 %.
  - Фазы task get (~200 мс): запуск процесса и рантайма ~45 мс, Autofac ~43 мс, открытие SQLite-индекса ~21 мс, сама команда ~69 мс, из них JIT ~50 мс (855 методов, несмотря на R2R); tasker --version 60 мс — нижняя граница любого вызова.
  - От 100 до 2000 задач: get 203→241 мс, list 180→200, create 242→282 (+10–20 %); RSS демона 36 МБ.
  - Шум: машина занята чужими сборками (load1 3–76); итоговые таблицы — из повторов при cpu_busy 14–20 %, шумные прогоны сохранены отдельно.
  - Ждём от Rust: запуск/JIT/DI (~140 мс из 200) → единицы мс; не изменится само по себе: SQLite (~20 мс открытие, ~20 мс commit) и чтение файлов.
