title: Фильтр колонки доски по полю (хранится в колонке)
description: 'Продолжение TSK-76. Сейчас срез по значению поля — условие просмотра (--field, ?field=, field у get_board), колонка его не хранит. Нужно: условие по полю в самой колонке (например, статус + Component=API): поле модели BoardColumn (условия поле-значение), оба хранилища (YAML доски и таблицы БД), валидация по каталогу при создании и правке доски и каскады при удалении поля или значения enum, BoardService.GetColumnTasks, REST, MCP (create_board, update_board), консоль (board create/update --column), интерфейс, README. Отдельная задача: меняет формат файла доски и схему БД и затрагивает каскады удаления полей.'
