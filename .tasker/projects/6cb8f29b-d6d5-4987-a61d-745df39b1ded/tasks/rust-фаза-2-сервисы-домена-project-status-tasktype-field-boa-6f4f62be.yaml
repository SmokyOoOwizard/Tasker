title: 'Rust, фаза 2: сервисы домена (Project, Status, TaskType, Field, Board, Task, Series, Links, LinkType, EditLock, Cleanup, Health, Usages)'
description: |-
  Фаза 2 плана docs/rust-migration-plan.md, п. 3. Сервисы синхронные (без async в домене).

  Project, Status, StatusSet, TaskType (каскады Clear/Keep), Field/FieldEnum/FieldConversion (смена типа, множественности, перечисления), Board/ColumnFilters (взаимоисключающие условия колонок), Task (Create/Update/Delete, фильтры полей со сравнениями, дерево иерархии до глубины 10 и 5000 строк), Series (нумерация под Exclusive, Renumber), TaskLink/LinkCycles (BFS и Тарьян, лимит 20 000), LinkType (дефолтные типы с детерминированными id: MD5 + Uuid::from_bytes_le, как Guid(byte[]) в .NET), EditLock (2 мин, ожидание 30 с), Cleanup, SeriesHealth/LinkHealth, Usages (единый текст 409).

  Критерий: Rust-тесты уровня сервисов повторяют сценарии SeriesCoreTests, TaskFieldsTests, LinkCoreTests, LinkCycleTests, EditLockTests, FieldCatalogTests (~250 тестов).
