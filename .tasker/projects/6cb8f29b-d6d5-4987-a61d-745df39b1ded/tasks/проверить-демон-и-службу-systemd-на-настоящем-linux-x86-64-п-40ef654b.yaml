title: Проверить демон и службу systemd на настоящем Linux (x86_64, перезагрузка, linger)
description: 'Продолжение TSK-111: на Linux в контейнере (arm64, systemd --user) всё проверено, не проверено — настоящая машина или виртуалка x86_64: автозапуск после перезагрузки с linger и без, enable по sudo -u/ssh без сеанса (сообщение с подсказкой), дистрибутивы без systemd, scripts/test-linux.sh --platform linux/amd64 (под эмуляцией Docker Desktop на Apple Silicon образ amd64 не запускается: exec format error). Чек-лист — README, «ПРОВЕРИТЬ НА LINUX С SYSTEMD».'
