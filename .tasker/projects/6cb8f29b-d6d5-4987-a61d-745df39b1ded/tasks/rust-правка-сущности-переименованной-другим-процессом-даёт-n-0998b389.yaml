title: 'Rust: правка сущности, переименованной другим процессом, даёт «No status» вместо «Modified by someone else»'
description: |-
  Падение в CI на main (прогон .NET tests 38144778724, ubuntu-latest, коммит bc94ac2): ConcurrencyTests.Of_two_processes_changing_the_same_version_only_one_wins(storage: "files") — два процесса одновременно делают status update <id> --name First|Second --expected-version <одна версия>. Ожидается: один успешен, второй — код 1 и «Modified by someone else». Получено у проигравшего: «Error: No status 'cf203767-…'». На sqlite тест проходит; на files — плавающий.

  Причина (предположительно): имя файла сущности строится по названию (<slug>-<id8>.yaml), победитель переименовывает файл, а проигравший нашёл путь по индексу до переименования и, не найдя файл по старому пути, считает сущность несуществующей. .NET ищет файл сущности по id маской *-<id8>.yaml (ProjectDirectory.FindFiles) — находит переименованный файл и отвечает конфликтом версии.

  Нужно: в Rust-хранилище файлов поиск сущности по id, пропавшей по известному пути, повторять по маске *-<id8>.yaml (и legacy <guid>.yaml), как .NET; проверить все виды сущностей с именем файла по названию (задачи, статусы, типы, наборы статусов, серии, доски, поля, перечисления, типы связей) и все операции, которые читают сущность перед записью (update, delete, переименование при записи). Тест на гонку переименования — в Rust (воспроизводимо, без расчёта на тайминги) и проверка, что .NET-тест стабилен (прогон в цикле).
