title: 'Rust, фаза 2: индекс index-rs.db — схема, Sync по (size, mtime), Refresh, сортировки'
description: |-
  Фаза 2 плана docs/rust-migration-plan.md, п. 1–2. Решение: вариант (Б) — свой файл .cache/index-rs.db и своя блокировка index-rs.lock; общий с .NET только write.lock и YAML как источник истины.

  rusqlite (bundled). Своя схема таблиц (data можно упростить до компактного JSON), Sync по (size, mtime), Refresh путей, ошибки чтения в колонке error, полный пересбор при повреждении. Инвариант нумерации серий: max(number) считается после Refresh(tasks/) под write.lock.

  Сортировки как WorkspaceIndex.Sort: бинарная коллация, ранги типов/статусов, числовой порядок серий, lower() как ToLowerInvariant, NULL в конец.

  Критерий: sync и cleanup --check на golden-корпусе дают тот же отчёт, что .NET; порядок task list --sort совпадает со снапшотами.
