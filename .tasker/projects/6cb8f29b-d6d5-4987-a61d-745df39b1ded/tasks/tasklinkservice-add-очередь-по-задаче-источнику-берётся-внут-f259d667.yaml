title: 'TaskLinkService.Add: очередь по задаче-источнику берётся внутри секции записи — возможна взаимная блокировка с write.lock'
description: 'В TaskLinkService.Add для типа без циклов проверка и запись идут под writes.Exclusive, а внутри Change (без версии) берётся полоса Stripes по задаче-источнику. Другой запрос на ту же задачу-источник с типом, допускающим циклы, берёт ту же полосу вне секции записи и уже под ней пишет файл (write.lock). Порядок захвата противоположный: первый держит write.lock и ждёт полосу, второй держит полосу и ждёт write.lock — взаимная блокировка до таймаута FileLock (в демоне с несколькими агентами). Комментарий в Change («очередь берётся вне секции записи и не вложена в другие») для Add неверен. Rust-порт (tasker-services::links) повторяет поведение буквально; править в обоих движках: брать полосу до Exclusive или проверять цикл внутри Modify.'
