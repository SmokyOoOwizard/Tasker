description: |-
  Сейчас REST API и живые события интерфейса есть только в .NET: src/Tasker.Web (TaskerApi.cs — около 90 маршрутов, Workspaces/WorkspaceEvents.cs — события по SSE, text/event-stream; маршрутизация /w/<key>, реестр областей, LoopbackOnly, режимы desktop/server в Auth/ModeRegistration). Их обслуживает .NET-процесс внутри десктопа поверх .NET-хранилища. Rust-демон tasker-mcpd отдаёт только MCP и /daemon/*.

  Нужно: tasker-mcpd обслуживает тот же REST API и те же события для локального интерфейса, чтобы десктоп работал поверх демона без .NET-сервера внутри себя.

  Что входит:
  - маршруты и формы ответов REST как у Tasker.Web в режиме desktop (JSON camelCase, коды ошибок и тексты 400/404/409/423, заголовки версий и блокировок правки) — перенос без изменения контракта, чтобы фронтенд (frontend/) работал без правок;
  - события: SSE по области с теми же типами событий, что WorkspaceEvents; источник — наблюдатель файлов демона и записи через сам демон (совпадает с тем, что видят агенты по MCP);
  - маршрутизация по области (/w/<key>/…) и реестр областей демона; только loopback (Host/Origin), как MCP;
  - аутентификации нет (локальный режим desktop); режим server с JWT и токенами агентов остаётся в .NET (Tasker.Server) и не переносится;
  - статику фронтенда демон не отдаёт: демон обслуживает только API (REST, события, MCP, /daemon/*); фронтенд остаётся в оболочке десктопа;
  - проверка паритета: те же .NET-тесты REST (FieldsApiTests, SeriesApiTests, LinkInterfaceTests, EditLockInterfaceTests и др. в режиме desktop) против демона, снимки ответов в golden-корпусе; фронтенд вручную против демона;
  - вики: «Демон-MCP» и «Интерфейс» — текущее поведение.
