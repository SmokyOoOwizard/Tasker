title: 'MCP-демон после перезапуска: [invalid] Workspace is not available: opening вместо повторяемой ошибки'
description: "Стенд (сценарий kill: демон убивается kill -9 и запускается заново): сразу после mcp start, пока область открывается, вызовы получают '[invalid] Workspace ws is not available: opening' (десятки вызовов за секунду). Код invalid не отличает временную недоступность от ошибки агента: нужен отдельный повторяемый код (например unavailable) или ожидание открытия области внутри вызова до таймаута. Воспроизведение: tools/Tasker.Stress --scenarios kill --client mix."
