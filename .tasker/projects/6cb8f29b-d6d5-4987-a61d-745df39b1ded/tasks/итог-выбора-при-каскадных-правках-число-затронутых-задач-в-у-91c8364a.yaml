title: 'Итог выбора при каскадных правках: число затронутых задач в успешном ответе'
description: |-
  Сейчас число затронутых задач видно только в ошибке без выбора (`In use` / `[in_use]` / 409: «N задач»). Когда пользователь уже сделал выбор, успешный ответ его не содержит: ядро возвращает только обновлённую сущность.

  Нужно, чтобы операции с выбором возвращали итог: сколько задач изменено, и показывали его везде.
  - Ядро: результат операций TaskTypeService.Update (убрать/оставить значения полей при снятии поля с типа), FieldEnumService.Update (удалить значение у задач / переназначить), удаление поля и перечисления, смена типа задачи; в результате — число изменённых задач (и, возможно, число очищенных/переназначенных значений), не только сущность. Сигнатуры без костылей (например, результат-запись с сущностью и счётчиками), оба хранилища.
  - REST: счётчики в теле ответа (например, поле affectedTasks) без поломки существующих клиентов.
  - MCP: то же в результате инструментов update_task_type, update_enum и т. п., чтобы агент видел последствия своего выбора.
  - Консоль: после успешного выбора писать, например, «Removed 'P1' from 12 tasks» / «Reassigned 'P1' → 'P2' in 12 tasks» / «Kept field 'X' as an extra field in 7 tasks»; в --json — число.
  - Интерфейс (когда появится), README, тесты: число совпадает с реальным числом переписанных задач, при выборе без затронутых задач — 0.
  То же желательно для каскадов, где число задач сейчас тоже не возвращается (удаление серии, чистка), если они уже отдают счётчик — выровнять формат. Зависит от слияния TSK-73, TSK-74 и TSK-75.
