title: 'Rust, фаза 1: крейт tasker-files — разбор YAML (saphyr), свой эмиттер байт в байт, formatVersion'
description: |-
  Фаза 1 плана docs/rust-migration-plan.md, п. 2.

  Разбор YAML файлов .tasker через saphyr в модели tasker-core с игнорированием неизвестных ключей. Собственный эмиттер, повторяющий YamlDotNet 18.1: LF, UTF-8 без BOM, camelCase, порядок ключей и пропуск null/false/пустых списков как в Storages/*File.cs, последовательности под ключом без отступа, многострочные строки литеральным блоком |/|-, кавычки только у строк, которые иначе прочитались бы как число/bool/null ('007', 'true'), DateTimeOffset в формате O (7 знаков, +00:00), Guid в форме D. formatVersion: 9 первой строкой; файлы новее не читать; старые читать с апгрейдом в памяти (замена номера).

  Критерий: для каждого файла golden-корпуса parse → emit даёт идентичные байты (кроме файлов старых версий — там совпадение с эталоном после апгрейда).
