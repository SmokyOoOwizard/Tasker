title: 'Демон: tasker mcp start/status сразу после старта может показать рабочий процесс без сборки (build пуст)'
description: |-
  Гонка в .NET-супервизоре (Supervisor.cs, McpWorker.cs). Рабочий процесс сначала открывает области (WorkspaceSync.Apply обновляет DaemonState), потом шлёт супервизору ready с версией и сборкой; супервизор рассылает workers уже со сборкой. Между этими шагами /daemon/status отвечает: области open, а у рабочего процесса build и version пустые (список workers пришёл из первой рассылки StartWorker, до ready). DaemonController.WaitReady ждёт только областей, поэтому tasker mcp start возвращается в этом окне.

  Как воспроизвести: DaemonUpgradeTests.Status_json_lists_the_worker_with_its_build с быстрой консолью (Rust, TASKER_BIN) и .NET-демоном/Rust-демоном без поправки — Assert.NotEmpty(build) падает; с .NET-консолью окно прячет медленный старт dotnet.

  Поправка в Rust-демоне (TSK-139): рабочий процесс сам подставляет свою версию и сборку в свою запись workers (DaemonState.identify), протокол не меняется. Для .NET — то же в McpWorker (state.SetWorkers с подстановкой своей сборки) или WaitReady ждать непустой сборки у активного рабочего процесса.
