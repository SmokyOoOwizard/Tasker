title: 'Rust-сервисы: параллельные add link в свежей области изредка дают «link type not found» для типа по умолчанию'
description: 'Найдено в TSK-141 (cargo nextest на macos-latest в GitHub Actions): tasker-services/tests/links.rs concurrent_links_from_one_task_without_a_version_are_all_kept падает с Validation("TypeId: link type not found in the project: <id Duplicate>") — шесть потоков одновременно добавляют связь типа Duplicate (тип по умолчанию с детерминированным id) от одной задачи. Воспроизводится локально под нагрузкой: 120 запусков теста по 12 параллельно — 2–5 падений, и с кодом индекса из main (до TSK-141), т. е. не связано с правкой TSK-153. Похоже на гонку чтения типа связи из индекса/файла по умолчанию с одновременной записью задач (пересинхронизация индекса или ленивое создание типов по умолчанию). В CI nextest повторяет упавший тест (retries = 2, профиль ci) и помечает его FLAKY — после исправления повтор можно убрать.'
