title: 'Rust-сервисы: параллельные add link в свежей области изредка дают «link type not found» для типа по умолчанию'
description: 'Найдено в TSK-141 (cargo nextest на macos-latest в GitHub Actions): tasker-services/tests/links.rs concurrent_links_from_one_task_without_a_version_are_all_kept падал с Validation("TypeId: link type not found in the project: <id Duplicate>") — шесть потоков одновременно добавляют связь типа Duplicate от одной задачи в проекте без сохранённых типов. Причина: LinkTypeService::ensure_defaults не атомарен — первый запрос записывает шесть типов по умолчанию по одному, второй, увидев уже записанную часть (набор не пуст), добавляет только недостающие иерархические (missing) и не находит Duplicate. Локально под нагрузкой (120 запусков по 12 параллельно) — 2–5 падений, и с кодом индекса из main. Та же гонка есть в .NET (LinkTypeService.EnsureDefaults) — там не исправлялась. Исправлено в TSK-141: если записывать есть что, ensure_defaults перечитывает набор и записывает в секции записи проекта (Workspace::exclusive, write.lock); обычный путь (всё уже записано) не изменился. После правки: 240 запусков по 12 параллельно — 0 падений.'
