title: 'Rust, фаза 4: супервизор и воркер — --listen-fd, NDJSON-протокол, AcceptGate, дренаж, backoff, upgrade с require'
description: |-
  Фаза 4 плана docs/rust-migration-plan.md, п. 3 и раздел 3.3. Ключ к бесшовному переходу: .NET-супервизор по tasker mcp upgrade запускает Rust-воркер, порт не закрывается.

  Сокет без FD_CLOEXEC и --worker --listen-fd N (tokio TcpListener::from_std), протокол NDJSON по stdin/stdout с префиксом @tasker у строк воркера и сообщениями hello/ready/activate/active/drain/stop/workers/request/reply, AcceptGate (accept только при открытых воротах, Connection: close при дренаже, 503 + Retry-After: 1 в фазе закрытия), перезапуск с backoff 0/1/2/5/10 с и лимитом 5 падений в минуту, upgrade с проверкой require, таймауты дренажа TASKER_MCP_DRAIN_*. Windows (не проверено): Job Object, WSADuplicateSocketW и listenSocket: "wsa:<base64>", --supervised / TASKER_MCP_SUPERVISOR. tasker mcp run (foreground).

  Критерий: DaemonTests, DaemonUpgradeTests, ParallelWorkTests проходят с Rust-бинарниками; тест в Docker: .NET-демон под systemd → upgrade на Rust-воркер без закрытия порта; tools/Tasker.Stress на смешанных клиентах (Rust-консоль + Rust-демон + .NET-десктоп REST) не находит нарушений.
