title: 'Rust: сверка индекса на каждом вызове дешевле — без stat каждого файла и без трёх обходов папки задач в task create'
description: 'Замеры TSK-136 (docs/rust-migration-results.md): на 2000 задачах сверка индекса с диском (WorkspaceIndex::sync — обход папок и std::fs::metadata каждого файла, ~5 мкс на файл) занимает ~10 мс из 25 у task get, а task create делает три сверки (полная при открытии, exclusive по папке задач под write.lock, refresh после записи) — 39 мс против 15 на 100 задачах. Варианты без изменения смысла: (1) getattrlistbulk на macOS / statx-обход по дескриптору каталога (fstatat относительно dirfd вместо полного пути) — меньше системных вызовов и разбора пути; (2) пропускать неизменившиеся каталоги по mtime каталога (новый/удалённый файл меняет mtime папки; правка на месте — нет, поэтому только как первый уровень проверки); (3) в task create не сверять папку задач второй раз сразу после полной сверки при открытии, если write.lock взят без ожидания. Любое из этого меняет гарантии свежести индекса — решать вместе с .NET-движком (тот же алгоритм у WorkspaceIndex.Sync).'
