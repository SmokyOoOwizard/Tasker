title: 'Установщик для Linux: вызывать tasker mcp upgrade'
description: |-
  Для Linux нет install-скрипта; когда появится, после копирования сборки он должен вызывать tasker mcp upgrade (как scripts/install-macos.sh), с флагом --restart. Связано с TSK-103.

  ВЫПОЛНЕНО В TSK-120: общий scripts/install.sh для macOS и Linux после копирования сборки вызывает `tasker mcp upgrade` (при неудаче — без молчаливого перезапуска, с подсказкой `tasker mcp upgrade --restart`; флаг `--restart` перезапускает по просьбе).
