title: 'Rust: поддержка SQLite-областей в консоли и демоне (та же схема EF Core, совместная работа с .NET-десктопом и сервером)'
description: |-
  Решение пользователя 2026-10-10: .NET-консоли в релизе больше нет, поэтому Rust-консоль и демон должны поддерживать SQLite-области (--sqlite <файл> в консоли, kind: "sqlite" у областей демона) вместо ответа «use the .NET build of Tasker». Вариант (а) из docs/rust-migration-plan.md (раздел 1, п. 1): перенос на rusqlite с той же схемой таблиц; Postgres в консоли и демоне не нужен.

  Ограничения: один файл .db одновременно открывают .NET-десктоп, .NET-сервер (EF Core, src/Tasker.Storage.Db) и Rust-консоль/демон. Rust читает и пишет ту же схему, что создаёт EnsureCreated, в тех же форматах значений (Guid, DateTimeOffset, bool, enum, JSON-колонки, коллации, индексы, уникальность), версии сущностей совпадают с .NET (ходят через --expected-version, MCP и REST). Схему не менять, своих таблиц не добавлять, миграций не делать (TSK-1). Блокировки и параллельная запись — как у .NET (журнал, busy timeout, транзакции), без потерь, дублей номеров серий и нарушений EditLock.

  План: 1) трейты хранилища в tasker-services по образцу I*Storage, файловая реализация за трейтом без изменения поведения; 2) SQLite-хранилище на rusqlite, создание новой БД с эталонной схемой (rust/tests/golden/sqlite/schema.sql); 3) --sqlite во всех командах консоли как у .NET; 4) области kind: sqlite в демоне и MCP, mcp workspace add <файл.db>; 5) golden-корпус: раздел sqlite в scripts/golden/generate.py, .NET-тесты с хранилищем sqlite против Rust через TASKER_BIN; 6) тест совместной записи .NET и Rust в один файл; 7) документация (wiki, план переноса, rust/README.md).
