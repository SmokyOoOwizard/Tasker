title: 'Стресс-тест параллельной работы: 10 агентов в одном проекте (CLI и MCP), блокировки и конфликты'
description: |-
  Проверить, что с одной рабочей областью и одним проектом одновременно нормально работают многие клиенты: например, 10 параллельных агентов (консоль `tasker`, MCP, смесь) создают, правят, переносят и удаляют задачи в одном проекте. Нужно выяснить, нет ли конфликтов, потерянных обновлений, дублей, порчи файлов и индекса, зависаний, и нормально ли отрабатывают блокировки (оптимистическая версия, блокировка на время правки EditLockService, межпроцессные блокировки записи/индекса, ожидание блокировок в массовых правках). Провести стресс-тест, исправить найденное, оставить стенд в репозитории.

  Что проверять (сценарии):
  1. Создание: N клиентов × M задач одновременно в одну серию — номера серии TSK-N уникальны и без пропусков? (дубликаты номеров — это сегодня «штатный» случай слияния git, но НЕ должен возникать при параллельной работе одной области); все задачи созданы (число совпадает), файлы целы, индекс = файлам (`tasker sync`/`cleanup --check` чистые).
  2. Правка одной и той же задачи: несколько клиентов одновременно меняют заголовок/описание/поля/статус — оптимистическая версия: нет «молчаливо потерянных» обновлений (каждый получает либо успех, либо `modified`/409 и может повторить); итоговая версия согласована; история не портится.
  3. Правки разных задач одним проектом параллельно — ничто не блокируется без нужды (нет глобальной сериализации, ломающей скорость), и нет повреждений.
  4. Блокировка на время правки: `lock acquire` разными держателями (агент A, агент B, cli, local), срок 2 минуты и продление, мгновенное освобождение, отказ `Locked` для чужих правок, ожидание блокировок в массовых правках (CascadeWait 30 с): нет взаимных блокировок (deadlock), нет вечных блокировок после падения клиента (процесс убит `kill -9` посреди операции), нет «залипания» блокировки записи (`.cache/write.lock`) после обрыва.
  5. Массовые операции параллельно с обычными: удаление серии, `cleanup`, смена полей типа/значений перечисления (каскады), перенос по доске, связи (`task link` в обе стороны одновременно: нет рассинхрона обратных ссылок), удаление задачи во время правки.
  6. MCP: те же сценарии через HTTP `/mcp` (несколько агентов с `X-Tasker-Agent`, общий демон, аргумент `workspace`, несколько областей одновременно), CLI через демон и CLI напрямую (без демона) одновременно с MCP; десктоп (REST) как ещё один клиент.
  7. Режимы хранения: файловое (YAML + SQLite-индекс) и БД (SQLite, Postgres, если доступен): отдельно прогнать оба.
  8. Падения: убитый процесс посреди записи (kill -9) — файл не полу-записан (атомарная запись через временный файл и переименование?), индекс восстанавливается сам, блокировки не залипают.
  9. Производительность под нагрузкой: время вызова от числа клиентов (связано с TSK-92 — деградация CLI со временем): график latency p50/p95/p99, пропускная способность (операций/с), поиск узких мест (очереди блокировок, сверка индекса на каждый вызов).
  10. События (SSE, наблюдатель файлов): подписчики получают согласованные события при потоке изменений, нет потерь/дублей и зависаний.

  Как сделать: воспроизводимый стенд (скрипт/проект тестов или отдельный инструмент `tools/stress`, запускаемый вручную и частично в CI с меньшими числами): параметры — число клиентов, число операций, тип (cli/mcp/mix), хранилище, сценарии; в конце проверки инвариантов (число задач, уникальность номеров серии, версии, целостность файлов YAML, `sync`/`cleanup --check`, индекс = файлам, нет залипших блокировок) и отчёт (успехи, ожидаемые конфликты `modified`/`Locked`, неожиданные ошибки, latency). Результаты — в README (раздел «Параллельная работа») и список найденных проблем: каждую — отдельной задачей в Tasker (Баг) либо исправить сразу, если мелкое. Тестовые данные в отдельной временной папке, НЕ в рабочем репозитории и не на настоящем демоне 5719 (поднять свой демон на свободном порту). Первый шаг — разведка: прогнать базовые сценарии 1, 2, 4 и 6 с 10 клиентами, оценить масштаб проблем, затем план остального.
