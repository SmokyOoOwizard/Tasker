title: 'Консоль: task get по id файла с конфликтом слияния падает необработанным исключением YamlDotNet'
description: |-
  Найдено golden-корпусом (TSK-124, rust/tests/golden, задача conflicted-title-ours-cccccccc.yaml в проекте Legacy).

  tasker sync и task list корректно показывают файл с маркерами <<<<<<< / ======= / >>>>>>> как «Unresolved git merge conflict» и исключают его из списков, migrate пропускает его. Но tasker task get <id> этого файла (по полному id или по первым 8 знакам) не проверяет маркеры и отдаёт пользователю необработанное исключение YamlDotNet.Core.SemanticErrorException со стеком (TaskService.Resolve → EntityFiles.GetById → YamlFile.Read). Ожидается аккуратная ошибка вида «Unresolved git merge conflict: fix the file first» с кодом выхода 1; то же для MCP get_task (скорее всего, тот же путь). Проверить и другие сущности (status get, board get по id). Тест на процесс в сквозных тестах; при исправлении добавить снапшот task-get-conflict в scripts/golden/generate.py (сейчас намеренно не снимается).
