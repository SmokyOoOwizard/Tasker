title: 'MCP: inputSchema вложенных объектов объявляет required, которые не обязательны'
description: 'Схемы инструментов .NET (create_board/update_board: columns[].required = [id, name, statusIds, dropStatuses]; create_task_type/update_task_type: fields[].required = [fieldId, required] и др.) перечисляют в required все параметры конструктора записи C#. Но SDK вложенные объекты разбирает JsonSerializer, и пропущенное свойство становится null/значением по умолчанию: тесты (FieldsMcpTests, BoardFieldFilterMcpTests) сами шлют колонки без id. Клиент, который проверяет аргументы по схеме, вынужден слать id: null и dropStatuses: null. Найдено при переносе MCP на Rust (TSK-138): Rust-сервер повторяет поведение .NET — required проверяется только у аргументов верхнего уровня. Исправить: убрать из required вложенных схем nullable-свойства и свойства со значением по умолчанию (или пометить их как необязательные в записях).'
