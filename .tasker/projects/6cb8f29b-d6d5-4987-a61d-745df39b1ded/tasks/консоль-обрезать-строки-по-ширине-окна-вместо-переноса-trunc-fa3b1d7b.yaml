id: fa3b1d7b-eedd-42ec-b6dd-9a5d923e2c6a
title: 'Консоль: обрезать строки по ширине окна вместо переноса (--truncate, --width)'
description: |-
  Строки текстового вывода консоли переносятся терминалом, когда окно узкое: список задач превращается в каша из обрывков, колонки (выровнены в TSK-91) съезжают. Нужна возможность обрезать строки по ширине окна (без переноса): длинный заголовок задачи заменяется началом с многоточием, строка занимает ровно одну строку терминала.

  Что сделать (детали согласовать с пользователем перед реализацией):
  - Параметр: `--truncate` (псевдоним `--no-wrap`) для текстового вывода списков: `task list`, `task links`, `board tasks`, `board show`, блок links в `task get`, `… list` по всем сущностям (общий форматировщик Table.cs из TSK-91); значение по умолчанию — выбрать (рекомендация: включено автоматически, когда вывод идёт в терминал (TTY) и ширина известна; выключено при перенаправлении в файл/конвейер, где обрезать нельзя; параметр `--no-truncate` отключает). Явная ширина: `--width N` (для скриптов и тестов; `0`/`auto` = по терминалу), переменная окружения `TASKER_WIDTH`, при необходимости настройка в глобальных настройках.
  - Определение ширины: размер окна терминала (Console.WindowWidth / ioctl TIOCGWINSZ, обработка отсутствия TTY и нулевой ширины, COLUMNS), пересчёт при каждом вызове; ширина считается как отображаемая ширина символов (кириллица 1, эмодзи и CJK 2, комбинируемые знаки 0 — как в TSK-91), а не длина UTF-16; суррогатные пары и графемы не разрываются.
  - Что обрезается: последняя колонка (заголовок/название) укорачивается до оставшейся ширины и получает `…` (один символ многоточия); если даже без последней колонки строка не помещается — обрезается справа с `…`; минимальная ширина (например, 20) — ниже не сжимаем, чтобы не получить пустой вывод; ссылки, статус и тип не обрезаются, пока можно обрезать заголовок. Не обрезать: `--json`, `task get` (текст описания — перенос полезен), сообщения об ошибках и подсказки пагинации.
  - Многострочные значения (описания в `get`) не затрагиваются; отступы `board show` учитываются в ширине.
  - Автодополнение (`--truncate`, `--width`), мануал (`tasker manual tasks`), README, тесты: узкая ширина, широкая, кириллица и эмодзи на границе, задача без типа, заголовок короче ширины, неизвестная ширина, перенаправление (не TTY) — не обрезает по умолчанию, `--width` задаёт явно, `--json` не меняется. Связано с TSK-91 (выравнивание колонок: после обрезки колонки остаются выровнены).
