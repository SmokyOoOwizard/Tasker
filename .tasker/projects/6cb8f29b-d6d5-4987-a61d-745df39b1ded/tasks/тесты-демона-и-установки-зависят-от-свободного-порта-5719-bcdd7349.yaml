title: Тесты демона и установки зависят от свободного порта 5719
description: 'Когда на машине работает настоящий демон MCP (порт 5719 по умолчанию, автозапуск launchd), падают DaemonLauncherTests.Tasker_without_the_daemon_next_to_it_says_so_instead_of_failing_obscurely, InstallScriptTests.Install_upgrade_and_uninstall_work_end_to_end и InstallScriptTests.Without_the_daemon_only_the_command_line_tool_is_installed: mcp start в изолированном TASKER_HOME видит чужой демон на дефолтном порту. Нужно задавать каждому такому тесту свободный порт (как делает DaemonFixture) через настройки изолированного каталога.'
