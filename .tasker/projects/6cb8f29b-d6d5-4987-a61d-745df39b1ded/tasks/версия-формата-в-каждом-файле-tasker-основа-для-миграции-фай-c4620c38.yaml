title: Версия формата в каждом файле .tasker — основа для миграции файлов
description: 'В каждом файле .tasker (задача, статус, набор, тип, доска, серия, тип связи, проект, пользователь) хранить версию формата/API Tasker, с которой он создан или последний раз записан (например, поле formatVersion: 1 или apiVersion). Зачем: уметь мигрировать файлы при изменении формата — по версии понимать, какой формат у файла и как его читать. Соображения: версия формата — не версия сущности (та намеренно не хранится в файле, чтобы git-слияния не конфликтовали); формат меняется редко, поэтому конфликты слияния только там, где ветки реально на разных форматах; файл без поля — формат 1 (все существующие); новый Tasker читает старые форматы и мигрирует при записи; старый Tasker отказывается писать файл более нового формата (сообщает, что нужно обновиться); команда tasker migrate (и проверка в sync/cleanup) для массовой миграции; файл более нового формата показывается в списке проблем (workspace/problems), а не молча ломается. Связано с TSK-1 (миграции БД): у БД своя схема миграций, здесь — файловое хранилище.'
