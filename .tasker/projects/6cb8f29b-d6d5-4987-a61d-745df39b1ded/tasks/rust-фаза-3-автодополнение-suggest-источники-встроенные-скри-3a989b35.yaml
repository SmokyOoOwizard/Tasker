title: 'Rust, фаза 3: автодополнение ([suggest], источники, встроенные скрипты), PerfTrace, размер и скорость бинарника'
description: |-
  Фаза 3 плана docs/rust-migration-plan.md, п. 3–4. Директива [suggest] и источники подсказок (как Sources.cs: проекты, задачи по префиксу, статусы, типы, поля…), существующие скрипты tasker.bash/zsh/ps1/fish встраиваются как есть через include_str! и печатаются tasker completion <shell> байт в байт. PerfTrace (TASKER_PROFILE=1), чтобы scripts/perf/bench.py работал без изменений.

  Критерий: bench.py calls показывает целевые времена (единицы-десятки мс на вызов); бинарник статически слинкован и весит единицы МБ; сравнить с базовой линией фазы 0 и записать числа.
