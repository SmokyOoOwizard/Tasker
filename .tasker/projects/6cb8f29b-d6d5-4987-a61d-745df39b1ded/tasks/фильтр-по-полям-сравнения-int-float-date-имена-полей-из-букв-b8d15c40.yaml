title: 'Фильтр по полям: сравнения (int, float, date), !=, имена полей из букв и цифр'
description: |-
  Расширение фильтра по полям (после TSK-76: `task list --field Имя=значение`, `GET /tasks?field=…`, `list_tasks` с `field`, колонки доски `--field`). Этап 1: сравнения для полей каталога. Фильтр по собственным полям задач вынесен в отдельную задачу TSK-87 (блокируется этой).

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение пройдено):
  1. Операторы: `=`, `!=`, `>`, `>=`, `<`, `<=`. В консоли условия с `<`/`>` пишутся в кавычках (`--field "Estimate>=3"`), в REST и MCP кавычки не нужны (в URL — кодирование). Диапазон `3..8` НЕ делаем: два условия (`">=3"` и `"<=8"`) уже объединяются по И. Несколько условий по одному полю — по И, как сейчас.
  2. Типы: `>` `>=` `<` `<=` — для int, float, date; у string, enum, bool — только `=` и `!=`, иначе ошибка 400 / понятная ошибка консоли с названием типа поля.
  3. Числовые сравнения: в таблицах значений (индекс файлового хранилища и таблицы БД) добавляется ОТДЕЛЬНЫЙ числовой столбец, который заполняется при записи значений int/float (значения уже проверены, плохих не бывает); сравнения идут по нему, индекс на (FieldId, число). Для date сравнение идёт по каноническому тексту yyyy-MM-dd (сортируется как текст). Схема индекса файлового хранилища поднимается и пересобирается сама; в БД миграций нет — существующую базу нужно пересоздать (написать в README, как уже сделано для прежних таблиц). Следить за точностью float (хранить как double; равенство — по каноническому тексту, как сейчас).
  4. Множественные поля: «хотя бы одно значение подходит» для `=`, `>`, `>=`, `<`, `<=`. `!=` означает «ни одно значение не равно X»: подходят и задачи без значения этого поля (это дополнение к `=`: вместе они дают все задачи).
  5. Имена полей могут состоять ТОЛЬКО из букв и цифр (Unicode-буквы, кириллица допустима; без пробелов, `_`, `-`, символов `= ! < > :`). Правило действует в каталоге полей при создании и переименовании (ядро, REST, MCP, консоль, сообщение об ошибке), а также в собственных полях задачи (TSK-87). Проверить существующие данные и тесты на имена, нарушающие правило; для уже созданных полей с недопустимыми именами — решить без потери данных (разрешить читать и фильтровать? предупреждение в sync? — описать в отчёте).
  6. Проверка наличия поля и значения (РЕШЕНО): ключевое слово через двоеточие (двоеточие запрещено в именах полей, поэтому запись однозначна; кавычки не нужны):
     - `--field Имя:set` — у задачи есть значение у поля (хотя бы одно);
     - `--field Имя:unset` — значения нет (в том числе когда поле у задачи не подключено): обратное к `:set`;
     - `--field Имя:attached` — поле подключено к задаче: входит в тип задачи или добавлено задаче как дополнительное, даже без значения;
     - `--field Имя:detached` — поле к задаче не подключено: обратное к `:attached`.
     «Подключено, но не заполнено» получается двумя условиями по И: `--field Имя:attached --field Имя:unset`. Те же слова в REST (`field=Имя:set`) и MCP. Поле типа не хранится в задаче, пока у него нет значения, поэтому «подключено» вычисляется: тип задачи содержит поле ИЛИ у задачи есть запись этого поля (в обоих хранилищах — через соединение с полями типа или данные в индексе; продумать смену типа задачи и добавление/удаление поля у типа). Разбор условия: имя (только буквы и цифры), затем `:слово`, либо оператор, либо ошибка; значения вида `Note=x:y` работают как раньше. Ключевые слова других значений не конфликтуют с `=`-значениями. Для собственных полей задач (TSK-87) те же слова: «подключено» = у задачи есть собственное поле с таким именем.
  Оба хранилища, REST, MCP, консоль (`task list --field`, `board tasks/show --field`), README (раздел «Фильтр по значениям полей»), тесты на оба хранилища, мануал `tasker manual fields` (если он есть в main — обновить страницу и тест примеров), автодополнение (операторы в значениях не требуют отдельной поддержки; убедиться).
