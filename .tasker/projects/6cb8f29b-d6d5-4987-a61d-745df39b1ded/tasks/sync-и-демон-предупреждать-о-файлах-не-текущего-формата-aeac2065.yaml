title: 'sync и демон: предупреждать о файлах не текущего формата'
description: 'Версия формата в файлах .tasker (TSK-66) и tasker migrate готовы, но о файлах старого формата никто сам не сообщает: в tasker sync, git-хуках и логе демона добавить строку вида «N файлов в старом формате: запустите tasker migrate» (по аналогии с отчётом о сериях). Файлы более нового формата уже видны в списке проблем рабочей области; сюда же — понятное предупреждение при открытии папки, где такие файлы есть.'
