title: 'Бесшовное обновление демона: замена на лету без простоя (tasker mcp upgrade)'
description: |
  Сейчас обновление демона = остановка и запуск (`tasker mcp restart`): несколько секунд порт 5719 закрыт, открытые вызовы обрываются, области открываются заново (в этот момент вызовы получают «workspace is opening», TSK-100). Если с демоном постоянно кто-то работает (десять агентов, скрипты, десктоп), перезапуск ломает чужую работу. Нужно обновлять демон бесшовно: клиенты не замечают обновления (в худшем случае — повтор одного запроса).

  Идея (обсудить с пользователем перед реализацией; важные вопросы ниже):
  1. Режим «заменить на лету» (`tasker mcp upgrade`, установщик вызывает его вместо restart): новый демон поднимается РЯДОМ со старым, принимает новые соединения, старый перестаёт принимать новые и доделывает уже принятые запросы (drain с таймаутом), затем выходит. Варианты передачи порта: (а) SO_REUSEPORT на одном порту (macOS/Linux): оба процесса слушают 5719, ядро распределяет соединения, старый закрывает слушающий сокет и дорабатывает; (б) передача слушающего сокета новому процессу (SCM_RIGHTS/наследование дескриптора), порт не закрывается вообще; (в) launchd socket activation / systemd socket activation: сокетом владеет система, демон — потребитель, при замене сокет остаётся открытым (соединения ждут в очереди); (г) два порта + тонкий прокси (хуже). Выбрать и обосновать; Windows пока не поддерживается.
  2. Готовность: эндпоинт `/ready` (и `/health`) — новый демон принимает трафик только когда ВСЕ разрешённые области открыты и индексы прогреты; старый не выходит, пока новый не стал ready; при неудаче старта нового (например, формат файлов новее или порт/ошибка) старый продолжает работать, обновление откатывается с понятным сообщением.
  3. Что происходит с запросами: MCP stateless HTTP — запрос целиком обслуживается одним процессом; при drain старый ждёт завершения активных вызовов (в том числе массовых правок и ожиданий блокировок до CascadeWait 30 с); долгие SSE-подписки (десктоп, /events) разрываются корректно, клиент переподключается к новому; в ответ на запрос, пришедший в окно переключения, — повторяемая ошибка (связано с TSK-100: код «unavailable/retry», Retry-After); клиенты MCP/REST/CLI повторяют такие запросы автоматически (CLI и тесты — один повтор с короткой паузой).
  4. Данные и блокировки: два демона одновременно работают с одной папкой на короткое время — это уже штатно (несколько процессов на папку: межпроцессные блокировки записи, индекс, версии), но проверить: блокировки на время правки (EditLockService) и межпроцессная очередь (index.lock), файл `mcp/daemon.lock` (TSK-51: десктоп отпускает порт, когда демон держит блокировку — при замене держатель меняется: определить владельца блокировки при двух демонах, передача владения), pid-файл/статус `tasker mcp status` (показывать оба на время замены), launchd/systemd: KeepAlive не должен перезапустить «ушедший» старый демон и не должен убить новый (служба владеет процессом: как заменить процесс под управлением службы — например, служба запускает родительский процесс-супервизор, а рабочие процессы меняются внутри; это ключевое архитектурное решение).
  5. Совместимость версий: новый демон может иметь более новый формат файлов (migrate до/после, TSK-66/77/85) и новые инструменты MCP: порядок «сначала новый демон, потом клиенты»; старый демон при встрече файлов нового формата продолжает работать (они читаются как «более новый формат» — не писать); версия протокола между CLI и демоном (DaemonClient) — совместимость назад на одну версию.
  6. Установка (scripts/install-macos.sh, Linux-аналог): после копирования новой сборки вызывает `tasker mcp upgrade`, при невозможности (нет живого демона, ошибка) падает назад на restart; флаг `--restart` для жёсткого перезапуска; сообщение «демон работает на предыдущей сборке» заменяется результатом замены.
  7. Тесты: интеграционные (поднять демон на свободном порту, поток клиентов шлёт вызовы, `upgrade` на лету — ни одного неповторяемого отказа, ни одного потерянного/дублированного write; kill нового при старте — старый остаётся; drain долгих вызовов; SSE-переподключение), стенд tools/Tasker.Stress (TSK-96): сценарий «upgrade under load» с проверкой инвариантов; README (раздел «MCP-демон»: обновление без простоя, ограничения), мануал (`tasker manual install-daemon`).
  Связано: TSK-100 (повторяемая ошибка «opening»/unavailable), TSK-101 (команды через прогретый демон — тонкий клиент делает бесшовность ещё важнее), TSK-51 (владелец порта и daemon.lock), TSK-96 (стенд параллельной работы).

  ## Итог реализации (TSK-103)
  Выбранный дизайн: tasker-mcpd — супервизор (владеет службой launchd/systemd, mcp/daemon.lock и слушающим сокетом, который не закрывается); сервер MCP — рабочие процессы (tasker-mcpd --worker), наследующие сокет (Kestrel ListenHandle) и принимающие из него через «затвор». Замена: новый рабочий поднимается рядом, открывает все области, супервизор открывает затвор ему и закрывает старому; старый доделывает вызовы (тишина 2 с, не дольше 60 с > CascadeWait) и выходит. Откат: новый не поднялся / не открыл область, открытую у старого / не успел за --timeout — старый продолжает работать, причина в сообщении. Рабочий процесс упал — супервизор запускает снова. Демон, запущенный по-старому (один процесс, --single), работает как раньше; upgrade его перезапускает. Подробности и альтернативы — README, «MCP-демон: обновление без простоя».
  Сделано: tasker mcp upgrade [--restart --timeout], /ready и /health, status показывает оба процесса, повтор запросов управления в DaemonClient, установщик вызывает upgrade (--restart), 15 интеграционных тестов DaemonUpgradeTests (под нагрузкой — ноль отказов, ни потерянных, ни продублированных записей; откаты; drain долгого вызова; падение рабочего процесса и супервизора), сценарий upgrade стенда Tasker.Stress, мануал и README.
  Не сделано / ограничения: (1) супервизор сам не обновляется на лету (меняется только перезапуском демона; он мал, обмен с рабочими совместим в обе стороны); (2) SSE в демоне нет (MCP без состояния), переподключать нечего; (3) на Linux проверен только прототип в контейнере (наследование сокета + затвор, 0 отказов), полный набор тестов там не прогонялся: в контейнере CLI не загружает Microsoft.Extensions.Logging.Abstractions (отдельная проблема сборки); (4) Windows не поддерживается (демон в одном процессе); (5) установщик при неудачной замене НЕ делает restart (новая сборка могла не подняться — restart остановил бы и рабочий сервер): выводит причину и подсказку.
