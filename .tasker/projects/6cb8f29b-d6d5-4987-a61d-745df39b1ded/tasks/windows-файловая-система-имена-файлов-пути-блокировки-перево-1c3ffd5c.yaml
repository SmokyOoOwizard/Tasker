id: 1c3ffd5c-31fc-4ce3-bceb-93e0aed0e8cd
title: 'Windows: файловая система — имена файлов, пути, блокировки, переводы строк'
description: |
  Файловое хранилище (.tasker, YAML, SQLite-индекс) должно работать на Windows так же надёжно, как на macOS и Linux.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Что проверить и исправить (по коду и тестами на Windows): (1) имена файлов сущностей `<название>-<id8>.yaml` (EntityFileNames, TSK-67/77): запрещённые в Windows символы `< > : " / \ | ? *`, управляющие, зарезервированные имена (CON, PRN, AUX, NUL, COM1–9, LPT1–9, в том числе с расширением), завершающие точка и пробел, регистронезависимость (две сущности «Баг» и «баг» → имя уже уникально благодаря id8, но проверить), длина пути (MAX_PATH 260: длинные заголовки и вложенность проект/задачи; опция длинных путей `\\?\`/манифест longPathAware, ограничение длины slug так, чтобы весь путь укладывался), нормализация Юникода (macOS NFD, Windows NFC) в имени файла и при сравнении; (2) межпроцессные блокировки (FileLock, IWriteScope, index.lock, write.lock): семантика блокировки файлов Windows (обязательные блокировки, FileShare), удаление или переименование открытого файла невозможно без FileShare.Delete (атомарная запись через временный файл и File.Move/Replace, чтение при записи, SQLite-индекс и его WAL-файлы, удаление `.cache`), залипание блокировки при убитом процессе (на Windows блокировка снимается ОС — проверить), `.yaml.tmp` после обрыва; (3) переводы строк: git autocrlf превращает LF в CRLF — чтение YAML, строка версии формата (замена с сохранением окончания строки, TSK-66), сверка хэша Version (хэш файла зависит от окончаний строк — Version должна быть стабильна после checkout на Windows), `.gitattributes` для `.tasker` (`text eol=lf`)?; (4) наблюдатель файлов (FileSystemWatcher) на Windows: события, задержки, буферы; (5) канонический путь области (`mcp workspace add`, регистр диска и разделители, `C:\` против `c:\`, символические ссылки/junction, UNC-пути, имена папок с пробелами и кириллицей в адресе `workspace`); (6) git-хуки (GitHooks.cs: sh-скрипты через Git for Windows) и права `chmod` (DaemonFiles); (7) каталоги настроек по умолчанию: TASKER_HOME и `settings.json` на Windows (`%APPDATA%\Tasker`?), логи, mcp/daemon.lock. Тесты: общие параметризованные на Windows/Linux/macOS, README.

  СДЕЛАНО (macOS/Linux; код и тесты): правила имён Windows как чистые функции (WindowsNames), всегда-валидное имя файла сущности (слаг NFC), версия файла (хэш) не зависит от CRLF/BOM, запись YAML всегда с LF, чтение с FileShare.Delete и повторы замены/удаления при занятом файле (AtomicFile), ключи блокировок без учёта регистра на Windows, канонический путь (буква диска, \\?\, 8.3, junction), буфер FileSystemWatcher 64 КБ, пути в git-хуках с «/», хуки с LF, предупреждение о длинном пути рабочей папки, .gitattributes `/.tasker/** text eol=lf`, раздел README «Windows: имена, длинные пути, переводы строк». Каталог данных по умолчанию — %LOCALAPPDATA%\Tasker (уже было).

  ПРОВЕРИТЬ НА WINDOWS (PowerShell 7 или Windows PowerShell; нужны .NET SDK 10 и Git for Windows; из корня клона репозитория):
  1. Тесты проходят: `dotnet test tests/Tasker.Tests --filter "FullyQualifiedName~WindowsFileSystemTests"` — ожидается 0 упавших, 0 пропущенных из «Windows_*» (пять тестов Windows_* выполняются, Unix_* пропущен). Затем весь набор `dotnet test` (кроме известных нестабильных SettingsTests.Parallel_updates_are_not_lost и DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up). Тесты GitHooksTests помечены `if (OperatingSystem.IsWindows()) return;` — на Windows они молча проходят; если хотите проверить хуки, уберите эти строки и запустите `dotnet test --filter GitHooksTests` (нужен Git for Windows в PATH).
  2. Имена файлов: `$w = "$env:TEMP\tasker win"; mkdir $w; tasker project create "CON" -w $w; tasker task create "con" -w $w; tasker task create 'NUL: <a>|"b"?*' -w $w; tasker task create "Привет, мир!" -w $w; Get-ChildItem -Recurse $w\.tasker -Filter *.yaml | % Name` — команды без ошибок; имена вида `con-xxxxxxxx.yaml`, `nul-a-b-xxxxxxxx.yaml`, `привет-мир-xxxxxxxx.yaml`, в именах нет `:<>|"?*`.
  3. Длинный путь: создать папку глубиной ~150 знаков (`$d = "$env:TEMP\" + ("a" * 120); mkdir $d`), `tasker project create P -w $d; tasker task create ("x" * 100) -w $d` — задача создаётся; в журнале демона или вывода при открытии есть предупреждение «The workspace path … is longer than 114 characters». `git config --global core.longpaths true` нужен, чтобы git работал с такой папкой.
  4. CRLF: в репозитории с `.tasker` выполнить `git config core.autocrlf true`, переключиться между ветками/сделать `git checkout -- .tasker` (или удалить `.tasker\projects\*\tasks\*.yaml` и восстановить `git checkout -- .tasker`) — файлы теперь с CRLF (`(Get-Content -Raw f.yaml) -match "`r`n"` даёт True). Затем `tasker task get <id>` — читается, поле `version` такое же, как на macOS/Linux для того же коммита; `tasker task update <id> --title "…"` проходит без «изменён другим». Файл после записи — с LF. С `.gitattributes` из репозитория (`/.tasker/** text eol=lf`) файлы приходят сразу с LF.
  5. Замена открытого файла: в одном окне `$f = [IO.File]::Open("<файл задачи>", 'Open', 'Read', 'Read')` (держит файл без FileShare.Delete), в другом `tasker task update <id> --description x` — команда ждёт и завершается успешно после `$f.Dispose()` в первом окне в течение ~1,5 с (если не освободить — ошибка «файл занят», а не зависание).
  6. Блокировки при убитом процессе: запустить `tasker mcp run` (демон, держит блокировки при работе с папкой), убить `Stop-Process -Name tasker-mcpd -Force`, сразу выполнить `tasker task list -w $w` — работает без ожидания 30 с (Windows снимает блокировку сам).
  7. Регистр и пути области: `tasker mcp workspace add c:\temp\...` и `tasker mcp workspace add C:\TEMP\...` — одна область (вторая команда сообщает, что уже добавлена). Папка через короткое имя (`cmd /c dir /x` покажет 8.3, например `C:\Users\RUNNER~1\...`) — та же область. `mklink /J C:\link C:\target` и `workspace add C:\link` — область указывает на C:\target. Папка с пробелом и кириллицей (`C:\Мой проект`) — область добавляется, `workspace` в адресе — `Мой-проект`.
  8. UNC: `tasker task list -w \\localhost\C$\temp\tasker win` — работает (или сообщает, что нет доступа к ресурсу); путь остаётся UNC.
  9. Наблюдатель: открыть папку в демоне/десктопе, сделать `git checkout` на ветку с сотнями изменённых файлов `.tasker` — списки обновляются без перезапуска (при потере событий в журнале «File watcher lost events, rescanning» и полная сверка).
  10. Хуки: `tasker hooks install -w <репозиторий>`; в `.git\hooks\post-checkout` пути `C:/…/tasker.exe` с «/», файл с LF (`[IO.File]::ReadAllText(...).Contains("`r")` = False); `git checkout <ветка>` в Git Bash/PowerShell — кэш обновляется (`tasker sync` не падает).
  11. Каталог настроек: без TASKER_HOME `tasker mcp config` показывает путь `%LOCALAPPDATA%\Tasker\settings.json` (после `tasker mcp workspace add <папка>` файл появляется); `$env:TASKER_HOME='D:\t'` переопределяет.
