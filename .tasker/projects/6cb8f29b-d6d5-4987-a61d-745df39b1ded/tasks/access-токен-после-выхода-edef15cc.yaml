title: Access-токен после выхода
description: |-
  Раздел бэклога: Агенты и MCP.

  Выход отзывает refresh-токены сессии, но уже выданный access-токен действует до своего срока (до 15 минут). Если нужно мгновенно — проверять сессию при каждом запросе (id сессии в JWT).
