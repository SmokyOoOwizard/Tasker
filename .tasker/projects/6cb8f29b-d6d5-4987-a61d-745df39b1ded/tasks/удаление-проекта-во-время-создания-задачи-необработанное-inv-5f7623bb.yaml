title: 'Удаление проекта во время создания задачи: необработанное InvalidOperationException (тип или набор статусов не найден)'
description: "Найдено стендом tools/Tasker.Stress (сценарий delete-project): пока идёт tasker project delete, параллельные create_task и task create иногда падают с необработанным исключением: Task type ... of task ... not found (TaskService.GetFields через Describe) или Status set ... of task type ... not found. В MCP агент видит общее 'An error occurred invoking create_task', в консоли 'Unhandled exception'. Ожидание: [not_found] или [invalid] с понятным текстом. Воспроизведение: dotnet run --project tools/Tasker.Stress -- --scenarios delete-project --client mix. Воскрешение папки удалённого проекта уже исправлено в TSK-96."
