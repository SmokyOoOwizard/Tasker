id: d84b3f5f-a3ba-4f98-be41-6a455141dbb9
title: 'Иерархия задач в task list: эпик и дочерние задачи с отступом (несколько родителей, --flat)'
description: |-
  Иерархия задач в выводе `task list`: если у задачи (эпика) есть дочерние задачи, то в списке сразу после неё с отступом идут её дочерние задачи (вывод строк остаётся таким же, как сейчас: ссылка, статус, тип, заголовок). Отступ — один «таб» на уровень вложенности (два уровня — эпик → задача → подзадача).

  Сегодня иерархии в Tasker нет: стандартные типы связей (Blocks, Cloners, Duplicate, Problem/Incident, Relates) не выражают «родитель и потомок». «Эпик» — не тип задачи, а любая задача, у которой есть дочерние.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение пройдено):
  1. Иерархия задаётся ИЕРАРХИЧЕСКИМ ТИПОМ СВЯЗИ: признак «иерархия» у типа связи (рядом с AllowCycles из TSK-97; задаётся при `link-type create/update`, в REST, MCP, файле типа связи (версия формата/миграция по правилам проекта, FormatVersions.Current сейчас 8) и в БД). Добавляется стандартный тип «Parent/Child» (читается «includes» от родителя и «is part of» от потомка) с признаком иерархии, запретом циклов и пользовательским переопределением; пользовательские типы (например, «входит в / включает» из других проектов) тоже можно сделать иерархическими. Проверить, как добавляются виртуальные типы по умолчанию (TSK-66/68: версия `default`, запись при первой записи) — новый стандартный тип должен появиться в существующих проектах без миграции данных. Эпик = задача, у которой есть исходящие связи этого типа; потомок — цель связи. Направление: связь «parent includes child» хранится у родителя (как все связи).
  2. У задачи МОЖЕТ БЫТЬ НЕСКОЛЬКО РОДИТЕЛЕЙ (одна задача входит в несколько эпиков). Значит иерархия — ориентированный ациклический граф, а не дерево. Циклы запрещены (проверка из TSK-97 для иерархических типов, обязательна).
  3. В списке задача с несколькими родителями показывается ПОД КАЖДЫМ из них (строка повторяется вместе со своим поддеревом); число найденного (`Found N`, TSK-107) считает уникальные задачи, а не показанные строки. Защита от разрастания: ограничение глубины отрисовки (например, 10 уровней) и от повторного показа одного поддерева в пределах одной ветки; решить и описать, как помечать повтор (например, суффикс `(+)` у повторных строк или без пометки).
  4. Фильтры: фильтр действует на каждую задачу отдельно. Если эпик попал в результат — под ним идут дочерние, которые тоже попали в результат (с отступом); дочерние, не прошедшие фильтр, не показываются; если дочерняя подходит, а её эпик нет — она показывается на ВЕРХНЕМ уровне как обычная строка без отступа (эпик как контекст не подтягивается). Если у дочерней несколько родителей, часть которых в результате: под каждым из попавших, на верхний уровень — только если не попал ни один родитель.
  5. Правило включено ВСЕГДА (по умолчанию) и отключается параметром `--flat` (плоский список, как раньше; для скриптов и привычного порядка). `--json` остаётся ПЛОСКИМ списком (не ломаем клиентов): в записи задачи появляются `parentIds` (массив id родителей по иерархическим связям) и `childCount`; в MCP `list_tasks`/`find_tasks_by_reference` те же поля; структура-дерево в JSON не строится.
  6. Пагинация и сортировка: страница не должна разрывать эпик и его поддерево (дочерние не уходят на следующую страницу отдельно от родителя) — постранично листаются верхний уровень (строки без родителя в результате), поддеревья показываются целиком; формат итога `Found N, shown …` (TSK-107) продумать (число найденных уникальных задач и число показанных верхних уровней; `--offset/--limit` считаются по верхнему уровню — описать явно). Сортировка (`--sort`, TSK-98) применяется и к верхнему уровню, и к дочерним внутри каждого родителя. Загрузка поддеревьев — запросами по индексу связей (оба хранилища), без загрузки всех задач в память; производительность на тысячах задач.
  7. Отступ входит в первую колонку таблицы (колонки остаются выровнены, TSK-91), учитывается в ширине при обрезке строк (TSK-106; итог/заголовок не обрезаются), в вертикальном выводе `board show`/`board tasks` дерево НЕ строится (доски — по статусам, не по иерархии) — не менять.
  Дополнительно (желательно, если просто): `task create --parent TSK-5` (и `task update --add-parent/--remove-parent`) как короткая запись для связи иерархического типа; `task get` показывает «parents:»/«children:» блоком links как сейчас (связи видны с обеих сторон, TSK-90).

  Объём: ядро (признак типа связи, чтение родителей/потомков пачкой, стандартный тип), оба хранилища (файловое: индекс task_links, БД), REST (`GET /tasks`: `flat`/поля `parentIds`, `childCount`), MCP (поля в записях), консоль (`task list`, `--flat`), автодополнение (`--flat`, `--hierarchy` у link-type; сторожевой тест значений), мануал (`tasker manual links`/`tasks`: как сделать эпик и подзадачи), README, тесты на оба хранилища (эпик с детьми, несколько родителей, вложенность в два-три уровня, фильтры по статусу (ребёнок есть — эпика нет, и наоборот), сортировка, пагинация, `--flat`, `--json`, обрезка/выравнивание, повторы, циклы запрещены, стандартный тип без миграции). Связано: TSK-97 (запрет циклов), TSK-90 (входящие связи), TSK-91 (выравнивание), TSK-98 (сортировка), TSK-105 (фильтры), TSK-106 (обрезка), TSK-107 (итог).
