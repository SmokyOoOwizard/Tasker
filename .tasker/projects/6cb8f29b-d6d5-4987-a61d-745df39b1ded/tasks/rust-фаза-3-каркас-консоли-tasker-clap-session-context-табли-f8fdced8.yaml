title: 'Rust, фаза 3: каркас консоли tasker — clap, Session, Context, таблицы, --json, коды выхода, тексты ошибок'
description: |-
  Фаза 3 плана docs/rust-migration-plan.md, п. 1. Крейт tasker-cli, синхронный код без tokio.

  clap builder API (дерево команд по одной ветке, как CliApp.BuildRoot), глобальные опции (-w, --sqlite с явной ошибкой «используйте .NET-сборку», -p, --json, -q, --truncate/--no-truncate/--width), Session (открытие области, проверка папки, TASKER_PROJECT и единственный проект), Context (таблицы с выравниванием, обрезка по ширине, --json без отступов, строка Found N, shown a-b, коды выхода 0/1/2/3, тексты ошибок Not found: / In use: / Locked: / Modified by someone else:), терминал и ширина (COLUMNS/LINES под watch), UTF-8 на Windows, тексты справки.

  Критерий: справка и ошибки совпадают со снапшотами фазы 0 построчно.
