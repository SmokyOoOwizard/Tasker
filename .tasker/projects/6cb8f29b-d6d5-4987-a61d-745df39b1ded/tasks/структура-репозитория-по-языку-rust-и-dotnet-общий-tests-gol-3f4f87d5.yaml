title: 'Структура репозитория по языку: rust/ и dotnet/, общий tests/golden, без остатков перехода на Rust'
description: |-
  Код разделяется по языку, у каждой половины свой инструментарий.

  Целевая структура:
  rust/      — Cargo workspace: Cargo.toml, crates/* (консоль, демон, библиотеки), свои тесты; .cargo/, .config/nextest.toml, rustfmt.toml
  dotnet/    — Tasker.slnx, Directory.Build.props, src/* (десктоп, сервер, библиотеки), tests/Tasker.Tests, tools/Tasker.Stress, tools/RustBinaries.targets
  tests/golden/ — общий корпус эталонов поведения консоли и демона (сейчас rust/tests/golden): им пользуются Rust-тесты и .NET-тесты
  frontend/, scripts/, docs/wiki/, .tasker, VERSION, README.md — в корне, как сейчас.

  Перенос (git mv, чтобы история файлов сохранилась) и всё, что от него зависит:
  - ProjectReference во всех .csproj, Tasker.slnx, Directory.Build.props, пути в tools/RustBinaries.targets (к rust/ и к frontend/);
  - rust/.cargo/config.toml, .config/nextest.toml, .gitignore, .gitattributes;
  - оба workflow CI (.github/workflows/release-build.yml, dotnet-tests.yml): фильтры путей, рабочие каталоги, пути к результатам;
  - scripts/release.sh, scripts/install.sh и install.ps1 (--from-source), scripts/test-linux*.sh, scripts/perf/*;
  - пути к корпусу в Rust-тестах (~20 файлов) и .NET-тестах (AutostartTests, WindowsConsoleTests и др.), TestWorkspace и путь к бинарникам;
  - README, rust/README.md, вики «Разработка» (структура, команды сборки и тестов).

  Удалить остатки перехода:
  - rust/spikes/ (rmcp-echo, yaml-emitter);
  - docs/rust-migration-plan.md, docs/rust-migration-baseline.md, docs/rust-migration-results.md, docs/perf-baseline/ и ссылки на них;
  - scripts/test-shared-index.py, scripts/test-sqlite-shared.py (нужна .NET-консоль 0.1.0, которой нет);
  - scripts/golden/generate.py целиком: эталоны переснимаются из Rust-тестов — TASKER_GOLDEN_UPDATE=1 cargo test перезаписывает файлы tests/golden, обычный cargo test сверяет; README корпуса — как переснимать и что в нём, без истории снятия с .NET;
  - в install.sh и install.ps1 — уборку .NET-файлов при обновлении со старой установки и сообщение про .NET-супервизор;
  - .NET-специфику в замерах: колонку jit в TASKER_PROFILE (PerfTrace), DOTNET_gcServer и фазы JIT в scripts/perf/bench.py;
  - в Rust-коде — комментарии со ссылками на удалённую C#-консоль и демон («порт EntityFiles.cs», «как в .NET», имена тестов …_like_dotnet, …_match_the_dotnet_snapshots): переписать как описание поведения. Ссылки на .NET-код, с которым Rust делит формат (хранилище десктопа и сервера: файлы .tasker, index.db, схема SQLite, протокол демона), оставить.

  Поведение консоли, демона, десктопа и сервера не меняется.

  Проверка: cargo test (в том числе сверка с tests/golden), dotnet build и dotnet test, scripts/release.sh для своей платформы, install.sh --from-source во временный префикс, CI зелёный на трёх ОС.
