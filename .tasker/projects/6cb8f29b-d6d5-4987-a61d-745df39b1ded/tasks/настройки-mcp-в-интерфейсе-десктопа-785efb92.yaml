title: Настройки MCP в интерфейсе десктопа
description: |-
  Раздел бэклога: Консоль.

  Сейчас настройки меняются командами `tasker mcp …`, десктоп их только читает (адрес MCP области в существующей вкладке «Агенты»). Нужна страница во фронтенде: состояние демона, список областей, порт, кнопки запуска, остановки и автозапуска.
