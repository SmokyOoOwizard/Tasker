title: 'Общий MCP: один адрес для всех рабочих областей, область — аргумент вызова'
description: |-
  Сейчас MCP привязан к рабочей области: адрес http://127.0.0.1:5719/w/<папка>/mcp, на каждую область приходится отдельное подключение у Claude, ChatGPT и других клиентов. Нужен один общий адрес http://127.0.0.1:5719/mcp, а рабочую область агент указывает аргументом вызова.

  РЕШЕНИЯ (согласованы с пользователем):
  1. Область — необязательный аргумент workspace в каждом инструменте (имя папки, как в list_workspaces, либо канонический путь). Сервер остаётся без состояния (stateless HTTP), без select_workspace и сессий. Реализовать централизованно в фильтре вызова по образцу DefaultProject (TSK-59): схема инструментов получает необязательный workspace, фильтр определяет область и подставляет её контейнер; если разрешена ровно одна область, аргумент можно не передавать (как projectId при одном проекте). Ошибки: область не указана при нескольких разрешённых — [invalid] с перечнем доступных и подсказкой list_workspaces; неизвестная или не разрешённая — [not_found], не раскрывая существование других папок.
  2. Новый инструмент list_workspaces (без аргумента workspace): имя, путь, статус (open/failed), число проектов. Агент может указывать только области, разрешённые в настройках (tasker mcp workspace add/remove, у десктопа — открытые вкладки); произвольную папку по пути, которой нет в списке, открыть нельзя.
  3. Адреса /w/<папка>/mcp убираются (и у демона tasker-mcpd, и у MCP десктопа); остаётся /mcp. Адреса REST /w/<папка>/api и интерфейса не меняются. Заголовок X-Tasker-Agent работает как раньше. GET /w/<папка>/api/workspace/mcp (адрес для интерфейса) отдаёт общий адрес /mcp и имя области для агента.
  4. Что обновить: McpRegistration/маршрутизация демона и десктопа, WorkspaceRegistry (разрешение области по имени/пути, суффикс -2 для одинаковых имён — стабильность имён), фильтр вызова и схемы инструментов (~50), логи при открытии области, интерфейс (где показывается адрес MCP и подсказка claude mcp add), README (разделы про MCP без токена, MCP-демон, пример claude mcp add --transport http tasker http://127.0.0.1:5719/mcp), тесты (две области в одном демоне: разные данные по аргументу, одна область без аргумента, ошибки, запрет не разрешённой области, list_workspaces, 404 на старом адресе), инструкции агентам. После слияния — перенастроить уже подключённые клиенты на новый адрес (в т.ч. Claude Code этого репозитория).
