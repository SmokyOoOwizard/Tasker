description: 'CanonicalPath.ActualName (src/Tasker.Storage.Files/Workspaces/CanonicalPath.cs) на каждом компоненте пути перечисляет каталог (EnumerateFileSystemInfos), чтобы узнать настоящий регистр имени. Если область лежит в большом каталоге (системный temp macOS /var/folders/.../T — ~50 000 записей; домашний каталог с тысячами файлов), каждый вызов консоли платит десятки мс. Замер TSK-136 на Rust-порте той же логики: 43 мс на вызов (status list в temp: 53 мс против 10 мс). В Rust исправлено быстрым путём (TSK-136): getattrlist(ATTR_CMN_NAME) по полному пути — если записанное имя совпадает с набранным, каталог не перечисляется. Для .NET: тот же быстрый путь (на macOS — getattrlist через P/Invoke или проверка File.Exists + совпадение регистра через FileSystemInfo по прямому пути); базовая линия docs/rust-migration-baseline.md, вероятно, включает эту стоимость (стенд bench.py создаёт область в системном temp).'
