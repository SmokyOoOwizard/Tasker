title: 'Rust, фаза 0: сквозные тесты с переключаемым бинарником (TASKER_BIN, TASKER_MCPD_BIN)'
description: |-
  Фаза 0 плана docs/rust-migration-plan.md, п. 3.

  Сделать существующие сквозные тесты в tests/Tasker.Tests запускаемыми против любого бинарника: в TestWorkspace / TaskerProcess / DaemonFixture добавить переменные TASKER_BIN и TASKER_MCPD_BIN (сейчас запускают dotnet tasker.dll). Без переменных поведение прежнее.

  Составить список тестов, идущих через CliApp.Run в процессе (BoardConsoleTests, FieldCliTests, …) — для Rust они не годятся; самые ценные перевести на запуск процесса, остальные пометить (категория/трейт) как .NET-only, чтобы прогон с TASKER_BIN их пропускал. Это самая дешёвая проверка паритета: ~840 тестов уже написаны.

  Критерий: dotnet test с TASKER_BIN=<путь к текущему .NET tasker> проходит так же, как без переменной.
