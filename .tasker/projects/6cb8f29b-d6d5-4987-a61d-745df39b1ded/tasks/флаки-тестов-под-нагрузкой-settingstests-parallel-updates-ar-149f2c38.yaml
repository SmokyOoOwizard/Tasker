title: 'Флаки тестов под нагрузкой: SettingsTests.Parallel_updates_are_not_lost, DaemonUpgradeTests.Status_json_lists_the_worker_with_its_build, DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up'
description: |-
  Замечено при полных прогонах в TSK-125 (load ~5, параллельные прогоны): три теста падают в обоих режимах (in-process и TASKER_BIN), в изоляции проходят и на ветке, и на чистом main.

  - SettingsTests.Parallel_updates_are_not_lost — таймаут settings.lock 30 с.
  - DaemonUpgradeTests.Status_json_lists_the_worker_with_its_build — пустой build воркера.
  - DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up — SIGINT дольше 30 с.

  Разобраться: это ограничения таймаутов под нагрузкой (поднять/сделать адаптивными) или настоящие гонки. Прогон с нагрузкой на машине воспроизводит.
