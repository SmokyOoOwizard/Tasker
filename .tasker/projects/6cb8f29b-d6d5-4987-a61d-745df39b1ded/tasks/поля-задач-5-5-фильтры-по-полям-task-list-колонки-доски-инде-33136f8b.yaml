title: 'Поля задач 5/5: фильтры по полям (task list, колонки доски, индекс SQLite)'
description: |-
  Часть большой фичи «Кастомные поля задач». Общая схема:
  - Каталог полей проекта: поле = имя, тип значения (string, int, float, bool, date, enum), признак «несколько значений», для enum — ссылка на перечисление. Перечисления — отдельная сущность проекта (имя + список значений), одно перечисление можно использовать в нескольких полях.
  - Тип задачи подключает поля из каталога (каждое обязательное или нет). Такие поля всегда есть у задач этого типа и у задачи их удалить нельзя.
  - У самой задачи можно добавить дополнительные поля: из каталога или собственные — тогда полное определение (имя, тип, обязательность, множественность, перечисление) хранится в самой задаче и больше нигде.
  - Значения хранятся в задаче; обязательное поле без значения — ошибка при создании и правке задачи.

  Эта задача: фильтр по значению поля в `task list --field Имя=значение` (и REST/MCP-фильтрах), оба хранилища; индекс SQLite для файлового хранилища хранит значения полей; решить, нужен ли фильтр колонки доски по полю (BoardService.GetColumnTasks) и как он задаётся. Блокируется задачами 2/5 и 3/5.
