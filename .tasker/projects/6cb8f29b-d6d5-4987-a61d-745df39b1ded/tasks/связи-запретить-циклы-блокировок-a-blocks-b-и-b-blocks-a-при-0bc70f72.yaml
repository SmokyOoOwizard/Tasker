title: 'Связи: запретить циклы блокировок (A blocks B и B blocks A принимаются оба)'
description: |-
  Цикл блокировок разрешён: «A blocks B» и «B blocks A» принимаются оба. Проверено на временной области: `task link T-1 blocks T-2`, затем `task link T-2 blocks T-1` — оба принимаются, `task links T-1` показывает «blocks T-2» и «is blocked by T-2» одновременно; длинный цикл T-1 → T-2 → T-3 → T-1 тоже принимается. Отклоняется только связь задачи с самой собой (`TargetId: a task cannot be linked to itself`). Циклы блокировок бессмысленны (задачи вечно ждут друг друга) и ломают любые построения порядка работ.

  Что сделать:
  - Проверка цикла при создании связи (TaskLinkService.Link; CLI `task link`, REST, MCP): для типов связей с направленным «запрещающим» смыслом (по умолчанию «Blocks/is blocked by», а также иерархические типы вроде «входит в/включает», если такие есть среди типов по умолчанию) добавление связи, замыкающее цикл любой длины (A→B→…→A), отклоняется ошибкой с путём цикла (`Cycle: T-1 → T-2 → T-1`, код ошибки/статус по образцу остальных валидаций: 400/`[invalid]`). Симметричные типы («relates to», «duplicates»?) цикла не образуют — проверять только направленные.
  - Настройка: признак типа связи «допускает циклы» (по умолчанию для blocks и иерархии — нет; у пользовательских типов — выбор; значения по умолчанию виртуальных типов TSK-… должны задавать запрет), редактируется вместе с типом связи (REST, MCP, консоль `link-type create/update --allow-cycles`), хранится в файле типа связи (версия формата/миграция по правилам проекта) и в БД.
  - Цепочки через ВСЕ связи одного типа внутри проекта; проверка в обоих хранилищах эффективно (обход графа с ограничением глубины/числа узлов, индекс связей — GetLinkedTo; защита от больших графов), под IWriteScope (две параллельные «A blocks B» и «B blocks A» не должны оба пройти: гонка проверки и записи — важный сценарий для TSK-96 стресс-теста).
  - Слияние git: две ветки могут независимо добавить связи, образующие цикл (файлы разные — конфликта git нет). `tasker sync`/`cleanup --check`/демон должны ОБНАРУЖИВАТЬ существующие циклы и сообщать (как дубликаты номеров серий: «Link cycle in project …: T-1 → T-2 → T-1 (link type Blocks)»), `cleanup` НЕ удаляет связи сам, но подсказывает команду `task unlink`; существующие данные с циклами остаются читаемыми.
  - Тесты на оба хранилища: прямой цикл, цикл из трёх, симметричные типы, самоссылка, тип с разрешёнными циклами, параллельное создание встречных связей (один успех, один отказ), обнаружение цикла после «слияния» (файлы вручную), `task get`/`links` продолжают работать с уже существующим циклом. README (раздел «Связи между задачами»), мануал (`tasker manual links`), схемы инструментов MCP.
