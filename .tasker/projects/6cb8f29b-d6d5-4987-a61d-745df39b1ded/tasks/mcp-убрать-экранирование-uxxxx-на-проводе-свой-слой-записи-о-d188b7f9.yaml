title: 'MCP: убрать экранирование \uXXXX на проводе (свой слой записи ответа поверх SDK)'
description: |-
  После TSK-88 кириллица, обратные кавычки, «ёлочки» и эмодзи в JSON приложения идут как есть (общий TaskerJson с собственным энкодером), но на ПРОВОДЕ MCP остаётся экранирование `\uXXXX`: MCP SDK (ModelContextProtocol.AspNetCore 2.2.0) кодирует конверт JSON-RPC сам, своими опциями (McpJsonUtilities.DefaultOptions, source-generated), и менять их нельзя. Клиент разбирает конверт и получает поле `text` с нормальной кириллицей, но размер сообщения на проводе не уменьшился (ответ list_tasks на 3 кириллические задачи — ~25 КБ). Токены считаются по тексту после разбора, поэтому для самого агента выигрыша нет, но вес трафика и логов (и читаемость сырого обмена при отладке) страдают.

  Нужно: собственный слой записи ответа MCP поверх SDK, чтобы на проводе кириллица не экранировалась. Варианты изучить и выбрать (обсудить с пользователем перед реализацией): (а) middleware/транспорт: перехват HTTP-ответа stateless-эндпоинта и перекодирование тела JSON (разобрать и записать с нашим энкодером) — просто, но лишний проход по каждому ответу; (б) своя реализация транспорта (StreamableHttp) или кастомный JsonRpc-писатель, если SDK даёт расширяемые точки (проверить актуальную версию SDK и changelog: возможно, опции сериализации стали настраиваемыми в новых версиях — тогда достаточно обновления пакета); (в) жить с текущим положением, если выигрыш окажется незначительным. Измерить до реализации: размер ответов list_tasks/get_board на типичных данных на проводе и после перекодирования. Учесть: корректность (JSON остаётся валидным, SSE-режим ответа `data:` строки, потоковые ответы, заголовки Content-Length), безопасность (не ломать экранирование управляющих символов, суррогатов, U+2028/2029), производительность (дополнительный проход), совместимость со всеми клиентами (Claude, ChatGPT и т. п.). Тесты: сырой ответ MCP по сети содержит кириллицу, ёлочки, эмодзи как есть и разбирается обратно; размер сообщения уменьшился; поведение SSE-ответа. README. Связано с TSK-88 (общий TaskerJson) и TSK-89 (краткие списки — основное сокращение размера ответов).
