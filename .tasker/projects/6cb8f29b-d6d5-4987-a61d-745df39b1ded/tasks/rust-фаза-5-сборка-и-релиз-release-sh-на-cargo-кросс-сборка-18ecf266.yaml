title: 'Rust, фаза 5: сборка и релиз — release.sh на cargo, кросс-сборка, install.sh/install.ps1, VERSION через build.rs'
description: 'Фаза 5 плана docs/rust-migration-plan.md, п. 1–2. scripts/release.sh: cargo build --release --target … вместо dotnet publish; кросс-сборка cargo-zigbuild для Linux/macOS либо матрица GitHub Actions (для windows-msvc надёжнее вторая); цели x86_64/aarch64-unknown-linux-gnu (musl — бонус), aarch64/x86_64-apple-darwin, x86_64/aarch64-pc-windows-msvc. Архив тот же: app/tasker, app/tasker-mcpd, install.sh, release.txt; VERSION читается build.rs. install.sh/install.ps1: убрать --framework-dependent, --from-source собирает cargo; раскладка <prefix>/share/tasker/app и ссылка <prefix>/bin/tasker не меняются, обновление — обычный install.sh --from.'
