title: 'Поля задач 1/5: каталог полей и перечислений проекта (ядро, оба хранилища)'
description: |-
  Часть большой фичи «Кастомные поля задач». Общая схема:
  - Каталог полей проекта: поле = имя, тип значения (string, int, float, bool, date, enum), признак «несколько значений», для enum — ссылка на перечисление. Перечисления — отдельная сущность проекта (имя + список значений), одно перечисление можно использовать в нескольких полях.
  - Тип задачи подключает поля из каталога (каждое обязательное или нет). Такие поля всегда есть у задач этого типа и у задачи их удалить нельзя.
  - У самой задачи можно добавить дополнительные поля: из каталога или собственные — тогда полное определение (имя, тип, обязательность, множественность, перечисление) хранится в самой задаче и больше нигде.
  - Значения хранятся в задаче; обязательное поле без значения — ошибка при создании и правке задачи.

  Эта задача: сущности «определение поля» и «перечисление» (модель, сервисы, хранилища files и db/SQLite/Postgres, YAML-файлы fields/ и enums/ в .tasker, индекс, блокировки правки, версия формата файлов и миграция, README). Валидация: уникальное имя поля в проекте, enum-поле обязано ссылаться на существующее перечисление, значения перечисления уникальны, перечисление и поле, которые используются, не удаляются (In use). Без привязки к типам и задачам — это следующие задачи.

  Решение: удаление значения перечисления, которое уже выбрано у задач, здесь не реализуется (значений у задач ещё нет) — это правило описано в TSK-73. Здесь: перечисление и поле, на которые есть ссылки (в других полях, типах задач), не удаляются (In use).
