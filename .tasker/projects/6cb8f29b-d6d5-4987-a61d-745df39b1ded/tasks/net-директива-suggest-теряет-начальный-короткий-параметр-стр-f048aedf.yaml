title: '.NET: директива [suggest] теряет начальный короткий параметр строки (-p X status get) — строка разбирается как аргумент программы'
description: "CompleteDirective берёт строку как parseResult.Tokens.LastOrDefault(...) — а System.CommandLine разбирает второй аргумент программы как обычный: строка, начатая с короткого параметра, разбивается склейкой (-p ' Второй status get' → токены -p и ' Второй status get'), и директива получает строку без -p. Итог: tasker '[suggest:22]' '-p Второй status get ' подсказывает статусы единственного проекта, а не проекта Второй; '--json=x task' превращается в 'x task'; '@файл …' — читается как файл ответов. Rust-консоль (TSK-136) повторяет поведение ради паритета (suggest::run). Исправить в обеих: брать строку прямо из args[1] (или Tokens после директивы по позиции), без повторного разбора."
