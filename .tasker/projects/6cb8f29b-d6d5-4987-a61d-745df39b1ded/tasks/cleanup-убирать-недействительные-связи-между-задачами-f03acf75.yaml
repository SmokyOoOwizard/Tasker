title: 'cleanup: убирать недействительные связи между задачами'
description: 'Связи (TSK-63) указывают на задачу и тип по id; после слияния веток цель или тип могут оказаться удалёнными. Сейчас такие связи при показе пропускаются, а каскад удаления задачи убирает входящие связи только при обычном удалении. Добавить в tasker cleanup (CleanupService) и в отчёт sync: находить связи на несуществующие задачи и типы (в индексе — запрос по task_links, в БД — по task_links без цели/типа), убирать их и показывать в отчёте (CleanupChangeKind.RemovedInvalidLink), в --dry-run/--check учитывать.'
