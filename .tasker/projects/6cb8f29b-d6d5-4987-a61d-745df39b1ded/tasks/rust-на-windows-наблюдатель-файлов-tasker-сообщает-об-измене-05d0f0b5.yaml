title: 'Rust на Windows: наблюдатель файлов .tasker сообщает об изменении каталогов (tasks, boards) как об изменённых путях'
description: 'Найдено в TSK-141 при первом прогоне cargo nextest на windows-latest (GitHub Actions). tasker-files/tests/watch.rs: burst_of_edits_is_one_changed_event_with_relative_paths, cache_and_tmp_files_are_ignored, rename_reports_old_and_new_paths падают: в событии Changed кроме файлов есть пути каталогов (projects/<id>/tasks, projects/<id>/boards, projects/<id>/statuses) — ReadDirectoryChangesW через notify сообщает о модификации каталога при изменении файла в нём; на macOS/Linux таких событий нет. Ожидаемо (как .NET FileSystemWatcher с фильтрами) — только пути файлов; изменение каталога без файла не должно давать события (cache_and_tmp_files_are_ignored получает лишнее Changed([.../tasks])). Нужно: отфильтровать события-модификации каталогов на Windows (или все события, где путь — существующий каталог, кроме удаления папки проекта), снять ignore с этих тестов.'
