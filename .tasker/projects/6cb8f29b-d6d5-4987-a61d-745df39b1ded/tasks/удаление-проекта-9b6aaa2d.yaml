title: Удаление проекта
description: |-
  Раздел бэклога: Данные и хранилища.

  Сейчас удаляет всё содержимое без проверок (в файлах — всю папку проекта).

  РЕШЕНИЕ (2026-10-02): проект с содержимым удалять разрешено, но только с подтверждением человека, которому показывают, что будет потеряно. В консоли (tasker project delete) без --yes — интерактивный вопрос «да/нет» с краткой статистикой проекта (сколько задач, досок, статусов, наборов, типов задач, серий, типов связей и т. п.); в неинтерактивном режиме (stdin не терминал) без --yes — ошибка. Статистику отдаёт ядро и REST (GET /projects/{id}/stats), интерфейс показывает её в блоке удаления проекта. MCP: инструмента delete_project по-прежнему нет.
