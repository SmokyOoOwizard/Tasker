title: 'MCP: projectId необязателен при единственном проекте'
description: 'То же для инструментов MCP: если в области один проект, агент может не передавать projectId. Сложность: у большинства инструментов projectId стоит перед обязательными параметрами (Guid projectId, string name, …), а в C# необязательный параметр не может стоять раньше обязательных; нужно либо переставить параметры, либо взять Guid? без значения по умолчанию и проверить, как SDK строит JSON-схему (required или нет). Сделать общий McpCall.ResolveProject.'
