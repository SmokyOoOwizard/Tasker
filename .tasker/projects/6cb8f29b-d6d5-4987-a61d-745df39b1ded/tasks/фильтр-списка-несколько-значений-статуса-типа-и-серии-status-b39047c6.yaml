title: 'Фильтр списка: несколько значений статуса, типа и серии (--status A --status B)'
description: |-
  Фильтры списка задач принимают только ОДНО значение статуса, типа и серии: `tasker task list --status "В работе" --status Готово` отвечает `Option '--status' expects a single argument but 2 were provided`, `--status "В работе" Готово` — `Unrecognized command or argument`. Через REST (`statusId`) и MCP (`list_tasks`: `statusId`, `typeId`, `seriesId` — по одному Guid) то же самое. Нужно смотреть, например, «что в работе И что на проверке» одним запросом, без двух вызовов и склейки.

  Ядро уже умеет списки: `TaskFilter.StatusIds`, `TypeIds`, `SeriesIds` — массивы (внутри статусов — ИЛИ), клиентские слои собирают их из одного значения. Значит это правка интерфейсов и тестов, а не хранилищ.

  Что сделать:
  - Консоль: `task list --status A --status B` (повтор параметра) и/или `--status A,B` (через запятую; решить — одно из двух либо оба; рекомендация: повтор, как у `--series`/`--field`, плюс несколько значений после одного параметра, как у `--field`), то же для `--type` и `--series`; значения по имени или id; ошибка с перечнем допустимых при неизвестном; семантика: значения одного параметра — ИЛИ, разные параметры (статус, тип, серия, поля) — И. Тот же параметр у `board tasks` и `board show` (срез просмотра), если там есть `--status`-подобный фильтр.
  - REST: `GET /tasks?statusId=…&statusId=…` (повтор; также `typeId`, `seriesId`), обратная совместимость с одним значением.
  - MCP: `list_tasks`/`get_board`: массивы `statusIds`, `typeIds`, `seriesIds` (старые `statusId`/`typeId`/`seriesId` оставить как есть или объявить устаревшими — решить; схема инструментов описывает ИЛИ внутри параметра и И между параметрами), поддержка коротких id (TSK-94) и имён там, где это уже принято.
  - Автодополнение: `--status`/`--type`/`--series` подсказывают значения и после повтора; сторожевой тест значений должен проходить.
  - Сочетается с `--field`, `--sort` (TSK-98), `descriptionLength` (TSK-89), пагинацией и `totalCount`.
  - Тесты на оба хранилища (ИЛИ по статусам, И между параметрами, один статус, неизвестное имя, статус из набора, которого нет у типа), мануал (`tasker manual tasks`), README. Предварительно проверить фильтр доски (колонка = статусы, TSK-85): отдельных изменений не требует.
