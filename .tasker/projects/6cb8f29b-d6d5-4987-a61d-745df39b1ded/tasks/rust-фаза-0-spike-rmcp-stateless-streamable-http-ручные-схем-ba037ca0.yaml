title: 'Rust, фаза 0: spike rmcp (stateless Streamable HTTP, ручные схемы) и собственного YAML-эмиттера'
description: |-
  Фаза 0 плана docs/rust-migration-plan.md, раздел 8 п. 4 и риск «зрелость rmcp».

  1. rmcp: поднять эхо-сервер на Streamable HTTP в stateless-режиме, добавить инструмент с вручную собранной inputSchema (нужно добавлять аргумент workspace и убирать projectId из required), проверить claude mcp add и tools/list. Если stateless или ручные схемы не даются — зафиксировать решение: свой JSON-RPC-слой поверх axum (протокол небольшой).
  2. YAML-эмиттер: на эталонах YamlDotNet из задачи golden-корпуса убедиться, что плоская схема файлов .tasker воспроизводится собственным эмиттером байт в байт дешевле, чем подгонка saphyr/serde_yaml. Набросок API эмиттера.

  По дню на каждый. Итог (выбранные крейты, версии, ограничения) записать в описание задачи и при необходимости поправить план.
