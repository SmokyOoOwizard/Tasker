title: 'Rust, фаза 0: spike rmcp (stateless Streamable HTTP, ручные схемы) и собственного YAML-эмиттера'
description: |-
  Фаза 0 плана docs/rust-migration-plan.md, раздел 8 п. 4 и риск «зрелость rmcp».

  1. rmcp: поднять эхо-сервер на Streamable HTTP в stateless-режиме, добавить инструмент с вручную собранной inputSchema (нужно добавлять аргумент workspace и убирать projectId из required), проверить claude mcp add и tools/list. Если stateless или ручные схемы не даются — зафиксировать решение: свой JSON-RPC-слой поверх axum (протокол небольшой).
  2. YAML-эмиттер: на эталонах YamlDotNet из задачи golden-корпуса убедиться, что плоская схема файлов .tasker воспроизводится собственным эмиттером байт в байт дешевле, чем подгонка saphyr/serde_yaml. Набросок API эмиттера.

  По дню на каждый. Итог (выбранные крейты, версии, ограничения) записать в описание задачи и при необходимости поправить план.

  ИТОГ (2026-10-09, rust/spikes/README.md):
  1. rmcp 3.5.1 подходит: stateless через legacy_session_mode=false + NeverSessionManager (tools/call без initialize, без Mcp-Session-Id), схемы руками через Tool::new с произвольным JSON Schema (workspace добавлен, projectId не required), заголовки HTTP из context.extensions (X-Tasker-Agent), CallToolResult::error даёт isError и текст с кодом, проверка Host по умолчанию (чужой → 403), ответ text/event-stream с одной строкой data:. Свой JSON-RPC-слой не нужен. Учесть: rmcp не валидирует аргументы по inputSchema (делать самим — нужно и для текстов [invalid]); порядок ключей в ответе и isError:false отличаются от .NET SDK — снапшоты MCP сравнивать семантически, inputSchema строить с preserve_order. claude mcp add проверен до «Pending approval» (проектная область требует интерактивного одобрения), протокол — запросами, идентичными тестовому клиенту.
  2. Свой YAML-эмиттер оправдан: порт AnalyzeScalar/SelectScalarStyle YamlDotNet (~300 строк) + saphyr для чтения; на golden-корпусе все строки-пробы и все 120 файлов области воспроизводятся байт в байт (тесты в rust/spikes/yaml-emitter). Неочевидное: анализ по UTF-16-единицам (эмодзи → двойные кавычки с \U0001F680), регулярное выражение QuotingNecessaryStrings YAML 1.2 (yes/no/off без кавычек), хвостовые переводы строки литерала (|, |+) заменяют конец строки документа, ширина строки не ограничена.
