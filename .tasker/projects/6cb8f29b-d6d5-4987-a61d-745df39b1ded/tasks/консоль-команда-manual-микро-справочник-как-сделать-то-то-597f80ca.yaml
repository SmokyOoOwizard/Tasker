title: 'Консоль: команда manual — микро-справочник «как сделать то-то»'
description: |-
  Сейчас у консоли есть только справка по командам (--help) и длинный README. Нужна отдельная команда мануала: микро-справочник «как сделать то-то» — короткие рецепты с готовыми командами.

  Идея (детали уточнить перед реализацией):
  - Команда `tasker manual` (псевдоним `tasker howto`?) без аргументов печатает оглавление тем; `tasker manual <тема>` — короткая страница-рецепт: что нужно, по шагам команды, пример вывода, на что обратить внимание. Поиск по ключевым словам: `tasker manual search <слово>` или `tasker manual <часть названия>` (если совпадение одно — показать, если несколько — перечислить).
  - Темы для начала: «завести проект и первую доску», «создать задачу и перевести по статусам», «серии и ссылки TSK-N», «связи между задачами», «посмотреть доску и колонки (board show / board tasks)», «поля задач и перечисления» (когда будут готовы TSK-72..76), «блокировка на время правки», «подключить агента (claude mcp add, общий адрес /mcp, аргумент workspace)», «миграция формата (tasker migrate)», «sync и cleanup», «установка и MCP-демон».
  - Хранение: Markdown-страницы, встроенные в сборку консоли (EmbeddedResource), одна тема — один файл, заголовок и короткое описание в начале; тест проверяет, что все команды, упомянутые в примерах, существуют (разбор через дерево команд System.CommandLine), чтобы мануал не устаревал при переименовании команд. Язык: решить (русский по умолчанию, как README; английский для --help остаётся).
  - Вывод: читаемый текст в терминале (без требования рендерера Markdown: заголовки и блоки кода простым форматированием), `--json` — список тем / содержимое темы для агентов и скриптов.
  - Агентам: тот же справочник отдать через MCP (инструмент manual/get_manual или ресурс), чтобы агент мог узнать «как сделать» без README — решить отдельно, возможно, вынести в следующую задачу.
  - README: упомянуть команду, не дублируя тексты (источник правды — страницы мануала).
  Перед выполнением коротко согласовать с пользователем: имя команды, язык, список тем, нужен ли MCP-вариант.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение перед реализацией пройдено):
  - Команда `tasker manual`, псевдоним `tasker howto`.
  - Язык: пока русский, но структура должна позволять добавить другие языки без переделки: страницы лежат по языкам (например, manual/ru/<тема>.md), язык выбирается настройкой/параметром (`--lang`, по умолчанию ru; если страницы нужного языка нет — откат на русский с пометкой), код ничего не знает о конкретных языках, кроме списка найденных ресурсов.
  - Вариант для MCP (инструмент/ресурс «manual») в эту задачу не входит — отдельной задачей позже.
