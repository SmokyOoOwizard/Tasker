title: 'Rust-демон на Linux: при замене под нагрузкой изредка обрывается ответ /mcp после заголовков 200 (SSE без тела)'
description: 'Найдено в TSK-141 (Docker, Linux arm64, --cpus 2, примерно 1 прогон из 8): в tasker-mcpd/tests/supervisor.rs upgrade_under_continuous_load_refuses_no_connection_and_loses_no_write отдельные вызовы create_task около второй замены получают HTTP 200 с пустым телом — заголовки ответа SSE отправлены, затем соединение закрыто без события data (провал «load N-87: None»). Похоже, старый рабочий процесс завершается при дренаже (тишина TASKER_MCP_DRAIN_QUIET_MS=300 в тесте), пока тело потокового ответа ещё не дописано, т. е. вызов перестаёт считаться «в работе» раньше конца тела, либо выход не дожидается сброса буферов. На macOS и в CI ubuntu-latest не наблюдалось. Нужно: воспроизвести (Docker --cpus 2, цикл по тесту), проверить учёт вызова в работе до конца тела у SSE-ответа rmcp и порядок завершения рабочего процесса; заодно — дописана ли задача (подтверждение ровно один раз).'
