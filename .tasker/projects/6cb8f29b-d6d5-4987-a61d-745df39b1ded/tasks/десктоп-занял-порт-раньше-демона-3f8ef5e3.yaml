title: Десктоп занял порт раньше демона
description: |-
  Раздел бэклога: Консоль.

  Десктоп уступает демону только при своём запуске: если он уже держит порт MCP, демон с тем же портом не запустится, пока десктоп не закрыть или порт не сменить. Нужно освобождать порт на лету, когда демон стартует.
