title: 'Rust, фаза 4: демон tasker-mcpd в одиночном режиме — daemon.lock/json, axum, /health /ready /daemon/*, реестр областей, журнал'
description: |-
  Фаза 4 плана docs/rust-migration-plan.md, п. 1. Крейт tasker-mcpd на tokio + axum.

  daemon.lock (flock LOCK_EX|LOCK_NB на весь срок жизни), ожидание порта 5 с, слушатель 127.0.0.1:<port>, токен управления и заголовок X-Tasker-Control, daemon.json {pid,port,token,startedAt} через .tmp + rename с правами 0600, GET /health, GET /ready, GET /daemon/status, POST /daemon/sync|stop|upgrade с JSON DaemonStatus/WorkspaceStatus/SyncResult/UpgradeResult (camelCase, enum строками), loopback-фильтр по Host/Origin, реестр областей (ключ — slug имени папки с повторами -2, -3; id — 12 hex SHA-256 от "Files:<канонический путь>"; статусы opening/open/failed, повтор через 30 с), слежение за settings.json с debounce 200 мс, журнал logs/mcp-YYYYMMDD.log на 7 дней в формате Serilog ([ERR]/[FTL]) через tracing. Остановка SIGTERM/SIGINT; Windows — именованное событие Local\tasker-mcp-stop-<16 hex SHA-256 пути> (не проверено).

  Критерий: .NET-десктоп и .NET-консоль видят Rust-демон как свой (status, stop, sync).
