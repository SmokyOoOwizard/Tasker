title: 'Блокировка на время правки: что осталось'
description: |-
  Раздел бэклога: Одновременная работа.

  Само удержание готово (ядро, файлы и БД, REST, MCP, CLI, события, плашки «Правит Иван» и блокировка при открытии форм правки в интерфейсе). Осталось:
  - карточка задачи с блокировкой при открытии: правка названия и описания задачи (сейчас в интерфейсе у задач меняется только статус — разовым вызовом, без блокировки) — делать вместе с пунктом «Карточка задачи»;
  - блокировка при правке досок, серий и проекта целиком в интерфейсе — когда появятся формы (сейчас блокируются статусы, наборы, типы задач и название проекта);
  - имя «локального человека» не правится в интерфейсе десктопа, только `tasker whoami` — добавить в настройки пользователя;
  - пользователей (`User`) блокировать через REST, MCP и CLI нельзя: проверка в `UserService` есть, а точки входа нет, пока не решено, кто вправе блокировать чужого пользователя;
  - блокировка, взятая демоном или консолью, не шлёт событие открытому десктопу (другой процесс): плашка появится при следующем чтении;
  - на сервере события об изменениях нет, плашки обновляются опросом раз в 15 секунд;
  - между машинами файловые блокировки не передаются (только проверка версии), а `cleanup` переписывает задачи мимо блокировок.
