title: 'Связи между задачами: ядро, хранилища, REST, MCP, консоль'
description: 'Связь «задача A —тип→ задача B» (зависит от, дубликат, клонирует, связана с, причина…). Список исходящих связей хранится в файле задачи, обратная сторона вычисляется. Типы связей настраиваемые в проекте: у каждого свои названия для исходящей и входящей стороны (blocks / is blocked by); по умолчанию — набор Jira. Только внутри одного проекта.'
