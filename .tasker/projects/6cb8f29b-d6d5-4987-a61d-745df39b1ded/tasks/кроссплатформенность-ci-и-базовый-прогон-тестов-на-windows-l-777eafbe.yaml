title: 'Кроссплатформенность: CI и базовый прогон тестов на Windows, Linux и macOS'
description: |-
  Сегодня нет ни удалённого репозитория, ни CI (в корне нет .github, git remote пуст), всё проверяется на одном macOS. Без прогона на Windows и Linux остальные задачи нельзя считать готовыми.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Что сделать: (1) выбрать, где гонять: CI-сервис с матрицей windows-latest / ubuntu-latest / macos-latest (например, GitHub Actions — тогда нужен удалённый репозиторий; решить вместе с пользователем: хостинг, приватность), либо виртуальные машины/отдельная Windows-машина с воспроизводимым скриптом запуска; (2) единый скрипт сборки и тестов для трёх платформ (dotnet build/test, фронтенд npm ci и tsc), кэш NuGet и npm; (3) БАЗОВЫЙ ПРОГОН: собрать и запустить все тесты на Windows и Linux, ЗАФИКСИРОВАТЬ результат (сколько тестов падает и почему, сгруппировать причины: пути и разделители, имена файлов, блокировки, процессы, переводы строк, зависимость от sh/bash/python/launchctl/ps/kill в тестах и скриптах, кодировка), завести по группам задачи-баги и привязать к эпику; на Linux известная проблема: в контейнере CLI не находит Microsoft.Extensions.Logging.Abstractions (отдельная проблема сборки, TSK-111); (4) пометки платформ в тестах (`[SkippableFact]`/трейты) там, где тест по своей природе платформенный (launchd, systemd, Планировщик задач), чтобы пропуск был явным, а не молчаливым; (5) в CI включить стенд tools/Tasker.Stress в малом объёме; (6) README: матрица «платформа × что проверено».
