title: 'Rust, фаза 1: имена файлов и slug, пути, AtomicFile, FileLock, WriteScope, блокировки правки, tasker migrate'
description: |-
  Фаза 1 плана docs/rust-migration-plan.md, п. 3, 4, 6.

  Имена файлов <slug>-<id8>.yaml и legacy <guid>.yaml: slug — NFC, только категории L* и Nd (через unicode-general-category, не char::is_alphabetic), ToLowerInvariant как в .NET (посимвольное отображение без спец-правил, тест на İ, умляуты, кириллицу, эмодзи, комбинируемые знаки), не более 60 UTF-16-единиц. WindowsNames, PathRules, CanonicalPath, PathBudget (предупреждение о длине пути).

  AtomicFile (<path>.tmp → rename, без fsync), FileLock (flock LOCK_EX, повторы 1→5 мс до 30 с, реентерабельность в потоке; повторы открытия — только Windows), WriteScope с порядком захвата write.lock → семафор файла → index-rs.lock. Блокировки правки .cache/edit-locks/<Entity>-<guid>.json в PascalCase JSON. Маркеры .cache/deleted-projects/<id>, дописывание .tasker/.gitignore.

  Команда tasker migrate целиком (первая команда, проверяемая на реальной области): переписывает formatVersion и переименовывает файлы в схему <slug>-<id8>.yaml; migrate --check с кодом выхода 2.

  Критерий: migrate на копии golden-корпуса даёт те же файлы (имена и байты), что .NET; тест slug по корпусу строк.
