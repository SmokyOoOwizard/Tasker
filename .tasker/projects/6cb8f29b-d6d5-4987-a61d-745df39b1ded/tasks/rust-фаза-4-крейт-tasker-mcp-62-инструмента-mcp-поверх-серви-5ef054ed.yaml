title: 'Rust, фаза 4: крейт tasker-mcp — 62 инструмента MCP поверх сервисов, фильтры workspace/projectId, коды ошибок, экранирование'
description: |-
  Фаза 4 плана docs/rust-migration-plan.md, п. 2 и раздел 3.4. По итогам spike — rmcp или свой JSON-RPC-слой.

  Streamable HTTP, stateless, /mcp, только loopback; аргумент workspace у всех инструментов кроме list_workspaces; projectId необязателен при одном проекте (DefaultProject); X-Tasker-Agent и локальный агент; коды [invalid] [forbidden] [not_found] [modified] [locked] [unsupported_format] [in_use] [unavailable] [failed] в начале текста ошибки и isError: true; экранирование на проводе как WireJson (сырой UTF-8).

  Критерий: снапшот tools/list совпадает с эталоном фазы 0 (имена, описания, схемы); *McpTests проходят с TASKER_MCPD_BIN=rust.
