title: Выбор агента на десктопе — без проверки
description: |-
  Раздел бэклога: Пользователи и доступ.

  Любая программа на этом компьютере может передать `X-Tasker-Agent` чужого агента папки: заголовок выбирает, от чьего имени писать, но не защищает. Защита на десктопе — только то, что MCP слушает 127.0.0.1.
