title: 'Сортировка задач: task list --sort по статусу и полям (консоль, REST, MCP)'
description: |-
  При выводе задач (`task list`) нужно уметь упорядочивать их по статусу или по полям. Сейчас порядок фиксированный (по номеру серии/дате создания — уточнить по коду), управлять им нельзя; страница в 50 задач не даёт найти «самые срочные» или «по статусам».

  Идея (детали уточнить с пользователем перед реализацией):
  - Параметр сортировки: консоль `task list --sort <ключи>`, REST `GET /tasks?sort=…`, MCP `list_tasks` `sort`. Ключи через запятую, префикс `-` — по убыванию: `--sort status`, `--sort -updated`, `--sort "type,status,-Estimate"`. Несколько ключей — сортировка по порядку перечисления.
  - Ключи: `status` (порядок статусов — позиция в наборе статусов типа задачи, а не по алфавиту; у задач разных типов с разными наборами решить: порядок позиции внутри набора, затем по названию набора/статуса), `type`, `title` (регистр не важен, Unicode), `created`, `updated`, `series`/номер серии (`TSK-12` — по числу, а не по тексту), и поля каталога по имени (`Estimate`, `Priority`): int/float — по числу, date — по дате, string — по тексту, bool — false<true, enum — по порядку значений в перечислении (не по алфавиту); у множественного поля — по первому значению (или min/max — решить) ; собственные поля задач — по имени, как фильтр (TSK-87: один тип — по нему, несколько типов — ошибка); задачи без значения поля — в конце (или в начале при `-`; опиши); стабильный порядок: при равных ключах — по умолчанию (номер серии/id), чтобы страницы пагинации не пересекались и не пропускали задачи.
  - Хранилища: файловое (SQLite-индекс: сортировка запросом по таблицам значений: числовой столбец `number`, `ORDER BY` по вычисляемому ключу, индексы; без полной загрузки задач в память) и БД; пагинация с `totalCount` не меняется; производительность на тысячах задач.
  - Охват: `task list`, `board tasks`, `board show` (сортировка внутри колонок), MCP `list_tasks`, `get_board`, REST `GET /tasks` и колонки доски; сочетается с фильтром `--field` и краткими списками (`descriptionLength`). Значение по умолчанию — как сейчас.
  - Ошибки: неизвестный ключ/поле — понятная ошибка со списком допустимых ключей; сортировка по полю, которое у части задач неоднозначно по типу — ошибка со списком типов.
  - Автодополнение (`--sort`: ключи status/type/title/created/updated/series и имена полей, с `-`), мануал (`tasker manual tasks`), README, тесты на оба хранилища (по каждому типу ключа, составная сортировка, обратный порядок, пустые значения, стабильность страниц).
