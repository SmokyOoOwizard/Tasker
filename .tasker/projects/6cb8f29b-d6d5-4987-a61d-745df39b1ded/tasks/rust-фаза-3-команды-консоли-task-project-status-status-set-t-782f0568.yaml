description: |-
  Фаза 3 плана docs/rust-migration-plan.md, п. 2. Команды по одной, в порядке частоты использования: task (create/list/get/update/delete/link/unlink/links/import), project, status, status-set, task-type, series, field, enum, board, link-type, lock, whoami, user, agent, sync, cleanup, migrate, hooks install, manual (встроенные md через include_str!), mcp (клиентская часть: DaemonClient по daemon.json через ureq, запуск отсоединённого процесса, автозапуск, mcp status с кодом 3).

  Rust-консоль должна уметь управлять .NET-демоном по тем же daemon.json и /daemon/*, чтобы её можно было отдать пользователям раньше демона.

  Критерий: сквозные тесты фазы 0 проходят с TASKER_BIN=rust; --json совпадает со снапшотами строго, текст — построчно.
