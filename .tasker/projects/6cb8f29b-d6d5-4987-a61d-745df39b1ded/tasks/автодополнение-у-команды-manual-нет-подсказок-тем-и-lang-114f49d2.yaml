title: 'Автодополнение: у команды manual нет подсказок тем и --lang'
description: |-
  Команда `tasker manual` (псевдоним `howto`, TSK-82) не поддерживает автодополнение значений (TSK-83): две задачи делались параллельно, и источники значений к manual не подключены.

  Воспроизведение: `tasker "[suggest:14]" "tasker manual "` и `tasker "[suggest:13]" "tasker howto "` предлагают только параметры (--json, --lang, --project, --sqlite, --workspace…); в zsh/bash по Tab после `tasker manual ` темы не подставляются. Ожидается: темы справочника (first-project, tasks, series, links, boards, fields, locks, agent, migrate, sync-cleanup, install-daemon — берутся из каталога страниц ManualCatalog для выбранного языка) и значения `--lang` (найденные языки). Для howto то же самое.

  Что сделать: подключить источник значений (Completion/Sources.cs, по образцу остальных команд) к аргументу темы manual и к --lang; темы берутся из каталога страниц, не из жёсткого списка (новые страницы и языки подхватываются сами); учесть язык, заданный --lang/TASKER_LANG в уже набранной строке; рабочая область для этого не нужна (дополнение не должно открывать её). Параметры workspace/project/sqlite у manual не нужны вовсе: проверить, зачем они предлагаются у команды, которой область не нужна (глобальные параметры) — если можно, не предлагать. Тест: подсказки тем для manual и howto, фильтр по префиксу (`manual fi` → first-project), --lang, добавленный тестовый язык; общий сторожевой тест, который сверяет, что у всех аргументов-имён команд есть источник значений, если такой тест уместен (чтобы подобное не повторилось при добавлении новых команд).
