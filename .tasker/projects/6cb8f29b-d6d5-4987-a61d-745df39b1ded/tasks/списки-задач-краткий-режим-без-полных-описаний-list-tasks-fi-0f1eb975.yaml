title: 'Списки задач: краткий режим без полных описаний (list_tasks, find_tasks_by_reference, task list --json)'
description: |-
  Списки всегда отдают полные описания. У `list_tasks` и `find_tasks_by_reference` нет краткого режима; при описаниях до 2,7 тыс. символов страница в 50 задач агенту практически недоступна (десятки тысяч токенов ради поиска нужной задачи).

  Нужно: краткий режим списков. Варианты (обсудить с пользователем перед реализацией): (а) параметр `brief` (по умолчанию true для MCP-списков?) — в списке нет описания, остаются id, ссылка серии (TSK-N), заголовок, тип, статус, серии/номера, версия, время изменения, признак «есть описание» и длина, число связей; полное описание — через get_task; (б) параметр `descriptionLength` (0 = без описания, N = первые N символов + многоточие, по умолчанию, например, 200); (в) выбор полей (`fields: [...]`). Рекомендация: (б) как единый параметр + разумное значение по умолчанию для списков MCP, обратная совместимость REST (по умолчанию как сейчас, либо тот же параметр).
  Охват: MCP — list_tasks, find_tasks_by_reference, get_board (tasksPerColumn), list_boards/колонки, где отдаются задачи, а также списки с большими текстовыми полями (комментарии/описания других сущностей, если есть); REST — GET /tasks, колонки доски; консоль — `task list --json`, `board tasks --json`, `board show --json` (текстовые строки списков описаний не содержат). totalCount/пагинация не меняются. Описание ответа (схема инструмента) объясняет, как получить полный текст. Тесты на оба хранилища (длинные описания, граница N, 0, юникод/суррогатные пары не режутся посередине), README, мануал/автодополнение при появлении параметров консоли.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (обсуждение пройдено):
  1. Один параметр `descriptionLength` (целое): 0 — без описания; N>0 — первые N символов; -1 — полный текст (значение выбрано мной как простое; в схеме инструмента описано словами). Вариант «brief» и выбор полей не делаем.
  2. Значения по умолчанию: MCP-списки — 200 символов превью; REST и консольный `--json` — полный текст, как сейчас (совместимость; параметр тот же: REST `?descriptionLength=`, консоль `--description-length`).
  3. В записи списка: описание усечено до N символов (резать по символам Unicode, суррогатные пары и комбинируемые знаки не разрывать; «…» в текст НЕ добавлять), плюс поля `descriptionTruncated` (true/false) и `descriptionLength` — полная длина описания в символах; плюс `linksCount` (число связей, см. TSK-90: исходящие и входящие). Для задач без описания — пустая строка/отсутствие, truncated=false, length=0.
  Охват: MCP list_tasks, find_tasks_by_reference, get_board (tasksPerColumn) и задачи колонок; REST GET /tasks и задачи колонок доски; консоль task list --json, board tasks --json, board show --json. get_task и прочие получения одной задачи отдают полный текст всегда. Схема инструмента объясняет, как получить полный текст (get_task или descriptionLength=-1). totalCount и пагинация не меняются. Фронтенд: проверить, что интерфейс не ломается (REST по умолчанию полный).
