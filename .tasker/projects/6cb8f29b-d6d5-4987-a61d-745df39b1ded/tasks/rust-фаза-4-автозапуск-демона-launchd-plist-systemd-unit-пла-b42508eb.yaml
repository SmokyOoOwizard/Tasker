title: 'Rust, фаза 4: автозапуск демона — launchd plist, systemd unit, Планировщик заданий байт в байт'
description: |-
  Фаза 4 плана docs/rust-migration-plan.md, п. 4. Крейт tasker-daemon: autostart enable/disable/status для launchd (plist), systemd (unit с тем же квотированием), Планировщика заданий Windows (XML UTF-16 LE с BOM, conhost --headless; не проверено). Файлы генерировать дословно как сейчас: autostart enable на уже стоящей службе должен давать байт-идентичный файл.

  Критерий: scripts/test-linux-systemd.sh проходит с Rust-бинарниками; сравнение сгенерированных файлов с .NET-версией в тесте.
