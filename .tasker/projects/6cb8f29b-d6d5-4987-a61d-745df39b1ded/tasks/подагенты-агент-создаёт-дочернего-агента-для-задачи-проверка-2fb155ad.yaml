title: 'Подагенты: агент создаёт дочернего агента для задачи, проверка «жив» (heartbeat) и автоудаление'
description: |-
  ПЕРЕД ВЫПОЛНЕНИЕМ ЭТУ ЗАДАЧУ НУЖНО ЕЩЁ РАЗ ОБСУДИТЬ С ПОЛЬЗОВАТЕЛЕМ: ниже только первоначальная идея, открытые вопросы не решены, к реализации не приступать без обсуждения.

  Идея. Агент (LLM, работающий через MCP; сегодня агент — пользователь kind=agent, см. README «Агенты и MCP») может через MCP создать подагента — дочернего агента, который будет выполнять конкретную задачу. Впоследствии подагенты назначаются исполнителями задач (поля «исполнитель» пока нет — зависит от того, как это будет устроено).
  Жизненный цикл: подагент раз в ~3 минуты подтверждает, что жив и продолжает работать (heartbeat, инструмент MCP). Если подтверждения нет 10 минут — подагент удаляется автоматически (фоновая проверка в демоне/сервере, значения срока и периода настраиваемые).
  Что обсудить до реализации:
  - Модель: подагент — тот же пользователь kind=agent с полем «родитель» (parentAgentId) и признаком временного, или отдельная сущность? Кто владелец, права подагента (наследует от родителя? только проекты/задачи родителя?), глубина вложенности (подагент создаёт подагентов?), лимиты числа.
  - Как подагент подключается: токен/заголовок X-Tasker-Agent, выдаёт родитель при создании; в общем MCP (TSK-78) область — аргумент workspace, подагент ограничен областью родителя?
  - Что делать при автоудалении: со значениями «исполнитель» у задач, с блокировками правки (EditLockService), с его правками/комментариями (история, автор остаётся?), уведомление родителю и людям, возможность «воскресить».
  - Heartbeat: отдельный инструмент или любой вызов подагента считается подтверждением; период 3 мин и таймаут 10 мин — настройки по проекту/глобально; что с долгими операциями; часы и сон машины (пауза демона не должна убивать всех подагентов).
  - Исполнитель задачи: поле задачи (в связи с кастомными полями TSK-72..76 — поле типа «пользователь» или отдельное поле), как подагент берёт задачу и сообщает результат, статус по завершении.
  - Хранение: в файловом хранилище подагенты временные — писать ли их в .tasker (git!) или только в памяти демона/отдельном нетрекаемом файле, чтобы временные агенты не попадали в репозиторий.
  - Поверхности: ядро, оба хранилища, MCP (create_subagent, heartbeat, list, delete), REST, консоль (agent list показывает родителя и «последний сигнал»), интерфейс.
