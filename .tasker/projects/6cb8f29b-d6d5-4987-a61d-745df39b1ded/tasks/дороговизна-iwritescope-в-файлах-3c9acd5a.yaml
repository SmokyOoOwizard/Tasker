title: Дороговизна `IWriteScope` в файлах
description: |-
  Раздел бэклога: Серии задач.

  Каждый вызов `Exclusive` (в том числе вложенный) сверяет папку задач проекта: один обход каталога на вызов. Можно сделать сверку точечнее. Кроме того, эта сверка не отправляет вкладкам событие об изменении, если нашла только уже известное.
