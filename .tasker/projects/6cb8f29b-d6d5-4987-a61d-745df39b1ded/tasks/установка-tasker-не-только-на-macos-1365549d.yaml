title: Установка `tasker` не только на macOS
description: |-
  Раздел бэклога: Консоль.

  Есть только `scripts/install-macos.sh`. Для Linux нужен аналогичный скрипт (тот же `~/.local`, systemd уже поддержан), для Windows — установка в `%LOCALAPPDATA%` и добавление в PATH. Сборка для других систем (`linux-x64`, `win-x64`) не проверялась.
