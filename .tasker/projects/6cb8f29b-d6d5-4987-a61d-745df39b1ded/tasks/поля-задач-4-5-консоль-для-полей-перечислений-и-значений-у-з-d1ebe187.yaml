title: 'Поля задач 4/5: консоль для полей, перечислений и значений у задач'
description: |-
  Часть большой фичи «Кастомные поля задач». Общая схема:
  - Каталог полей проекта: поле = имя, тип значения (string, int, float, bool, date, enum), признак «несколько значений», для enum — ссылка на перечисление. Перечисления — отдельная сущность проекта (имя + список значений), одно перечисление можно использовать в нескольких полях.
  - Тип задачи подключает поля из каталога (каждое обязательное или нет). Такие поля всегда есть у задач этого типа и у задачи их удалить нельзя.
  - У самой задачи можно добавить дополнительные поля: из каталога или собственные — тогда полное определение (имя, тип, обязательность, множественность, перечисление) хранится в самой задаче и больше нигде.
  - Значения хранятся в задаче; обязательное поле без значения — ошибка при создании и правке задачи.

  Эта задача: команды `tasker field …` и `tasker enum …` (create/list/get/update/delete), поля у типа задачи (`task-type create/update --field имя[:required]`), значения у задачи (`task create/update --field Имя=значение`, повтор для нескольких значений, `--custom-field` для собственных полей задачи с типом), вывод полей в `task get`, --json, README. Блокируется задачами 1/5 и 2/5.

  Передавать выборы из TSK-73: `task-type update … --remove-field Имя` с обязательным `--drop-values` или `--keep-values` (если у задач есть значения), `enum … remove-value Имя --drop` или `--replace-with Другое`. Подтверждение и число затронутых задач в сообщении. Ошибка при правке задачи с пропущенным обязательным полем называет поле и подсказывает `--field`.
