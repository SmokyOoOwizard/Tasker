id: 92270c47-5796-4f7a-bf57-28c1431a75b9
title: 'Скорость CLI: ~0,45 с на вызов (профилирование и ускорение запуска)'
description: |-
  Агент из другого проекта жаловался: 477 задач создавались 9 минут (≈0,45 с на вызов `tasker task create`). Для скриптов и агентов, которые делают много вызовов, это узкое место.

  Замеры на этой машине (установленная сборка, на фоне работающих тестов агентов, т. е. верхняя оценка): `tasker --version` — 0,14 с (старт процесса и разбор), `tasker status list` — 0,34 с, `task list --limit 1` — 0,41 с, `task get TSK-1` — 0,55–0,73 с (первый холодный вызов 1,3 с). Значит ~0,2–0,5 с уходит НЕ на запуск рантайма, а на то, что делает команда до полезной работы: определение рабочей области, подключение к демону («via daemon»), открытие хранилища/индекса, построение контейнера Autofac, проверки и сверка индекса, затем сама операция.

  Что сделать: (1) профилирование одного вызова по фазам (старт рантайма, построение дерева команд System.CommandLine, Autofac, поиск демона и обмен с ним, открытие области/индекса, сверка индекса с файлами, запись, вывод) — собрать таблицу времени, воспроизводимый замер (скрипт/бенчмарк, не зависящий от загрузки машины, медиана N вызовов); (2) ускорить: ReadyToRun/TieredPGO/TieredCompilation-настройки в сборке, ленивая регистрация сервисов (не поднимать то, что команде не нужно), не строить все команды при вызове одной, кэш найденной области и демона, не делать полную сверку индекса на каждый вызов, если демон уже следит за файлами, не загружать лишние хранилища, не читать ненужные настройки; для автодополнения тот же путь (должно отвечать быстрее). Цель: типичная команда (get/list/create) <0,15–0,2 с через демон и не хуже без него. Не ломать надёжность (проверка версии, блокировки, формат). Тесты/сторож на производительность (мягкий порог, не флакующий), README (замеры и как профилировать). Пакетное создание (много задач за один вызов) — отдельная задача.

  ДОПОЛНЕНИЕ (отчёт из другого проекта): CLI замедляется по ходу работы. В первой загрузке вызов занимал около 0,35–0,45 с, во втором проходе в среднем 1,5 с, отдельный `task get` — 2,7 с (замер сделан, пока параллельно работал скрипт). 748 вызовов шли 19 минут. Причина не выяснена.

  Гипотезы, которые надо проверить профилированием (а не гадать): (1) рост работы на вызов по мере роста данных: сверка индекса с файлами на каждый вызов (число файлов/задач выросло с сотен до тысяч), полное чтение каталога или хэширование файлов; (2) конкуренция за блокировки между параллельными процессами: межпроцессная блокировка записи (.cache/write.lock), блокировки индекса, SQLite-индекс (WAL, busy-timeout, ожидание), опрос блокировки с паузой (FileLock — длина шага ожидания); (3) демон: очередь событий наблюдателя файлов после массовой записи (каждая запись порождает событие, обработка очереди тормозит ответы), SSE-рассылка, утечка/рост памяти и GC в долго живущем демоне, рост лог-файла; (4) параллельные клиенты (скрипт + агенты + тесты) делят CPU/диск — отделить от (1)–(3) измерением на «тихой» машине; (5) накопление чего-то на диске между вызовами (кэш, .cache/index.db без VACUUM/checkpoint, временные файлы, журнал).
  Что сделать дополнительно к профилированию одного вызова: воспроизводимый стенд «деградация»: создать N=500/1000/2000 задач и замерять время `task get`/`task list --limit 1` на каждом шаге (график времени от числа задач и числа выполненных вызовов), раздельно: один последовательный клиент; несколько параллельных; с демоном и без. Найти и устранить причину роста (цель: время вызова не зависит от числа ранее выполненных вызовов и слабо — от числа задач); при необходимости — дополнительные индексы, отказ от полной сверки на каждый вызов, инкрементальная сверка, мягкий backoff вместо опроса блокировок, ограничение очереди событий. Добавить в README раздел «Производительность» с замерами и способом воспроизведения, а в тесты — мягкий сторож (например, отношение времени 200-го вызова к первому).

  ---
  РЕЗУЛЬТАТ (выполнено): стенд scripts/perf/bench.py (+publish.sh), TASKER_PROFILE=1 для фаз, README «Производительность консоли».
  Найдено: обычные команды не ходят через демон. Последовательно и тихо время не растёт ни от числа вызовов (200 подряд: x0,98), ни заметно от числа задач (100->2000: +5-10 %). Деградация до 1,5-2,7 с = параллельность + нагрузка: ~0,2 с CPU на вызов (JIT ~1000 методов), очередь на index.lock (~9 обращений на вызов), опрос блокировки до 50 мс.
  Сделано: FileSystemWatcher не стартует в консоли (-77 мс), проверка TASKER_* без рефлексии (-25), JSON индекса source-gen, дерево команд только нужной ветки, Autofac-регистрации по требованию (-25..30), task get не строит JSON в тексте, TieredPGO/GC off, потолок опроса FileLock 5 мс, прогрев SQLite до index.lock.
  Цифры (100 задач, мс до -> после): version 73-101 -> 59; status list 251-272 -> 145; task list 272-299 -> 165; task get 318-340 -> 194; task create 341-354 -> 232. 8 параллельных клиентов при load 10-15: get 1050-1190 -> 650-880, p90 1,6-1,8 с -> 0,75-0,97 с.
  Не сделано: цель <0,15 с для get/create не достигнута (пол процесса .NET + JIT) — TSK-99 (исполнение через прогретый демон); очередь на index.lock — TSK-100 (граница с TSK-96).
