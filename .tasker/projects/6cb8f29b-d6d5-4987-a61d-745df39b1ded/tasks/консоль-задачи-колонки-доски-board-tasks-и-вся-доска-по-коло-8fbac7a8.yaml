title: 'Консоль: задачи колонки доски (board tasks) и вся доска по колонкам (board show)'
description: 'tasker board get уже показывает колонки и их статусы, но задач колонок в консоли нет. Добавить: (1) board tasks <доска> <колонка> — задачи одной колонки в том же виде, что task list (ссылка, статус, тип, заголовок), с --offset/--limit/--all; (2) board show <доска> — все колонки по порядку: заголовок колонки с числом задач и её задачи; --limit на колонку, --all; --json у обоих. В board get добавить число задач в колонках.'
