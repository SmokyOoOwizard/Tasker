title: Чистка ссылок при удалении серии опирается на `GetRange`
description: |-
  Раздел бэклога: Серии задач.

  Каскад читает первую страницу задач серии до тех пор, пока она не опустеет, и полагается на то, что обновлённые задачи выпадают из фильтра; при сбое хранилища каскад останавливается защитным `break`, а оставшиеся ссылки убирает `cleanup`.
