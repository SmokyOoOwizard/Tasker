title: 'Десктоп: свой MCP не поднимать — запускать Rust-демон tasker-mcpd, если он не работает'
description: |-
  Сейчас десктоп (src/Tasker.Desktop) демон не запускает: при старте он проверяет daemon.lock/daemon.json и /daemon/status (DesktopMcpPlan в src/Tasker.Daemon); если демон работает — свой MCP не поднимает, если нет — сам обслуживает MCP на настроенном порту по открытым вкладкам через Tasker.Mcp (Tasker.Web: AddTaskerMcp, WorkspaceRegistry/LocalMcpAgent, McpWorkspaceCatalog) и отдаёт порт, когда демон стартует. Из-за этого все 62 инструмента MCP существуют дважды — в Rust (rust/crates/tasker-mcp) и в C# (src/Tasker.Mcp) — и каждое изменение инструмента или схемы нужно делать в обеих реализациях.

  Нужно:
  - десктоп при старте, если демон не работает, запускает Rust tasker-mcpd так же, как tasker mcp start (отсоединённый процесс, тот же daemon.json, тот же порт из settings.json), и ждёт готовности; свой MCP десктоп больше не поднимает ни в каком случае;
  - открытые во вкладках области, которые не перечислены в настройках MCP (mcp.workspaces в settings.json), — решить, как они попадают к демону (сейчас десктоп обслуживает их сам): добавлять в settings.json при открытии, передавать демону иначе или не отдавать по MCP — выбрать и описать в вики;
  - где десктоп берёт tasker-mcpd: рядом с установленной консолью (~/.local/share/tasker/app) или из своей сборки — для пользователей, у которых стоит только десктоп, демон должен оказаться в сборке и упаковке десктопа;
  - убрать из десктопа и из Tasker.Web режим собственного MCP для десктопа (DesktopMcpPlan, регистрацию MCP в режиме desktop, связанный код и тесты DesktopMcpTests, DesktopSharedMcpTests, DesktopMcpDaemonTests — переделать на проверку запуска демона); Tasker.Mcp остаётся только для сервера (MCP с токенами агентов, AddTaskerMcp(requireAgentToken: true));
  - в интерфейсе десктопа (адрес MCP, сообщения о том, кто обслуживает MCP) показывать состояние демона;
  - вики «MCP-и-агенты», «Демон-MCP», «Интерфейс» — описать текущее поведение;
  - проверка: десктоп без работающего демона запускает его и MCP отвечает; десктоп при работающем демоне ничего не запускает; закрытие десктопа не останавливает демон; .NET-тесты и CI зелёные на трёх ОС.
