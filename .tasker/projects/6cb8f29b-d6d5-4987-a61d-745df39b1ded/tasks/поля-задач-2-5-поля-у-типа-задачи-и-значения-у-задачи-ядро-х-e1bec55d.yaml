title: 'Поля задач 2/5: поля у типа задачи и значения у задачи (ядро, хранилища, валидация)'
description: |-
  Часть большой фичи «Кастомные поля задач». Общая схема:
  - Каталог полей проекта: поле = имя, тип значения (string, int, float, bool, date, enum), признак «несколько значений», для enum — ссылка на перечисление. Перечисления — отдельная сущность проекта (имя + список значений), одно перечисление можно использовать в нескольких полях.
  - Тип задачи подключает поля из каталога (каждое обязательное или нет). Такие поля всегда есть у задач этого типа и у задачи их удалить нельзя.
  - У самой задачи можно добавить дополнительные поля: из каталога или собственные — тогда полное определение (имя, тип, обязательность, множественность, перечисление) хранится в самой задаче и больше нигде.
  - Значения хранятся в задаче; обязательное поле без значения — ошибка при создании и правке задачи.

  Эта задача: тип задачи получает список полей (fieldId + обязательное), задача — значения полей и собственные поля (с полным определением внутри задачи). Правила: поля типа нельзя удалить из задачи; можно добавлять собственные; значения проверяются по типу (int, float, bool, date, enum из перечисления, string), несколько значений только у «множественных» полей; обязательное поле без значения — ошибка. Решить и описать: что с уже существующими задачами, когда у типа добавили поле (особенно обязательное), и что с задачами, когда поле убрали из типа, и когда меняется тип задачи. Оба хранилища, формат файла задачи, версия формата и миграция, оптимистическая блокировка, README.

  РЕШЕНИЯ ПО ПРАВИЛАМ (согласованы с пользователем):
  1. Добавили полю типа обязательность (или добавили обязательное поле), а у существующих задач значения нет: задачи остаются как есть. Обязательность проверяется при создании задачи и при её правке: правка, которая меняет содержимое задачи (заголовок, описание, поля и т. п.), обязана в той же операции заполнить все пропущенные обязательные поля, иначе ошибка с перечнем полей. Перенос по доске и смена статуса — не правка в этом смысле: пропущенное обязательное поле не мешает переносу в другую колонку (move_task, `board`-перенос, смена статуса меняют только статус и проверку обязательных полей не выполняют).
  2. Поле убрали из типа задачи, а у задач есть значения: пользователь, правящий тип, обязан явно выбрать: (а) убрать значения этого поля у всех задач типа, или (б) оставить: поле становится дополнительным полем каждой такой задачи (необязательным, его можно удалить у задачи вручную). Если значений нет ни у одной задачи, выбор не нужен. Без явного выбора при наличии значений — ошибка с числом затронутых задач.
  3. Смена типа задачи: поля старого типа обрабатываются как в п.2(б) (остаются дополнительными; значение общего поля сохраняется); обязательные поля нового типа без значения — ошибка с перечнем, значения передаются в той же правке.
  4. Удаление значения перечисления, выбранного у задач: пользователь обязан явно выбрать: (а) удалить значение у всех задач, которые его используют, или (б) переназначить: указать другое значение того же перечисления, и оно подставится у всех этих задач (у множественного поля — без дублей). Если значение нигде не используется, выбор не нужен. Без выбора при использовании — ошибка `In use` с числом задач. Обязательное поле, у которого после (а) не осталось значения, у затронутых задач остаётся пустым (это не правка пользователем, проверка обязательности не блокирует).
  Ядро принимает эти выборы параметрами операции (атомарно: вся замена или ничего, с повтором по оптимистической блокировке); REST, MCP и консоль (TSK-74, TSK-75) их передают.
