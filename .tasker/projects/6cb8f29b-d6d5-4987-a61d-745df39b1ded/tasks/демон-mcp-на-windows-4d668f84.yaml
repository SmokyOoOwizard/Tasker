title: Демон MCP на Windows
description: |-
  Раздел бэклога: Консоль.

  Фоновый запуск (`tasker mcp start`) и автозапуск (`mcp autostart`) работают на macOS и Linux; на Windows нужен запуск без окна и автозапуск через Планировщик заданий или службу Windows. Сейчас — только `tasker mcp run` в терминале (демон — отдельная программа `tasker-mcpd`, её запуск без окна и автозапуск нужно сделать для Windows).
