title: SettingsStore.AddWorkspace/RemoveWorkspace пересчитывают CanonicalPath всех записей на каждом вызове
description: 'Найдено при переносе на Rust (TSK-128). SettingsStore.AddWorkspace и RemoveWorkspace сравнивают области через x.Location.Id, а WorkspaceEntry.Location каждый раз строит WorkspaceLocation заново: CanonicalPath.Of перечисляет каталог (EnumerateFileSystemInfos) на каждом компоненте пути каждой записи. На macOS, где во временном каталоге ~50 тыс. записей, 20 последовательных AddWorkspace заняли ~12 с в Rust-порте с тем же алгоритмом; у .NET тот же порядок затрат. Варианты: кэшировать Location в WorkspaceEntry или сравнивать канонический путь без повторного раскрытия. Поведение (детерминизм Id) менять нельзя; чинить в обеих реализациях, Rust-порт — rust/crates/tasker-core/src/settings/store.rs.'
