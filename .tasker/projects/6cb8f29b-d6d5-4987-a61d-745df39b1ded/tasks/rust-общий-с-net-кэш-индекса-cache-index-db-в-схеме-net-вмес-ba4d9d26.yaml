title: 'Rust: общий с .NET кэш индекса — .cache/index.db в схеме .NET вместо своего index-rs.db'
description: |-
  Решение пользователя 2026-10-11: кэш индекса файловой области должен быть один. Сейчас Rust (tasker, tasker-mcpd) ведёт свой .tasker/.cache/index-rs.db с блокировкой .cache/index-rs.lock (вариант (Б) раздела 3.2 docs/rust-migration-plan.md, TSK-131), а .NET — .cache/index.db с index.lock. Нужно перейти на вариант (А): Rust читает и пишет ровно index.db в схеме .NET.

  Ограничения: тот же PRAGMA user_version, те же таблицы/колонки/индексы/коллации; колонка data — JSON как IndexJson (System.Text.Json source-gen) байт в байт; size/mtime в тех же единицах (иначе процессы переиндексируют файлы друг друга); при чужой схеме — пересоздать, как .NET; блокировка index.lock тем же способом и в том же порядке (write.lock → файл → index.lock), режим журнала и busy timeout как у .NET. Старый index-rs.db (+ -wal/-shm) при открытии области удаляется.

  План: эталон index.db от .NET-консоли на golden-корпусе (rust/tests/golden/index); перепись хранения индекса в tasker-files; проверки — совпадение с эталоном, перекрёстное чтение без пересборки, совместная запись .NET+Rust (скрипт), .NET-тесты против Rust-консоли, cargo test/clippy/fmt, golden --verify, bench до/после; документация (план 3.2 → (А), README, вики); зелёный CI.
