title: 'Windows: остановка демона и upgrade без простоя не покрыты .NET-тестами'
description: |-
  Разбор прогона .NET-тестов в CI (dotnet-tests.yml): на Windows пропускаются как Unix-only DaemonUpgradeTests (3 теста: замена рабочего процесса без простоя, статус с рабочими процессами, откат неудачного upgrade) и DaemonTests.Foreground_run_stops_on_interrupt_and_cleans_up (остановка tasker mcp run по прерыванию). Вместе с TSK-156 (интеграционные тесты Rust-демона на Windows не доходят до готовности) это значит, что на Windows ни один тест не проверяет остановку демона (именованное событие Local\tasker-mcp-stop-<hash>, Ctrl+C в tasker mcp run) и tasker mcp upgrade (передача сокета через WSADuplicateSocketW, Job Object).

  Нужно: сделать эти сценарии проверяемыми на Windows — тесты с Windows-механизмами вместо сигналов Unix (именованное событие, CTRL_BREAK/GenerateConsoleCtrlEvent для mcp run), включить их на windows-latest в CI, найденные ошибки исправить. Связано с TSK-156.

  Справка: на Windows в отчёте тестов на 7 меньше, чем на Linux и macOS (1574 против 1581). Это не потеря: две параметризованные Unix-only теории InstallScriptTests (Bad_arguments_are_rejected_with_the_usage — 4 набора данных, Conflicting_options_are_rejected_with_the_usage — 5) при пропуске попадают в отчёт одной записью каждая (9 − 2 = 7). Установщик для Windows (install.ps1) покрыт InstallPowerShellTests: на windows-latest 11 из 11.

  Сбой в CI (windows-latest, прогон 38140857331): DaemonUpgradeTests.Upgrade_under_load_loses_no_call_and_no_write_and_duplicates_none упал — во время upgrade под нагрузкой запросы к /mcp и /health получили HttpRequestException «An error occurred while sending the request» (load 0-7…5-9, health); в предыдущем прогоне на той же ветке тест прошёл. Значит, на Windows upgrade не всегда без простоя: соединения обрываются при передаче сокета новому рабочему процессу. Этот тест — первый кандидат на проверку.
