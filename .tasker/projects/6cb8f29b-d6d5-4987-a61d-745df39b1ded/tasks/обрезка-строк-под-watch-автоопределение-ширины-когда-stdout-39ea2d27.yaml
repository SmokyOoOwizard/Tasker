id: 39ea2d27-dc8d-40b3-a27b-188aa9c6fccc
title: 'Обрезка строк под watch: автоопределение ширины, когда stdout не терминал, но COLUMNS/LINES заданы'
description: |-
  При запуске под `watch` (`watch -n 10 tasker task list --status "В работе" "На проверке"`) строки не обрезаются по ширине окна и переносятся терминалом, хотя в терминале (без watch) всё обрезается. Причина — правило из TSK-106: обрезка включена автоматически только когда stdout — настоящий терминал; `watch` запускает команду через конвейер (stdout не TTY), поэтому tasker считает «вывод в файл/конвейер» и ничего не режет, хотя `watch` экспортирует `COLUMNS`/`LINES` с реальной шириной окна.

  Проверено (COLUMNS=40, stdout не терминал, считая символы): без параметров — строки по 55 и 52 символа, не обрезаны; с `--truncate`, `--width 40` или `TASKER_WIDTH=auto` — обрезаются до 40 с `…`. Обходной путь сегодня: `watch -n 10 tasker task list --truncate …` или `export TASKER_WIDTH=auto`.

  Нужно: автоопределение «под watch», чтобы параметр не требовался.
  - Идея (рекомендация): считать вывод «экранным», если stdout не терминал, но в окружении ЭКСПОРТИРОВАНЫ `COLUMNS` и `LINES` (так делает procps `watch`; обычные shell не экспортируют их по умолчанию, поэтому для `tasker task list | wc -l` и `> file` поведение не меняется) — и тогда брать ширину из `COLUMNS` (минимум 20, как в TSK-106). Дополнительно можно проверять родительский процесс (`watch`; на macOS и Linux по `ps -o comm= -p <ppid>`), но это хрупко и не работает через обёртки — использовать только как дополнительный признак, не как единственный.
  - Риски, которые надо оценить и описать: окружения, где `COLUMNS`/`LINES` экспортированы глобально (некоторые CI, IDE-терминалы, tmux/screen настройки, `.zshrc` с `export COLUMNS`) — вывод в файл/конвейер там начнёт обрезаться; смягчение: требовать ОБЕ переменные (`COLUMNS` и `LINES`) и ненулевые значения; явный `--no-truncate` и `TASKER_WIDTH=0`/`off` всегда выключают; `-q` и `--json` не затрагиваются; решить, нужно ли ограничить авто-режим командами-списками и не трогать текст `task get`/ошибки (как в TSK-106).
  - Также: `watch` на macOS (procps-ng из Homebrew) и GNU watch на Linux ведут себя одинаково; `watch --color`, `watch -x`/`-n`: проверить обе формы вызова (`watch tasker …` через `sh -c` и `watch -x tasker …` напрямую), обрезку при изменении размера окна между обновлениями (ширина читается на каждом вызове).
  - Тесты: подстановка окружения (COLUMNS и LINES заданы + stdout не терминал → обрезает по COLUMNS; задана только COLUMNS → не обрезает; ни одной → не обрезает; `--no-truncate`/`TASKER_WIDTH=off` → не обрезает; `--width N` приоритетнее), мануал (`tasker manual tasks`: раздел «Под watch»: что происходит автоматически, как включить/выключить вручную), README, справка параметров. Связано с TSK-106 (обрезка строк по ширине окна).
