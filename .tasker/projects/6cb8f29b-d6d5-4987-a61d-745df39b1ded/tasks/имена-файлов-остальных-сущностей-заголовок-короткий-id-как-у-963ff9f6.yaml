title: 'Имена файлов остальных сущностей: заголовок + короткий id, как у задач'
description: 'Сейчас файлы задач называются <заголовок>-<id8>.yaml (TSK-67, TaskFileNames), а файлы остальных сущностей — по полному Guid: series/, task-types/, statuses/, status-sets/, boards/, link-types/ (а также projects, если файл по Guid), и будущие fields/ и enums/ из задачи TSK-72. Нужно хранить их так же: название сущности (slug, кириллица допустима) + короткий id (8 символов), id остаётся полем внутри файла. Что учесть: (1) переиспользовать TaskFileNames (общий код для всех сущностей), уникальность и обработку одинаковых названий; (2) переименование файла при смене названия (в git — удаление + добавление); (3) WorkspaceLayout.Classify, проверка согласованности id и имени, события наблюдателя (WorkspaceEvents.Parse), индекс id→путь — id берётся из содержимого, а не из имени файла; (4) версия формата файлов (FormatVersions.Current, шаг миграции) и tasker migrate: переименование старых Guid-файлов этих сущностей, чтение обоих вариантов, предупреждение старому Tasker (как в TSK-67), проверка до любых изменений (InspectTask); (5) git-хуки sync/cleanup, README (раскладка .tasker, раздел «Имя файла задачи»). Делать после TSK-72, чтобы новые fields/enums сразу создавались с таким именем, либо согласовать с ней.'
