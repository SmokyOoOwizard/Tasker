title: 'Rust-консоль: .NET-тесты SyncTests, GitHooksTests, ConcurrencyTests падают против Rust-бинарника (файловые области)'
description: |-
  При прогоне .NET-тестов против Rust-консоли (TASKER_BIN=<rust tasker> TASKER_MCPD_BIN=<rust tasker-mcpd> dotnet test tests/Tasker.Tests --filter "Binary!=in-process") падали 10 тестов в SyncTests, GitHooksTests, ConcurrencyTests (плюс нестабильный SettingsTests.Parallel_updates_are_not_lost — TSK-145, не относится). Падали и на main, не связано с SQLite (TSK-159). Golden-корпус эти сценарии не покрывал.

  Воспроизведено (43 теста классов, 10 падений):
  - SyncTests.Sync_asks_the_daemon_and_returns_when_the_cache_is_up_to_date, Daemon_reports_the_problems_it_found, If_the_daemon_stops_sync_falls_back_to_the_folder: Assert.Equal "daemon" ≠ "direct". Причина — Rust `tasker sync` всегда сверял сам и не спрашивал демон (/daemon/sync), .NET спрашивает (DaemonClient.Sync). Расхождение в Rust.
  - GitHooksTests.Checkout_updates_the_cache_right_away_without_any_tasker_process_running, Without_the_hooks_nothing_updates_the_cache_until_someone_opens_the_workspace, Merge_updates_the_cache, Rebase_updates_the_cache, A_workspace_in_a_subfolder_with_a_space_in_its_name_works, A_new_worktree_syncs_its_own_workspace: ожидалось 1/2 проекта в кэше, получено -1 («кэша нет»). Причина — тест читает .NET-кэш .cache/index.db, у Rust свой index-rs.db (решение (Б) TSK-131). Хуки Rust ставит и они работают; тексты install/status/uninstall и блок хука совпадают с .NET (кроме пути программы).
  - ConcurrencyTests.Reading_waits_for_the_index_lock_and_goes_on_after_release: «the command must wait while the index lock is held» — тест держит index.lock, у Rust index-rs.lock (то же решение (Б)).

  Исправлено:
  - Rust: tasker sync через демон (daemon::sync, ответ /daemon/sync .NET или Rust, свойства без учёта регистра — health::from_json), иначе прямая сверка; via daemon/direct, тексты и JSON как у .NET.
  - Тесты: IndexCache — файлы кэша той консоли, что их создала (index.db/index.lock у .NET, index-rs.db/index-rs.lock у Rust): имя файла кэша — не поведение для пользователя.
  - Корпус: golden expected/mcp/cli (sync, --json, -q при работающем демоне); Rust-тесты git_hooks.rs, concurrency.rs, mcp_daemon.rs (sync через демон).
