title: Обмен refresh-токена без Web Locks
description: |-
  Раздел бэклога: Фронтенд.

  Если сервер открыт по http не на localhost, `navigator.locks` недоступен, и очередь обмена — только внутри вкладки: две вкладки могут обменять один токен одновременно, и сессия отзовётся. Нужен https или запасной вариант (например, блокировка через `localStorage`).
