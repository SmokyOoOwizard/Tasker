title: Get по префиксу id файла с конфликтом слияния отвечает «No task» вместо ошибки чтения
description: |-
  Проблема
  Задача, файл которой содержит маркеры конфликта слияния git (<<<<<<< / ======= / >>>>>>>), по полному id даёт «Error: Unresolved git merge conflict (line 3)», а по первым 8 знакам id — «Error: No task 'cccccccc'», как будто задачи нет. Пример: rust/tests/golden/workspace, проект Legacy, conflicted-title-ours-cccccccc.yaml.

  Где
  - Rust-консоль: поиск сущности по префиксу id (rust/crates/tasker-services, разрешение ссылок на сущности) берёт только читаемые записи индекса.
  - MCP get_task и другие get-инструменты по префиксу id (rust/crates/tasker-mcp).
  - Другие сущности: status get, board get и т. д. по префиксу id.

  Что нужно сделать
  - Поиск по префиксу id учитывает файлы с ошибкой чтения: если префикс указывает на такой файл — та же ошибка, что по полному id («Unresolved git merge conflict …», «format version … is newer …»), код выхода 1.
  - То же в MCP get-инструментах и для всех сущностей.
  - Тесты: консоль (процесс) и MCP — по полному id и по префиксу; снимок task-get-conflict в tests/golden.
