title: 'Канонический путь: регистр имени без перебора всего каталога'
description: |-
  Проблема
  Канонический путь области (регистр букв как на диске) для каждой папки пути перебирает все записи родительского каталога. В каталоге с десятками тысяч записей (системный временный каталог macOS, большие папки с проектами) это от десятков мс до секунды на каждый путь. Время идёт под блокировками: settings.lock в .NET-тестах SettingsTests и SeriesIndexTests не укладывается в 30 с, когда временный каталог переполнен.

  Где
  - .NET: src/Tasker.Storage.Files/Workspaces/CanonicalPath.cs, ActualName — перебор без быстрого пути на всех ОС (вызывается из WorkspaceLocation и настроек).
  - Rust: rust/crates/tasker-core/src/settings/canonical_path.rs, actual_name — быстрый путь только на macOS (getattrlist); на Linux и Windows перебор.

  Что нужно сделать
  - Имя элемента в записанном на диске регистре получать без перебора каталога: macOS — getattrlist(ATTR_CMN_NAME) (как уже в Rust), Windows — имя из FindFirstFile/GetFinalPathNameByHandle, Linux — точное совпадение по lstat, перебор только когда точного совпадения нет.
  - Результат канонического пути не меняется: симлинки, junction, короткие имена 8.3, UNC, буква диска — как сейчас.
  - Обе реализации одинаково.
  - Проверка: тесты канонического пути (регистр, симлинки, несуществующий хвост) на трёх ОС; тест, что путь в каталоге с 50 000 записей вычисляется быстро; .NET-тесты SettingsTests и SeriesIndexTests проходят при переполненном временном каталоге; CI зелёный на трёх ОС.
