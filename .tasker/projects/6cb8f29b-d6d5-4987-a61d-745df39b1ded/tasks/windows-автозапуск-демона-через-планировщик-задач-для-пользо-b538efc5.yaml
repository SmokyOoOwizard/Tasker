title: 'Windows: автозапуск демона через Планировщик задач (для пользователя)'
description: |-
  Автозапуск демона на macOS — launchd-агент, на Linux — пользовательская служба systemd (ServiceManager, LaunchdService, SystemdService). На Windows нужен аналог.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Решение пользователя: Планировщик задач Windows для ТЕКУЩЕГО пользователя (не служба Windows, права администратора не нужны).

  Что сделать: `WindowsTaskService` рядом с LaunchdService/SystemdService в src/Tasker.Daemon/Services (реализовать тот же интерфейс, подключить в ServiceManager для OperatingSystem.IsWindows()): создание, включение, отключение, удаление и проверка состояния задачи автозапуска (`tasker mcp autostart enable|disable|status` — как на других платформах): задача «Tasker MCP» запускается при входе пользователя (триггер At log on), без окна (запуск через `tasker-mcpd.exe --detached` с CreateNoWindow либо через `conhost --headless`/`wscript` обёртку — выбрать самый надёжный вариант без мерцающего окна консоли), перезапуск при падении (Restart on failure: интервал и число попыток), «выполнять только когда пользователь вошёл», приоритет и условия (работает от батареи, не останавливать при простое), одна копия (MultipleInstancesPolicy IgnoreNew), перенос в профиль пользователя; способ управления: `schtasks.exe` (XML-определение) либо COM/ITaskService (Microsoft.Win32.TaskScheduler или собственный минимальный вызов) — выбрать без лишних зависимостей, учесть кодировку XML и пути с кириллицей/пробелами; `tasker mcp start|stop|restart` при включённом автозапуске идут через Планировщик (как через launchd/systemd, чтобы система не перезапускала остановленный демон); совместимость с супервизором TSK-103: задача держит супервизор (`tasker-mcpd`), рабочие процессы внутри; переменные TASKER_SERVICE_DIR и TASKER_SERVICE_LABEL для подмены в тестах (как для launchd), тесты на Windows: изолированная задача с уникальным именем, удаление после теста; README и `tasker manual install-daemon` (раздел «Windows»).

  СДЕЛАНО (по коду и проверкам macOS/Linux; на Windows НЕ проверено): WindowsTaskDefinition (чистые функции: XML задачи, квотирование аргументов, действие запуска, разбор состояния) и WindowsTaskService (schtasks /create /xml /f, /run, /end, /delete; состояние через PowerShell Get-ScheduledTask, т.к. вывод schtasks локализован); запуск без окна — `conhost.exe --headless tasker-mcpd.exe --detached`; XML в UTF-16 с BOM; при переопределённом TASKER_HOME — через `cmd /d /s /c "set ... && ..."` (значение без % и "); перезапуск при падении PT1M x 999; тесты WindowsTaskServiceTests (golden XML, команды с подменой runner) и [WindowsFact]-тест на настоящем Планировщике (на других системах пропускается).

  ПРОВЕРИТЬ НА WINDOWS (PowerShell, обычный пользователь без администратора; Windows 10 1809+ или 11; собрать/поставить tasker и tasker-mcpd.exe, tasker mcp workspace add <папка>):
  1. Создание: `tasker mcp autostart enable` -> «Autostart is enabled (Task Scheduler)», демон запущен. `Get-ScheduledTask -TaskName "Tasker MCP" | Select State,TaskName` -> State Running. Файл `%LOCALAPPDATA%\Tasker\service\Tasker MCP.xml` существует. `(Get-ScheduledTask "Tasker MCP").Principal` -> RunLevel Limited (не Highest), UserId = текущий пользователь.
  2. Нет окна: при enable и при следующем входе не мелькает окно консоли; в диспетчере задач tasker-mcpd.exe есть, `conhost.exe` без окна.
  3. Параметры: `schtasks /query /tn "Tasker MCP" /xml` — LogonTrigger, MultipleInstancesPolicy IgnoreNew, DisallowStartIfOnBatteries false, StopIfGoingOnBatteries false, RestartOnFailure PT1M/999, ExecutionTimeLimit PT0S. Эмуляция батареи/простоя: демон не останавливается.
  4. Запуск при входе: выйти из Windows и войти (или Win+L -> войти) / перезагрузка -> `tasker mcp status` показывает демон работающим без ручного запуска; `Get-ScheduledTaskInfo "Tasker MCP"` -> LastTaskResult 267009 (выполняется).
  5. Одна копия: `tasker mcp start` (и `schtasks /run /tn "Tasker MCP"`) при работающем демоне не запускает вторую копию (в диспетчере задач один tasker-mcpd).
  6. Остановка: `tasker mcp stop` -> демон остановлен и в течение 2 минут НЕ поднимается снова; автозапуск остаётся включённым (`tasker mcp autostart status` -> enabled). `tasker mcp start` поднимает снова; `tasker mcp restart` перезапускает.
  7. Перезапуск при падении: `Stop-Process -Name tasker-mcpd -Force` (убить принудительно; при супервизоре и рабочих процессах убить супервизор) -> примерно через минуту демон снова работает (`Get-ScheduledTaskInfo` показывает новый запуск). Если НЕ поднялся — принудительное завершение даёт код, который Планировщик не считает сбоем: отметить в результате (тогда переделать на цикл перезапуска в самом демоне).
  8. Отключение: `tasker mcp autostart disable` -> `Get-ScheduledTask -TaskName "Tasker MCP"` -> «No MSFT_ScheduledTask objects found», файл `Tasker MCP.xml` удалён, демон остановлен (или продолжает работать — зафиксировать фактическое поведение).
  9. Повторное включение: `autostart enable` дважды подряд (idempotent, без ошибки, одна задача); `autostart disable` без включённого автозапуска — без ошибки.
  10. Пробелы и кириллица: установить tasker в каталог вида `C:\Users\Артём Иванов\Мои программы\Tasker App`, пользователь с кириллическим именем и пробелом; `autostart enable` -> демон запущен; `schtasks /query /tn "Tasker MCP" /xml` показывает путь без искажений (кракозябры — ошибка кодировки XML). Затем `$env:TASKER_HOME = "C:\Данные Tasker\тест"` и `autostart enable` -> демон видит этот каталог данных (`tasker mcp status`); значение с `%` даёт понятную ошибку.
  11. Тесты: `dotnet test --filter WindowsTaskServiceTests` -> все тесты, включая Real_task_scheduler_creates_queries_and_deletes_an_isolated_task (не Skipped), проходят; после теста `Get-ScheduledTask -TaskName "Tasker MCP test*"` пусто.
  12. Сообщения об ошибках schtasks на русской Windows читаемы (кодировка OEM); если кракозябры — завести задачу про кодировку вывода процесса.
  13. Совместимость с supervisor-ом TSK-103 на Windows (когда появится): одна задача держит tasker-mcpd (супервизор), рабочие процессы внутри; `schtasks /end` останавливает их все.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ ПО ВОПРОСАМ АГЕНТА (после реализации): (1) запуск без окна через `conhost.exe --headless tasker-mcpd.exe --detached` ПРИНЯТ: минимальная версия Windows — 10 версии 1809 (октябрь 2018) и новее, более старые не поддерживаем; запасной вариант (собрать tasker-mcpd.exe как приложение без консоли) не делаем, пока не понадобятся старые системы; (2) состояние задачи Планировщика читается через PowerShell `Get-ScheduledTask` (встроен в Windows 10/11, ответ не зависит от языка системы) — ПРИНЯТО. Остальные вопросы (поднимется ли демон после принудительного завершения, кодировка вывода schtasks на русской Windows, `mcp start` без автозапуска — Launcher.SpawnDaemon реализован в TSK-117) проверяются по чек-листу «ПРОВЕРИТЬ НА WINDOWS».
