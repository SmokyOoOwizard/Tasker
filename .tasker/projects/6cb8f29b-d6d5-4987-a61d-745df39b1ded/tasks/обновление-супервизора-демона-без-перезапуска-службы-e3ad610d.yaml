title: Обновление супервизора демона без перезапуска службы
description: Супервизор tasker-mcpd живёт до перезапуска демона и не заменяется командой upgrade (только рабочие процессы). Продумать, нужна ли замена супервизора на лету (передача сокета и блокировки новому супервизору) или достаточно совместимости протокола. Связано с TSK-103.
