title: 'Windows: десктоп (Avalonia) — сборка, WebView2, заголовок окна, упаковка'
description: |-
  Десктоп (src/Tasker.Desktop, Avalonia 11, WebView с фронтендом по адресу /w/{папка}/) сейчас рассчитан на macOS: нативные вкладки, нативный заголовок (MacTitleBar, левый отступ 84 под «светофор»), горячие клавиши Cmd. В коде уже есть общие развилки (Primary клавиша Control вне macOS, правый отступ 140 под кнопки окна), но на Windows и Linux десктоп не собирался и не запускался.

  РЕШЕНИЯ ПОЛЬЗОВАТЕЛЯ (общие для всей фичи «Windows, macOS и Linux»): Windows поддерживается обязательно и на равных с macOS и Linux; автозапуск демона на Windows — Планировщик задач Windows для текущего пользователя (без прав администратора, перезапуск при падении, запуск без окна); поставка на первом этапе — самодостаточные сборки (без установленного .NET) для win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64, osx-x64 и скрипты установки (install.ps1 для Windows, общий install.sh для macOS и Linux вместо install-macos.sh); winget/brew/apt — отдельными задачами позже; бесшовное обновление демона (TSK-103: супервизор и рабочие процессы, общий слушающий сокет) влито для macOS и Linux, на Windows демон пока однопроцессный (режим --single), `tasker mcp upgrade` на Windows работает как перезапуск до задачи про сокет.
  ВАЖНО: основная машина разработки — macOS; проверить Windows локально нельзя. Нужен способ запускать сборку и тесты на Windows (CI-сервис, виртуальная машина или отдельная машина) — первая задача фичи (CI). Каждая Windows-задача считается готовой, только когда тесты ПРОХОДЯТ НА WINDOWS.

  Что сделать: (1) сборка и запуск десктопа на Windows (и Linux): зависимости Avalonia, WebView (Avalonia.WebView/CefGlue или WebView2 на Windows — выбрать; требование установленного WebView2 Runtime: проверять и предлагать установку), (2) вкладки: на Windows и Linux нет нативных вкладок macOS — собственная панель вкладок (проверить, что уже реализовано в WorkspaceWindow), заголовок окна и кнопки (отступы Left/RightInset по платформам), меню, горячие клавиши (Ctrl вместо Cmd), (3) хост MCP/REST десктопа и уступка порта демону (TSK-51) на Windows (daemon.lock, обработка занятого порта), (4) пути и настройки (`%APPDATA%\Tasker`, лог), (5) открытие папки (диалог выбора папки), перетаскивание, ассоциация с `.tasker`, (6) упаковка: self-contained публикация, установщик (MSIX или Inno Setup/WiX) или zip с ярлыком, значок, версия, подпись (на потом); (7) проверка на Windows 10/11 x64 и arm64, высокий DPI, тёмная тема, (8) README. Это самая объёмная и наименее срочная часть: консоль и демон важнее — приоритет ниже.
