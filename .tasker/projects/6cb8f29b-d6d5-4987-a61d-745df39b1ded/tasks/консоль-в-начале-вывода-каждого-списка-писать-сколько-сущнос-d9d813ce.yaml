id: d9d813ce-3f11-44ee-b10d-0e6d504972a0
title: 'Консоль: в начале вывода каждого списка писать, сколько сущностей найдено'
description: |-
  При выводе списков консоль не всегда пишет, сколько сущностей найдено. Сейчас итоговая строка есть только когда страница обрезана пагинацией и печатается в КОНЦЕ: `task list --limit 2` → строки данных, затем `Shown 1-2 of 106: use --offset/--limit`. Если всё уместилось на одной странице (`status list`, `task list --all`) числа нет совсем; при пустом результате (`task list --status "В работе"`) не печатается вообще ничего, и непонятно, что это «ничего не найдено», а не сбой. Длинный список приходится листать до конца, чтобы узнать, сколько всего найдено.

  РЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ: количество найденного пишется В НАЧАЛЕ вывода (первой строкой, до строк данных), а не в конце.

  Нужно: каждый текстовый список в консоли начинается строкой с количеством найденного.
  - Формат (согласовать): `Found 106` / `Found 3` для списка, который целиком показан; для обрезанной страницы — `Found 106, shown 1-2 (use --offset/--limit)` вместо сегодняшней концевой строки `Shown 1-2 of 106: …` (она переезжает в начало); для пустого результата — `Found 0` (и больше ничего). Число — это `totalCount` (после фильтров), а не число показанных строк; в начале вывода его знать можно, потому что страница загружается целиком до печати.
  - Охват: `task list`, `task links`, `board tasks`, `board show` (счётчик колонки в заголовке `Backlog (59)` оставить; для всей доски итог не нужен), `status/status-set/task-type/series/board/link-type/field/enum/project/user/agent list`, `mcp workspace list`, списки блокировок и другие списки консоли (найти все через `Kit.List`/`Context.Print(ListDto…)` и привести к общему приёму; один код в общем форматировщике, а не в каждой команде).
  - Куда писать — РЕШЕНИЕ ПОЛЬЗОВАТЕЛЯ: в stdout (первой строкой вывода, до строк данных). Последствие: в конвейерах (`tasker task list | wc -l`, `| head -1`, `| awk`) первая строка — это итог, а не данные. Для скриптов остаются `--json` (поле `totalCount`, поток без итоговой строки) и параметр `-q`/`--quiet`, который убирает строку итога (описать в справке, мануале и README; примеры в мануале и README, где вывод списков разбирается конвейером, обновить). Проверить, куда сейчас пишется `Shown …` (stdout или stderr), и поправить тесты и мануал, которые на него опираются; тесты «stdout чистый» заменяются на «первая строка stdout — итог, дальше данные, с `-q` — только данные». Открытый вопрос на реализацию (не блокирует): стоит ли по умолчанию опускать итог, когда stdout не терминал (конвейер/файл); решение пользователя — всегда печатать, поэтому по умолчанию печатать везде.
  - Согласовать с обрезкой строк (TSK-106: итог не обрезается и не входит в таблицу), выравниванием (TSK-91), сортировкой (TSK-98), фильтрами (TSK-105/84: итог считается после фильтров), вертикальным выводом `board show` (итог вообще не нужен, там заголовки колонок).
  - Тесты (пустой результат, одна страница, несколько страниц, фильтры, разные списки, строка идёт ПЕРВОЙ, `--json` без изменений, перенаправление: stdout чистый, `-q`), мануал (`tasker manual`), README, автодополнение (`--quiet`).
