query Projects($offset: Int, $limit: Int) {
  projects(offset: $offset, limit: $limit) {
    totalCount
    offset
    limit
    data {
      ...ProjectFields
    }
  }
}

query Project($id: UUID!) {
  project(id: $id) {
    ...ProjectFields
    stats {
      tasks
      boards
      statuses
      statusSets
      taskTypes
      series
      linkTypes
    }
  }
}

fragment ProjectFields on Project {
  id
  name
  createdAt
  version
}

query ProjectSetup($projectId: UUID!) {
  project(id: $projectId) {
    id
    statuses(limit: 200, descriptionLength: 0) {
      data {
        id
        name
      }
    }
    statusSets(limit: 200) {
      data {
        id
      }
    }
    taskTypes(limit: 200, descriptionLength: 0) {
      data {
        id
      }
    }
  }
}
