query SettingsCatalog($projectId: UUID!) {
  project(id: $projectId) {
    id
    name
    createdAt
    version
    fields(limit: 200) {
      data {
        id
        name
        type
        multiple
        enumId
        version
      }
    }
    enums(limit: 200) {
      data {
        id
        name
        version
        values {
          id
          name
        }
      }
    }
    linkTypes(limit: 200) {
      data {
        id
        name
        outwardName
        inwardName
        allowCycles
        hierarchical
        isSymmetric
        version
      }
    }
    seriesList(limit: 200) {
      data {
        id
        name
        prefix
        version
      }
    }
    statuses(limit: 200) {
      data {
        id
        name
        color
        description
        icon
        version
      }
    }
    statusSets(limit: 200) {
      data {
        id
        name
        statusIds
        version
      }
    }
    taskTypes(limit: 200) {
      data {
        id
        name
        description
        statusSetId
        version
        fields {
          fieldId
          required
        }
      }
    }
    boards(limit: 200) {
      data {
        id
        name
        statusSetIds
        columns {
          id
          name
          statusIds
          dropStatuses {
            statusSetId
            statusId
          }
        }
      }
    }
    seriesHealth {
      numberConflicts {
        seriesId
        number
        taskIds
      }
      prefixConflicts {
        prefix
        seriesIds
      }
      tasksWithInvalidSeries
      unreadableSeriesFiles
      needsAttention
    }
  }
}

query SettingsTasks($projectId: UUID!, $field: [String!], $statusIds: [UUID!], $typeIds: [UUID!], $offset: Int, $limit: Int) {
  project(id: $projectId) {
    id
    tasks(statusIds: $statusIds, typeIds: $typeIds, field: $field, offset: $offset, limit: $limit, descriptionLength: 0) {
      totalCount
      data {
        id
        title
        seriesNumbers {
          seriesId
          number
        }
        fields {
          fieldId
          values
        }
      }
    }
  }
}

query SettingsMembers($projectId: UUID!) {
  project(id: $projectId) {
    id
    members(limit: 200) {
      data {
        id
        username
        kind
        email
        isAdmin
        ownerId
        rights {
          editTasks
          deleteTasks
          configureProject
          manageSeries
        }
      }
    }
  }
}

query SettingsUsers {
  users(limit: 200) {
    data {
      id
      username
      kind
      email
      isAdmin
      ownerId
    }
  }
}
