query ProjectTasks($projectId: UUID!, $statusIds: [UUID!], $typeIds: [UUID!], $sort: String, $offset: Int, $limit: Int) {
  project(id: $projectId) {
    id
    tasks(statusIds: $statusIds, typeIds: $typeIds, sort: $sort, offset: $offset, limit: $limit, descriptionLength: 0) {
      totalCount
      offset
      limit
      data {
        ...TaskListFields
      }
    }
  }
}

query Task($projectId: UUID!, $id: UUID!) {
  project(id: $projectId) {
    id
    task(id: $id) {
      id
      projectId
      title
      description
      typeId
      statusId
      seriesNumbers {
        seriesId
        number
      }
      createdAt
      updatedAt
      version
      fieldViews {
        fieldId
        name
        type
        multiple
        enumId
        required
        source
        values
        texts
      }
      linkViews {
        typeId
        typeName
        direction
        name
        task {
          id
          title
          statusId
          seriesNumbers {
            seriesId
            number
          }
        }
      }
    }
  }
}

fragment TaskListFields on TaskListItem {
  id
  projectId
  title
  typeId
  statusId
  seriesNumbers {
    seriesId
    number
  }
  createdAt
  updatedAt
  version
  parentIds
  childCount
}

query TaskListPage($projectId: UUID!, $statusIds: [UUID!], $typeIds: [UUID!], $seriesIds: [UUID!], $field: [String!], $sort: String, $query: String, $offset: Int, $limit: Int) {
  project(id: $projectId) {
    id
    tasks(statusIds: $statusIds, typeIds: $typeIds, seriesIds: $seriesIds, field: $field, sort: $sort, query: $query, offset: $offset, limit: $limit, descriptionLength: 0) {
      totalCount
      offset
      limit
      data {
        ...TaskRowFields
      }
    }
  }
}

query TaskTreePage($projectId: UUID!, $statusIds: [UUID!], $typeIds: [UUID!], $seriesIds: [UUID!], $field: [String!], $sort: String, $query: String, $parentId: UUID, $levels: Int, $offset: Int, $limit: Int) {
  project(id: $projectId) {
    id
    taskTree(statusIds: $statusIds, typeIds: $typeIds, seriesIds: $seriesIds, field: $field, sort: $sort, query: $query, parentId: $parentId, levels: $levels, offset: $offset, limit: $limit, descriptionLength: 0) {
      totalCount
      topLevelCount
      offset
      limit
      data {
        ...TaskTreeRowFields
      }
    }
  }
}

query TaskListCount($projectId: UUID!, $statusIds: [UUID!], $typeIds: [UUID!], $seriesIds: [UUID!], $field: [String!], $query: String) {
  project(id: $projectId) {
    id
    tasks(statusIds: $statusIds, typeIds: $typeIds, seriesIds: $seriesIds, field: $field, query: $query, limit: 1, descriptionLength: 0) {
      totalCount
    }
  }
}

query TaskListVocabulary($projectId: UUID!) {
  project(id: $projectId) {
    id
    statuses(limit: 200, descriptionLength: 0) {
      data {
        id
        name
        color
        icon
      }
    }
    statusSets(limit: 200) {
      data {
        id
        name
        statusIds
      }
    }
    taskTypes(limit: 200, descriptionLength: 0) {
      data {
        id
        name
        statusSetId
        fields {
          fieldId
          required
        }
      }
    }
    seriesList(limit: 200) {
      data {
        id
        name
        prefix
      }
    }
    boards(limit: 200) {
      data {
        id
        name
      }
    }
    seriesHealth {
      numberConflicts {
        seriesId
        number
        taskIds
      }
    }
    linkTypes(limit: 200) {
      data {
        id
        name
        outwardName
        inwardName
        hierarchical
        isSymmetric
      }
    }
    fields(limit: 200) {
      data {
        id
        name
        type
        multiple
        enumId
      }
    }
    enums(limit: 200) {
      data {
        id
        name
        values {
          id
          name
        }
      }
    }
  }
}

fragment TaskRowFields on TaskListItem {
  id
  projectId
  title
  typeId
  statusId
  seriesNumbers {
    seriesId
    number
  }
  createdAt
  updatedAt
  version
  parentIds
  childCount
  fields {
    fieldId
    values
    own {
      name
      type
      enumId
    }
  }
}

fragment TaskTreeRowFields on TaskTreeItem {
  id
  projectId
  title
  typeId
  statusId
  seriesNumbers {
    seriesId
    number
  }
  createdAt
  updatedAt
  version
  parentIds
  childCount
  fields {
    fieldId
    values
    own {
      name
      type
      enumId
    }
  }
  depth
  repeated
  treeChildCount
}

query ResolveTaskRef($projectId: UUID!, $ref: String!) {
  project(id: $projectId) {
    id
    resolveTasks(ref: $ref) {
      id
      title
      statusId
      typeId
      seriesNumbers {
        seriesId
        number
      }
    }
  }
}

query TaskSearchPage($projectId: UUID!, $offset: Int, $limit: Int) {
  project(id: $projectId) {
    id
    tasks(offset: $offset, limit: $limit, descriptionLength: 0) {
      totalCount
      data {
        id
        title
        statusId
        typeId
        seriesNumbers {
          seriesId
          number
        }
      }
    }
  }
}

query TaskPaletteSearch($projectId: UUID!, $query: String!, $limit: Int) {
  project(id: $projectId) {
    id
    taskSearch(query: $query, limit: $limit) {
      score
      field
      match
      snippet {
        text
        ranges {
          start
          length
        }
      }
      task {
        id
        title
        statusId
        typeId
        seriesNumbers {
          seriesId
          number
        }
      }
    }
  }
}

query TaskComments($projectId: UUID!, $id: UUID!) {
  project(id: $projectId) {
    id
    taskComments(id: $id) {
      id
      parentId
      depth
      author {
        id
        name
        kind
      }
      body
      createdAt
      editedAt
      deleted
      mine
      version
    }
  }
}

query TaskQueryAnalysis($projectId: UUID!, $text: String!, $cursor: Int) {
  project(id: $projectId) {
    id
    taskQueryAnalysis(text: $text, cursor: $cursor) {
      valid
      hasSort
      errors {
        code
        message
        start
        end
        params {
          name
          value
        }
      }
      suggestions {
        kind
        label
        insert
        start
        end
        caret
        detail
      }
    }
  }
}
