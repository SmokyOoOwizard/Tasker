name: Tasker
options:
  bundleIdPrefix: com.technotronika
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: ${TASKER_VERSION}
    CURRENT_PROJECT_VERSION: ${TASKER_BUILD}
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TaskerAPI:
    path: TaskerAPI
targets:
  Tasker:
    type: application
    platform: macOS
    sources:
      - Sources/Tasker
      - path: Resources/Tasker.help
        type: folder
        buildPhase: resources
      - path: build/daemon/tasker-mcpd
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
    info:
      path: Support/Info.plist
      properties:
        CFBundleHelpBookFolder: Tasker.help
        CFBundleHelpBookName: com.technotronika.tasker.help
    dependencies:
      - package: TaskerAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.technotronika.tasker
        PRODUCT_NAME: Tasker
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tasker
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Technotronika
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  TaskerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/TaskerTests
    dependencies:
      - target: Tasker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.technotronika.tasker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tasker:
    build:
      targets:
        Tasker: all
        TaskerTests: [test]
    test:
      targets:
        - TaskerTests
        - package: TaskerAPI/TaskerAPITests
