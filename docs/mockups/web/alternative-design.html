<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasker — IDE</title>
<style>
:root{--bg:#14161a;--bg2:#181b20;--panel:#1b1e24;--panel2:#21252c;--edge:#2b303a;--fg:#c9d1d9;--dim:#7d8797;--dim2:#566071;--acc:#5ad4a4;--acc2:#2f8f6c;--blue:#6cb6ff;--yel:#e5c07b;--red:#f47067;--pur:#b392f0;--org:#f0a35e;--sel:#243040;--hov:#232831;--st:#0f3d33}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12.5px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--edge);border-radius:3px;padding:2px 9px}
button:hover{border-color:var(--acc2);background:#262c35}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:#111317;border:1px solid var(--edge);border-radius:3px;padding:3px 7px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc2)}
input[type=checkbox]{accent-color:var(--acc)}
input[type=color]{padding:0;width:28px;height:22px}
textarea{resize:vertical;width:100%}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b303a;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-corner{background:transparent}
#app{display:grid;grid-template-rows:34px auto 1fr 24px;height:100vh}
#title{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--edge);white-space:nowrap}
#title .logo{color:var(--acc);font-weight:700}
#title .gap{flex:1}
#title .qs{width:min(460px,40vw);text-align:left;color:var(--dim);background:#111317;display:flex;justify-content:space-between}
.mock{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim2)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:1px 8px;font-size:11px}
.seg button.on{background:var(--acc2);color:#fff}
#wsrow{display:flex;background:var(--bg2);height:0;overflow:hidden}
#wsrow.on{height:28px;border-bottom:1px solid var(--edge)}
#wsrow .w{padding:3px 14px;border-right:1px solid var(--edge);color:var(--dim);cursor:pointer}
#wsrow .w.on{color:var(--fg);background:var(--bg);border-top:2px solid var(--acc)}
#body{display:grid;grid-template-columns:48px var(--sw,270px) 1fr;min-height:0}
#act{background:var(--bg2);border-right:1px solid var(--edge);display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:2px}
#act .ab{width:48px;height:44px;background:transparent;border:0;border-left:2px solid transparent;border-radius:0;color:var(--dim);position:relative;font-size:17px;padding:0}
#act .ab small{display:block;font-size:8.5px;line-height:1;margin-top:1px}
#act .ab:hover{color:var(--fg);background:transparent}
#act .ab.on{color:var(--acc);border-left-color:var(--acc)}
#act .sp{flex:1}
.bdg{position:absolute;top:3px;right:5px;background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:0 4px;line-height:14px}
#side{background:var(--panel);border-right:1px solid var(--edge);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#side.off{display:none}
.sh{padding:6px 10px;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:6px}
.sb{overflow:auto;flex:1;padding-bottom:20px}
.sctl{padding:0 8px 6px;display:flex;gap:6px;flex-wrap:wrap}
.sctl input,.sctl select{flex:1}
.tn{display:flex;align-items:center;gap:4px;padding:1px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;line-height:20px}
.tn:hover{background:var(--hov)}
.tn.on{background:var(--sel);color:#fff}
.tn .tx{overflow:hidden;text-overflow:ellipsis}
.car{width:12px;color:var(--dim);flex:none;text-align:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.ref{color:var(--blue)}
.dim{color:var(--dim)}
.warn{color:var(--yel)}
.err{color:var(--red)}
.ok{color:var(--acc)}
.fold{color:var(--yel)}
.bad{color:var(--red)!important;text-decoration:underline wavy var(--red);text-underline-offset:3px}
#center{display:grid;grid-template-rows:34px 1fr auto;min-width:0;min-height:0}
#tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--edge);overflow-x:auto;overflow-y:hidden}
.tab{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--edge);color:var(--dim);cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab.on{background:var(--bg);color:var(--fg);border-top-color:var(--acc)}
.tab .x{width:16px;height:16px;line-height:14px;text-align:center;border-radius:3px;padding:0;border:0;background:transparent;color:var(--dim)}
.tab .x:hover{background:#333a46;color:#fff}
.tab .dd{color:var(--org);font-size:14px}
#main{overflow:auto;background:var(--bg);min-height:0;position:relative}
#panel{background:var(--panel);border-top:1px solid var(--edge);display:flex;flex-direction:column;height:250px;min-height:0}
#panel.off{display:none}
#rsz{height:4px;cursor:ns-resize;background:transparent;margin-top:-2px;position:relative;z-index:2}
#ptabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--edge);height:28px;flex:none}
#ptabs .pt{padding:3px 10px;border:0;background:transparent;border-bottom:2px solid transparent;border-radius:0;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.05em}
#ptabs .pt.on{color:var(--fg);border-bottom-color:var(--acc)}
#ptabs .gap{flex:1}
#pbody{flex:1;min-height:0;display:flex;flex-direction:column}
.conout{flex:1;overflow:auto;padding:6px 10px;white-space:pre;font-size:12px;line-height:1.45}
.conin{display:flex;gap:8px;padding:5px 10px;border-top:1px solid var(--edge);align-items:center;flex:none}
.conin input{flex:1;background:transparent;border:0;padding:2px}
.ps{color:var(--acc)}
.plist{overflow:auto;flex:1;padding:4px 0}
.prow{display:flex;gap:10px;align-items:center;padding:3px 12px;border-bottom:1px solid #22262e}
.prow:hover{background:var(--hov)}
.prow .m{flex:1;min-width:0}
.jrow{padding:1px 12px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
#status{background:var(--st);color:#cfeee2;display:flex;align-items:center;gap:0;font-size:11.5px;overflow:hidden;white-space:nowrap}
#status span{padding:0 10px;height:24px;line-height:24px;border-right:1px solid #1d5c4b}
#status .gap{flex:1;border:0}
#status .cl{cursor:pointer}
#status .cl:hover{background:#17604c}
.pane{padding:14px 18px 40px;max-width:1500px}
.crumb{color:var(--dim);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--fg)}
h2{margin:0 0 10px;font-size:14px;color:var(--acc);font-weight:600}
h3{margin:16px 0 6px;font-size:12px;color:var(--yel);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .gap{flex:1}
.cmdline{background:#111317;border:1px solid var(--edge);border-radius:3px;padding:3px 9px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:200px}
.cmdline b{color:var(--acc)}
.btn.pri{background:var(--acc2);border-color:var(--acc2);color:#fff}
.btn.dng{border-color:#7a2d28;color:var(--red)}
.btn.sm{padding:0 6px;font-size:11px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--dim);font-weight:400;border-bottom:1px solid var(--edge);padding:3px 8px;white-space:nowrap;position:sticky;top:0;background:var(--bg)}
.tbl td{padding:2px 8px;border-bottom:1px solid #1d2026;vertical-align:middle}
.tbl tr:hover td{background:#191c21}
.tbl td.ttl{max-width:560px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl select{padding:0 3px;font-size:11.5px}
.chip{display:inline-block;border:1px solid var(--edge);border-radius:10px;padding:0 8px;margin:1px 3px 1px 0;color:var(--dim);cursor:pointer;background:transparent;line-height:18px}
.chip.on{border-color:var(--acc2);color:var(--acc);background:#14291f}
.tag{display:inline-block;border-radius:3px;padding:0 6px;background:#262b34;color:var(--dim);margin-right:4px;font-size:11px;line-height:17px}
.card-box{border:1px solid var(--edge);border-radius:4px;background:var(--panel);padding:10px 12px;margin-bottom:10px}
.fp{border:1px solid var(--edge);border-radius:4px;background:var(--bg2);padding:8px 12px;margin-bottom:10px}
.fp .rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:3px 0}
.fp .lb{width:90px;color:var(--dim);flex:none}
.qc{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.qc input[name=t]{flex:1}
.pg{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--dim)}
.prog{display:inline-block;width:46px;height:6px;background:#262b34;border-radius:3px;vertical-align:middle;overflow:hidden;margin:0 4px}
.prog i{display:block;height:100%;background:var(--acc)}
.edg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media(max-width:1300px){.edg{grid-template-columns:1fr}}
.fld{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;margin:4px 0}
.fld .n{color:var(--pur);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .n.req::after{content:" *";color:var(--red)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select{width:100%}
.ttlin{width:100%;font-size:15px;padding:6px 9px;font-weight:600}
.lock{display:inline-block;background:#3a2f12;color:var(--yel);border:1px solid #6b5a22;border-radius:3px;padding:0 7px}
.lock.me{background:#12342a;color:var(--acc);border-color:var(--acc2)}
.yaml{background:#101216;border:1px solid var(--edge);border-radius:4px;padding:8px 0;overflow:auto;font-size:12.5px;line-height:1.6}
.yl{display:flex;white-space:pre}
.yl .ln{width:44px;text-align:right;padding-right:12px;color:var(--dim2);flex:none;user-select:none}
.yk{color:var(--blue)}.ys{color:var(--org)}.yn{color:var(--acc)}.yb{color:var(--pur)}.yi{color:var(--yel)}.yd{color:var(--dim)}
.board{display:flex;gap:10px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.col{flex:1 0 250px;max-width:340px;background:var(--panel);border:1px solid var(--edge);border-radius:4px;min-height:200px}
.col.ok{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.col.no{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.col .ch{padding:6px 10px;border-bottom:1px solid var(--edge)}
.col .ch b{color:var(--fg)}
.col .cb{padding:6px;display:flex;flex-direction:column;gap:6px}
.kc{background:var(--panel2);border:1px solid var(--edge);border-left:3px solid var(--dim);border-radius:3px;padding:6px 8px;cursor:grab}
.kc:hover{border-color:#3d4452}
.kc.drag{opacity:.4}
.kc .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 4px}
.kc .ft{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px}
.kc select{font-size:11px;padding:0 2px}
.empty{padding:40px;color:var(--dim);text-align:center}
.step{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #1f2329}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);text-align:center;line-height:20px;color:var(--dim)}
.step.done .n{background:var(--acc2);border-color:var(--acc2);color:#fff}
.step .t{flex:1}
#modal{display:none}
#modal.on{display:flex;position:fixed;inset:0;background:rgba(5,7,10,.65);z-index:50;align-items:flex-start;justify-content:center;padding-top:9vh}
.dlg{background:var(--panel);border:1px solid #3a4150;border-radius:5px;width:min(540px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:80vh;display:flex;flex-direction:column}
.dlg.wide{width:min(820px,94vw)}
.dh{padding:8px 12px;border-bottom:1px solid var(--edge);display:flex;justify-content:space-between;color:var(--acc)}
.dh button{border:0;background:transparent}
.db{padding:12px;overflow:auto}
.db label{display:block;margin:6px 0 2px;color:var(--dim)}
.db input[type=text],.db input[type=password],.db input[type=number],.db input[type=email],.db select,.db textarea,.db input[type=date]{width:100%}
.df{padding:8px 12px;border-top:1px solid var(--edge);display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;right:14px;bottom:36px;display:flex;flex-direction:column;gap:6px;z-index:80}
.toast{background:var(--panel2);border:1px solid var(--acc2);border-left:4px solid var(--acc);padding:6px 12px;border-radius:3px;max-width:460px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.err{border-color:#7a2d28;border-left-color:var(--red);color:#ffb3ad}
.toast.info{border-left-color:var(--blue)}
#palette{display:none}
#palette.on{display:flex;position:fixed;inset:0;z-index:60;justify-content:center;padding-top:10vh;background:rgba(5,7,10,.45)}
.pal{width:min(640px,94vw);background:var(--panel);border:1px solid #3a4150;border-radius:5px;align-self:flex-start;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.pal input{width:100%;border:0;border-bottom:1px solid var(--edge);border-radius:0;padding:9px 12px;font-size:14px}
.pal .it{padding:4px 12px;display:flex;gap:10px;cursor:pointer;white-space:nowrap;overflow:hidden}
.pal .it.on{background:var(--sel)}
.pal .res{max-height:50vh;overflow:auto}
#login{display:none}
#login.on{display:flex;position:fixed;inset:0;background:var(--bg);z-index:70;align-items:center;justify-content:center}
.lg{width:min(400px,94vw);border:1px solid var(--edge);background:var(--panel);border-radius:5px;padding:20px}
.lg label{display:block;margin:8px 0 2px;color:var(--dim)}
.lg input{width:100%}
.lg .tabs2{display:flex;gap:14px;margin-bottom:10px}
.lg .tabs2 a{cursor:pointer;color:var(--dim)}
.lg .tabs2 a.on{color:var(--acc);text-decoration:underline}
.menu{position:fixed;background:var(--panel2);border:1px solid #3a4150;border-radius:4px;z-index:65;min-width:200px;padding:3px 0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu div{padding:3px 12px;cursor:pointer}
.menu div:hover{background:var(--sel)}
.menu hr{border:0;border-top:1px solid var(--edge);margin:3px 0}
pre.raw{background:#101216;padding:10px;border:1px solid var(--edge);overflow:auto;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mono-in{width:100%}
.hint{color:var(--dim);font-size:11.5px}
.sq{text-decoration:underline wavy var(--yel);text-underline-offset:3px}
.ddrop{outline:1px dashed var(--acc)}
.sbtn{background:transparent;border:0;color:var(--dim);padding:0 4px}
.sbtn:hover{color:var(--fg);background:transparent}
</style>
</head>
<body>
<div id="app">
<header id="title"></header>
<div id="wsrow"></div>
<div id="body">
<nav id="act"></nav>
<aside id="side"></aside>
<section id="center">
<div id="tabs"></div>
<div id="main"></div>
<div id="panel"><div id="rsz"></div><div id="ptabs"></div><div id="pbody"></div></div>
</section>
</div>
<footer id="status"></footer>
</div>
<div id="modal"></div>
<div id="palette"></div>
<div id="login"></div>
<div id="toasts"></div>
<script>
const DB = {
  me: 'u-artem',
  mode: 'server',
  users: [
    { id: 'u-artem', kind: 'human', name: 'Артём', email: 'artem@example.com', admin: true },
    { id: 'u-maria', kind: 'human', name: 'Мария', email: 'maria@example.com', admin: false },
    { id: 'u-ivan', kind: 'human', name: 'Иван', email: 'ivan@example.com', admin: false },
    { id: 'a-claude', kind: 'agent', name: 'Claude', owner: 'u-artem' },
    { id: 'a-review', kind: 'agent', name: 'Ревьюер-бот', owner: 'u-maria' }
  ],
  agentTokens: [
    { id: 't1', agentId: 'a-claude', name: 'Ноутбук', prefix: 'tsk_7f3a', createdAt: '2026-09-01T10:00:00Z', expiresAt: null, lastUsedAt: '2026-11-03T09:41:00Z', revokedAt: null },
    { id: 't2', agentId: 'a-claude', name: 'CI', prefix: 'tsk_c91d', createdAt: '2026-10-01T10:00:00Z', expiresAt: '2026-12-30T10:00:00Z', lastUsedAt: '2026-11-02T22:10:00Z', revokedAt: null },
    { id: 't3', agentId: 'a-review', name: 'Старый', prefix: 'tsk_02be', createdAt: '2026-07-01T10:00:00Z', expiresAt: null, lastUsedAt: '2026-08-15T12:00:00Z', revokedAt: '2026-09-01T08:00:00Z' }
  ],
  projects: [
    { id: 'p-tasker', name: 'Tasker', createdAt: '2026-06-01T10:00:00Z', members: ['u-artem', 'u-maria', 'u-ivan', 'a-claude', 'a-review'] },
    { id: 'p-demo', name: 'Demo', createdAt: '2026-10-20T10:00:00Z', members: ['u-artem', 'a-claude'] }
  ],
  statuses: [
    { id: 's-backlog', name: 'Бэклог', color: '#8993a4', description: 'Идея или задача без срока, ещё не взята в план' },
    { id: 's-todo', name: 'Туду', color: '#2684ff', description: 'Взята в план, можно начинать' },
    { id: 's-doing', name: 'В работе', color: '#f5a623', description: 'Кто-то работает над задачей прямо сейчас' },
    { id: 's-review', name: 'Ревью', color: '#9b59b6', description: 'Открыт PR, ждёт проверки' },
    { id: 's-done', name: 'Готово', color: '#36b37e', description: 'Сделано и влито в main' },
    { id: 's-cancel', name: 'Отменена', color: '#de350b', description: 'Задача больше не актуальна: не делается и не будет сделана' }
  ],
  statusSets: [
    { id: 'ss-main', name: 'Основной', statusIds: ['s-backlog', 's-todo', 's-doing', 's-review', 's-done', 's-cancel'] },
    { id: 'ss-bug', name: 'Баги', statusIds: ['s-backlog', 's-doing', 's-done', 's-cancel'] }
  ],
  taskTypes: [
    { id: 'tt-feature', name: 'Фича', description: 'Новая возможность для пользователя', statusSetId: 'ss-main', fields: [{ fieldId: 'f-estimate', required: false }, { fieldId: 'f-priority', required: true }, { fieldId: 'f-component', required: false }] },
    { id: 'tt-bug', name: 'Баг', description: 'Поведение расходится с документацией или ожиданием', statusSetId: 'ss-bug', fields: [{ fieldId: 'f-priority', required: true }, { fieldId: 'f-regression', required: false }, { fieldId: 'f-version', required: false }, { fieldId: 'f-component', required: false }] },
    { id: 'tt-rnd', name: 'R&D', description: 'Исследование: результат — вывод или прототип, а не фича', statusSetId: 'ss-main', fields: [{ fieldId: 'f-deadline', required: false }] }
  ],
  series: [
    { id: 'sr-tsk', name: 'Tasker', prefix: 'TSK' },
    { id: 'sr-rel', name: 'Релиз 1.0', prefix: 'REL' }
  ],
  enums: [
    { id: 'e-priority', name: 'Приоритеты', values: [{ id: 'ev-low', name: 'Низкий' }, { id: 'ev-mid', name: 'Средний' }, { id: 'ev-high', name: 'Высокий' }, { id: 'ev-crit', name: 'Критичный' }] },
    { id: 'e-component', name: 'Компоненты', values: [{ id: 'ev-cli', name: 'CLI' }, { id: 'ev-mcp', name: 'MCP' }, { id: 'ev-daemon', name: 'Демон' }, { id: 'ev-desktop', name: 'Desktop' }, { id: 'ev-web', name: 'Web' }, { id: 'ev-core', name: 'Core' }] }
  ],
  fields: [
    { id: 'f-estimate', name: 'Оценка', type: 'int', multiple: false },
    { id: 'f-priority', name: 'Приоритет', type: 'enum', enumId: 'e-priority', multiple: false },
    { id: 'f-component', name: 'Компонент', type: 'enum', enumId: 'e-component', multiple: true },
    { id: 'f-deadline', name: 'Срок', type: 'date', multiple: false },
    { id: 'f-regression', name: 'Регрессия', type: 'bool', multiple: false },
    { id: 'f-version', name: 'Версия', type: 'string', multiple: false },
    { id: 'f-hours', name: 'Часы', type: 'float', multiple: false }
  ],

function taskFields(t,typeId){const ty=TY(typeId||t.typeId);const out=[];(ty?ty.fields:[]).forEach(x=>{const d=FL(x.fieldId);if(d)out.push({def:d,kind:'type',required:x.required})});

t.custom.forEach(c=>out.push({def:{id:c.fieldId,name:c.name,type:c.type,multiple:c.multiple},kind:'custom',required:c.required}));return out}
const isSet=v=>v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length);
const enumName=(enumId,vid)=>{const e=EN(enumId);const v=e&&e.values.find(x=>x.id===vid);return v?v.name:vid};
function fmtVal(d,v){if(!isSet(v))return '—';const f=x=>d.type==='enum'?enumName(d.enumId,x):d.type==='bool'?(x?'да':'нет'):x;return Array.isArray(v)?v.map(f).join(', '):String(f(v))}
const OPS={equal:'=',notEqual:'!=',gt:'>',gte:'>=',lt:'<',lte:'<=',set:'set',unset:'unset',attached:'attached',detached:'detached'};
const OPSYM={equal:'=',notEqual:'≠',gt:'>',gte:'≥',lt:'<',lte:'≤',set:'задано',unset:'не задано',attached:'привязано',detached:'не привязано'};
const NUMOPS=['gt','gte','lt','lte'];
const noVal=o=>['set','unset','attached','detached'].includes(o);
function condText(c){const d=defById(c.fieldId);const n=d?d.name:c.fieldId;if(noVal(c.operator))return n+' '+OPSYM[c.operator];return n+' '+OPSYM[c.operator]+' '+(d?fmtVal(d,d.type==='int'||d.type==='float'?+c.value:d.type==='bool'?c.value==='true'||c.value===true:c.value):c.value)}
function condOk(t,c){const f=taskFields(t).find(x=>x.def.id===c.fieldId);if(c.operator==='attached')return !!f;if(c.operator==='detached')return !f;
const v=f?t.fields[c.fieldId]:undefined,has=isSet(v);if(c.operator==='set')return has;if(c.operator==='unset')return !has;
const arr=has?(Array.isArray(v)?v:[v]):[];const d=f?f.def:defById(c.fieldId)||{type:'string'};
const num=d.type==='int'||d.type==='float',cv=c.value;
const cmp=a=>num?(+a)-(+cv):d.type==='date'||d.type==='string'?String(a).localeCompare(String(cv)):String(a)===String(cv)?0:1;
const o=c.operator;
if(o==='equal')return arr.some(a=>cmp(a)===0);if(o==='notEqual')return !arr.some(a=>cmp(a)===0);
if(o==='gt')return arr.some(a=>cmp(a)>0);if(o==='gte')return arr.some(a=>cmp(a)>=0);if(o==='lt')return arr.some(a=>cmp(a)<0);return arr.some(a=>cmp(a)<=0)}
function parseVal(d,str){str=String(str).trim();const one=s=>{s=s.trim();
if(d.type==='int'){if(!/^-?\d+$/.test(s))throw Error('«'+d.name+'»: ожидается целое число');return +s}
if(d.type==='float'){if(isNaN(+s)||s==='')throw Error('«'+d.name+'»: ожидается число');return +s}
if(d.type==='bool'){if(/^(true|да|1)$/i.test(s))return true;if(/^(false|нет|0)$/i.test(s))return false;throw Error('«'+d.name+'»: ожидается true/false')}
if(d.type==='date'){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))throw Error('«'+d.name+'»: ожидается дата ГГГГ-ММ-ДД');return s}
if(d.type==='enum'){const e=EN(d.enumId);const v=e&&e.values.find(x=>x.name.toLowerCase()===s.toLowerCase()||x.id===s);if(!v)throw Error('«'+d.name+'»: значение «'+s+'» не входит в перечисление «'+(e?e.name:'?')+'»');return v.id}
return s};
return d.multiple?str.split(',').map(one):one(str)}
function sortVal(t,key){if(key==='status')return DB.statuses.findIndex(s=>s.id===t.statusId);if(key==='type'){const y=TY(t.typeId);return y?y.name.toLowerCase():null}
if(key==='title')return t.title.toLowerCase();if(key==='created')return t.createdAt;if(key==='updated')return t.updatedAt;
if(key==='series')return t.series.length?pfx(t.series[0].seriesId).padEnd(20)+String(t.series[0].number).padStart(8,'0'):null;
const d=defByName(key);if(!d)return null;let v=t.fields[d.id];if(Array.isArray(v))v=v[0];if(!isSet(v))return null;
if(d.type==='enum'){const e=EN(d.enumId);return e.values.findIndex(x=>x.id===v)}return v}
const cmpTasks=sort=>(a,b)=>{for(const s of sort){const x=sortVal(a,s.key),y=sortVal(b,s.key);const nx=x==null||x==='',ny=y==null||y==='';if(nx&&ny)continue;if(nx)return 1;if(ny)return -1;if(x<y)return -s.dir;if(x>y)return s.dir}return 0};

function f2q(F){const p=new URLSearchParams();F.types.forEach(x=>p.append('type',x));F.statuses.forEach(x=>p.append('status',x));F.series.forEach(x=>p.append('series',x));
F.conds.forEach(c=>p.append('c',[c.fieldId,c.operator,c.value==null?'':c.value].join('~')));p.set('sort',F.sort.map(s=>(s.dir<0?'-':'')+s.key).join(','));if(F.flat)p.set('flat','1');if(F.page>1)p.set('page',F.page);
let q=p.toString();return q?'?'+q:''}
function q2f(p){const F=newFilter();F.types=p.getAll('type');F.statuses=p.getAll('status');F.series=p.getAll('series');
p.getAll('c').forEach(x=>{const a=x.split('~');F.conds.push({fieldId:a[0],operator:a[1],value:a[2]})});
if(p.has('sort')){const s=p.get('sort');F.sort=s?s.split(',').map(x=>x[0]==='-'?{key:x.slice(1),dir:-1}:{key:x,dir:1}):[]}
F.flat=p.get('flat')==='1';F.page=+p.get('page')||1;F.open=S.filter.open;return F}
function cliOfFilter(F,withFlat=true){const a=['task list'];F.statuses.forEach(x=>a.push('--status "'+ST(x).name+'"'));F.types.forEach(x=>a.push('--type "'+TY(x).name+'"'));F.series.forEach(x=>a.push('--series '+pfx(x)));
F.conds.forEach(c=>{const d=defById(c.fieldId);if(!d)return;a.push("--field '"+d.name+(noVal(c.operator)?' '+c.operator:OPS[c.operator]+(d.type==='enum'?enumName(d.enumId,c.value):c.value))+"'")});

function setFieldValue(t,fid,v,via){const lf=lockFail(t);if(lf)return lf;const f=taskFields(t).find(x=>x.def.id===fid);if(!f)return ERR('Поле не привязано к задаче');

function createTask(o,via){const title=(o.title||'').trim();if(!title)return ERR('Название не может быть пустым');const ty=TY(o.typeId);if(!ty)return ERR('Тип не найден');

function findCycle(lt,a,b){if(lt.allowCycles)return null;const adj={};DB.links.filter(l=>l.typeId===lt.id).forEach(l=>{(adj[l.from]=adj[l.from]||[]).push(l.to)});
const prev={[b.id]:null},q=[b.id];while(q.length){const x=q.shift();if(x===a.id){const p=[];let c=x;while(c){p.unshift(c);c=prev[c]}return [a.id,...p]}(adj[x]||[]).forEach(y=>{if(!(y in prev)){prev[y]=x;q.push(y)}})}return null}
function linkTasks(a,ltId,b,via){const lt=LT(ltId);if(!lt)return ERR('Тип связи не найден');if(a.id===b.id)return ERR('Нельзя связать задачу саму с собой');

function stNode(t,d,car,pre,suf){const st=ST(t.statusId);const cf=inConflict(t);const lk=lockOf('task',t.id);

function sideTasks(){const q=S.explQ.trim().toLowerCase();let h=`<div class="sctl"><input placeholder="фильтр дерева…" value="${esc(S.explQ)}" data-i="explq"><span class="seg"><button class="${S.sideView==='tree'?'on':''}" data-a="sview" data-p="tree">Задачи</button><button class="${S.sideView==='files'?'on':''}" data-a="sview" data-p="files">.tasker</button></span></div><div class="sb">`;
if(!DB.tasks.length&&S.sideView==='tree')return h+'<div class="empty">Пока нет задач.<br><a href="#/welcome">Начать настройку проекта</a></div></div>';
if(S.sideView==='files'){h+=filesTree()}
else if(q){DB.tasks.filter(t=>(refOf(t)+' '+t.title).toLowerCase().includes(q)).forEach(t=>h+=stNode(t,0))}
else{const seen=new Set();const cmp=cmpTasks([{key:'series',dir:1}]);
const walk=(t,d,path)=>{const kids=childrenOf(t).sort(cmp);const rep=seen.has(t.id);seen.add(t.id);const col=S.collapsed['e:'+t.id];
const car=kids.length?`<span class="car" data-a="ecol" data-p="${t.id}">${col?'▸':'▾'}</span>`:'<span class="car"></span>';
h+=stNode(t,d,car,kids.length?'<span class="fold">▤</span> ':'',rep?' <span class="dim">(+)</span>':'');
if(!rep&&!col)kids.forEach(k=>{if(!path.includes(k.id))walk(k,d+1,path.concat(t.id))})};
h+=`<div class="tn dim"><span class="car">▾</span><span class="fold">▤</span> ${esc(projDir())}/tasks</div>`;
DB.tasks.filter(t=>!parentsOf(t).length).sort(cmp).forEach(t=>walk(t,1,[]))}
return h+'</div>'}

const fl=(n,dd,act,p,bad)=>`<div class="tn ${bad?'bad':''}" style="padding-left:${8+dd*14}px" data-a="${act}" data-p="${p}"><span class="car"></span><span class="dim">≡</span><span class="tx ${bad?'':'dim'}">${esc(n)}</span></div>`;
let h=fd('.tasker',0)+fd('projects/'+d.split('/')[2],1);const sc=[['project.yaml','project'],['statuses.yaml','statuses'],['status-sets.yaml','sets'],['task-types.yaml','types'],['link-types.yaml','links'],['fields.yaml','fields'],['enums.yaml','enums']];
sc.forEach(x=>h+=fl(x[0],3,'open','schema/'+x[1]));h+=fl('series.yaml',3,'open','series');
h+=fd('boards',2);DB.boards.forEach(b=>h+=fl(slug(b.name,2)+'-'+hex(b.id,8)+'.yaml',3,'open','board/'+b.id));

DB.problems.filter(p=>p.kind==='unreadable'&&/tasks/.test(p.path)).forEach(()=>h+=fl('fix-login-11ab5ea4.yaml',3,'open','problems',true));
DB.problems.filter(p=>p.kind==='secondFolder').forEach(()=>h+=`<div class="tn bad" style="padding-left:22px" data-a="open" data-p="problems"><span class="car">▸</span><span class="fold">▤</span><span class="tx">projects/tasker-old-6cb8f29b</span></div>`);return h}

function rows(F){const cmp=cmpTasks(F.sort);const list=DB.tasks.filter(t=>matches(t,F)).sort(cmp);if(F.flat)return {list,rows:list.map(t=>({t,d:0,kids:0}))};
const set=new Set(list.map(t=>t.id)),seen=new Set(),out=[];const roots=list.filter(t=>!parentsOf(t).some(p=>set.has(p.id)));
const walk=(t,d,path)=>{const kids=childrenOf(t).filter(k=>set.has(k.id)).sort(cmp);const rep=seen.has(t.id);seen.add(t.id);const col=S.collapsed['l:'+t.id];out.push({t,d,kids:kids.length,rep,col});if(rep||col)return;kids.forEach(k=>{if(!path.includes(k.id))walk(k,d+1,path.concat(t.id))})};
roots.forEach(t=>walk(t,0,[]));return {list,rows:out}}
function valInput(d,id,v){v=v==null?'':v;if(!d)return `<input type="text" id="${id}" value="${esc(v)}">`;
if(d.type==='enum'){const e=EN(d.enumId);return `<select id="${id}">${(e?e.values:[]).map(x=>`<option value="${x.id}" ${x.id===v?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}
if(d.type==='bool')return `<select id="${id}"><option value="true" ${String(v)==='true'?'selected':''}>да</option><option value="false" ${String(v)==='false'?'selected':''}>нет</option></select>`;
if(d.type==='date')return `<input type="date" id="${id}" value="${esc(v)}">`;if(d.type==='int'||d.type==='float')return `<input type="number" step="${d.type==='int'?1:'any'}" id="${id}" value="${esc(v)}">`;return `<input type="text" id="${id}" value="${esc(v)}">`}
function opOptions(d,sel){return Object.keys(OPS).filter(o=>!NUMOPS.includes(o)||(d&&['int','float','date'].includes(d.type))).map(o=>`<option value="${o}" ${o===sel?'selected':''}>${OPS[o]}</option>`).join('')}

function yamlHTML(t){const L=[];const k=(n,i)=>' '.repeat(i||0)+`<span class="yk">${esc(n)}</span>:`;const sv=v=>{v=String(v);return /[:#\[\]{}&*!|>'"%@`,]|^\s|\s$|^-/.test(v)||v===''?'<span class="ys">"'+esc(v.replace(/"/g,'\\"'))+'"</span>':'<span class="ys">'+esc(v)+'</span>'};
const idv=v=>`<span class="yi">${esc(v)}</span>`,nv=v=>`<span class="yn">${esc(v)}</span>`;
L.push(k('formatVersion')+' '+nv(10));L.push(k('id')+' '+idv(uuid(t.id)));L.push(k('title')+' '+sv(t.title));L.push(k('typeId')+' '+idv(t.typeId));L.push(k('statusId')+' '+idv(t.statusId));
L.push(k('createdAt')+' '+sv(t.createdAt));L.push(k('updatedAt')+' '+sv(t.updatedAt));
if(t.series.length){L.push(k('series'));t.series.forEach(s=>{L.push('  - '+`<span class="yk">seriesId</span>: `+idv(s.seriesId));L.push('    '+`<span class="yk">number</span>: `+nv(s.number))})}else L.push(k('series')+' <span class="yd">[]</span>');
const ol=DB.links.filter(l=>l.from===t.id);if(ol.length){L.push(k('links'));ol.forEach(l=>{L.push('  - <span class="yk">typeId</span>: '+idv(l.typeId));L.push('    <span class="yk">to</span>: '+idv(uuid(l.to))+' <span class="yd"># '+esc(refOf(T(l.to)))+'</span>')})}else L.push(k('links')+' <span class="yd">[]</span>');
const fk=Object.keys(t.fields);if(fk.length||t.custom.length){L.push(k('fields'));fk.forEach(f=>{const c=t.custom.find(x=>x.fieldId===f);const v=t.fields[f];const fv=x=>typeof x==='number'?nv(x):typeof x==='boolean'?`<span class="yb">${x}</span>`:(FL(f)&&FL(f).type==='enum')?idv(x):sv(x);
const val=Array.isArray(v)?'<span class="yd">[</span>'+v.map(fv).join('<span class="yd">, </span>')+'<span class="yd">]</span>':fv(v);
if(c){L.push('  '+k(f));L.push('    <span class="yk">custom</span>: <span class="yd">{</span>name: '+sv(c.name)+', type: '+esc(c.type)+', multiple: <span class="yb">'+c.multiple+'</span>, required: <span class="yb">'+c.required+'</span><span class="yd">}</span>');L.push('    <span class="yk">value</span>: '+val)}
else L.push('  '+k(f)+' '+val)})}else L.push(k('fields')+' <span class="yd">{}</span>');
if(t.description){L.push(k('description')+' <span class="yb">|</span>');t.description.split('\n').forEach(x=>L.push('  <span class="ys">'+esc(x)+'</span>'))}else L.push(k('description')+' <span class="ys">""</span>');
return `<div class="hint" style="margin-bottom:6px">Файл задачи в порядке ключей, как его пишет Tasker. Только чтение: правки — через «Форма» или консоль.${dirty(t)?' <span class="warn">Показана сохранённая версия, есть несохранённые правки.</span>':''}</div><div class="yaml">${L.map((x,i)=>`<div class="yl"><span class="ln">${i+1}</span><span>${x}</span></div>`).join('')}</div>`}

function fieldInput(f,v,err){const d=f.def,val=v.fields[d.id];const id=d.id;
const base=`data-i="fv" data-p="${esc(id)}"`;const sty=err?' style="border-color:var(--red)"':'';
if(d.type==='bool')return `<label><input type="checkbox" ${base} ${val?'checked':''}> ${val?'да':'нет'}</label>`;
if(d.type==='enum'){const e=EN(d.enumId);if(d.multiple){const a=Array.isArray(val)?val:[];return `<span class="fmulti" data-f="${esc(id)}">${e.values.map(x=>`<label style="margin-right:8px"><input type="checkbox" data-i="fvm" data-p="${esc(id)}" value="${x.id}" ${a.includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</span>`}
return `<select ${base}${sty}><option value="">—</option>${e.values.map(x=>`<option value="${x.id}" ${val===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}
if(d.type==='date')return `<input type="date" ${base}${sty} value="${esc(val||'')}">`;
if(d.type==='int'||d.type==='float')return `<input type="${d.multiple?'text':'number'}" step="${d.type==='int'?1:'any'}" ${base}${sty} value="${esc(Array.isArray(val)?val.join(', '):val==null?'':val)}">`;
return `<input type="text" ${base}${sty} value="${esc(Array.isArray(val)?val.join(', '):val==null?'':val)}" ${d.multiple?'placeholder="через запятую"':''}>`}
function formHTML(t){const v=viewOf(t);const ty=TY(v.typeId);const errs=(S.errs&&S.errs[t.id])||[];const fs=taskFields(Object.assign({},t,{fields:v.fields}),v.typeId);
const miss=reqMissing(t,v.typeId,v.fields);

const avail=DB.fields.filter(d=>!fs.some(f=>f.def.id===d.id));
L+=`<div class="bar" style="margin-top:8px"><select id="xf"><option value="">＋ поле из каталога…</option>${avail.map(d=>`<option value="${d.id}">${esc(d.name)} · ${d.type}</option>`).join('')}</select><button class="btn sm" data-a="attachx">привязать</button><button class="btn sm" data-a="addcustom">＋ своё поле…</button></div></div>`;

<div class="hint">Набор «${esc(ty?SS(ty.statusSetId).name:'?')}». Смена статуса применяется сразу и не проверяет обязательные поля.</div></div>`;
L+=`<div class="card-box"><h3 style="margin-top:0">series</h3>${t.series.map(s=>{const du=dupOf(t,s).length;return `<div class="fld" style="grid-template-columns:1fr auto auto"><span class="${du?'sq':''} ref" ${du?'title="Номер выдан нескольким задачам"':''}>${esc(refStr(s))}${du?' <span class="warn">⚠</span>':''}</span><button class="btn sm" data-a="renum" data-p="${s.seriesId}">№…</button><button class="btn sm" data-a="unser" data-p="${s.seriesId}">×</button></div>`}).join('')||'<div class="dim">вне серий · ключ '+esc(sid(t))+'</div>'}
${inConflict(t)?'<div class="warn" style="margin-top:6px">⚠ Конфликт номера. <a href="#" data-a="fix" data-p="resolve" data-q="0">Разрешить конфликты номеров</a></div>':''}
<div class="bar" style="margin-top:6px"><select id="sadd">${DB.series.filter(s=>!t.series.some(x=>x.seriesId===s.id)).map(s=>`<option value="${s.id}">${esc(s.prefix)}</option>`).join('')}</select><input id="snum" type="number" placeholder="номер (авто)" style="width:110px"><button class="btn sm" data-a="addser">в серию</button></div></div>`;

ACT.reverttask=()=>{const t=curTask();delete S.drafts[t.id];delete S.myLocks[t.id];S.errs&&delete S.errs[t.id];renderMain();refreshEd();toast('Правки отменены','info')};
ACT.savetask=()=>{const t=curTask();if(t)saveTask(t)};
function saveTask(t){const d=S.drafts[t.id];if(!d||!dirty(t))return;const lf=lockFail(t);if(lf){toast(lf.msg,'err');return}
if(S.once[t.id]||d.base!==verOf(t.id)){S.once[t.id]=false;
modal('Изменено другим пользователем','<div>Задача <b>'+esc(refOf(t))+'</b> была сохранена кем-то ещё, пока вы её правили (версия '+verOf(t.id)+' вместо '+d.base+').</div><div class="hint" style="margin-top:6px">Ваши правки не потеряны: перечитайте задачу и повторите сохранение.</div>',
[{label:'Отмена'},{label:'Перечитать и повторить',cls:'pri',fn:()=>{d.base=verOf(t.id);saveTask(t)}}]);return}
if(!d.title.trim()){toast('Название не может быть пустым','err');return}
const miss=reqMissing(t,d.typeId,d.fields);if(miss.length){S.errs=S.errs||{};S.errs[t.id]=miss.map(m=>m.def.id);toast('Обязательное поле: '+miss.map(m=>m.def.name).join(', '),'err');renderMain();return}
if(S.errs)delete S.errs[t.id];
const parts=[];if(d.title!==t.title)parts.push('--title "'+d.title+'"');if(d.description!==t.description)parts.push('--description "…"');if(d.typeId!==t.typeId)parts.push('--type "'+TY(d.typeId).name+'"');if(d.statusId!==t.statusId)parts.push('--status "'+ST(d.statusId).name+'"');
const oldF=t.fields;taskFields(Object.assign({},t,{fields:d.fields}),d.typeId).forEach(f=>{if(JSON.stringify(oldF[f.def.id])!==JSON.stringify(d.fields[f.def.id]))parts.push("--field '"+f.def.name+'='+(isSet(d.fields[f.def.id])?fmtVal(f.def,d.fields[f.def.id]):'')+"'")});
t.title=d.title.trim();t.description=d.description;t.typeId=d.typeId;t.statusId=d.statusId;const nty=TY(d.typeId);
Object.keys(d.fields).forEach(k=>{if(FL(k)&&!nty.fields.some(x=>x.fieldId===k)&&!(t.extra||[]).includes(k)&&!t.custom.some(c=>c.fieldId===k))t.extra.push(k)});t.fields=jsonClone(d.fields);
delete S.drafts[t.id];delete S.myLocks[t.id];touch(t);cli('task update '+refOf(t)+' '+parts.join(' '));toast(refOf(t)+' сохранена');render()}
ACT.simconf=()=>{const t=curTask();S.vers[t.id]=verOf(t.id)+1;S.sync=Date.now();toast('Мария сохранила '+refOf(t)+' (версия '+verOf(t.id)+')','info');refreshEd()};

ACT.addcustom=()=>{const t=curTask();modal('Своё поле задачи','<div class="hint">Определение хранится в самой задаче и потом не меняется.</div><label>Имя (буквы и цифры)</label><input type="text" name="n" autofocus><label>Тип</label><select name="ty"><option value="string">string</option><option value="int">int</option><option value="float">float</option><option value="bool">bool</option><option value="date">date</option></select><label><input type="checkbox" name="m"> несколько значений</label><label><input type="checkbox" name="r"> обязательное</label>',
[{label:'Отмена'},{label:'Добавить',cls:'pri',fn:()=>{const n=mv('n').trim();if(!/^[\p{L}\p{N}]+$/u.test(n)){toast('Имя поля: только буквы и цифры','err');return false}if(allDefs().some(d=>d.name.toLowerCase()===n.toLowerCase())){toast('Поле с таким именем уже есть','err');return false}
t.custom.push({fieldId:'cf-'+hex(n+t.id,6),name:n,type:mv('ty'),multiple:mv('m'),required:mv('r')});touch(t);cli("task update "+refOf(t)+" --custom-field '"+n+":"+mv('ty')+"'");toast('Поле «'+n+'» добавлено');render()}}])};

function boardTasks(b){const flt=S.bflt[b.id]||[];return DB.tasks.filter(t=>{const ty=TY(t.typeId);return ty&&b.statusSetIds.includes(ty.statusSetId)&&flt.every(c=>condOk(t,c))})}
function boardCols(b){const cols=b.columns.map(c=>({c,items:[]}));const out=[];
boardTasks(b).forEach(t=>{const x=cols.find(k=>k.c.statusIds.includes(t.statusId)&&k.c.fieldConditions.every(cd=>condOk(t,cd)));if(x)x.items.push(t);else out.push(t)});
cols.forEach(k=>k.items.sort(cmpTasks([{key:'series',dir:1}])));return {cols,out}}
const colOf=(b,t)=>{const x=b.columns.find(k=>k.statusIds.includes(t.statusId)&&k.fieldConditions.every(cd=>condOk(t,cd)));return x}
function dropStatus(col,t){const ty=TY(t.typeId);const set=SS(ty.statusSetId);return col.dropStatuses[set.id]||col.statusIds.find(id=>set.statusIds.includes(id))}
function moveCard(t,col,b,via){const lf=lockFail(t);if(lf)return lf;const unmet=col.fieldConditions.filter(c=>!condOk(t,c));
if(unmet.length)return ERR('Сначала поправьте поля: '+unmet.map(condText).join(', '));
const sid2=dropStatus(col,t);if(!sid2){const ty=TY(t.typeId);return ERR('В колонке «'+col.name+'» нет статусов набора «'+SS(ty.statusSetId).name+'»')}
if(sid2===t.statusId)return OK('Карточка уже в колонке «'+col.name+'»');return setStatus(t,sid2,via)}
function vBoard(id){const b=BD(id);if(!b)return '<div class="pane"><div class="empty">Досок нет. <a href="#" data-a="newboard">Создать доску</a></div></div>';
if(!DB.statuses.length)return vWelcome();
const {cols,out}=boardCols(b);const lk=lockOf('board',b.id);const flt=S.bflt[b.id]||[];
let h=`<div class="pane"><div class="crumb"><span class="dim">${esc(projDir())}/boards/</span><b>${esc(slug(b.name,2)+'-'+hex(b.id,8))}.yaml</b>${lk?`<span class="lock">◉ правит ${esc(lk.holder)} · ещё ${lk.expiresInSec} с</span>`:''}</div>
<div class="bar"><select data-c="bpick">${DB.boards.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><div class="cmdline"><b>$</b> tasker board show ${esc(b.name)}${flt.map(c=>" --field '"+condText(c)+"'").join('')}</div>
<button class="btn" data-a="open" data-p="bedit/${b.id}">✎ Редактор доски</button><button class="btn" data-a="newboard">＋ Доска</button></div>
<div class="fp"><div class="rw"><span class="lb">фильтр полей</span>${flt.map((c,i)=>`<span class="chip on">${esc(condText(c))} <b data-a="bfdel" data-p="${i}">×</b></span>`).join('')}${condEditor(S.newBc,'bc','bfadd')}</div>
<div class="rw"><span class="lb">наборы</span><span class="dim">${b.statusSetIds.map(x=>SS(x)?SS(x).name:'?').join(', ')}</span>${out.length?`<a href="#" data-a="outcol" style="margin-left:auto" class="warn">${out.length} ${plural(out.length,'задача','задачи','задач')} вне колонок</a>`:''}</div></div><div class="board">`;
cols.forEach(k=>{const c=k.c;const lim=S.bshow[b.id+c.id]?1e9:50;h+=`<div class="col" data-col="${c.id}" data-b="${b.id}"><div class="ch"><b>${esc(c.name)}</b> <span class="dim">${k.items.length}</span><div>${c.statusIds.map(x=>`<span class="tag">${esc(ST(x)?ST(x).name:'?')}</span>`).join('')}${c.fieldConditions.map(cd=>`<span class="chip on" style="cursor:default">${esc(condText(cd))}</span>`).join('')}</div></div><div class="cb">`;
k.items.slice(0,lim).forEach(t=>{const st=ST(t.statusId),pr=FL('f-priority'),has=taskFields(t).some(f=>f.def.id==='f-priority');const l2=lockOf('task',t.id);
h+=`<div class="kc" draggable="true" data-card="${t.id}" style="border-left-color:${st?st.color:'#888'}"><div>${rl(t)} ${inConflict(t)?'<span class="warn">⚠</span>':''}${l2?` <span class="lock">◉ ${esc(l2.holder)}</span>`:''}<span class="dim" style="float:right">${esc(TY(t.typeId).name)}</span></div><div class="tt">${esc(t.title)}</div>
<div class="ft">${sdot(st)}<span class="dim">${esc(st.name)}</span>${has?`<select data-c="cardprio" data-p="${t.id}" title="Приоритет"><option value="">—</option>${EN('e-priority').values.map(v=>`<option value="${v.id}" ${t.fields['f-priority']===v.id?'selected':''}>${esc(v.name)}</option>`).join('')}</select>`:''}${t.fields['f-estimate']!=null?`<span class="dim">${t.fields['f-estimate']}</span>`:''}</div></div>`});
if(k.items.length>lim)h+=`<button class="btn sm" data-a="showall" data-p="${b.id+c.id}">показать все ${k.items.length}</button>`;
if(!k.items.length)h+='<div class="dim" style="padding:10px;text-align:center">пусто</div>';h+='</div></div>'});
return h+'</div></div>'}
const plural=(n,a,b,c)=>{const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<10||k>=20)?b:c};
CHG.bpick=v=>go('#/boards/'+v);
CHG.bcfield=v=>{S.newBc={fieldId:v,op:'equal',value:''};renderMain()};CHG.bcop=v=>{S.newBc.fieldId=$('#bcf').value;S.newBc.op=v;renderMain()};
ACT.bfadd=()=>{const c=readCond('bc');if(!c)return;const id=S.active.split('/')[1];(S.bflt[id]=S.bflt[id]||[]).push(c);S.newBc={fieldId:c.fieldId,op:'equal',value:''};cli("board show "+BD(id).name+" --field '"+condText(c)+"'");renderMain()};
ACT.bfdel=i=>{const id=S.active.split('/')[1];S.bflt[id].splice(+i,1);renderMain()};

CHG.cardprio=(v,el)=>{const t=T(el.dataset.p);const b=BD(S.active.split('/')[1]);const before=b?colOf(b,t):null;const r=setFieldValue(t,'f-priority',v||undefined);
if(!r.ok){toast(r.msg,'err');render();return}const after=b?colOf(b,t):null;toast(before&&after&&before!==after?refOf(t)+' переехала в «'+after.name+'»':r.msg);render()};
function dropOn(colEl,tid,commit){const b=BD(colEl.dataset.b),col=b.columns.find(c=>c.id===colEl.dataset.col),t=T(tid);
if(!commit){const unmet=col.fieldConditions.some(c=>!condOk(t,c));return !unmet}
const r=moveCard(t,col,b);toast(r.msg,r.ok?'':'err');render()}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card]');if(c){S.drag=c.dataset.card;e.dataTransfer.setData('text/plain',S.drag);e.dataTransfer.effectAllowed='move';c.classList.add('drag')}});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('.drag,.col.ok,.col.no').forEach(x=>x.classList.remove('drag','ok','no'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c||!S.drag)return;e.preventDefault();document.querySelectorAll('.col.ok,.col.no').forEach(x=>{if(x!==c)x.classList.remove('ok','no')});const ok=dropOn(c,S.drag,false);c.classList.toggle('ok',ok);c.classList.toggle('no',!ok)});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c||!S.drag)return;e.preventDefault();const id=S.drag;S.drag=null;dropOn(c,id,true)});

function newBoardDraft(){return {id:'b-'+hex(String(Math.random()),6),name:'Новая доска',statusSetIds:DB.statusSets[0]?[DB.statusSets[0].id]:[],columns:[{id:'c-'+hex(String(Math.random()),5),name:'Колонка 1',statusIds:[],dropStatuses:{},fieldConditions:[]}]}}
ACT.newboard=()=>{modal('Новая доска','<label>Название</label><input type="text" name="n" autofocus>',[{label:'Отмена'},{label:'Создать',cls:'pri',fn:()=>{const n=mv('n').trim();if(!n){toast('Название не может быть пустым','err');return false}
if(DB.boards.some(b=>b.name===n)){toast('Доска с таким названием уже есть','err');return false}const b=newBoardDraft();b.name=n;DB.boards.push(b);cli('board create "'+n+'"');toast('Доска «'+n+'» создана');go('#/boards/'+b.id+'/edit')}}])};
function bd(id){const b=BD(id);if(!S.bdr[id]){S.bdr[id]=jsonClone(b);S.myLocks['b:'+id]=120}return S.bdr[id]}
function bsync(id){if(!bdirty(id)){delete S.bdr[id];delete S.myLocks['b:'+id]}}
function exclusive(a,b){return a.fieldConditions.some(x=>b.fieldConditions.some(y=>{if(x.fieldId!==y.fieldId)return false;const d=defById(x.fieldId);if(d&&d.multiple)return false;
if(x.operator==='equal'&&y.operator==='equal')return x.value!==y.value;if(x.operator==='equal'&&y.operator==='notEqual'||x.operator==='notEqual'&&y.operator==='equal')return x.value===y.value;
const p=[x.operator,y.operator].sort().join();return p==='set,unset'||p==='attached,detached'}))}
function boardError(d){if(!d.name.trim())return 'Название не может быть пустым';if(!d.statusSetIds.length)return 'Выберите хотя бы один набор статусов';if(!d.columns.length)return 'Нужна хотя бы одна колонка';
for(let i=0;i<d.columns.length;i++)for(let j=i+1;j<d.columns.length;j++){const a=d.columns[i],b=d.columns[j];const sh=a.statusIds.find(s=>b.statusIds.includes(s));if(sh&&!exclusive(a,b))return 'Доска не принимается: статус «'+ST(sh).name+'» в колонках '+a.name+' и '+b.name+' без взаимоисключающих условий'}return null}
function saveBoard(id){const d=S.bdr[id];if(!d||!bdirty(id))return;if(lockOf('board',id)){toast('Доска правится: '+lockOf('board',id).holder+'. Сохранить нельзя','err');return}
const e=boardError(d);if(e){S.berr=e;toast(e,'err');renderMain();return}S.berr=null;const i=DB.boards.findIndex(b=>b.id===id);DB.boards[i]=jsonClone(d);delete S.bdr[id];delete S.myLocks['b:'+id];cli('board update "'+d.name+'" --columns '+d.columns.length);toast('Доска «'+d.name+'» сохранена');render()}
function vBedit(id){const b0=BD(id);if(!b0)return '<div class="pane"><div class="empty">Доска не найдена</div></div>';const d=S.bdr[id]||b0;const lk=lockOf('board',id);const dy=bdirty(id);
const sts=[];d.statusSetIds.forEach(s=>SS(s)&&SS(s).statusIds.forEach(x=>{if(!sts.includes(x))sts.push(x)}));
let h=`<div class="pane"><div class="crumb"><span class="dim">${esc(projDir())}/boards/</span><b>${esc(slug(d.name,2)+'-'+hex(id,8))}.yaml</b>${lk?`<span class="lock">◉ правит ${esc(lk.holder)} · ещё ${lk.expiresInSec} с</span>`:S.myLocks['b:'+id]!==undefined?`<span class="lock me">⚿ вы правите, блокировка продлевается</span>`:''}</div>

${S.berr?`<div class="card-box err">✖ ${esc(S.berr)}</div>`:''}
<div class="card-box"><div class="fld"><span class="n">name</span><input type="text" data-i="bname" value="${esc(d.name)}"><span></span></div>
<div class="fld"><span class="n">statusSets</span><span>${DB.statusSets.map(s=>`<label style="margin-right:10px"><input type="checkbox" data-c="bset" data-p="${s.id}" ${d.statusSetIds.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</span><span></span></div></div>`;
d.columns.forEach((c,i)=>{h+=`<div class="card-box"><div class="bar"><span class="dim">columns[${i}]</span><input type="text" data-i="bcname" data-p="${i}" value="${esc(c.name)}" style="width:200px"><span class="gap"></span><button class="btn sm" data-a="bcup" data-p="${i}" ${i?'':'disabled'}>↑</button><button class="btn sm" data-a="bcdn" data-p="${i}" ${i<d.columns.length-1?'':'disabled'}>↓</button><button class="btn dng sm" data-a="bcdel" data-p="${i}">удалить</button></div>
<div class="rw fp" style="background:transparent;border:0;padding:0"><span class="dim">статусы:</span> ${sts.map(sid2=>`<label style="margin-right:10px"><input type="checkbox" data-c="bcst" data-p="${i}" data-q="${sid2}" ${c.statusIds.includes(sid2)?'checked':''}> ${sdot(ST(sid2))} ${esc(ST(sid2).name)}</label>`).join('')||'<span class="dim">выберите набор</span>'}</div>
<div class="rw fp" style="background:transparent;border:0;padding:0"><span class="dim">статус при перетаскивании:</span> ${d.statusSetIds.map(s=>SS(s)).filter(Boolean).map(s=>{const opts=c.statusIds.filter(x=>s.statusIds.includes(x));return `<span>${esc(s.name)} → <select data-c="bdrop" data-p="${i}" data-q="${s.id}"><option value="">авто</option>${opts.map(x=>`<option value="${x}" ${c.dropStatuses[s.id]===x?'selected':''}>${esc(ST(x).name)}</option>`).join('')}</select></span>`}).join('')}</div>
<div class="rw fp" style="background:transparent;border:0;padding:0"><span class="dim">условия:</span> ${c.fieldConditions.map((cd,j)=>`<span class="chip on">${esc(condText(cd))} <b data-a="bccdel" data-p="${i}" data-q="${j}">×</b></span>`).join('')||'<span class="dim">нет</span>'}</div>
<div class="rw fp" style="background:transparent;border:0;padding:0">${condEditor(S.bnc[i]||(S.bnc[i]={fieldId:'',op:'equal',value:''}),'bn'+i,'bcadd').replace('data-a="bcadd"','data-a="bcadd" data-p="'+i+'"').replace(/data-c="bn(\d+)field"/,'data-c="bnfield" data-p="$1"').replace(/data-c="bn(\d+)op"/,'data-c="bnop" data-p="$1"')}</div></div>`});
return h+'<button class="btn" data-a="bcnew">＋ Колонка</button></div>'}
INP.bname=el=>{const id=S.active.split('/')[1];bd(id).name=el.value;bsync(id);refreshBd()};
INP.bcname=el=>{const id=S.active.split('/')[1];bd(id).columns[+el.dataset.p].name=el.value;bsync(id);refreshBd()};
function refreshBd(){renderTabs();renderStatus();const id=S.active.split('/')[1];const bar=document.querySelector('[data-a=savebd]');if(bar){bar.disabled=!bdirty(id)||!!lockOf('board',id)}}
CHG.bset=(v,el)=>{const id=S.active.split('/')[1];const d=bd(id);const s=el.dataset.p;const i=d.statusSetIds.indexOf(s);i<0?d.statusSetIds.push(s):d.statusSetIds.splice(i,1);
const all=[];d.statusSetIds.forEach(x=>SS(x).statusIds.forEach(y=>all.push(y)));d.columns.forEach(c=>{c.statusIds=c.statusIds.filter(x=>all.includes(x));Object.keys(c.dropStatuses).forEach(k=>{if(!d.statusSetIds.includes(k))delete c.dropStatuses[k]})});bsync(id);renderMain();refreshBd()};
CHG.bcst=(v,el)=>{const id=S.active.split('/')[1];const c=bd(id).columns[+el.dataset.p];const s=el.dataset.q;const i=c.statusIds.indexOf(s);i<0?c.statusIds.push(s):c.statusIds.splice(i,1);Object.keys(c.dropStatuses).forEach(k=>{if(!c.statusIds.includes(c.dropStatuses[k]))delete c.dropStatuses[k]});bsync(id);renderMain();refreshBd()};
CHG.bdrop=(v,el)=>{const id=S.active.split('/')[1];const c=bd(id).columns[+el.dataset.p];if(v)c.dropStatuses[el.dataset.q]=v;else delete c.dropStatuses[el.dataset.q];bsync(id);refreshBd()};
CHG.bnfield=(v,el)=>{const i=+el.dataset.p;S.bnc[i]={fieldId:v,op:'equal',value:''};renderMain()};
CHG.bnop=(v,el)=>{const i=+el.dataset.p;S.bnc[i]={fieldId:$('#bn'+i+'f').value,op:v,value:''};renderMain()};
ACT.bcadd=i=>{const c=readCond('bn'+i);if(!c)return;const id=S.active.split('/')[1];bd(id).columns[+i].fieldConditions.push(c);S.bnc[i]={fieldId:c.fieldId,op:'equal',value:''};bsync(id);renderMain();refreshBd()};
ACT.bccdel=(i,j)=>{const id=S.active.split('/')[1];bd(id).columns[+i].fieldConditions.splice(+j,1);bsync(id);renderMain();refreshBd()};
ACT.bcnew=()=>{const id=S.active.split('/')[1];bd(id).columns.push({id:'c-'+hex(String(Math.random()),5),name:'Колонка '+(bd(id).columns.length+1),statusIds:[],dropStatuses:{},fieldConditions:[]});renderMain();refreshBd()};
ACT.bcdel=i=>{const id=S.active.split('/')[1];bd(id).columns.splice(+i,1);bsync(id);renderMain();refreshBd()};
ACT.bcup=i=>{const id=S.active.split('/')[1];const a=bd(id).columns;i=+i;[a[i-1],a[i]]=[a[i],a[i-1]];bsync(id);renderMain();refreshBd()};
ACT.bcdn=i=>{const id=S.active.split('/')[1];const a=bd(id).columns;i=+i;[a[i+1],a[i]]=[a[i],a[i+1]];bsync(id);renderMain();refreshBd()};
ACT.savebd=()=>saveBoard(S.active.split('/')[1]);
ACT.revertbd=()=>{const id=S.active.split('/')[1];delete S.bdr[id];delete S.myLocks['b:'+id];S.berr=null;renderMain();refreshBd();toast('Правки отменены','info')};
ACT.delboard=()=>{const id=S.active.split('/')[1];const b=BD(id);confirmBox('Удалить доску','Удалить доску «'+esc(b.name)+'»? Задачи не затрагиваются.','Удалить',()=>{DB.boards.splice(DB.boards.indexOf(b),1);cli('board delete "'+b.name+'"');['board/','bedit/'].forEach(p=>{const i=S.tabs.indexOf(p+id);if(i>=0)S.tabs.splice(i,1)});delete S.bdr[id];toast('Доска удалена');go('#/boards')},true)};

function vSeries(){const g=conflictGroups();
let h=`<div class="pane"><div class="crumb"><span class="dim">${esc(projDir())}/</span><b>series.yaml</b></div><div class="bar"><button class="btn pri" data-a="newseries">＋ Серия</button><div class="cmdline"><b>$</b> tasker series list</div></div>`;
if(g.length)h+=`<div class="card-box"><b class="warn">⚠ Конфликты номеров (${g.length})</b> <span class="dim">— один номер выдан в разных ветках git</span>${g.map(c=>`<div style="margin-top:4px"><span class="ref">${esc(pfx(c.seriesId)+'-'+c.number)}</span>: ${c.tasks.map(t=>`${rl(t)} <span class="dim">«${esc(t.title.slice(0,32))}…» ${dt(t.createdAt)}</span>`).join(' &nbsp;|&nbsp; ')}</div>`).join('')}<div style="margin-top:8px"><button class="btn pri" data-a="fix" data-p="resolve" data-q="0">Разрешить конфликты номеров</button> <span class="hint">самая ранняя задача сохраняет номер, остальные получают следующие свободные</span></div></div>`;
else h+='<div class="card-box ok">✔ Здоровье серий: конфликтов номеров нет</div>';
DB.series.forEach(s=>{const ts=DB.tasks.filter(t=>t.series.some(x=>x.seriesId===s.id)).sort((a,b)=>a.series.find(x=>x.seriesId===s.id).number-b.series.find(x=>x.seriesId===s.id).number);
h+=`<div class="card-box"><div class="bar"><b class="ref">${esc(s.prefix)}</b><span>${esc(s.name)}</span><span class="dim">· задач ${ts.length} · следующий № ${nextNum(s.id)}</span><span class="gap"></span><button class="btn sm" data-a="renseries" data-p="${s.id}">Переименовать</button><button class="btn sm" data-a="addtoser" data-p="${s.id}">Добавить задачу…</button><button class="btn dng sm" data-a="delseries" data-p="${s.id}">Удалить</button></div>
<table class="tbl"><tbody>${ts.map(t=>{const n=t.series.find(x=>x.seriesId===s.id);return `<tr><td style="width:100px" class="${dupOf(t,n).length?'warn':''}">${esc(refStr(n))}${dupOf(t,n).length?' ⚠':''}</td><td>${sdot(ST(t.statusId))} <span class="dim">${esc(ST(t.statusId).name)}</span></td><td class="ttl"><a href="${href(t)}" style="color:var(--fg)">${esc(t.title)}</a></td><td style="width:140px"><button class="btn sm" data-a="serrenum" data-p="${t.id}" data-q="${s.id}">№…</button> <button class="btn sm" data-a="serrm" data-p="${t.id}" data-q="${s.id}">убрать</button></td></tr>`}).join('')||'<tr><td class="dim">пусто</td></tr>'}</tbody></table></div>`});
return h+'</div>'}
ACT.newseries=()=>{modal('Новая серия','<label>Префикс (латиница и цифры, до 20, регистр важен)</label><input type="text" name="p" autofocus maxlength="30"><label>Название</label><input type="text" name="n">',[{label:'Отмена'},{label:'Создать',cls:'pri',fn:()=>{const p=mv('p').trim(),n=mv('n').trim();
if(!/^[A-Za-z0-9]{1,20}$/.test(p)){toast('Префикс: только латинские буквы и цифры, не больше 20','err');return false}if(DB.series.some(s=>s.prefix===p)){toast('Префикс «'+p+'» уже занят','err');return false}if(!n){toast('Укажите название','err');return false}
DB.series.push({id:'sr-'+p.toLowerCase(),name:n,prefix:p});cli('series create '+p+' "'+n+'"');toast('Серия '+p+' создана');render()}}])};
ACT.renseries=id=>{const s=SR(id);modal('Переименовать серию','<label>Название</label><input type="text" name="n" value="'+esc(s.name)+'" autofocus>',[{label:'Отмена'},{label:'Сохранить',cls:'pri',fn:()=>{const n=mv('n').trim();if(!n){toast('Укажите название','err');return false}s.name=n;cli('series rename '+s.prefix+' "'+n+'"');toast('Серия переименована');render()}}])};
ACT.delseries=id=>{const s=SR(id);const n=DB.tasks.filter(t=>t.series.some(x=>x.seriesId===id)).length;confirmBox('Удалить серию','Удалить серию <b>'+esc(s.prefix)+'</b>? У '+n+' задач исчезнут ключи '+esc(s.prefix)+'-N (задачи останутся).','Удалить',()=>{DB.tasks.forEach(t=>{t.series=t.series.filter(x=>x.seriesId!==id)});DB.series.splice(DB.series.indexOf(s),1);S.filter.series=S.filter.series.filter(x=>x!==id);cli('series delete '+s.prefix);toast('Серия удалена');render()},true)};
ACT.addtoser=id=>{modal('Добавить задачу в серию '+pfx(id),'<label>Задача (ключ или название)</label><input type="text" name="q" autofocus><label>Номер (пусто — '+nextNum(id)+')</label><input type="number" name="n">',[{label:'Отмена'},{label:'Добавить',cls:'pri',fn:()=>{const r=findRef(mv('q'));const t=r[0]||DB.tasks.find(x=>x.title.toLowerCase().includes(mv('q').toLowerCase()));if(!t){toast('Задача не найдена','err');return false}
const x=addToSeries(t,id,parseInt(mv('n'))||0);toast(x.msg,x.ok?'':'err');if(!x.ok)return false;render()}}])};
ACT.serrm=(tid,sid2)=>{const r=removeFromSeries(T(tid),sid2);toast(r.msg,r.ok?'':'err');render()};
ACT.serrenum=(tid,sid2)=>{const t=T(tid);modal('Перенумеровать','<label>Новый номер (пусто — следующий свободный: '+nextNum(sid2)+')</label><input type="number" name="n" autofocus>',[{label:'Отмена'},{label:'Применить',cls:'pri',fn:()=>{const v=mv('n');const r=renumber(t,sid2,v?parseInt(v):0);toast(r.msg,r.ok?'':'err');if(!r.ok)return false;render()}}])};

function vSchema(sec){const f={statuses:schStatuses,sets:schSets,types:schTypes,links:schLinks,fields:schFields,enums:schEnums,members:schMembers,project:schProject}[sec];
if(!f)return '<div class="pane"><div class="empty">Нет такого раздела</div></div>';const m=SCH.find(x=>x[0]===sec);
return `<div class="pane"><div class="crumb"><span class="dim">${esc(projDir())}/</span><b>${m[1]}</b><span class="dim">· ${m[2]}</span></div>${f()}</div>`}
const refList=a=>a.slice(0,6).join(', ')+(a.length>6?' и ещё '+(a.length-6):'');
function usedMsg(parts){return 'Используется: '+parts.filter(Boolean).join('; ')}
function statusUsage(id){const sets=DB.statusSets.filter(s=>s.statusIds.includes(id)).map(s=>s.name);const ts=DB.tasks.filter(t=>t.statusId===id).map(refOf);const cols=[];DB.boards.forEach(b=>b.columns.forEach(c=>{if(c.statusIds.includes(id))cols.push(b.name+'/'+c.name)}));
return {sets,ts,cols,any:sets.length||ts.length||cols.length}}
function schStatuses(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker status list</div></div><table class="tbl"><thead><tr><th></th><th>name</th><th>description</th><th>используется</th><th></th></tr></thead><tbody>`;
DB.statuses.forEach(s=>{const u=statusUsage(s.id);h+=`<tr><td><input type="color" value="${s.color}" data-c="stcolor" data-p="${s.id}"></td><td><input data-c="stname" data-p="${s.id}" value="${esc(s.name)}" style="width:150px"></td><td><input data-c="stdesc" data-p="${s.id}" value="${esc(s.description)}" style="width:100%"></td><td class="dim">наборов ${u.sets.length} · задач ${u.ts.length}</td><td><button class="btn dng sm" data-a="stdel" data-p="${s.id}">×</button></td></tr>`});
h+=`<tr><td><input type="color" id="nsc" value="#2684ff"></td><td><input id="nsn" placeholder="новый статус" style="width:150px"></td><td><input id="nsd" placeholder="описание" style="width:100%"></td><td></td><td><button class="btn pri sm" data-a="stadd">＋</button></td></tr></tbody></table>`;return h}
CHG.stcolor=(v,el)=>{ST(el.dataset.p).color=v;cli('status update "'+ST(el.dataset.p).name+'" --color '+v);toast('Цвет обновлён');render()};
CHG.stname=(v,el)=>{const s=ST(el.dataset.p);v=v.trim();if(!v){toast('Название не может быть пустым','err');render();return}if(DB.statuses.some(x=>x!==s&&x.name===v)){toast('Статус «'+v+'» уже есть','err');render();return}cli('status update "'+s.name+'" --name "'+v+'"');s.name=v;toast('Переименовано');render()};
CHG.stdesc=(v,el)=>{ST(el.dataset.p).description=v;cli('status update "'+ST(el.dataset.p).name+'" --description "…"');toast('Описание сохранено')};
ACT.stadd=()=>{const n=$('#nsn').value.trim();if(!n){toast('Укажите название статуса','err');return}if(DB.statuses.some(s=>s.name===n)){toast('Статус «'+n+'» уже есть','err');return}
DB.statuses.push({id:'s-'+hex(n,6),name:n,color:$('#nsc').value,description:$('#nsd').value});cli('status create "'+n+'"');toast('Статус «'+n+'» создан');render()};
ACT.stdel=id=>{const s=ST(id),u=statusUsage(id);if(u.any){toast(usedMsg([u.sets.length&&'наборы «'+u.sets.join('», «')+'»',u.ts.length&&'задачи '+refList(u.ts),u.cols.length&&'колонки '+refList(u.cols)]),'err');return}
DB.statuses.splice(DB.statuses.indexOf(s),1);cli('status delete "'+s.name+'"');toast('Статус удалён');render()};

function schSets(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker status-set list</div><button class="btn pri" data-a="setnew">＋ Набор статусов</button></div>`;
DB.statusSets.forEach(s=>{const avail=DB.statuses.filter(x=>!s.statusIds.includes(x.id));
h+=`<div class="card-box"><div class="bar"><input data-c="setname" data-p="${s.id}" value="${esc(s.name)}" style="width:200px"><span class="dim">порядок = путь задачи; можно тащить мышью</span><span class="gap"></span><button class="btn dng sm" data-a="setdel" data-p="${s.id}">Удалить набор</button></div>
<div>${s.statusIds.map((x,i)=>`<div class="tn" draggable="true" data-sdrag="${s.id}:${i}" style="border:1px solid var(--edge);margin:2px 0;border-radius:3px"><span class="dim">${i+1}</span>${sdot(ST(x))}<span class="tx">${esc(ST(x).name)}</span><span style="margin-left:auto"><button class="sbtn" data-a="setmv" data-p="${s.id}" data-q="${i}:-1">↑</button><button class="sbtn" data-a="setmv" data-p="${s.id}" data-q="${i}:1">↓</button><button class="sbtn" data-a="setrm" data-p="${s.id}" data-q="${x}">×</button></span></div>`).join('')}</div>
<div class="bar" style="margin-top:6px"><select id="sadd_${s.id}">${avail.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button class="btn sm" data-a="setadd" data-p="${s.id}" ${avail.length?'':'disabled'}>＋ статус в набор</button></div></div>`});return h}
CHG.setname=(v,el)=>{const s=SS(el.dataset.p);v=v.trim();if(!v){toast('Название не может быть пустым','err');render();return}cli('status-set update "'+s.name+'" --name "'+v+'"');s.name=v;toast('Набор переименован');render()};
ACT.setnew=()=>{modal('Новый набор статусов','<label>Название</label><input type="text" name="n" autofocus>',[{label:'Отмена'},{label:'Создать',cls:'pri',fn:()=>{const n=mv('n').trim();if(!n){toast('Укажите название','err');return false}DB.statusSets.push({id:'ss-'+hex(n,6),name:n,statusIds:[]});cli('status-set create "'+n+'"');toast('Набор создан');render()}}])};
ACT.setdel=id=>{const s=SS(id);const ty=DB.taskTypes.filter(t=>t.statusSetId===id).map(t=>t.name),bd2=DB.boards.filter(b=>b.statusSetIds.includes(id)).map(b=>b.name);if(ty.length||bd2.length){toast(usedMsg([ty.length&&'типы «'+ty.join('», «')+'»',bd2.length&&'доски «'+bd2.join('», «')+'»']),'err');return}DB.statusSets.splice(DB.statusSets.indexOf(s),1);cli('status-set delete "'+s.name+'"');toast('Набор удалён');render()};
ACT.setmv=(id,q)=>{const [i,d]=q.split(':').map(Number);const a=SS(id).statusIds;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];cli('status-set reorder "'+SS(id).name+'"');renderMain()};
ACT.setrm=(id,st)=>{const s=SS(id);const used=DB.tasks.filter(t=>t.statusId===st&&TY(t.typeId)&&TY(t.typeId).statusSetId===id).map(refOf);if(used.length){toast(usedMsg(['задачи '+refList(used)+' в статусе «'+ST(st).name+'»']),'err');return}s.statusIds=s.statusIds.filter(x=>x!==st);cli('status-set remove-status "'+s.name+'" "'+ST(st).name+'"');renderMain()};
ACT.setadd=id=>{const v=$('#sadd_'+id).value;if(!v)return;SS(id).statusIds.push(v);cli('status-set add-status "'+SS(id).name+'" "'+ST(v).name+'"');renderMain()};
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-sdrag]');if(c){S.sdrag=c.dataset.sdrag;e.dataTransfer.setData('text/plain',S.sdrag)}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-sdrag]');if(c&&S.sdrag&&S.sdrag.split(':')[0]===c.dataset.sdrag.split(':')[0])e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-sdrag]');if(!c||!S.sdrag)return;const [id,i]=S.sdrag.split(':'),j=+c.dataset.sdrag.split(':')[1];S.sdrag=null;if(id!==c.dataset.sdrag.split(':')[0])return;const a=SS(id).statusIds;const x=a.splice(+i,1)[0];a.splice(j,0,x);cli('status-set reorder "'+SS(id).name+'"');renderMain()});

function schTypes(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker type list</div><button class="btn pri" data-a="tynew">＋ Тип задач</button></div>`;
DB.taskTypes.forEach(ty=>{const n=DB.tasks.filter(t=>t.typeId===ty.id).length;const avail=DB.fields.filter(f=>!ty.fields.some(x=>x.fieldId===f.id));
h+=`<div class="card-box"><div class="bar"><input data-c="tyname" data-p="${ty.id}" value="${esc(ty.name)}" style="width:180px"><span class="dim">задач: ${n}</span><span>набор: <select data-c="tyset" data-p="${ty.id}">${DB.statusSets.map(s=>`<option value="${s.id}" ${s.id===ty.statusSetId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></span><span class="gap"></span><button class="btn dng sm" data-a="tydel" data-p="${ty.id}">Удалить тип</button></div>
<input data-c="tydesc" data-p="${ty.id}" value="${esc(ty.description)}" style="width:100%;margin-bottom:6px" placeholder="описание">
<table class="tbl"><tbody>${ty.fields.map(x=>{const f=FL(x.fieldId);return `<tr><td style="width:200px">${esc(f.name)} <span class="dim">${f.type}${f.multiple?'[]':''}</span></td><td><label><input type="checkbox" data-c="tyreq" data-p="${ty.id}" data-q="${f.id}" ${x.required?'checked':''}> обязательное</label></td><td style="width:40px"><button class="sbtn" data-a="tyfrm" data-p="${ty.id}" data-q="${f.id}">×</button></td></tr>`}).join('')||'<tr><td class="dim">нет полей</td></tr>'}</tbody></table>
<div class="bar" style="margin-top:6px"><select id="tyf_${ty.id}">${avail.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><button class="btn sm" data-a="tyfadd" data-p="${ty.id}" ${avail.length?'':'disabled'}>＋ поле типа</button></div></div>`});return h}

CHG.tyreq=(v,el)=>{const t=TY(el.dataset.p);t.fields.find(x=>x.fieldId===el.dataset.q).required=!!el.checked;cli('type update "'+t.name+'" --field "'+FL(el.dataset.q).name+(el.checked?'" --required':'" --optional'));toast('Сохранено')};

ACT.tyfrm=(id,fid)=>{const t=TY(id);const hv=DB.tasks.filter(x=>x.typeId===id&&isSet(x.fields[fid]));
modal('Убрать поле «'+FL(fid).name+'» из типа','<div>У '+hv.length+' задач типа «'+esc(t.name)+'» поле заполнено ('+esc(refList(hv.map(refOf)))+').</div><label><input type="radio" name="m" value="drop" checked> удалить значения</label><label><input type="radio" name="m" value="keep"> оставить как дополнительное поле задач</label>',
[{label:'Отмена'},{label:'Убрать',cls:'pri',fn:()=>{const keep=mr('m')==='keep';t.fields=t.fields.filter(x=>x.fieldId!==fid);DB.tasks.filter(x=>x.typeId===id).forEach(x=>{if(keep){if(isSet(x.fields[fid])&&!x.extra.includes(fid))x.extra.push(fid)}else delete x.fields[fid]});cli('type update "'+t.name+'" --remove-field "'+FL(fid).name+'" --'+(keep?'keep-values':'drop-values'));toast('Поле убрано из типа');render()}}])};
ACT.tynew=()=>{modal('Новый тип задач','<label>Название</label><input type="text" name="n" autofocus><label>Набор статусов</label><select name="s">'+DB.statusSets.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'</select><label>Описание</label><input type="text" name="d">',
[{label:'Отмена'},{label:'Создать',cls:'pri',fn:()=>{const n=mv('n').trim();if(!n){toast('Укажите название','err');return false}if(!mv('s')){toast('Сначала создайте набор статусов','err');return false}if(DB.taskTypes.some(t=>t.name===n)){toast('Тип «'+n+'» уже есть','err');return false}DB.taskTypes.push({id:'tt-'+hex(n,6),name:n,description:mv('d'),statusSetId:mv('s'),fields:[]});cli('type create "'+n+'"');toast('Тип создан');render()}}])};
