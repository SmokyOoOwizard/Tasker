function schLinks(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker link-type list</div></div><table class="tbl"><thead><tr><th>name</th><th>outward</th><th>inward</th><th>циклы</th><th>иерарх.</th><th>связей</th><th></th></tr></thead><tbody>`;
DB.linkTypes.forEach(l=>{const n=DB.links.filter(x=>x.typeId===l.id).length;h+=`<tr><td><input data-c="ltf" data-p="${l.id}" data-q="name" value="${esc(l.name)}" style="width:140px"></td><td><input data-c="ltf" data-p="${l.id}" data-q="outward" value="${esc(l.outward)}" style="width:130px"></td><td><input data-c="ltf" data-p="${l.id}" data-q="inward" value="${esc(l.inward||'')}" placeholder="— (ненаправленная)" style="width:150px"></td>
<td><input type="checkbox" data-c="ltb" data-p="${l.id}" data-q="allowCycles" ${l.allowCycles?'checked':''}></td><td><input type="checkbox" data-c="ltb" data-p="${l.id}" data-q="hierarchical" ${l.hierarchical?'checked':''}></td><td class="dim">${n}</td><td><button class="btn dng sm" data-a="ltdel" data-p="${l.id}">×</button></td></tr>`});
return h+`<tr><td><input id="ln1" placeholder="Имя" style="width:140px"></td><td><input id="ln2" placeholder="исходящая" style="width:130px"></td><td><input id="ln3" placeholder="входящая (пусто = ненапр.)" style="width:150px"></td><td><input type="checkbox" id="ln4"></td><td><input type="checkbox" id="ln5"></td><td></td><td><button class="btn pri sm" data-a="ltadd">＋</button></td></tr></tbody></table>`}
CHG.ltf=(v,el)=>{const l=LT(el.dataset.p),k=el.dataset.q;v=v.trim();if(k!=='inward'&&!v){toast('Поле не может быть пустым','err');render();return}l[k]=k==='inward'&&!v?null:v;cli('link-type update "'+l.name+'" --'+k+' "'+v+'"');toast('Сохранено');render()};
CHG.ltb=(v,el)=>{const l=LT(el.dataset.p);l[el.dataset.q]=el.checked;cli('link-type update "'+l.name+'" --'+el.dataset.q+' '+el.checked);toast('Сохранено')};
ACT.ltadd=()=>{const n=$('#ln1').value.trim(),o=$('#ln2').value.trim(),i=$('#ln3').value.trim();if(!n||!o){toast('Укажите имя и исходящее название','err');return}if(DB.linkTypes.some(l=>l.name===n)){toast('Тип связи «'+n+'» уже есть','err');return}
DB.linkTypes.push({id:'lt-'+hex(n,6),name:n,outward:o,inward:i||null,allowCycles:$('#ln4').checked,hierarchical:$('#ln5').checked});cli('link-type create "'+n+'"');toast('Тип связи создан');render()};
ACT.ltdel=id=>{const l=LT(id);const n=DB.links.filter(x=>x.typeId===id).length;if(n){toast('Используется: '+n+' связей этого типа. Сначала удалите связи','err');return}DB.linkTypes.splice(DB.linkTypes.indexOf(l),1);cli('link-type delete "'+l.name+'"');toast('Тип связи удалён');render()};

function fieldUsage(id){const ty=DB.taskTypes.filter(t=>t.fields.some(x=>x.fieldId===id)).map(t=>t.name);const ts=DB.tasks.filter(t=>isSet(t.fields[id])||t.extra.includes(id)).map(refOf);const bs=[];DB.boards.forEach(b=>b.columns.forEach(c=>{if(c.fieldConditions.some(x=>x.fieldId===id))bs.push(b.name+'/'+c.name)}));return {ty,ts,bs,any:ty.length||ts.length||bs.length}}
function schFields(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker field list</div></div><table class="tbl"><thead><tr><th>name</th><th>type</th><th>multiple</th><th>enum</th><th>используется</th><th></th></tr></thead><tbody>`;
DB.fields.forEach(f=>{const u=fieldUsage(f.id);h+=`<tr><td><input data-c="fname" data-p="${f.id}" value="${esc(f.name)}" style="width:140px"></td><td><select data-c="ftype" data-p="${f.id}">${['string','int','float','bool','date','enum'].map(x=>`<option ${x===f.type?'selected':''}>${x}</option>`).join('')}</select></td><td><input type="checkbox" data-c="fmult" data-p="${f.id}" ${f.multiple?'checked':''}></td>
<td>${f.type==='enum'?`<select data-c="fenum" data-p="${f.id}">${DB.enums.map(e=>`<option value="${e.id}" ${e.id===f.enumId?'selected':''}>${esc(e.name)}</option>`).join('')}</select>`:'<span class="dim">—</span>'}</td><td class="dim">типов ${u.ty.length} · задач ${u.ts.length} · колонок ${u.bs.length}</td><td><button class="btn dng sm" data-a="fdel" data-p="${f.id}">×</button></td></tr>`});
return h+`<tr><td><input id="fn1" placeholder="ИмяПоля" style="width:140px"></td><td><select id="fn2" data-c="fnewtype">${['string','int','float','bool','date','enum'].map(x=>`<option>${x}</option>`).join('')}</select></td><td><input type="checkbox" id="fn3"></td><td><select id="fn4">${DB.enums.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></td><td></td><td><button class="btn pri sm" data-a="fadd">＋</button></td></tr></tbody></table><div class="hint">Имя поля: только буквы и цифры. Смена типа поля, заполненного у задач, откроет диалог преобразования.</div>`}
const validName=n=>/^[\p{L}\p{N}]+$/u.test(n);
ACT.fadd=()=>{const n=$('#fn1').value.trim(),ty=$('#fn2').value;if(!validName(n)){toast('Имя поля: только буквы и цифры, без пробелов','err');return}if(allDefs().some(d=>d.name.toLowerCase()===n.toLowerCase())){toast('Поле «'+n+'» уже есть','err');return}
if(ty==='enum'&&!DB.enums.length){toast('Сначала создайте перечисление','err');return}const f={id:'f-'+hex(n,6),name:n,type:ty,multiple:$('#fn3').checked};if(ty==='enum')f.enumId=$('#fn4').value;DB.fields.push(f);cli('field create '+n+' --type '+ty+(f.multiple?' --multiple':''));toast('Поле «'+n+'» создано');render()};
CHG.fname=(v,el)=>{const f=FL(el.dataset.p);v=v.trim();if(!validName(v)){toast('Имя поля: только буквы и цифры','err');render();return}if(allDefs().some(d=>d!==f&&d.name.toLowerCase()===v.toLowerCase())){toast('Поле «'+v+'» уже есть','err');render();return}cli('field update '+f.name+' --name '+v);f.name=v;toast('Поле переименовано');render()};
CHG.fmult=(v,el)=>{const f=FL(el.dataset.p);const sel=el.checked;const aff=DB.tasks.filter(t=>isSet(t.fields[f.id]));
if(!sel&&aff.some(t=>Array.isArray(t.fields[f.id])&&t.fields[f.id].length>1)){modal('Несколько значений → одно','<div>Есть задачи с несколькими значениями поля «'+esc(f.name)+'»:</div>'+aff.filter(t=>Array.isArray(t.fields[f.id])&&t.fields[f.id].length>1).map(t=>'<div>'+esc(refOf(t))+': '+esc(fmtVal(f,t.fields[f.id]))+'</div>').join('')+'<label><input type="radio" name="m" value="first" checked> оставить первое значение</label><label><input type="radio" name="m" value="clear"> очистить поле</label>',
[{label:'Отмена',fn:()=>{render()}},{label:'Применить',cls:'pri',fn:()=>{aff.forEach(t=>{const v2=t.fields[f.id];if(Array.isArray(v2)){if(mr('m')==='first')t.fields[f.id]=v2[0];else delete t.fields[f.id]}});f.multiple=false;cli('field update '+f.name+' --single --'+(mr('m')==='first'?'keep-first':'clear'));toast('Изменено');render()}}]);return}
aff.forEach(t=>{const v2=t.fields[f.id];t.fields[f.id]=sel?(Array.isArray(v2)?v2:[v2]):(Array.isArray(v2)?v2[0]:v2)});f.multiple=sel;cli('field update '+f.name+(sel?' --multiple':' --single'));toast('Изменено');render()};
CHG.fenum=(v,el)=>{const f=FL(el.dataset.p);const aff=DB.tasks.filter(t=>isSet(t.fields[f.id]));if(aff.length){toast('Нельзя сменить перечисление: значения есть у '+aff.length+' задач','err');render();return}f.enumId=v;cli('field update '+f.name+' --enum "'+EN(v).name+'"');toast('Перечисление изменено');render()};
function convertible(from,to,v){if(to==='string')return true;if(from===to)return true;if(from==='int'&&to==='float')return true;if(from==='float'&&to==='int')return Number.isInteger(+v);if(from==='string'&&(to==='int'||to==='float'))return v!==''&&!isNaN(+v)&&(to==='float'||Number.isInteger(+v));if(from==='enum'&&to==='string')return true;return false}
CHG.ftype=(v,el)=>{const f=FL(el.dataset.p);const old=f.type;if(v===old)return;const aff=DB.tasks.filter(t=>isSet(t.fields[f.id]));
const conv=x=>f.type==='enum'?enumName(f.enumId,x):x;
const bad=aff.filter(t=>[].concat(t.fields[f.id]).some(x=>!convertible(old,v,conv(x))));
const doChange=(map)=>{aff.forEach(t=>{const cvt=x=>{let y=old==='enum'?enumName(f.enumId,x):x;if(map&&map[x]!==undefined&&map[x]!=='')y=map[x];if(!convertible(old,v,y)&&!(map&&map[x]))return undefined;if(v==='int'||v==='float')return +y;if(v==='bool')return /^(true|да|1)$/i.test(y);return String(y)};
const val=t.fields[f.id];const arr=Array.isArray(val)?val.map(cvt).filter(x=>x!==undefined):[cvt(val)].filter(x=>x!==undefined);if(!arr.length)delete t.fields[f.id];else t.fields[f.id]=f.multiple?arr:arr[0]});f.type=v;if(v==='enum'){f.enumId=DB.enums[0]&&DB.enums[0].id}else delete f.enumId;cli('field update '+f.name+' --type '+v);toast('Тип поля изменён');render()};
if(!aff.length){doChange();return}
const vals=[...new Set(aff.flatMap(t=>[].concat(t.fields[f.id])))];
modal('Смена типа поля «'+f.name+'»: '+old+' → '+v,'<div>Затронуто задач: <b>'+aff.length+'</b> ('+esc(refList(aff.map(refOf)))+'). Не конвертируются: <b>'+bad.length+'</b>.</div><label><input type="radio" name="m" value="clear" checked> очистить значения, которые не конвертируются</label><label><input type="radio" name="m" value="map"> сопоставить: старое = новое</label><div class="hint">'+vals.slice(0,6).map(x=>'<div>'+esc(old==='enum'?enumName(f.enumId,x):x)+' = <input type="text" data-map="'+esc(x)+'" style="width:140px"></div>').join('')+'</div>',
[{label:'Отмена',fn:()=>render()},{label:'Преобразовать',cls:'pri',fn:()=>{let map=null;if(mr('m')==='map'){map={};document.querySelectorAll('#modal [data-map]').forEach(i=>{if(i.value)map[i.dataset.map]=i.value})}doChange(map)}}],{wide:true})};
ACT.fdel=id=>{const f=FL(id),u=fieldUsage(id);if(u.any){toast(usedMsg([u.ty.length&&'типы «'+u.ty.join('», «')+'»',u.ts.length&&'значение у задач '+refList(u.ts),u.bs.length&&'условия колонок '+refList(u.bs)]),'err');return}DB.fields.splice(DB.fields.indexOf(f),1);cli('field delete '+f.name);toast('Поле удалено');render()};

function schEnums(){let h=`<div class="bar"><div class="cmdline"><b>$</b> tasker enum list</div><button class="btn pri" data-a="ennew">＋ Перечисление</button></div>`;
DB.enums.forEach(e=>{h+=`<div class="card-box"><div class="bar"><input data-c="enname" data-p="${e.id}" value="${esc(e.name)}" style="width:200px"><span class="dim">полей: ${DB.fields.filter(f=>f.enumId===e.id).length}</span><span class="gap"></span><button class="btn dng sm" data-a="endel" data-p="${e.id}">Удалить</button></div>
${e.values.map(v=>`<div class="fld" style="grid-template-columns:1fr auto"><input data-c="envname" data-p="${e.id}" data-q="${v.id}" value="${esc(v.name)}"><button class="sbtn" data-a="envdel" data-p="${e.id}" data-q="${v.id}">×</button></div>`).join('')}
<div class="bar"><input id="env_${e.id}" placeholder="новое значение" style="width:200px"><button class="btn sm" data-a="envadd" data-p="${e.id}">＋ значение</button></div></div>`});return h}
CHG.enname=(v,el)=>{const e=EN(el.dataset.p);v=v.trim();if(!v){toast('Название не может быть пустым','err');render();return}cli('enum update "'+e.name+'" --name "'+v+'"');e.name=v;toast('Переименовано');render()};
CHG.envname=(v,el)=>{const e=EN(el.dataset.p),x=e.values.find(q=>q.id===el.dataset.q);v=v.trim();if(!v||e.values.some(q=>q!==x&&q.name===v)){toast(v?'Значение «'+v+'» уже есть':'Значение не может быть пустым','err');render();return}cli('enum rename-value "'+e.name+'" "'+x.name+'" "'+v+'"');x.name=v;toast('Значение переименовано');render()};
ACT.envadd=id=>{const e=EN(id);const v=$('#env_'+id).value.trim();if(!v){toast('Укажите значение','err');return}if(e.values.some(x=>x.name===v)){toast('Значение «'+v+'» уже есть','err');return}e.values.push({id:'ev-'+hex(id+v,6),name:v});cli('enum add-value "'+e.name+'" "'+v+'"');toast('Значение добавлено');render()};
ACT.envdel=(id,vid)=>{const e=EN(id),v=e.values.find(x=>x.id===vid);const fs=DB.fields.filter(f=>f.enumId===id);const aff=DB.tasks.filter(t=>fs.some(f=>[].concat(t.fields[f.id]).includes(vid)));
const bs=[];DB.boards.forEach(b=>b.columns.forEach(c=>{if(c.fieldConditions.some(x=>x.value===vid))bs.push(b.name+'/'+c.name)}));
if(!aff.length&&!bs.length){e.values=e.values.filter(x=>x.id!==vid);cli('enum remove-value "'+e.name+'" "'+v.name+'"');toast('Значение удалено');render();return}
modal('Удалить значение «'+v.name+'»','<div>Значение используется у '+aff.length+' задач ('+esc(refList(aff.map(refOf)))+')'+(bs.length?' и в условиях колонок '+esc(refList(bs)):'')+'.</div><label><input type="radio" name="m" value="drop" checked> убрать значение из задач</label><label><input type="radio" name="m" value="rep"> заменить другим:</label><select name="r">'+e.values.filter(x=>x.id!==vid).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')+'</select>',
[{label:'Отмена'},{label:'Удалить',cls:'dng',fn:()=>{const rep=mr('m')==='rep'?mv('r'):null;if(!rep&&bs.length){toast('Значение стоит в условиях колонок досок: выберите замену','err');return false}
aff.forEach(t=>fs.forEach(f=>{const x=t.fields[f.id];if(x===undefined)return;const arr=[].concat(x).map(y=>y===vid?rep:y).filter(Boolean);const u=[...new Set(arr)];if(!u.length)delete t.fields[f.id];else t.fields[f.id]=f.multiple?u:u[0]}));
DB.boards.forEach(b=>b.columns.forEach(c=>c.fieldConditions.forEach(x=>{if(x.value===vid)x.value=rep})));
e.values=e.values.filter(x=>x.id!==vid);cli('enum remove-value "'+e.name+'" "'+v.name+'"'+(rep?' --replace-with "'+e.values.find(x=>x.id===rep).name+'"':' --drop'));toast('Значение удалено');render()}}])};
ACT.endel=id=>{const e=EN(id);const fs=DB.fields.filter(f=>f.enumId===id).map(f=>f.name);if(fs.length){toast(usedMsg(['поля «'+fs.join('», «')+'»']),'err');return}DB.enums.splice(DB.enums.indexOf(e),1);cli('enum delete "'+e.name+'"');toast('Перечисление удалено');render()};
ACT.ennew=()=>{modal('Новое перечисление','<label>Название</label><input type="text" name="n" autofocus><label>Значения через запятую</label><input type="text" name="v">',[{label:'Отмена'},{label:'Создать',cls:'pri',fn:()=>{const n=mv('n').trim();if(!n){toast('Укажите название','err');return false}if(DB.enums.some(e=>e.name===n)){toast('Перечисление «'+n+'» уже есть','err');return false}
DB.enums.push({id:'e-'+hex(n,6),name:n,values:mv('v').split(',').map(s=>s.trim()).filter(Boolean).map(s=>({id:'ev-'+hex(n+s,6),name:s}))});cli('enum create "'+n+'"');toast('Перечисление создано');render()}}])};

function schMembers(){const p=byId(DB.projects,S.proj);const humans=p.members.filter(m=>U(m)&&U(m).kind==='human');const me=U(DB.me);

function con(h){S.con.push(h);if(S.con.length>500)S.con.shift();if(S.panel==='console'&&S.panelOpen&&$('#conOut')){$('#conOut').innerHTML=S.con.join('\n');$('#conOut').scrollTop=1e9}}
function tokenize(s){const out=[];let cur='',q=null,has=false;for(const ch of s){if(q){if(ch===q)q=null;else cur+=ch}else if(ch==='"'||ch==="'"){q=ch;has=true}else if(/\s/.test(ch)){if(cur||has){out.push(cur);cur='';has=false}}else cur+=ch}if(cur||has)out.push(cur);return out}
const BOOLF=['flat','resolve-conflicts','links','required','multiple'];
function parseArgs(a){const pos=[],fl={};for(let i=0;i<a.length;i++){const x=a[i];if(x.startsWith('--')){const k=x.slice(2);if(BOOLF.includes(k)||i+1>=a.length||a[i+1].startsWith('--'))(fl[k]=fl[k]||[]).push(true);else (fl[k]=fl[k]||[]).push(a[++i])}else pos.push(x)}return {pos,fl}}
function cell(c){return typeof c==='object'?c:{t:String(c),c:''}}
function table(head,rows){const w=head.map((h,i)=>Math.max(h.length,...rows.map(r=>cell(r[i]).t.length)));const ln=(l,m,r)=>'<span class="dim">'+l+w.map(x=>'─'.repeat(x+2)).join(m)+r+'</span>';
const row=(cs)=>'<span class="dim">│</span>'+cs.map((c,i)=>{const o=cell(c);return ' <span class="'+o.c+'">'+esc(o.t)+'</span>'+' '.repeat(w[i]-o.t.length)+' <span class="dim">│</span>'}).join('');
return [ln('┌','┬','┐'),row(head.map(h=>({t:h,c:'warn'}))),ln('├','┼','┤'),...rows.map(row),ln('└','┴','┘')].join('\n')}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function stByName(n){const s=DB.statuses.find(x=>x.name.toLowerCase()===String(n).toLowerCase()||x.id===n);if(!s)throw Error('статус «'+n+'» не найден. Есть: '+DB.statuses.map(x=>x.name).join(', '));return s}
function tyByName(n){const s=DB.taskTypes.find(x=>x.name.toLowerCase()===String(n).toLowerCase()||x.id===n);if(!s)throw Error('тип «'+n+'» не найден. Есть: '+DB.taskTypes.map(x=>x.name).join(', '));return s}
function srByName(n){const s=DB.series.find(x=>x.prefix===n||x.name===n||x.id===n);if(!s)throw Error('серия «'+n+'» не найдена. Есть: '+DB.series.map(x=>x.prefix).join(', '));return s}
function taskArg(r){const l=findRef(r);if(!l.length)throw Error('задача «'+r+'» не найдена');if(l.length>1)throw Error('«'+r+'» — конфликт номера: '+l.map(t=>sid(t)+' «'+trunc(t.title,28)+'»').join(' и ')+'. Укажите id или выполните cleanup --resolve-conflicts');return l[0]}
function parseCondStr(s){let m=s.match(/^(.+?)\s+(set|unset|attached|detached)$/);if(m){const d=defByName(m[1]);if(!d)throw Error('поле «'+m[1].trim()+'» не найдено');return {fieldId:d.id,operator:m[2],value:''}}
m=s.match(/^(.+?)(>=|<=|!=|=|>|<)(.*)$/);if(!m)throw Error('условие «'+s+'»: ожидается Имя>=3, Имя=Значение или «Имя set»');const d=defByName(m[1]);if(!d)throw Error('поле «'+m[1].trim()+'» не найдено');
const op={'=':'equal','!=':'notEqual','>':'gt','>=':'gte','<':'lt','<=':'lte'}[m[2]];if(NUMOPS.includes(op)&&!['int','float','date'].includes(d.type))throw Error('оператор '+m[2]+' только для int, float и date');
let v=m[3].trim();if(d.type==='enum'){const e=EN(d.enumId).values.find(x=>x.name.toLowerCase()===v.toLowerCase()||x.id===v);if(!e)throw Error('значение «'+v+'» не входит в перечисление «'+EN(d.enumId).name+'»');v=e.id}return {fieldId:d.id,operator:op,value:v}}
function flagsToFilter(fl){const F=newFilter();F.sort=[];F.open=S.filter.open;
(fl.status||[]).forEach(x=>String(x).split(',').forEach(n=>F.statuses.push(stByName(n.trim()).id)));(fl.type||[]).forEach(x=>String(x).split(',').forEach(n=>F.types.push(tyByName(n.trim()).id)));(fl.series||[]).forEach(x=>String(x).split(',').forEach(n=>F.series.push(srByName(n.trim()).id)));
(fl.field||[]).forEach(x=>F.conds.push(parseCondStr(String(x))));
const keys=['status','type','title','created','updated','series',...allDefs().map(d=>d.name)];
(fl.sort||[]).forEach(x=>String(x).split(',').forEach(k=>{const desc=k.startsWith('-');const n=k.replace(/^[-+]/,'');const kk=keys.find(y=>y.toLowerCase()===n.toLowerCase());if(!kk)throw Error('ключ сортировки «'+n+'» неизвестен. Есть: '+keys.join(', '));F.sort.push({key:kk,dir:desc?-1:1})}));
if(!F.sort.length)F.sort=[{key:'series',dir:1}];F.flat=!!fl.flat;return F}
function applyFields(t,list){(list||[]).forEach(x=>{const m=String(x).match(/^(.+?)=(.*)$/);if(!m)throw Error('--field: ожидается Имя=Значение');const d=defByName(m[1]);if(!d)throw Error('поле «'+m[1].trim()+'» не найдено');const v=m[2].trim()===''?undefined:parseVal(d,m[2]);const r=setFieldValue(t,d.id,v,'cli');if(!r.ok)throw Error(r.msg);con('<span class="ok">✔</span> '+esc(r.msg))})}
const CMDS={
'help'(){con(`<span class="warn">Команды tasker</span>
  task list [--status X] [--type X] [--series P] [--field 'Имя>=3'] [--sort -Имя] [--flat]
  task get TSK-140
  task update TSK-140 [--status "В работе"] [--title …] [--type …] [--field 'Имя=Значение']
  task create "Название" --type Фича [--series TSK] [--parent TSK-100] [--field 'Приоритет=Высокий']
  task link TSK-121 blocks TSK-140      task unlink TSK-121 TSK-140
  task delete TSK-140
  board list | board show Основная
  series list
  sync                          сверить индекс с файлами
  cleanup [--resolve-conflicts] очистить ссылки / разрешить конфликты номеров
  problems | status | clear
<span class="dim">Операторы условий: = != > >= < <= и «Имя set|unset|attached|detached». Каждая команда обновляет интерфейс.</span>`)},
'clear'(){S.con=[]},
'task list'(a){const {fl}=parseArgs(a);const F=flagsToFilter(fl);const keepOpen=S.filter.open;S.filter=F;S.filter.open=keepOpen;if(S.active==='tasks')history.replaceState(null,'','#/tasks'+f2q(F));const r=rows(F);
con(table(['КЛЮЧ','ТИП','СТАТУС','НАЗВАНИЕ'],r.rows.map(x=>[{t:refOf(x.t)+(inConflict(x.t)?' ⚠':''),c:'ref'},TY(x.t.typeId).name,{t:ST(x.t.statusId).name,c:''},(F.flat?'':'  '.repeat(x.d)+(x.d?'└ ':''))+trunc(x.t.title,56)+(x.rep?' (+)':'')])));con('<span class="ok">Найдено '+r.list.length+'</span>')},
'task get'(a){const t=taskArg(a[0]||'');if(S.tabs.indexOf('task/'+t.id)<0)S.tabs.push('task/'+t.id);const L=[['id',uuid(t.id)],['ключ',t.series.map(refStr).join(', ')||sid(t)],['название',t.title],['тип',TY(t.typeId).name],['статус',ST(t.statusId).name],['создана',dt(t.createdAt)],['обновлена',dt(t.updatedAt)]];
taskFields(t).forEach(f=>L.push(['поле '+f.def.name,fmtVal(f.def,t.fields[f.def.id])+(f.required?' *':'')]));
const ps=parentsOf(t),ks=childrenOf(t);if(ps.length)L.push(['входит в',ps.map(refOf).join(', ')]);if(ks.length)L.push(['включает',ks.map(refOf).join(', ')]);
DB.links.forEach(l=>{const lt=LT(l.typeId);if(lt.hierarchical)return;if(l.from===t.id)L.push([lt.outward,refOf(T(l.to))]);else if(l.to===t.id)L.push([lt.inward||lt.outward,refOf(T(l.from))])});
con(L.map(x=>'<span class="yk">'+esc(x[0].padEnd(12))+'</span> '+esc(x[1])).join('\n')+(t.description?'\n<span class="dim">'+esc(t.description)+'</span>':''));go(routeOf('task/'+t.id))},
'task update'(a){const {pos,fl}=parseArgs(a);const t=taskArg(pos[0]||'');const lf=lockFail(t);if(lf)throw Error(lf.msg);let did=false;
if(fl.title){const v=String(fl.title[0]).trim();if(!v)throw Error('название не может быть пустым');t.title=v;touch(t);cli('task update '+refOf(t)+' --title "'+v+'"','cli');did=true;con('<span class="ok">✔</span> название обновлено')}
if(fl.type){const ty=tyByName(fl.type[0]);const ok=SS(ty.statusSetId).statusIds.includes(fl.status?stByName(fl.status[0]).id:t.statusId);if(!ok)throw Error('статус «'+ST(t.statusId).name+'» не входит в набор типа «'+ty.name+'»: добавьте --status');t.typeId=ty.id;touch(t);cli('task update '+refOf(t)+' --type "'+ty.name+'"','cli');did=true;con('<span class="ok">✔</span> тип: '+esc(ty.name))}
if(fl.status){const r=setStatus(t,stByName(fl.status[0]).id,'cli');if(!r.ok)throw Error(r.msg);did=true;con('<span class="ok">✔</span> '+esc(r.msg))}
if(fl.field){applyFields(t,fl.field);did=true}
if(!did)throw Error('нечего обновлять: укажите --status, --title, --type или --field')},
'task create'(a){const {pos,fl}=parseArgs(a);const ty=fl.type?tyByName(fl.type[0]):DB.taskTypes[0];if(!ty)throw Error('нет типов задач');const fields={};(fl.field||[]).forEach(x=>{const m=String(x).match(/^(.+?)=(.*)$/);const d=m&&defByName(m[1]);if(!d)throw Error('--field: неизвестное поле');fields[d.id]=parseVal(d,m[2])});
const r=createTask({title:pos[0],typeId:ty.id,seriesIds:(fl.series||[]).flatMap(x=>String(x).split(',')).map(n=>srByName(n.trim()).id),parent:fl.parent&&fl.parent[0],fields},'cli');if(!r.ok)throw Error(r.msg);
con('<span class="ok">✔</span> создана <span class="ref">'+esc(refOf(r.task))+'</span> '+esc(r.task.title)+' ['+esc(ST(r.task.statusId).name)+']')},
'task link'(a){const [x,kw,y]=a;if(!y)throw Error('использование: task link TSK-121 blocks TSK-140');const A=taskArg(x),B=taskArg(y);const k=kw.toLowerCase();
let lt=null,inv=false;DB.linkTypes.forEach(l=>{const names=[l.name.toLowerCase(),lkSide(l),l.outward.toLowerCase(),l.id];if(names.includes(k))lt=lt||l;else if(l.inward&&l.inward.toLowerCase()===k&&!lt){lt=l;inv=true}});
if(!lt)throw Error('тип связи «'+kw+'» не найден. Есть: '+DB.linkTypes.map(l=>lkSide(l)).join(', '));const r=inv?linkTasks(B,lt.id,A,'cli'):linkTasks(A,lt.id,B,'cli');if(!r.ok)throw Error(r.msg);con('<span class="ok">✔</span> '+esc(r.msg))},
'task unlink'(a){const A=taskArg(a[0]||''),B=taskArg(a[1]||'');const ls=DB.links.filter(l=>(l.from===A.id&&l.to===B.id)||(l.from===B.id&&l.to===A.id));if(!ls.length)throw Error('связи между '+refOf(A)+' и '+refOf(B)+' нет');ls.forEach(l=>unlinkTasks(l,'cli'));con('<span class="ok">✔</span> связей удалено: '+ls.length)},
'task delete'(a){const t=taskArg(a[0]||'');const r=deleteTask(t,'cli');if(!r.ok)throw Error(r.msg);S.tabs=S.tabs.filter(k=>k!=='task/'+t.id);con('<span class="ok">✔</span> '+esc(r.msg))},
'board list'(){con(table(['ДОСКА','КОЛОНКИ','НАБОРЫ'],DB.boards.map(b=>[b.name,b.columns.length,b.statusSetIds.map(x=>SS(x).name).join(', ')+(lockOf('board',b.id)?'  ◉ правит '+lockOf('board',b.id).holder:'')])))},
'board show'(a){const b=DB.boards.find(x=>x.name.toLowerCase()===(a.join(' ')).toLowerCase()||x.id===a[0]);if(!b)throw Error('доска «'+a.join(' ')+'» не найдена. Есть: '+DB.boards.map(x=>x.name).join(', '));const {cols,out}=boardCols(b);const n=Math.max(0,...cols.map(c=>c.items.length));
const head=cols.map(c=>c.c.name+' ('+c.items.length+')');const rs=[];for(let i=0;i<n;i++)rs.push(cols.map(c=>c.items[i]?{t:refOf(c.items[i])+' '+trunc(c.items[i].title,20),c:''}:''));
con(table(head,rs));if(out.length)con('<span class="warn">'+out.length+' '+plural(out.length,'задача','задачи','задач')+' вне колонок</span>');if(!S.tabs.includes('board/'+b.id))S.tabs.push('board/'+b.id);go('#/boards/'+b.id)},
'series list'(){con(table(['ПРЕФИКС','НАЗВАНИЕ','ЗАДАЧ','СЛЕДУЮЩИЙ'],DB.series.map(s=>[{t:s.prefix,c:'ref'},s.name,DB.tasks.filter(t=>t.series.some(x=>x.seriesId===s.id)).length,nextNum(s.id)])));const g=conflictGroups();if(g.length)con('<span class="warn">⚠ конфликтов номеров: '+g.map(c=>pfx(c.seriesId)+'-'+c.number).join(', ')+'. cleanup --resolve-conflicts</span>')},
'sync'(){S.sync=Date.now();con('Индекс index-rs.db: сверка по (size, mtime)…\n<span class="ok">✔</span> файлов '+(DB.tasks.length+DB.boards.length+9)+', изменённых 0, новых 0, удалённых 0'+(problemCount()?'\n<span class="warn">проблем в рабочей области: '+problemCount()+' (см. вкладку «Проблемы»)</span>':''));cli('sync','cli')},
'cleanup'(a){const {fl}=parseArgs(a);if(fl['resolve-conflicts']){const m=resolveConflicts('cli');if(!m.length)con('Конфликтов номеров нет');else{m.forEach(x=>con('<span class="ok">✔</span> '+esc(x)));con('Исправлено: '+m.length)}}else{const n=cleanLinks('cli');con(n?'<span class="ok">✔</span> удалено недействительных ссылок: '+n:'Недействительных ссылок нет')}},
'problems'(){const it=problemItems();con(it.length?table(['',' ФАЙЛ','ПРОБЛЕМА'],it.map(p=>[{t:p.sev==='error'?'✖':'▲',c:p.sev==='error'?'err':'warn'},trunc(p.file,44),trunc(p.msg,70)])):'<span class="ok">Проблем нет</span>')},
'status'(){con('рабочая область  '+esc(S.mode==='desktop'?S.ws[S.wsActive]:BASE)+'\nпроект           '+esc(projName())+'\nветка            main\nзадач            '+DB.tasks.length+'\nпроблем          '+problemCount()+'\nMCP              '+(S.mode==='desktop'?'127.0.0.1:5719':HOST+'/mcp'))}};
function runCmd(line){line=line.trim();if(!line)return;con('<span class="ps">tasker ❯</span> '+esc(line));S.hist.push(line);S.hi=S.hist.length;
let a;try{a=tokenize(line)}catch(e){con('<span class="err">ошибка разбора</span>');return}if(a[0]==='tasker')a.shift();if(!a.length)return;
let key=a.slice(0,2).join(' ');let rest=a.slice(2);if(!CMDS[key]){key=a[0];rest=a.slice(1)}
if(!CMDS[key]){con('<span class="err">tasker: неизвестная команда «'+esc(a.join(' '))+'». Введите help.</span>');return}
try{CMDS[key](rest);S.sync=Date.now();render()}catch(e){con('<span class="err">ошибка: '+esc(e.message)+'</span>');if(S.panel==='console')renderPanel()}}
const CMDLIST=['help','clear','task list','task get','task update','task create','task link','task unlink','task delete','board list','board show','series list','sync','cleanup','cleanup --resolve-conflicts','problems','status'];
function complete(el){const v=el.value;const m=CMDLIST.filter(c=>c.startsWith(v.replace(/^tasker\s+/,'')));if(m.length===1)el.value=m[0]+' ';else if(m.length>1){con('<span class="dim">'+m.join('   ')+'</span>')}}

function palItems(q){q=q.trim();const out=[];const lq=q.toLowerCase();
if(q.startsWith('>')){out.push({l:'Выполнить в консоли: tasker '+q.slice(1).trim(),run:()=>{openPanel('console');runCmd(q.slice(1))}});return out}
const exact=findRef(q);exact.forEach(t=>out.push({l:'<span class="ref">'+esc(refOf(t))+'</span> <span class="dim">['+esc(sid(t))+']</span> '+esc(t.title)+(exact.length>1?' <span class="warn">⚠ конфликт номера</span>':''),run:()=>go(routeOf('task/'+t.id))}));
if(q)DB.tasks.filter(t=>!exact.includes(t)&&(t.series.map(refStr).join(' ')+' '+t.title).toLowerCase().includes(lq)).slice(0,10).forEach(t=>out.push({l:'<span class="ref">'+esc(refOf(t))+'</span> '+esc(t.title),run:()=>go(routeOf('task/'+t.id))}));
const screens=[['Список задач','#/tasks'+f2q(S.filter)],['Новая задача','new'],['Проблемы','#/problems'],['Серии','#/series'],['Агенты','#/agents'],['Профиль','#/profile'],['Разрешить конфликты номеров','fix'],...DB.boards.map(b=>['Доска «'+b.name+'»','#/boards/'+b.id]),...SCH.map(s=>['Схема: '+s[2],'#/schema/'+s[0]])];
screens.filter(s=>!q||s[0].toLowerCase().includes(lq)).slice(0,q?6:14).forEach(s=>out.push({l:'<span class="dim">→</span> '+esc(s[0]),run:()=>{if(s[1]==='new'){go('#/tasks'+f2q(S.filter));setTimeout(()=>{const e=$('#qct');if(e)e.focus()},50)}else if(s[1]==='fix')ACT.fix('resolve','0');else go(s[1])}}));return out}
function openPalette(){S.pal={q:'',i:0};renderPal();const e=$('#palIn');e&&e.focus()}
function renderPal(){const p=$('#palette');if(!S.pal){p.className='';p.innerHTML='';return}const it=palItems(S.pal.q);S.pal.items=it;if(S.pal.i>=it.length)S.pal.i=0;
const had=document.activeElement&&document.activeElement.id==='palIn';p.className='on';p.innerHTML=`<div class="pal"><input id="palIn" placeholder="TSK-133, название, раздел… или >команда" value="${esc(S.pal.q)}" autocomplete="off"><div class="res">${it.map((x,i)=>`<div class="it ${i===S.pal.i?'on':''}" data-a="palrun" data-p="${i}">${x.l}</div>`).join('')||'<div class="empty">Ничего не найдено</div>'}</div></div>`;
const e=$('#palIn');e.focus();e.setSelectionRange(S.pal.q.length,S.pal.q.length)}
ACT.palette=()=>openPalette();
ACT.palrun=i=>{const it=S.pal.items[+i];S.pal=null;renderPal();it&&it.run()};

document.addEventListener('click',e=>{if(!e.target.closest('.menu')&&!e.target.closest('[data-a=usermenu]'))closeMenu();
if(S.pal&&!e.target.closest('.pal')){S.pal=null;renderPal();return}
const b=e.target.closest('[data-a]');if(!b)return;const f=ACT[b.dataset.a];if(!f)return;if(b.tagName==='A')e.preventDefault();f(b.dataset.p,b.dataset.q,b,e)});
document.addEventListener('auxclick',e=>{const t=e.target.closest('.tab');if(t&&e.button===1){e.preventDefault();closeTab(t.dataset.p)}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;const f=CHG[el.dataset.c];if(f)f(el.type==='checkbox'?el.checked:el.value,el)});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='palIn'){S.pal.q=el.value;S.pal.i=0;renderPal();return}const d=el.closest&&el.closest('[data-i]');if(!d)return;const f=INP[d.dataset.i];if(f)f(d)});
document.addEventListener('keydown',e=>{const el=e.target;const mod=e.ctrlKey||e.metaKey;
if(el.id==='palIn'){if(e.key==='ArrowDown'){e.preventDefault();S.pal.i=Math.min(S.pal.i+1,S.pal.items.length-1);renderPal()}else if(e.key==='ArrowUp'){e.preventDefault();S.pal.i=Math.max(0,S.pal.i-1);renderPal()}else if(e.key==='Enter'){e.preventDefault();ACT.palrun(S.pal.i)}else if(e.key==='Escape'){S.pal=null;renderPal()}return}
if(el.id==='conIn'){if(e.key==='Enter'){runCmd(el.value);el.value=''}else if(e.key==='ArrowUp'){e.preventDefault();if(S.hi>0)S.hi--;el.value=S.hist[S.hi]||''}else if(e.key==='ArrowDown'){e.preventDefault();if(S.hi<S.hist.length)S.hi++;el.value=S.hist[S.hi]||''}else if(e.key==='Tab'){e.preventDefault();complete(el)}
else if(e.key==='Escape'){el.blur()}if(e.key!=='Escape'&&!(mod&&e.key.toLowerCase()==='k'))return}
if(el.id==='qct'&&e.key==='Enter'){ACT.qcreate();return}
if(e.key==='Escape'){if(S.modal){closeModal();return}if(S.pal){S.pal=null;renderPal();return}closeMenu();return}
if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveKey(S.active||'');return}
if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}
if(mod&&e.key.toLowerCase()==='j'){e.preventDefault();S.panelOpen=!S.panelOpen;renderPanel();return}
if(mod&&e.key==='`'){e.preventDefault();S.panelOpen=true;S.panel='console';renderPanel();const c=$('#conIn');c&&c.focus();return}
if(mod&&e.key.toLowerCase()==='w'&&S.active){e.preventDefault();closeTab(S.active);return}
if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(el.tagName)){e.preventDefault();openPalette()}});
ACT.mclose=()=>closeModal();
ACT.mbtn=i=>{const b=S.modal.btns[+i];const r=b.fn?b.fn():undefined;if(r!==false)closeModal()};
document.getElementById('rsz').addEventListener('mousedown',e=>{e.preventDefault();const y0=e.clientY,h0=S.panelH;const mv2=ev=>{S.panelH=Math.max(120,Math.min(window.innerHeight-200,h0+(y0-ev.clientY)));$('#panel').style.height=S.panelH+'px'};const up=()=>{document.removeEventListener('mousemove',mv2);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',mv2);document.addEventListener('mouseup',up)});

function tick(){DB.locks.forEach(l=>{l.expiresInSec--;if(l.expiresInSec<=0)l.expiresInSec=118});
Object.keys(S.myLocks).forEach(k=>{S.myLocks[k]--;if(S.myLocks[k]<=30)S.myLocks[k]=120});
const u=$('#upd');if(u)u.textContent='обновлено '+Math.max(0,Math.round((Date.now()-S.sync)/1000))+' с назад';
if(Object.keys(S.myLocks).length)renderStatus();
if(S.active&&S.active.startsWith('task/')&&T(S.active.slice(5))&&(lockOf('task',S.active.slice(5))||S.myLocks[S.active.slice(5)]!==undefined)&&!S.modal){const e=$('#edtool');const t=curTask();if(e&&t)e.innerHTML=edTool(t)}}
function incoming(){const t=T('k11');if(!t||t.statusId==='s-todo')return;t.statusId='s-todo';touch(t);cli('task update '+refOf(t)+' --status "Туду"','cli');toast('Claude перевёл '+refOf(t)+' в «Туду»','info');con('<span class="dim">[событие] Claude перевёл '+esc(refOf(t))+' в «Туду»</span>');
S.sync=Date.now();const ae=document.activeElement;if(!S.modal&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.closest('#main'))){renderMain()}renderSide();renderTabs()}

window.addEventListener('hashchange',onRoute);
DB.mode=S.mode;
S.con=['<span class="ok">tasker 0.9.2</span> · рабочая область '+esc(BASE+'/tasker')+' · ветка main','Введите <span class="warn">help</span>. Пример: <span class="warn">task list --status "В работе" --sort -Приоритет --flat</span>',''];
['task update TSK-131 --status "В работе"','task update TSK-118 --status "Ревью"','task create "Автодополнение: значения полей-перечислений" --type Фича --series TSK','task link TSK-121 blocks TSK-140'].forEach((c,i)=>S.journal.push({t:['08:12:44','08:30:02','07:00:15','07:41:09'][i],via:i%2?'gui':'cli',cmd:c}));
S.sync=Date.now()-3000;
if(!location.hash||location.hash==='#')location.hash='#/tasks';
renderLogin();onRoute();
setInterval(tick,1000);
setTimeout(incoming,20000);
</script>
