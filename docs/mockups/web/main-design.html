<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasker — Сводный макет</title>
<style>
:root{--bg:#0f1013;--side:#0c0d10;--panel:#14151a;--hov:#17181e;--sel:#1c1e26;--line:#202228;--line2:#2c2f38;--tx:#e4e5e9;--mut:#8b8f99;--dim:#5d616b;--acc:#7b83f5;--accbg:rgba(123,131,245,.14);--red:#e5604d;--green:#4cb782;--amber:#e0a23b;--shadow:0 16px 48px rgba(0,0,0,.55);--ovl:rgba(5,6,8,.55);--tbp:24%;--tbb:#14151a;--tfp:58%;--tfb:#fff;--qv:#c9a6f7;--qo:#e0a23b}
[data-theme=light]{--bg:#faf8f4;--side:#f3f0ea;--panel:#fff;--hov:#f1eee7;--sel:#fff3d1;--line:#e8e4db;--line2:#d9d4c8;--tx:#37352f;--mut:#6f6b61;--dim:#9b968c;--acc:#c2410c;--accbg:#fdeee3;--red:#d1432d;--green:#2f9e6e;--amber:#b7791f;--shadow:0 16px 48px rgba(60,50,30,.16);--ovl:rgba(55,53,47,.28);--tbp:17%;--tbb:#fff;--tfp:62%;--tfb:#000;--qv:#7c3aed;--qo:#b45309}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
.ic{flex:none;vertical-align:middle}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
#ws{display:none;height:34px;background:var(--side);border-bottom:1px solid var(--line);padding:0 12px;gap:2px;align-items:flex-end}
body.desk #ws{display:flex}
#ws button{padding:6px 12px;border-radius:7px 7px 0 0;color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
#ws button.on{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-bottom:0}
#app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
body.desk #app{height:calc(100vh - 34px)}
#app.nologin{grid-template-columns:1fr}
#app.nologin #side{display:none}
#side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 8px;gap:2px;overflow:auto}
.sw{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;width:100%;font-weight:550}
.sw:hover,.nv:hover{background:var(--hov)}
.logo{width:20px;height:20px;border-radius:6px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.sbtn{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;color:var(--mut);width:100%;margin:6px 0 8px;border:1px solid var(--line)}
.sbtn:hover{background:var(--hov);color:var(--tx)}
.sbtn kbd{margin-left:auto}
.nv{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;color:var(--mut);width:100%}
.nv.on{background:var(--sel);color:var(--tx)}
.nv .n{margin-left:auto;font-size:11px;color:var(--dim)}
.nv .n.bad{color:#fff;background:var(--red);border-radius:9px;padding:0 6px}
.nvs{padding-left:26px}
.nvs .nv{padding:3px 8px;font-size:12.5px}
.sec{font-size:11px;letter-spacing:.04em;color:var(--dim);padding:12px 8px 4px;text-transform:uppercase}
.sp{flex:1}
kbd{font:11px ui-monospace,Menlo,monospace;color:var(--mut);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel);display:inline-block;line-height:17px}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;transition:margin-right .18s}
#main.pk{margin-right:520px}
.top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:7px;font-weight:550;min-width:0;white-space:nowrap}
.crumb .sep{color:var(--dim)}
.top .sp{flex:1}
.scroll{flex:1;overflow:auto;min-height:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;border:1px solid var(--line2);color:var(--tx);background:transparent;white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn.dng{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line2))}
.btn.ghost{border-color:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--tx)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
#badge{position:fixed;bottom:12px;right:12px;z-index:60;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:3px 4px 3px 10px}
#badge .seg button{padding:1px 8px;border-radius:6px;color:var(--mut)}
#badge .seg button.on{background:var(--accbg);color:var(--acc)}
.upd{color:var(--dim);font-size:11px;padding-right:2px}
.tb{display:flex;align-items:center;gap:8px;padding:12px 20px 8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:1px 4px 1px 10px;font-size:12px;color:var(--tx);background:var(--panel)}
.pill b{font-weight:500;color:var(--mut)}
.pill button.x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.pill button.x:hover{background:var(--hov);color:var(--tx)}
.pill .v{cursor:pointer}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg2 button{padding:3px 10px;color:var(--mut)}
.seg2 button.on{background:var(--sel);color:var(--tx)}
.grp{display:flex;align-items:center;gap:8px;padding:7px 20px;color:var(--mut);cursor:pointer;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line)}
.grp:hover{color:var(--tx)}
.grp .ch{transition:transform .15s}
.grp.shut .ch{transform:rotate(-90deg)}
.grp .cnt{color:var(--dim)}
.grp .gn{font-weight:550;color:var(--tx)}
.row{display:flex;align-items:center;gap:10px;padding:0 20px;height:38px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);cursor:default;position:relative}
.row:hover{background:var(--hov)}
.row.sel{background:var(--sel)}
.row.sel::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--acc)}
.row.pk{background:var(--accbg)}
.row .ref{color:var(--dim);min-width:66px;display:inline-flex;gap:4px;align-items:center}
.row .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:12px}
.si{flex:none}
.stb{display:grid;place-items:center;width:22px;height:22px;border-radius:6px}
.stb:hover{background:var(--line)}
.tw{width:16px;height:16px;display:grid;place-items:center;color:var(--dim);flex:none}
.tw.shut .ic{transform:rotate(-90deg)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11.5px;color:var(--mut);line-height:18px;white-space:nowrap}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,var(--line));background:var(--accbg)}
.chip.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.chip.amb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,var(--line))}
.chip button{color:var(--dim);display:grid}
.chip button:hover{color:var(--tx)}
.pr-crit{color:var(--red)}.pr-high{color:var(--amber)}
.rep{color:var(--dim);font-size:11px}
.pager{display:flex;justify-content:center;gap:8px;padding:14px}
.empty{display:grid;place-items:center;padding:80px 20px;text-align:center;color:var(--mut);gap:8px}
.ov{position:fixed;inset:0;z-index:80;background:var(--ovl);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fi .12s}
.ov.mid{align-items:center;padding-top:0}
.dlg.cdlg{width:calc(100vw - 64px);max-width:1680px;height:calc(100vh - 64px);max-height:none;overflow:hidden}
.cd-h{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line);font-size:12.5px}
.cd-h .sp,.cdlg .ft .sp{flex:1}
.tp.cd-tp{flex:1;min-height:0;overflow:hidden;grid-template-rows:minmax(0,1fr)}
.cd-tp .tp-main{padding:22px 28px 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cd-tp .desc{flex:1;min-height:60px;overflow:auto}
.cd-split{flex:none;height:13px;margin:4px -28px 0;cursor:row-resize;display:flex;align-items:center;touch-action:none}
.cd-split::before{content:"";flex:1;height:1px;background:var(--line2)}
.cd-split::after{content:"";position:absolute;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line2)}
.cd-split{position:relative}
.cd-split:hover::before,.cd-split.on::before,.cd-split:hover::after,.cd-split.on::after{background:var(--acc)}
.cd-links{flex:none;overflow:auto;padding-bottom:12px}
.cd-links .sech{margin-top:6px}
.cd-tp .tp-main{max-width:none}
.cd-tp .tp-props{overflow:auto}
.cdlg .ft{border-top:1px solid var(--line);align-items:center;padding:10px 16px}
.cd-r{cursor:default}
.cd-r.miss .pl{color:var(--red)}
.cd-r.miss .cd-sel{border-color:var(--red)}
.cd-sel{background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;outline:0;max-width:170px;min-width:0;color:var(--tx);font-size:12.5px}
.cd-sel:hover{border-color:var(--line2)}
.cd-sel:focus{border-color:var(--acc);background:var(--bg)}
select.cd-sel option{background:var(--panel);color:var(--tx)}
.cd-mp{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:2px 6px;border:1px solid transparent;border-radius:6px;min-height:24px;text-align:left}
.cd-mp:hover,.cd-mp:focus{border-color:var(--line2);outline:0}
.cd-mp-add{color:var(--dim);display:inline-flex}
.cd-links{overflow-x:hidden}
.cd-k kbd{margin-left:2px}
.cd-err{margin-right:auto;padding:4px 10px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.pk-box,.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);animation:up .14s}
.pk-box{width:560px;max-width:92vw;overflow:hidden}
.pk-in{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 16px;outline:0;font-size:14px}
.pk-t{padding:10px 16px 0;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.pk-l{max-height:min(52vh,420px);overflow:auto;padding:6px}
.pi{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--tx)}
.pi.on{background:var(--sel)}
.pi .sub{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.pi .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .ck{width:14px;color:var(--acc);flex:none}
.pi .iw{width:16px;display:grid;place-items:center;color:var(--mut);flex:none}
.pk-e{padding:20px;text-align:center;color:var(--dim)}
.dlg{width:520px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column}
.dlg.wide{width:860px}
.dlg h3{margin:0;padding:16px 20px 4px;font-size:15px;font-weight:600}
.dlg .bd{padding:10px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px}
.dlg .err{color:var(--red);font-size:12.5px;background:color-mix(in srgb,var(--red) 10%,transparent);border-radius:7px;padding:7px 10px}
.dlg .note{color:var(--mut);font-size:12.5px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label{color:var(--mut);font-size:12px}
.inp,.sel,.ta{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;outline:0;width:100%}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--acc)}
.ta{resize:vertical;min-height:80px}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx)}
input[type=checkbox],input[type=radio]{accent-color:var(--acc)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow);animation:up .18s;display:flex;gap:8px;align-items:center;max-width:80vw}
.toast.err{border-color:color-mix(in srgb,var(--red) 55%,var(--line2))}
.toast.ok .ic{color:var(--green)}
.toast.err .ic{color:var(--red)}
#peek{position:fixed;top:40px;right:0;bottom:0;width:520px;background:var(--panel);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .18s;z-index:40;display:flex;flex-direction:column}
body.desk #peek{top:74px}
#peek.on{transform:none}
body:has(#peek.on) #badge{right:532px}
.pkh{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
.pkh .sp{flex:1}
.pkb{flex:1;overflow:auto}
.tp{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:0;min-height:100%}
.tp-main{padding:26px 36px 60px;min-width:0;max-width:820px}
.tp-props{padding:20px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.tp.compact{grid-template-columns:1fr}
.tp.compact .tp-main{padding:18px 22px 40px;order:2}
.tp.compact .tp-props{order:1;border-left:0;border-bottom:1px solid var(--line);padding:10px 12px}
.ttl{width:100%;font-size:21px;font-weight:600;border:0;background:transparent;outline:0;padding:2px 0;letter-spacing:-.01em;resize:none;overflow:hidden}
.tp.compact .ttl{font-size:17px}
.desc{width:100%;min-height:110px;margin-top:10px;border:0;background:transparent;outline:0;resize:none;color:var(--tx);line-height:1.65}
.desc::placeholder,.ttl::placeholder{color:var(--dim)}
.sech{display:flex;align-items:center;gap:8px;margin:26px 0 8px;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.sech .sp{flex:1}
.lrow{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:0 -8px;border-radius:7px}
.lrow:hover{background:var(--hov)}
.lrow .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.lrow .rm{opacity:0;color:var(--dim)}
.lrow:hover .rm{opacity:1}
.lside{color:var(--mut);font-size:12px;padding:8px 0 2px}
.bar{height:3px;background:var(--line2);border-radius:2px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.pr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;width:100%;min-height:30px}
.pr:hover,.pr:focus-visible{background:var(--hov);outline:0}
.pr:focus-visible{box-shadow:0 0 0 1px var(--acc) inset}
.pl{width:92px;color:var(--mut);flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{display:flex;gap:5px;align-items:center;flex-wrap:wrap;min-width:0}
.pv .req{color:var(--red)}
.pgap{height:10px}
.tag{--c:#8993a4;display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--c) var(--tbp),var(--tbb));color:color-mix(in srgb,var(--c) var(--tfp),var(--tfb));border-radius:5px;padding:0 7px;font-size:12px;line-height:19px;white-space:nowrap;flex:none}
.lkb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,var(--line));padding:0 7px;border-radius:999px}
.lkb.me{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
.board{display:flex;gap:14px;padding:6px 20px 30px;align-items:flex-start;min-height:calc(100% - 20px)}
.col{width:290px;flex:none;border-radius:12px;padding:6px;transition:background .15s,box-shadow .15s;min-height:160px}
.col.over{background:var(--accbg);box-shadow:0 0 0 1px var(--acc) inset}
.col.shake{animation:shk .35s}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.col h4{margin:0;padding:6px 8px 4px;display:flex;align-items:center;gap:8px;font-weight:550;font-size:13px}
.col h4 .c{color:var(--dim);font-weight:400}
.col .conds{padding:0 8px 8px;display:flex;gap:4px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:grab;user-select:none;touch-action:none;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--line2)}
.card.dragging{opacity:.3}
.card.pop{animation:pop .3s}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.card .ct{margin:6px 0 8px;line-height:1.4}
.card .cm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dragghost{position:fixed;z-index:200;pointer-events:none;margin:0;box-shadow:var(--shadow);transform:rotate(1.6deg) scale(1.02);border-color:var(--acc);transition:left .2s ease,top .2s ease,transform .2s ease,opacity .2s ease}
.dragghost.land{transform:none;opacity:.8}
.hint{padding:6px 20px;color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
.set{display:grid;grid-template-columns:190px minmax(0,1fr);height:100%}
.setnav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.setbody{padding:24px 36px 60px;overflow:auto;max-width:960px}
.setbody h2{margin:0 0 4px;font-size:18px;font-weight:600}
.setbody .lead{color:var(--mut);margin:0 0 18px}
.sr{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
.sr .nm{font-weight:500}
.sr .ds{color:var(--mut);font-size:12px}
.sr .acts{margin-left:auto;display:flex;gap:4px;align-items:center}
.sr .main{min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dlg.tye{width:860px}
.dlg.tye .bd{gap:10px;padding:6px 24px 14px}
.tye-top{display:flex;flex-direction:column;gap:8px}
.tye-name{font-size:19px;font-weight:600;border:0;border-bottom:1px solid var(--line);background:transparent;outline:0;padding:6px 0;color:var(--tx)}
.tye-name:focus{border-color:var(--acc)}
.tye-desc{resize:vertical;min-height:52px}
.tye-h{margin-top:12px;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.tye-sets{display:flex;flex-direction:column;gap:8px}
.tye-set{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-align:left}
.tye-set:hover{border-color:var(--line2);background:var(--hov)}
.tye-set.on{border-color:var(--line2);background:var(--hov);cursor:default}
.tye-sn{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;align-self:stretch}
.tye-radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.tye-set.on .tye-radio{border:4px solid var(--acc)}
.tye-path{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tye-st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.tye-arr{color:var(--dim)}
.tye-fl{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tye-fr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto auto;align-items:center;gap:12px;padding:9px 8px 9px 14px;border-top:1px solid var(--line)}
.tye-fr:first-child{border-top:0}
.tye-fn{font-weight:550}

function addFilter(scope){

  allFields().forEach(f=>items.push({k:'field',f,label:f.name,sub:'.Field.'+qName(f.name)+' · '+f.type+(f.multiple?'[]':''),icon:ic('filter')}));
  pick({title:_t('Фильтр — дописывает условие в строку запроса'),placeholder:_t('Что отфильтровать?'),items,onPick:i=>{

function fieldCond(scope,f){
  const pt='.Field.'+qName(f.name);
  const L=[['==',f.multiple?_t('ровно эти значения, порядок неважен'):_t('равно; массив — одно из')],['!=',f.multiple?_t('не ровно эти значения'):_t('не равно; массив — ни одно из')]];
  if(qCmpType(f))[['>',_t('больше')],['>=',_t('больше или равно')],['<',_t('меньше')],['<=',_t('меньше или равно')]].forEach(x=>L.push(x));
  if(f.multiple){L.push(['ContainsAny',_t('содержит любое из')]);L.push(['ContainsAll',_t('содержит все')])}
  [['IsSet',_t('значение задано')],['IsUnset',_t('поле есть, значения нет')],['IsAttached',_t('поле есть у типа задачи')],['IsDetached',_t('поля нет у типа задачи')]].forEach(x=>L.push(x));
  const add=text=>qEdit(scope,o=>qAdd(o,text));
  pick({title:_t('{0} — условие',[f.name]),noSort:true,items:L.map(x=>({o:x[0],label:/^Is/.test(x[0])||/^Contains/.test(x[0])?pt+'.'+x[0]+'()':pt+' '+x[0],sub:x[1]})),onPick:i=>{
    const op=i.o;
    if(/^Is/.test(op))return add(pt+'.'+op+'()');
    const names=op==='=='||op==='!='||/^Contains/.test(op);
    if(f.type==='enum'&&names)return enumMulti(scope,f,op);
    if(f.type==='bool')return pick({title:pt+' '+op,items:[{id:'true',label:'true',sub:_t('Да')},{id:'false',label:'false',sub:_t('Нет')}],onPick:v=>add(pt+' '+op+' '+v.id)});
    const hint=f.type==='date'?'2026-12-01':'';
    promptDlg(pt+' '+op,/^Contains/.test(op)?_t('Значения через запятую'):_t('Значение'),hint,v=>{
      v=v.trim();
      const vs=/^Contains/.test(op)?v.split(',').map(x=>x.trim()).filter(Boolean):[v];
      if(!vs.length||vs.some(x=>!x))return _t('Укажите значение');
      for(const x of vs){
        if(f.type==='int'&&!/^-?\d+$/.test(x))return _t('Ожидается целое число');
        if(f.type==='float'&&!/^-?\d+(\.\d+)?$/.test(x))return _t('Ожидается число');
        if(f.type==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(x))return _t('Дата в формате ГГГГ-ММ-ДД');
      }
      const lit=x=>f.type==='int'||f.type==='float'?x:qStr(x);
      if(/^Contains/.test(op))add(pt+'.'+(vs.length===1?'Contains':op)+'('+(vs.length===1?lit(vs[0]):'['+vs.map(lit).join(', ')+']')+')');
      else add(pt+' '+op+' '+lit(vs[0]));
    },f.type==='date'?'date':'text');
  }});
}

function editField(t,f){
  if(!f)return;
  const cur=t.fields[f.id];
  if(f.type==='enum'){
    const e=en(f.enumId);
    pick({title:f.name+(f.multiple?_t(' (несколько)'):''),multi:f.multiple,items:()=>{
      const v=t.fields[f.id];const has=x=>Array.isArray(v)?v.includes(x):v===x;
      return e.values.map(o=>({id:o.id,label:o.name,chk:has(o.id)})).concat(isSet(v)?[{id:'',label:_t('Очистить'),icon:ic('x')}]:[]);
    },onPick:i=>{
      if(i.id==='')return setField(t,f,undefined);
      if(f.multiple){const v=Array.isArray(t.fields[f.id])?t.fields[f.id].slice():[];const k=v.indexOf(i.id);if(k>=0)v.splice(k,1);else v.push(i.id);setField(t,f,v)}
      else setField(t,f,i.id);
    }});
  }else if(f.type==='bool'){
    pick({title:f.name,items:[{id:true,label:_t('Да'),chk:cur===true},{id:false,label:_t('Нет'),chk:cur===false},{id:'x',label:_t('Очистить')}],onPick:i=>setField(t,f,i.id==='x'?undefined:i.id)});
  }else{
    promptDlg(f.name+(f.multiple?_t(' (через запятую)'):''),_t('Значение'),Array.isArray(cur)?cur.join(', '):(cur==null?'':cur),v=>{
      v=v.trim();
      if(!v)return setField(t,f,undefined);
      const parse=x=>{x=x.trim();if(f.type==='int'){if(!/^-?\d+$/.test(x))throw _t('Ожидается целое число');return parseInt(x)}if(f.type==='float'){if(isNaN(parseFloat(x)))throw _t('Ожидается число');return parseFloat(x)}if(f.type==='date'&&!/^\d{4}-\d\d-\d\d$/.test(x))throw _t('Дата в формате ГГГГ-ММ-ДД');return x};
      try{setField(t,f,f.multiple?v.split(',').map(parse).filter(x=>x!==''):parse(v))}catch(er){return String(er)}
    },f.type==='date'?'date':'text');
  }
}
function addFieldTo(t){
  const att=tFields(t).map(f=>f.id);
  const items=DB.fields.filter(f=>!att.includes(f.id)).map(f=>({f,label:f.name,sub:f.type,icon:ic('tag')})).concat([{custom:1,label:_t('Своё поле…'),sub:_t('определение задаётся здесь и не меняется'),icon:ic('plus')}]);
  pick({title:_t('Добавить поле'),items,onPick:i=>{
    if(i.f)return mutate(t,()=>{t.extra.push(i.f.id)});
    formDlg(_t('Своё поле задачи'),[{name:'name',label:_t('Название')},{name:'type',label:_t('Тип'),type:'select',options:['string','int','float','bool','date'].map(x=>({v:x,l:x})),value:'string'},{name:'multiple',label:_t('Несколько значений'),type:'check'}],_t('Добавить'),v=>{
      if(!/^[A-Za-zА-Яа-яЁё0-9]+$/.test(v.name))return _t('Название: только буквы и цифры');
      if(tFields(t).some(f=>f.name===v.name))return _t('Поле с таким названием уже есть');
      mutate(t,()=>{t.custom.push({fieldId:'cf-'+Date.now(),name:v.name,type:v.type,multiple:v.multiple,required:false})});
    });
  }});
}

function render(){
  const p=route();const main=$('#main');
  document.documentElement.dataset.theme=S.theme;
  applyLang();
  const sc=$('.scroll[data-keep]',main);const st0=sc?sc.scrollTop:0;
  const pk0=$('.pkb',$('#peek'));const pks=pk0?pk0.scrollTop:0;
  if(p[0]==='tasks'||!p[0]){S.lq=hashQ();S.lastList='#/tasks'+(S.lq?'?q='+encodeURIComponent(S.lq):'')}
  else if(p[0]==='series'){S.lq=hashQ();S.lastList='#/series/'+encodeURIComponent(p[1]||'')+(S.lq?'?q='+encodeURIComponent(S.lq):'')}
  else if(p[0]==='epics')S.lastList='#/epics';
  S.viewSeries=p[0]==='series'?(serByPrefix(p[1]||'')||{}).id:null;
  if(p[0]==='boards')S.bq=hashQ();
  $('#app').className=p[0]==='login'?'nologin':'';
  let v;
  switch(p[0]){
    case 'login':v=vLogin();break;
    case 'epics':v=vEpics();break;
    case 'task':v=vTask(p[1]||'');break;
    case 'boards':v=vBoard(p[1]||S.lastBoard);break;
    case 'settings':v=vSettings(p[1]);break;
    case 'profile':v=vProfile();break;
    case 'agents':v=vAgents();break;
    case 'admin':v=vAdmin(p[1]);break;
    case 'series':v=vSeries(p[1]||'');break;
    case 'problems':v=vProblems();break;
    default:v=vList();
  }
  const fq=qFocusState();
  main.innerHTML=v.html;
  mountQ(fq);
  renderSide();renderPeek();
  const sc2=$('.scroll[data-keep]',main);if(sc2)sc2.scrollTop=st0;
  const pk1=$('.pkb',$('#peek'));if(pk1)pk1.scrollTop=pks;
  $$('.ttl').forEach(autosize);
  if(S.popId){const c=$('.card[data-id="'+S.popId+'"]');if(c)c.classList.add('pop');S.popId=null}
  tickUpd();
}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(OVS.length){const top=ovTop();ovClose(top)}palette();return}
  if(e.key==='Escape'){
    if(OVS.length){ovClose(ovTop());return}
    if(typing){e.target.blur();return}
    if(S.peek){S.peek=null;render();return}
    if(route()[0]==='task'){go(S.lastList);return}
    return;
  }
  if(typing||OVS.length||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(S.gt){const g=S.gt;S.gt=0;const m={t:'#/tasks',b:'#/boards/'+S.lastBoard,s:'#/settings/statuses'}[k.toLowerCase()];if(m){e.preventDefault();go(m)}return}
  const kl=k.toLowerCase();
  if(k==='/'){e.preventDefault();qFocus();return}
  if(k==='?'){e.preventDefault();cheat();return}
  if(kl==='g'){S.gt=1;setTimeout(()=>{S.gt=0},1200);return}
  if(kl==='c'){e.preventDefault();createDlg(null,curSeriesId());return}
  if(kl==='s'){e.preventDefault();statusCmd();return}
  if(kl==='l'){e.preventDefault();linkCmd();return}
  if(kl==='p'){e.preventDefault();parentCmd();return}
  if(kl==='f'){e.preventDefault();addFilter(route()[0]==='boards'?'board':'list');return}
  if(kl==='b'){e.preventDefault();toggleBoard();return}
  const ro=route()[0];
  if(ro==='tasks'||!ro||ro==='epics'){
    const rows=$$('.row[data-id]');
    if(k==='j'||k==='ArrowDown'||kl==='k'||k==='ArrowUp'){
      e.preventDefault();if(!rows.length)return;
      let i=rows.findIndex(r=>r.dataset.id===S.sel);i=(k==='j'||k==='ArrowDown')?Math.min(rows.length-1,i+1):Math.max(0,i-1);
      S.sel=rows[i].dataset.id;if(S.peek)S.peek=S.sel;render();const n=$('.row.sel');if(n)n.scrollIntoView({block:'nearest'});return;
    }
    if(k===' '){e.preventDefault();if(S.sel){S.peek=S.peek===S.sel?null:S.sel;render()}return}
    if(k==='Enter'){e.preventDefault();const t=tk(S.sel);if(t)openTask(t,true);return}
  }
  if(k==='Enter'&&S.peek){const t=tk(S.peek);if(t)openTask(t,true)}
});

  const t=tk('k5');t.statusId='s-doing';touch(t);
  DB.activity.unshift({at:new Date().toISOString(),who:'a-claude',text:_f('перевёл {0} в «{1}»',[refOf(t),st('s-doing').name])});
  S.lastUpd=Date.now();toast(_t('{0} перевёл {1} в «{2}»',[us('a-claude').name,refOf(t),st('s-doing').name]));render();
},20000);
DB.boards.forEach(b=>b.columns.forEach(c=>c.fieldConditions.forEach(cd=>{cd.op=cd.operator})));
if(!location.hash)location.hash='#/tasks';
render();
</script>
