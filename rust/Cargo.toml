[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
md-5 = "0.11"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-general-category = "1"
unicode-normalization = "0.1"
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
rustix = { version = "1", features = ["fs"] }
saphyr-parser = "0.1"
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
unicode-segmentation = "1"
notify = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "matched-path"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.9"
ureq = { version = "3", default-features = false }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }

# Release-профиль по плану: статический бинарник в единицы МБ, без размотки паники.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
