[package]
name = "tasker-mcpd"
description = "Tasker MCP daemon (tasker-mcpd): supervisor and worker processes (--listen-fd, NDJSON protocol, accept gate, drain, upgrade) and single-process mode — daemon.lock/daemon.json, /health, /ready, /daemon/*, /mcp (tasker-mcp), workspace registry, settings watch, log"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tasker-mcpd"
path = "src/main.rs"

[dependencies]
tasker-core = { path = "../tasker-core" }
tasker-files = { path = "../tasker-files" }
tasker-services = { path = "../tasker-services" }
tasker-mcp = { path = "../tasker-mcp" }
tasker-version = { path = "../tasker-version" }
rmcp.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "io-std"] }
axum.workspace = true
http.workspace = true
http-body.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
rand.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
ureq.workspace = true
regex.workspace = true
