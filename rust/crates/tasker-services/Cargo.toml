[package]
name = "tasker-services"
description = "Tasker domain services over a workspace folder (.tasker files and the index) or a SQLite file: projects, statuses, types, fields, boards, tasks, series, links, locks, cleanup, health"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tasker-core = { path = "../tasker-core" }
tasker-files = { path = "../tasker-files" }
rusqlite.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true


# Cargo не создаёт тест сам, если его файл уже указан в другой цели: сценарии на папке объявлены явно.
[[test]]
name = "boards"
path = "tests/boards.rs"

[[test]]
name = "catalog"
path = "tests/catalog.rs"

[[test]]
name = "cleanup_links"
path = "tests/cleanup_links.rs"

[[test]]
name = "fields"
path = "tests/fields.rs"

[[test]]
name = "hierarchy"
path = "tests/hierarchy.rs"

[[test]]
name = "links"
path = "tests/links.rs"

[[test]]
name = "locks"
path = "tests/locks.rs"

[[test]]
name = "projects"
path = "tests/projects.rs"

[[test]]
name = "series"
path = "tests/series.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"

# Те же сценарии сервисов на области в файле SQLite (TSK-159): тестовый двоичный файл с префиксом `sqlite_` открывает `Env` в
# SQLite (см. `tests/common`), как .NET-тесты, параметризованные хранилищем (`TestWorkspace.Storages()`).
[[test]]
name = "sqlite_boards"
path = "tests/boards.rs"

[[test]]
name = "sqlite_catalog"
path = "tests/catalog.rs"

[[test]]
name = "sqlite_cleanup_links"
path = "tests/cleanup_links.rs"

[[test]]
name = "sqlite_fields"
path = "tests/fields.rs"

[[test]]
name = "sqlite_hierarchy"
path = "tests/hierarchy.rs"

[[test]]
name = "sqlite_links"
path = "tests/links.rs"

[[test]]
name = "sqlite_locks"
path = "tests/locks.rs"

[[test]]
name = "sqlite_projects"
path = "tests/projects.rs"

[[test]]
name = "sqlite_series"
path = "tests/series.rs"

[[test]]
name = "sqlite_smoke"
path = "tests/smoke.rs"
