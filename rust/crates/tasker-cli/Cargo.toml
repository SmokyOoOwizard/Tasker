[package]
name = "tasker-cli"
description = "Tasker command line (tasker): the clap command tree, System.CommandLine-style help and errors, workspace session, output and exit codes; migrate"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tasker"
path = "src/main.rs"

[dependencies]
tasker-core = { path = "../tasker-core" }
tasker-files = { path = "../tasker-files" }
tasker-services = { path = "../tasker-services" }
tasker-daemon = { path = "../tasker-daemon" }
tasker-version = { path = "../tasker-version" }
uuid.workspace = true
clap.workspace = true
serde_json.workspace = true
unicode-general-category.workspace = true
unicode-segmentation = "1"
ureq = { version = "3", default-features = false }
signal-hook.workspace = true

[target.'cfg(not(windows))'.dependencies]
rustix = { workspace = true, features = ["termios", "stdio", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[dev-dependencies]
serde_json.workspace = true
