[package]
name = "tasker-files"
description = "Tasker .tasker files: YAML parsing (saphyr), byte-exact emitter, formatVersion, layout, writes under locks, SQLite index"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tasker-core = { path = "../tasker-core" }
saphyr-parser.workspace = true
regex.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
notify.workspace = true

# Обход папок при сверке индекса: fstatat относительно папки, на macOS — getattrlistbulk.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
