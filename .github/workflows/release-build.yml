# Сборка релиза Tasker (.NET: консоль tasker — NativeAOT, демон tasker-mcpd — один файл с рантаймом) на всех платформах.
# Архивы — scripts/release.sh --rid <RID> на машине своей ОС и архитектуры (Windows — в Git Bash, Linux musl x64 — в контейнере Alpine,
# Linux musl arm64 — через --builder docker: JavaScript-действия GitHub не работают в Alpine на arm64) — остаются артефактами прогона;
# релизы и теги этот workflow не создаёт и никуда ничего не публикует. Тесты — .NET tests.
name: Release build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'dotnet/src/**'
      - 'dotnet/Directory.Build.props'
      - 'VERSION'
      - 'scripts/release.sh'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: linux-x64, os: ubuntu-22.04 }
          - { rid: linux-arm64, os: ubuntu-22.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-latest, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, builder: docker }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: packages of the Alpine container
        if: matrix.container
        shell: sh
        run: apk add --no-cache bash git tar python3 file clang build-base zlib-dev sqlite-dev sqlite-static
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: ${{ !matrix.container }}
        with:
          dotnet-version: '10.0.x'
      - name: packages of the Linux runner
        if: ${{ !matrix.container && !matrix.builder && startsWith(matrix.rid, 'linux-') }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev libsqlite3-dev
      - name: scripts/release.sh --rid ${{ matrix.rid }}
        run: scripts/release.sh --rid '${{ matrix.rid }}' --builder '${{ matrix.builder || 'dotnet' }}' --out dist
      - name: run the built programs
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          name="tasker-$version-${{ matrix.rid }}"
          mkdir -p check
          case "${{ matrix.rid }}" in
            win-*) (cd check && python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall('.')" "../dist/$name.zip"); exe=.exe ;;
            *) tar -xzf "dist/$name.tar.gz" -C check; exe= ;;
          esac
          ls -la "check/$name" "check/$name/app"
          cat "check/$name/release.txt"
          export TASKER_HOME="$PWD/check/home"
          run=()
          case "${{ matrix.rid }}" in
            osx-x64) run=(arch -x86_64) ;;
            linux-musl-arm64) run=(docker run --rm -v "$PWD:$PWD" -w "$PWD" -e TASKER_HOME mcr.microsoft.com/dotnet/runtime-deps:10.0-alpine) ;;
          esac
          if [ "${{ matrix.rid }}" = osx-x64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "no Rosetta: not run"; exit 0; fi
          shown="$("${run[@]+"${run[@]}"}" "check/$name/app/tasker$exe" --version | tr -d '\r')"
          echo "tasker --version: $shown"
          [ "$shown" = "$version" ]
          "${run[@]+"${run[@]}"}" "check/$name/app/tasker-mcpd$exe" --help > /dev/null
          mkdir -p check/ws
          "${run[@]+"${run[@]}"}" "check/$name/app/tasker$exe" project create Smoke -w check/ws
          "${run[@]+"${run[@]}"}" "check/$name/app/tasker$exe" project list -w check/ws
          case "${{ matrix.rid }}" in
            linux-*)
              file "check/$name/app/tasker"; (ldd "check/$name/app/tasker" || true)
              if readelf -d "check/$name/app/tasker" | grep -q libsqlite3; then echo "tasker needs libsqlite3: SQLite must be linked in"; exit 1; fi ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: tasker-*
          merge-multiple: true
      - run: |
          set -euo pipefail
          mkdir dist
          cp parts/* dist/
          cp scripts/install.sh scripts/install.ps1 dist/
          (cd dist && cat *.sha256 | sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: tasker-release
          path: dist/
          retention-days: 14
